launch path now runs the new release, and which still runs the old one?","answer":"ONLY `pnpm start` moves, because the script rewrites the `package.json` dependency. `start-harness.sh` and `start-harness.cmd` still launch the old release: each carries its own hard-coded `DSH_VERSION` default.","explanation":"The pin lives in THREE files and the update script touches one. Fix: edit both script defaults in the same change, or use `DSH_VERSION=latest` for a one-off run. Note that the script goes through npm, the resolver the launchers avoid (see 60).","example":"npm run update:dsh  # package.json dependency changes; the two script defaults do not","confusables":"`DSH_VERSION=latest` — changes ONE run of the launcher scripts and writes nothing; `update:dsh` rewrites `package.json` and leaves the scripts alone.","evidence_quote":"\"update:dsh\": \"npm install @deepseek-ai/dsh@latest\"","tags":["trap","drift","version-pin"],"source_refs":[{"path":"package.json","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":9,"end":12},{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":18},{"path":"start-harness.cmd","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":12},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":101}]},{"id":"deep-seek-harness:92","slug":"deep-seek-harness","code":"5192","category":9,"rank":2,"type":"recall","level":2,"concept":"Node guard looser than docs","question":"deep-seek-harness documents Node 22.19+ or 24+ as its requirement. Which Node versions does `start-harness.sh` actually refuse to launch with?","answer":"ONLY majors below 22. The guard compares the major number alone, so 22.0 to 22.18 pass it although they sit below the documented 22.19 minimum.","explanation":"The script extracts the first component of the Node version and tests it with `-lt 22`; the minor is never read (23.x passes too). Check `node --version` by hand against the documented rule. The Windows launcher has no version test at all, see 40.","confusables":"the documented requirement `22.19+ or 24+` — it constrains the minor as well; the guard reads the MAJOR only.","evidence_quote":"if [ \"$NODE_MAJOR\" -lt 22 ]; then","tags":["drift","node-guard"],"source_refs":[{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":11,"end":15},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":13}]},{"id":"deep-seek-harness:99","slug":"deep-seek-harness","code":"5199","category":9,"rank":9,"type":"scenario","level":4,"concept":"Resume: re-verify then bump","question":"deep-seek-harness pins a release candidate of a fast-moving developer preview. You return after months: what is the first step, and what must change together if it passes?","answer":"Re-verify against the newest upstream before trusting the runbook. (1) Run `DSH_VERSION=latest ./start-harness.sh --no-open` and expect HTTP 200 on `http://127.0.0.1:3080`. (2) If it passes, move the pin in ALL three files: both script defaults and the `package.json` dependency. (3) If it fails, stay on the pin: the documented flags and first-run steps are only known to hold for that release.","explanation":"The repository records no roadmap; this step follows from its own statements: the pin is the last verified release, upstream changes fast, and the override exists to try the newest release without editing anything. Why all three files: see 91.","evidence_quote":"DeepSeek Harness is in _developer preview_ and changes fast.","tags":["inferred","resume","version-pin"],"source_refs":[{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":9},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":99,"end":105},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":48},{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":17,"end":18},{"path":"start-harness.cmd","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":12},{"path":"package.json","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":12}]},{"id":"memory-systems-anki-decks:00","slug":"memory-systems-anki-decks","code":"6200","category":0,"rank":0,"type":"recall","level":1,"concept":"Programming Millenium fork purpose","question":"memory-systems-anki-decks: what did the owner build on top of this forked memory-systems repository?","answer":"A Programming Millenium: 1000 programming concepts at fixed codes 000-999 (CSV -> xlsx -> Anki), plus a PAO starter kit.","explanation":"The upstream repository maps 1000 numbers to images; the owner's two folders reuse the same spreadsheet matrix method for programming concepts and add a beginner kit for peg systems.","anchor":"A thousand-drawer apothecary cabinet: every drawer carries a brass number that never changes, and inside each sits one programming idea with its tiny diorama.","evidence_quote":"1000 programming concepts mapped to fixed 3-digit addresses with vivid anchor images.","tags":["peg-matrix"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":3,"end":5},{"path":"00.Memory_systems/07.PAO_multiple_encoding/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":3,"end":5}]},{"id":"memory-systems-anki-decks:01","slug":"memory-systems-anki-decks","code":"6201","category":0,"rank":1,"type":"recall","level":1,"concept":"Anki comes last","question":"Which rule about the place of Anki does memory-systems-anki-decks exist to protect?","answer":"Anki comes LAST: the matrix (the CSV behind it) stays the source of truth, Anki is only the drill.","explanation":"The matrix is edited in one place and the workbook and the Anki export files are regenerated from it; a block is exported only once it is stable, because drilling pegs that still change engraves the wrong images. Breaks if undone: edits made inside Anki diverge from the matrix, and nothing reads them back into it.","confusables":"Anki-first decks — there the deck is the source and cards are edited in place; here a card is a disposable PRINT of a matrix row.","evidence_quote":"Anki always comes last; the matrix stays the source of truth.","tags":["source-of-truth"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":112},{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":4,"end":6},{"path":"00.Memory_systems/07.PAO_multiple_encoding/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":96,"end":97}]},{"id":"memory-systems-anki-decks:02","slug":"memory-systems-anki-decks","code":"6202","category":0,"rank":2,"type":"cloze","level":1,"concept":"Code digit reading rule","question":"memory-systems-anki-decks: complete how a Programming Millenium code is read, digit by digit.","answer":"domain · category · rank on the shelf (0 = most fundamental)","example":"520 -> 5 = Concurrency & parallelism · 52 = Locks & mutual exclusion · rank 0 = Mutex","cloze":"A code reads left to right: hundreds digit = {{c1::domain}}, tens digit = {{c1::category}}, units digit = {{c2::rank on the shelf (0 = most fundamental)}}.","evidence_quote":"hundreds digit = domain, tens = category, units = item (0 = most fundamental)","tags":["address-space"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-mem digit compression","question":"memory-systems-anki-decks: complete the compression rule trained by the starter kit's `drill` tab.","answer":"Person · Action · Object · ONE","explanation":"One image per 6 digits instead of one per 2: three times fewer palace loci, and the combinations stay unique.","cloze":"731942 -> the {{c1::Person}} of 73 doing the {{c1::Action}} of 19 with the {{c1::Object}} of 42 = {{c2::ONE}} scene for 6 digits.","evidence_quote":"rows = [(\"Person of\", 1, 2), (\"Action of\", 3, 3), (\"Object of\", 5, 4)]","tags":["pao"],"source_refs":[{"path":"00.Memory_systems/07.PAO_multiple_encoding/make_template.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":101},{"path":"00.Memory_systems/07.PAO_multiple_encoding/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":49,"end":53}]},{"id":"memory-systems-anki-decks:30","slug":"memory-systems-anki-decks","code":"6230","category":3,"rank":0,"type":"locate","level":1,"concept":"build.py entry command","question":"Which command regenerates memory-systems-anki-decks' Programming Millenium workbook and its Anki export files?","answer":"`python3 build.py`, run in `00.Memory_systems/06.Programming_Millenium` (needs `openpyxl`).","example":"python3 build.py  # wrote .../Programming_Millenium.xlsx and .../export_for_anki/*.csv from 1000 rows","confusables":"`python3 make_template.py` — rewrites the BLANK PAO workbook in `07.PAO_multiple_encoding`; it reads no CSV.","evidence_quote":"Usage: python3 build.py (requires: pip install openpyxl)","tags":["entry-point"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":8},{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":160,"end":170}]},{"id":"memory-systems-anki-decks:31","slug":"memory-systems-anki-decks","code":"6231","category":3,"rank":1,"type":"output","level":3,"concept":"read_rows() 1000-row guard","question":"memory-systems-anki-decks · `read_rows`: predict the result of the call below when `programming_millenium.csv` holds 999 data rows.","answer":"`AssertionError: expected 1000 rows, got 999` — it RAISES before anything is written: the 000-999 address space must stay complete.","explanation":"Derivation: (1) `DictReader` consumes the header, so 999 data rows give `len(rows) == 999`; (2) 999 == 1000 is False; (3) the assert raises with the f-string message. The address space is closed: replace a concept in place, never insert or delete a row.","code_snippet":"def read_rows():\n    with open(CSV_PATH, newline=\"\", encoding=\"utf-8\") as f:\n        rows = list(csv.DictReader(f))\n    assert len(rows) == 1000, f\"expected 1000 rows, got {len(rows)}\"\n    return rows\n\nread_rows()  # the CSV holds 999 data rows","expected_output":"AssertionError: expected 1000 rows, got 999","evidence_quote":"assert len(rows) == 1000, f\"expected 1000 rows, got {len(rows)}\"","tags":["grounded:logic","intended-error","address-space"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":71,"end":75}]},{"id":"memory-systems-anki-decks:32","slug":"memory-systems-anki-decks","code":"6232","category":3,"rank":2,"type":"output","level":3,"concept":"sheet_pao() Major hint","question":"memory-systems-anki-decks · `sheet_pao`: predict the exact hint text written in the last column for `n = 67`.","answer":"`j + k` — only the FIRST sound listed for each digit is kept, joined by ` + `.","explanation":"Derivation: (1) divmod(67, 10) = (6, 7); (2) MAJOR[6].split(',')[0] = 'j'; (3) MAJOR[7].split(',')[0] = 'k'; (4) the f-string joins them vidence_quote":"\"evalue\": \"list index out of range\"","tags":["grounded:fixture","intended-error","procedural-layer"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/000_fundamentals.ipynb","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":270,"end":290},{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/specs/000_fundamentals.json","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":46}]},{"id":"memory-systems-anki-decks:34","slug":"memory-systems-anki-decks","code":"6234","category":3,"rank":4,"type":"locate","level":1,"concept":"export_anki() per-hundred files","question":"Which function in memory-systems-anki-decks writes the ten per-hundred Anki import files?","answer":"`export_anki(rows)` in `build.py`: rows grouped by the FIRST digit of `code` into `export_for_anki/{h}00.csv`.","explanation":"Each file holds 100 rows, semicolon-delimited, `utf-8-sig`, with NO header row: every line is data and Anki maps the six fields by position. One file per hundred-block becomes one subdeck.","example":"export_for_anki/500.csv starts with 500;Concurrency vs parallelism;...","evidence_quote":"block = [r for r in rows if r[\"code\"][0] == str(h)]","tags":["anki-export"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":148,"end":157}]},{"id":"memory-systems-anki-decks:40","slug":"memory-systems-anki-decks","code":"6240","category":4,"rank":0,"type":"compare","level":2,"concept":"build.py vs make_notebooks.py","question":"memory-systems-anki-decks: `build.py` vs `notebooks/make_notebooks.py`: what is the ONE difference in what they read?","answer":"`build.py` reads `programming_millenium.csv`; `make_notebooks.py` reads ONLY `notebooks/specs/*.json`, so a CSV edit never reaches the notebooks.","explanation":"The spec markdown cells carry their own copy of the definition and anchor text (018 Shadowing appears in both files). Breaks if confused: a concept reworded in the CSV keeps its old wording in the executed notebook until the spec is edited too.","anchor":"Two kitchens in one house: the first cooks from the ledger on the wall, the second from recipe cards photocopied long ago; rewrite the ledger and only one dish changes.","confusables":"`make_notebooks.py` — fed by SPECS, not by the CSV; the CSV is the source for the xlsx and the exports only.","evidence_quote":"specs = sys.argv[1:] or sorted(glob.glob(os.path.join(HERE, \"specs\", \"*.json\")))","tags":["trap","two-sources"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":54},{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":18},{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/specs/000_fundamentals.json","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":18},{"path":"00.Memory_systems/06.Programming_Millenium/programming_millenium.csv","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":20}]},{"id":"memory-systems-anki-decks:50","slug":"memory-systems-anki-decks","code":"6250","category":5,"rank":0,"type":"locate","level":2,"concept":"allow_errors notebook execution","question":"Which `NotebookClient` setting lets memory-systems-anki-decks commit real tracebacks as notebook output?","answer":"`allow_errors=True` — execution continues past a raising cell and stores its traceback as that cell's output.","explanation":"Each notebook runs top to bottom in one `python3` kernel with `timeout=90` and is committed WITH its outputs, so review needs no run. Breaks if undone: the first intended failure stops the run and the cells after it have no output.","confusables":"`INTENDED ERROR` marker — `allow_errors` lets EVERY cell fail without stopping; the marker only decides which failures are REPORTED as build errors.","evidence_quote":"client = NotebookClient(nb, timeout=90, allow_errors=True, kernel_name=\"python3\")","tags":["notebook-execution"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":37},{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":4,"end":7}]},{"id":"memory-systems-anki-decks:51","slug":"memory-systems-anki-decks","code":"6251","category":5,"rank":1,"type":"recall","level":1,"concept":"INTENDED ERROR marker","question":"Which literal text must a notebook cell contain for memory-systems-anki-decks' `make_notebooks.py` to accept its exception?","answer":"`INTENDED ERROR`, anywhere in the cell source (by convention in the first comment line).","example":"# INTENDED ERROR — read the traceback","evidence_quote":"A cell whose source contains 'INTENDED ERROR' may raise","tags":["intended-error"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":9,"end":10},{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":45}]},{"id":"memory-systems-anki-decks:60","slug":"memory-systems-anki-decks","code":"6260","category":6,"rank":0,"type":"why","level":2,"concept":"Decimal taxonomy addresses","question":"Why does memory-systems-anki-decks' Programming Millenium encode addresses with a decimal taxonomy rather than the phonetic Major code of the original Millenium?","answer":"The digits must let you DERIVE the shelf: read as domain -> category -> rank they locate a concept by its meaning, where consonant sounds would only spell a word.","explanation":"Each hundred carries a digit mnemonic, the 'phonetics' of this system, so the address alone names the kind of idea. Breaks if undone: a code no longer says which domain or category its concept belongs to, and the 10x10 category grid loses its meaning. Digit rule: see 02.","anchor":"A library where the shelf mark is the floor, the aisle and the position: read the three digits and your feet already know where to walk, no dictionary needed.","confusables":"Major system (original Millenium) — digits become consonant SOUNDS that spell an image word; here digits are taxonomy COORDINATES.","evidence_quote":"**decimal taxonomy**: hundreds = domain, tens = category, units = item (0 = most fundamental)","tags":["inferred","address-space"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":29},{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":111}]},{"id":"memory-systems-anki-decks:61","slug":"memory-systems-anki-decks","code":"6261","category":6,"rank":1,"type":"why","level":2,"concept":"Anchor encodes concept only","question":"Why must an anchor in memory-systems-anki-decks' Programming Millenium encode ONLY the concept rather than the digits of its code as well?","answer":"The taxonomy walk already decodes the digits; an anchor that also carries the number mixes two kinds of information, the main source of confusion.","explanation":"Fusion comes AFTERWARDS: stage the anchor scene at the address, or merge it with the French Millenium peg image for that number. Breaks if undone: one scene must serve both the mechanism and the number and serves neither. Fusion as the next step: see 99.","anchor":"A street sign that also tries to be the shop window: passers-by can read neither the house number nor what is sold.","example":"520 Mutex: a restroom key chained to your own belt loop = ownership; no 5, 2 or 0 in the scene","confusables":"French Millenium peg image — the peg encodes the NUMBER phonetically; the anchor encodes the CONCEPT. They are fused, never swapped.","evidence_quote":"the digits are decoded by the taxonomy, never by the anchor.","tags":["per-docs","anchor"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":50,"end":59}]},{"id":"memory-systems-anki-decks:62","slug":"memory-systems-anki-decks","code":"6262","category":6,"rank":2,"type":"why","level":2,"concept":"One demo per category","question":"Why does memory-systems-anki-decks add executed notebooks with ONE demo per category rather than one demo for each of the 1000 codes?","answer":"One well-chosen demo per category burns in the LARGER idea, not the particulars; watching code produce its output trains procedural memory, while images and definitions train declarative memory.","explanation":"The demos are reviewed as read -> predict -> run -> compare; the demo count is at 03. Breaks if undone: flashcards alone leave the net effect of code untrained, while 1000 demos would drill particulars.","anchor":"A coin die struck once per shelf: one hard blow leaves its pattern on every blank stacked beneath it.","confusables":"The matrix rows — they hold WHAT a concept is (image, definition); the notebooks show what the code DOES.","evidence_quote":"seeing the net effect of code you run is procedural memory","tags":["per-docs","procedural-layer"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":82,"end":87}]},{"id":"memory-systems-anki-decks:63","slug":"memory-systems-anki-decks","code":"6263","category":6,"rank":3,"type":"compare","level":2,"concept":"Anki pathway 3 multi-card","question":"memory-systems-anki-decks: Anki pathway 1 vs pathway 3: what is the ONE difference in what a matrix row becomes?","answer":"Pathway 1 imports the generated semicolon files as they are; pathway 3 turns one row into one note that yields SEVERAL cards through conditional templates.","explanation":"In pathway 3 each card front is wrapped in a conditional block on its field, so a blank field produces no card and the `N/A` padding of the original route becomes optional. The cost: one conditional template per question and a tab-delimited UTF-8 file saved by hand.","anchor":"One dough ball pushed through a three-blade cutter gives three shapes at once, and a blade that meets no dough cuts nothing.","confusables":"Pathway 1 (`export_for_anki/*.csv`) — the ready-made files are imported as they are; pathway 3 adds CONDITIONAL templates so one note per row yields several cards.","evidence_quote":"you want ONE note per row to generate SEVERAL cards","tags":["per-docs","anki-export"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":119,"end":122},{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":145,"end":147},{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":114,"end":116}]},{"id":"memory-systems-anki-decks:70","slug":"memory-systems-anki-decks","code":"6270","category":7,"rank":0,"type":"recall","level":2,"concept":"Learned flag persistence","question":"Where must a Learned flag be recorded to survive `python3 build.py` in memory-systems-anki-decks?","answer":"In the `learned` column of `programming_millenium.csv`: `build.py` starts from a FRESH workbook and fills column A from the CSV, so flags typed into the xlsx are overwritten.","explanation":"Drift: the README and the seeded backlog say to flip Learned in the matrix, 'where progress lives', yet nothing reads the workbook back. The same loss hits the reject column I and any backlog note typed by hand. The progress cell is `A1004` = `=SUM(A2:A1003)`.","anchor":"A whiteboard that the caretaker wipes and redraws from his ledger every morning: only the ticks written in the ledger are still there the next day.","confusables":"`Programming_Millenium.xlsx` column A — it DISPLAYS the flag and sums it; the CSV column is the only place the build READS it from.","evidence_quote":"ws[f\"A{i}\"] = int(r.get(\"learned\", 0) or 0)","tags":["drift","trap","progress-state"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":87},{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":161,"end":168},{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":168,"end":169}]},{"id":"memory-systems-anki-decks:80","slug":"memory-systems-anki-decks","code":"6280","category":8,"rank":0,"type":"recall","level":1,"concept":"Notebook rebuild dependencies","question":"Which three packages must be installed to rebuild memory-systems-anki-decks' executed notebooks?","answer":"`nbformat`, `nbclient` and `ipykernel` (it provides the `python3` Jupyter kernel).","explanation":"`build.py` and `make_template.py` need only `openpyxl`. No requirements file exists in the two folders: the install commands live in the docstrings and READMEs. Everything runs as local scripts.","evidence_quote":"Requires: pip install nbformat nbclient ipykernel","tags":["dependencies"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":13},{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":8},{"path":"00.Memory_systems/07.PAO_multiple_encoding/make_template.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":8}]},{"id":"memory-systems-anki-decks:90","slug":"memory-systems-anki-decks","code":"6290","category":9,"rank":0,"type":"recall","level":2,"concept":"Notebook rebuild passing sign","question":"What is the passing sign of a notebook rebuild in memory-systems-anki-decks?","answer":"One line `\u003cnotebook>.ipynb: OK` per spec and exit code 0; any `UNEXPECTED ERRORS: [...]` line makes the script exit 1.","explanation":"The two folders hold no test suite: this status line and the 1000-row assert in `build.py` (see 31) are the only automated checks.","example":"python3 make_notebooks.py specs/500_concurrency.json  # 500_concurrency.ipynb: OK","evidence_quote":"status = \"OK\" if not unexpected else f\"UNEXPECTED ERRORS: {unexpected}\"","tags":["check-command"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":53,"end":61}]},{"id":"memory-systems-anki-decks:91","slug":"memory-systems-anki-decks","code":"6291","category":9,"rank":1,"type":"scenario","level":3,"concept":"Unmarked failing demo cell","question":"memory-systems-anki-decks: a new demo cell raises `KeyError` and its source lacks the intended-error marker. What does `make_notebooks.py` do with that notebook?","answer":"It STILL writes the executed `.ipynb`, traceback included, then prints `UNEXPECTED ERRORS: [(cell index, ename, evalue)]` and exits 1 — the file on disk is already the broken one.","explanation":"The write is unconditional and comes before the return. Check the status line or the exit code before committing; then fix the cell or, when the failure is the lesson, put `INTENDED ERROR` in its source.","evidence_quote":"nbformat.write(nb, out)","tags":["trap","notebook-pipeline"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":40,"end":50},{"path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":57,"end":61}]},{"id":"memory-systems-anki-decks:92","slug":"memory-systems-anki-decks","code":"6292","category":9,"rank":2,"type":"scenario","level":3,"concept":"Better image after Learned=1","question":"memory-systems-anki-decks: you think of a better image for a PAO row that is already marked Learned=1. What do you do with it?","answer":"Keep the existing peg and park the new idea in `Non retenu mais convient` (the bench): a peg is frozen once you start learning it.","explanation":"Collisions are fixed BEFORE Learned=1; after that the `déjà pris` column exists precisely to stop the urge to improve a peg in mid-flight, and a good candidate you did not keep goes to the bench so it is never re-evaluated from scratch.","confusables":"`Attention doublon / déjà pris` — it logs a COLLISION between two addresses; the bench stores a valid ALTERNATIVE for the same address.","evidence_quote":"Don't change a peg after you start learning it.","tags":["per-docs","peg-stability"],"source_refs":[{"path":"00.Memory_systems/07.PAO_multiple_encoding/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":119,"end":120},{"path":"00.Memory_systems/07.PAO_multiple_encoding/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":84,"end":85}]},{"id":"memory-systems-anki-decks:93","slug":"memory-systems-anki-decks","code":"6293","category":9,"rank":3,"type":"scenario","level":4,"concept":"Generate pathway 3 file","question":"memory-systems-anki-decks: `build.py` must emit the pathway 3 import file itself so the manual Save As step disappears. What is the smallest change, and what must stay true?","answer":"DESIGN TARGET, not built: a second writer in `export_anki()`. (1) It already emits the six fields in note-type order (code, concept, anchor, definition, example, confusables), so only the delimiter becomes Tab and the extension `.txt`. (2) The encoding must be UTF-8, or the accents in the anchors break. (3) No `N/A` padding: with conditional templates a blank field simply yields no card.","explanation":"Today pathway 3 starts from the `matrix` tab saved by hand as tab-delimited text and re-saved as UTF-8. The note type itself (fields in column order, one conditional template per question) would still be built once in Anki.","evidence_quote":"pick the target deck, separator = **Tab**, and check in the preview that each field maps","tags":["anki-export","direction"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":163,"end":165},{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":136,"end":138},{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":145,"end":147},{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":148,"end":157}]},{"id":"memory-systems-anki-decks:99","slug":"memory-systems-anki-decks","code":"6299","category":9,"rank":9,"type":"scenario","level":4,"concept":"Resume: fuse with French pegs","question":"memory-systems-anki-decks: you have one free evening to resume the Programming Millenium. Which backlog step is flagged as next, what does it buy and what does it depend on?","answer":"Fuse each code with the French Millenium peg image for the same number. (1) It is the only `BACKLOG` row flagged `!!!!`. (2) peg(number) x anchor(concept) gives ONE compound image that answers both 'what lives at 520?' and 'where does mutex live?'. (3) It depends on knowing the original pegs in `01.Millenium`, the upstream sheet that stands at 809/1000 learned.","explanation":"Three of the other seeded rows (per-language variants, a picture per anchor, a review of the confusables) carry no mark; the fourth (mark Learned=1, tracked by the SUM) is marked `done`. Learning itself has not started: every `learned` value in the CSV is 0.","evidence_quote":"(\"fuse each code with the French Millenium peg image (00.Memory_systems/01.Millenium)\", \"!!!!\", \"\"),","tags":["direction","resume"],"source_refs":[{"path":"00.Memory_systems/06.Programming_Millenium/build.py","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":45,"end":51},{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":55,"end":59},{"path":"00.Memory_systems/06.Programming_Millenium/README.md","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","line":35}]},{"id":"remotion-maker:00","slug":"remotion-maker","code":"7000","category":0,"rank":0,"type":"recall","level":1,"concept":"Brand video pipeline purpose","question":"What does remotion-maker's pipeline take in, and what does it produce?","answer":"A website's brand identity + an operator's script IN; a Remotion video rendered in 30-second chunks OUT.","explanation":"The repository holds the reusable workflow (`workflow/`) and the project that instantiates it (`sealcoin-promo/`). The root README is a bare heading: start from `workflow/README.md`. See 02.","anchor":"A press takes paint swatches scraped off a shopfront in one hand and a typed script in the other, and extrudes film in reels of equal length.","evidence_quote":"into a Remotion video rendered in **30-second chunks**, previewable in a locally hosted Remotion Studio","tags":["chunked-render"],"source_refs":[{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":3},{"path":"README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":1}]},{"id":"remotion-maker:01","slug":"remotion-maker","code":"7001","category":0,"rank":1,"type":"recall","level":1,"concept":"Script-true total invariant","question":"Which timing invariant does remotion-maker's sealcoin-promo fail loudly to protect?","answer":"Scene durations must sum to EXACTLY the script's timed map: 4500 frames (75 s at 60 fps).","explanation":"Durations are script-true (script seconds x 60) and tile the timeline with no gap. The check runs at module scope, so Studio and every render stop when it fails; see 32.","anchor":"A tailor's tape cut to the script's exact length: eight strips of cloth must cover it end to end, no gap and no overhang, or the shop bell rings.","confusables":"`TOTAL_FRAMES` — the COMPUTED sum of the scene durations; `EXPECTED_TOTAL_FRAMES` is the DECLARED script total it is checked against.","evidence_quote":"export const EXPECTED_TOTAL_FRAMES = 4500; // 75s — synopsis.md §3 map [0-75]","tags":["drift-guard"],"source_refs":[{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":37,"end":40},{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":69,"end":70}]},{"id":"remotion-maker:02","slug":"remotion-maker","code":"7002","category":0,"rank":2,"type":"recall","level":1,"concept":"sealcoin-promo instance","question":"In remotion-maker, what is the `sealcoin-promo` directory?","answer":"The project that instantiates the workflow: a 75-second explainer for the Eco Wave Power x SEALCOIN x SEALSQ PoC.","explanation":"A Remotion 4.0.438 app whose structure was replicated from `h2-promo`. Its script is `sealcoin/synopsis.md` (8 timed segments), its tokens `docs/BRAND.md`, its timing `remotion/manifest.ts`.","confusables":"`sealcoin/` (no suffix) — holds ONLY the operator's script `synopsis.md`, read-only ground truth; `sealcoin-promo/` is the app built from it.","evidence_quote":"75-second explainer for the **Eco Wave Power × SEALCOIN × SEALSQ** Autonomous Renewable Energy Marketplace PoC.","source_refs":[{"path":"sealcoin-promo/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":3},{"path":"sealcoin-promo/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":5,"end":8}]},{"id":"remotion-maker:03","slug":"remotion-maker","code":"7003","category":0,"rank":3,"type":"recall","level":1,"concept":"[V] / [I] provenance tags","question":"In remotion-maker, what do the provenance tags `[V]` and `[I]` on a brand token mean?","answer":"`[V]` VERIFIED: seen on the live site or stated in the script. `[I]` INFERRED: proposed, needs sign-off.","explanation":"Every brand token and every on-screen line carries one; an inferred value is never silently promoted. In sealcoin-promo's `theme.ts` only the orange accent, its gradient stop and two of the three fonts are verified.","example":"accentPrimary: \"#FF9C1E\", // [V] / accentSecondary: \"#3EC1F0\", // [I]  # same file, different trust","evidence_quote":"`[VERIFIED]` (observed on the live site / stated in the operator's script) or `[INFERRED]` (proposed, needs sign-off)","tags":["provenance"],"source_refs":[{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":22},{"path":"sealcoin-promo/remotion/theme.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":3,"end":13}]},{"id":"remotion-maker:10","slug":"remotion-maker","code":"7010","category":1,"rank":0,"type":"recall","level":1,"concept":"SceneSpec entry of SCENES","question":"remotion-maker: which four fields does one `SceneSpec` entry of sealcoin-promo's `SCENES` hold?","answer":"`id`, `label`, `durationInFrames` (script seconds x 60) and `scriptRef` (the script's time range).","explanation":"Eight entries in play order: ocean, identity, marketplace, autonomy, trust, scale, pqc, finale. `id` is also the key that picks the scene's React component; `scriptRef` traces the scene to the operator's timed map.","example":"{ id: \"ocean\", label: \"Ocean energy\", durationInFrames: 480, scriptRef: \"[0-8s]\" }  # 8 s x 60 fps","evidence_quote":"{ id: \"ocean\", label: \"Ocean energy\", durationInFrames: 480, scriptRef: \"[0-8s]\" },","source_refs":[{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":16,"end":33},{"path":"sealcoin-promo/remotion/SealcoinPromo.tsx","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":17}]},{"id":"remotion-maker:11","slug":"remotion-maker","code":"7011","category":1,"rank":1,"type":"recall","level":1,"concept":"CHUNK_FRAMES chunk size","question":"How many frames is one render chunk in remotion-maker, and what running time is that?","answer":"1800 frames = 30 s at 60 fps (`CHUNK_FRAMES`); the last chunk may be partial.","explanation":"Chunk count = `ceil(TOTAL_FRAMES / 1800)`. For the 4500-frame sealcoin-promo that is 3 chunks: 1800, 1800 and a partial 900; see 33.","evidence_quote":"export const CHUNK_FRAMES = 1800; // 30s @ 60fps","tags":["chunked-render"],"source_refs":[{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":36},{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":25}]},{"id":"remotion-maker:20","slug":"remotion-maker","code":"7020","category":2,"rank":0,"type":"trace","level":3,"concept":"Six-stage pipeline","question":"remotion-maker · Brand Video Maker pipeline: recite the 6 stages from the baseline commit to the verified chunk files.","answer":"checkpoint · brand decomposition · script gate · scaffold · scenes + assets · chunked render + verify","explanation":"Stages are numbered 0 to 5 and each ends in a commit and a reviewable artifact; the operator reviews at stage boundaries. Stage 2 is the only hard gate; see 62.","anchor":"A relay through six huts: sign the logbook, scrape colour chips off a shopfront, wait for the typed pages, raise a bare frame, hang the drawings on it, then film it in reels and weigh each reel.","steps":["Stage 0 checkpoint -> baseline commit pushed to the remote","Stage 1 brand decomposition: website URL -> `docs/BRAND.md`, 12-section token dictionary","Stage 2 script intake (hard gate): operator script -> `script.md` + `SCENE-MANIFEST.md`","Stage 3 scaffold: h2-promo structure + BRAND.md -> `theme.ts` + `manifest.ts`","Stage 4 scenes + assets: scene manifest -> scene components and SVG assets","Stage 5 chunked render + verify -> chunk MP4s, the concat file, a probe report"],"evidence_quote":"| 5. Chunked render + verify | registered chunk compositions |","tags":["pipeline"],"source_refs":[{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":9,"end":18}]},{"id":"remotion-maker:21","slug":"remotion-maker","code":"7021","category":2,"rank":1,"type":"trace","level":3,"concept":"Stage 5 render chain","question":"remotion-maker · sealcoin-promo stage 5: recite the 4 npm scripts that go from clean code to verified MP4s, in order.","answer":"lint · render:chunks · concat · verify:media","explanation":"`npm run studio` (preview) and `npm run render:full` (single-pass reference) sit beside the chain but are not part of it. Run from `sealcoin-promo/`.","anchor":"A print shop: proofread the plates, print three booklets one after another, staple them without reprinting a page, then lay a ruler on each booklet and on the stapled volume.","steps":["`npm run lint` -> eslint then `tsc --noEmit`; must be clean before any render","`npm run render:chunks` -> `out/sealcoin-chunk-01..03.mp4`, each rendered muted","`npm run concat` -> stream-copies the chunks into `out/sealcoin-promo-75s.mp4`","`npm run verify:media` -> asserts 30 s / 30 s / 15 s / 75 s within one frame"],"evidence_quote":"npm run lint            # eslint + tsc --noEmit — must be clean before any render","tags":["chunked-render"],"source_refs":[{"path":"workflow/CHUNK-RENDER.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":13,"end":19},{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":52,"end":60}]},{"id":"remotion-maker:30","slug":"remotion-maker","code":"7030","category":3,"rank":0,"type":"locate","level":1,"concept":"Studio entry point","question":"Which command in remotion-maker's sealcoin-promo opens the local preview of the master and every chunk?","answer":"`npm run studio` (cwd `sealcoin-promo`) — it runs `remotion studio`.","explanation":"Studio lists four compositions, all scrubbable: `SealcoinPromo` plus `SealcoinChunk01/02/03`. Loading them imports the manifest, so this is also where a drift throw first shows; see 32.","example":"cd sealcoin-promo / npm run studio  # master + the 3 chunk compositions","confusables":"`npm run dev` — starts the inherited Electron shell (`electron-forge start`), whose export button is BROKEN; see 92.","evidence_quote":"\"studio\": \"remotion studio\",","source_refs":[{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":48,"end":49},{"path":"sealcoin-promo/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":13}]},{"id":"remotion-maker:31","slug":"remotion-maker","code":"7031","category":3,"rank":1,"type":"output","level":3,"concept":"seriesDuration() crossfade extension","question":"remotion-maker · `seriesDuration`: predict the two return values of the calls below. Scene 0 lasts 480 frames, scene 7 (the last of 8) lasts 360, and `TRANSITION_FRAMES` is 12.","answer":"`492` and `360` — every scene EXCEPT the last is lengthened by the 12-frame crossfade it hands off into.","explanation":"A crossfade overlaps two neighbours, so 7 transitions would eat 84 frames. Derivation: (1) index 0 \u003c 7, so 480 + 12 = 492; (2) index 7 is the last, so 360 + 0; (3) the eight values sum to 4584 and 4584 - 7 x 12 = 4500.","confusables":"`sceneStart(index)` — the script-true segment boundary (sum of the durations BEFORE it), with NO crossfade extension.","code_snippet":"export const seriesDuration = (index: number): number =>\n  SCENES[index].durationInFrames +\n  (index \u003c SCENES.length - 1 ? TRANSITION_FRAMES : 0);\n\nseriesDuration(0);\nseriesDuration(7);","expected_output":"492\n360","evidence_quote":"(index \u003c SCENES.length - 1 ? TRANSITION_FRAMES : 0);","tags":["grounded:logic","transition-series"],"source_refs":[{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":42,"end":46},{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":35},{"path":"sealcoin-promo/docs/SCENE-MANIFEST.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":26,"end":27}]},{"id":"remotion-maker:32","slug":"remotion-maker","code":"7032","category":3,"rank":2,"type":"output","level":3,"concept":"Manifest drift guard","question":"remotion-maker · sealcoin-promo `manifest.ts`: the `ocean` scene is edited from 480 to 500 frames and nothing else changes. Predict the result of starting Studio or any render.","answer":"It THROWS `Manifest drift: scene durations sum to 4520 frames, expected 4500. ...` — the guard sits at module scope, so importing the manifest fails before a single frame is drawn.","explanation":"Derivation: 4020 + 500 = 4520, and 4520 !== 4500. The guard protects the script's 75 s map: fix `SCENES`, or, when the script itself changed, change `EXPECTED_TOTAL_FRAMES` too and then see 94.","code_snippet":"{ id: \"ocean\", label: \"Ocean energy\", durationInFrames: 500, scriptRef: \"[0-8s]\" }, // was 480\n// ... the seven other scenes unchanged (they sum to 4020)\n\nexport const EXPECTED_TOTAL_FRAMES = 4500;\nexport const TOTAL_FRAMES = SCENES.reduce((sum, s) => sum + s.durationInFrames, 0);\n\nif (TOTAL_FRAMES !== EXPECTED_TOTAL_FRAMES) {\n  throw new Error(/* ... */);\n}","expected_output":"Error: Manifest drift: scene durations sum to 4520 frames, expected 4500. Fix SCENES in remotion/manifest.ts (script map: sealcoin/synopsis.md §3).","evidence_quote":"`Manifest drift: scene durations sum to ${TOTAL_FRAMES} frames, expected ${EXPECTED_TOTAL_FRAMES}. ` +","tags":["grounded:logic","intended-error","drift-guard"],"source_refs":[{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":69,"end":75},{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":37,"end":40}]},{"id":"remotion-maker:33","slug":"remotion-maker","code":"7033","category":3,"rank":3,"type":"output","level":3,"concept":"CHUNKS partial last window","question":"remotion-maker · `CHUNKS`: predict the four fields of the THIRD element of the array computed below. `TOTAL_FRAMES` is 4500 and `CHUNK_FRAMES` is 1800.","answer":"`index 3`, `id \"SealcoinChunk03\"`, `fromFrame 3600`, `durationInFrames 900` — `ceil(4500 / 1800)` gives 3 windows and the last is PARTIAL (15 s).","explanation":"Derivation with i = 2: (1) index 2 + 1 = 3; (2) `padStart(2, \"0\")` turns 3 into `03`; (3) fromFrame 2 x 1800 = 3600; (4) min(1800, 4500 - 3600) = 900. `Root.tsx` registers one composition per element, passing `fromFrame` as a default prop.","code_snippet":"export const CHUNKS: readonly ChunkSpec[] = Array.from(\n  { length: Math.ceil(TOTAL_FRAMES / CHUNK_FRAMES) },\n  (_, i) => ({\n    index: i + 1,\n    id: `SealcoinChunk${String(i + 1).padStart(2, \"0\")}`,\n    fromFrame: i * CHUNK_FRAMES,\n    durationInFrames: Math.min(CHUNK_FRAMES, TOTAL_FRAMES - i * CHUNK_FRAMES),\n  }),\n);","expected_output":"{ index: 3, id: \"SealcoinChunk03\", fromFrame: 3600, durationInFrames: 900 }","evidence_quote":"durationInFrames: Math.min(CHUNK_FRAMES, TOTAL_FRAMES - i * CHUNK_FRAMES),","tags":["grounded:logic","chunked-render"],"source_refs":[{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":59,"end":67},{"path":"sealcoin-promo/remotion/Root.tsx","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":29,"end":38},{"path":"sealcoin-promo/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":21}]},{"id":"remotion-maker:40","slug":"remotion-maker","code":"7040","category":4,"rank":0,"type":"locate","level":1,"concept":"Timing chokepoint file","question":"Which is the ONLY file in remotion-maker's sealcoin-promo where a scene's length may be set?","answer":"`sealcoin-promo/remotion/manifest.ts` — the `SCENES` array; totals and chunk windows are derived from it.","explanation":"`Root.tsx`, the master composition and the chunk wrapper all import their numbers from it. `theme.ts` holds design tokens only; see 61.","confusables":"`docs/SCENE-MANIFEST.md` — the human MIRROR of the same table; when the two disagree the code wins and the document is corrected.","evidence_quote":"// Scene + chunk manifest — THE single source of truth for all timing.","tags":["single-source"],"source_refs":[{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":1,"end":3},{"path":"sealcoin-promo/remotion/theme.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":2}]},{"id":"remotion-maker:50","slug":"remotion-maker","code":"7050","category":5,"rank":0,"type":"recall","level":1,"concept":"render:chunks sequential chain","question":"In what order and concurrency does `npm run render:chunks` run remotion-maker's three chunk renders?","answer":"One after another: `render:chunk1 && render:chunk2 && render:chunk3` — a failed chunk stops the chain.","explanation":"Everything is started by hand on a local machine through npm scripts. The three chunk scripts are HARD-CODED in `package.json`, so a fourth chunk would need a new script; see 94.","evidence_quote":"\"render:chunks\": \"npm run render:chunk1 && npm run render:chunk2 && npm run render:chunk3\",","source_refs":[{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":52,"end":55}]},{"id":"remotion-maker:51","slug":"remotion-maker","code":"7051","category":5,"rank":1,"type":"locate","level":2,"concept":"seededRandom() particle determinism","question":"Which function in remotion-maker's sealcoin-promo makes the background particles identical in every render and every chunk?","answer":"`seededRandom(seed)` in `remotion/components/BubbleField.tsx`: the fractional part of `sin(seed * 9301 + 49297) * 233280`, a pure function of the particle index.","explanation":"Position, size, speed and delay of each particle come from it. A frame is rendered on its own and a chunk in its own run, so anything random must be reproducible. Breaks if undone: particles differ between runs and jump at a chunk boundary.","confusables":"`Math.random()` — a NEW value on every call; `seededRandom(i)` returns the SAME value for the same index forever.","evidence_quote":"// Deterministic pseudo-random for consistent renders","tags":["determinism"],"source_refs":[{"path":"sealcoin-promo/remotion/components/BubbleField.tsx","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":13,"end":17},{"path":"sealcoin-promo/remotion/components/BubbleField.tsx","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":29,"end":36}]},{"id":"remotion-maker:60","slug":"remotion-maker","code":"7060","category":6,"rank":0,"type":"why","level":2,"concept":"Chunks window the master","question":"Why does remotion-maker register each render chunk as `\u003cSequence from={-fromFrame}>` around the master rather than building each 30 s chunk as its own edit?","answer":"A negative `from` slides the ONE master timeline back, so chunk frame 0 shows master frame `fromFrame`: boundaries are pixel-continuous by construction and may fall mid-scene.","explanation":"Breaks if undone: separately edited chunks must rebuild mid-animation state at every cut by hand, and any retiming moves the cuts. Here chunk 1 ends 2 s into `autonomy` with no special handling. Proof: a still of the master at frame k x 1800 equals a still of chunk k+1 at frame 0.","anchor":"One long film strip slides under a fixed half-minute viewing slot. Three cameramen each filming their own half minute would make the wave jump at every handover.","confusables":"A separately edited chunk — its frame 0 starts every animation FRESH; a window chunk's frame 0 is the master caught mid-flight.","evidence_quote":"master frame `fromFrame`. Boundary continuity is guaranteed by construction.","tags":["chunked-render"],"source_refs":[{"path":"sealcoin-promo/remotion/SealcoinChunk.tsx","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":11,"end":19},{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":25},{"path":"sealcoin-promo/docs/SCENE-MANIFEST.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":29},{"path":"workflow/CHUNK-RENDER.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":41}]},{"id":"remotion-maker:61","slug":"remotion-maker","code":"7061","category":6,"rank":1,"type":"why","level":2,"concept":"One timing source of truth","question":"Why does remotion-maker keep scene durations ONLY in `remotion/manifest.ts` rather than also in a `SCENES` table inside `theme.ts`?","answer":"Two timing tables drift: in the H2Evo exemplar `theme.SCENES` stopped matching the master composition's real durations. One source plus a module-scope throw makes drift impossible to miss.","explanation":"So `theme.ts` holds design tokens only and its `VIDEO` object deliberately has no `durationInFrames`. Breaks if undone: a token table says one length, the render uses another, and nothing fails. See 01 and 32.","anchor":"Two clocks in one workshop, one on the paint shelf and one on the bench, slowly disagree and nobody knows which the film obeys. The shelf clock is thrown out; the bench clock gets an alarm.","confusables":"`DURATIONS` in `theme.ts` — motion MICRO-timing (fade, pop, stagger, the 12-frame transition), NOT scene lengths.","evidence_quote":"its `theme.SCENES` drifted from the master comp's real durations","tags":["single-source"],"source_refs":[{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":23},{"path":"sealcoin-promo/remotion/theme.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":2},{"path":"sealcoin-promo/remotion/theme.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":44},{"path":"sealcoin-promo/remotion/theme.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":59}]},{"id":"remotion-maker:62","slug":"remotion-maker","code":"7062","category":6,"rank":2,"type":"why","level":2,"concept":"Hard script gate","question":"Why does remotion-maker stop at a hard script gate in stage 2 rather than letting the assistant draft scene copy from the brand website?","answer":"On-screen copy must be ground truth: final scene copy comes ONLY from the operator's script. Until it arrives, scenes exist only as neutral timing stubs (scene id + frame counter).","explanation":"Breaks if undone: invented claims about a partner's product reach a rendered video. Once the script lands and the decomposition is approved, work switches to auto-mode (scenes, assets, chunked render without stops). For sealcoin-promo the script is `sealcoin/synopsis.md`.","anchor":"A turnstile that turns only when the operator feeds typed pages into its slot; behind it wait empty boxes, each showing nothing but its name and a running counter.","confusables":"Stage 1 brand decomposition — it MAY propose values tagged `[INFERRED]` for sign-off; stage 2 may not start the scene build without the script.","evidence_quote":"**No scene visuals or copy may be built from inferred data points.**","tags":["script-gate"],"source_refs":[{"path":"workflow/SCENE-MANIFEST.template.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":6,"end":9},{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":13},{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":22}]},{"id":"remotion-maker:63","slug":"remotion-maker","code":"7063","category":6,"rank":3,"type":"why","level":2,"concept":"--muted chunk renders","question":"Why do remotion-maker's chunk render scripts all pass `--muted` rather than letting Remotion embed its default audio track?","answer":"Un-muted, each chunk gets a silent AAC track slightly LONGER than its video; the concat demuxer aligns on the longest stream, leaving ~3-frame gaps at every boundary (75.117 s instead of 75.000 s).","explanation":"The rule holds only while the composition has no audio. Breaks if undone: the joined file runs long and hitches at each chunk boundary. See 99 for what adding audio would change.","anchor":"Three planks, each with a strip of tape glued along it that sticks out a finger past the end: butt them together and the tape holds a crack open at every joint.","confusables":"`-c copy` in the concat step — it avoids RE-ENCODING; `--muted` avoids the over-long audio track. The join uses both.","evidence_quote":"The concat demuxer aligns segments on the longest stream, so un-muted chunks concat into a video with ~3-frame timestamp gaps at every boundary","tags":["chunked-render","ffmpeg-concat"],"source_refs":[{"path":"workflow/CHUNK-RENDER.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":39},{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":52,"end":56}]},{"id":"remotion-maker:70","slug":"remotion-maker","code":"7070","category":7,"rank":0,"type":"recall","level":1,"concept":"out/ render directory","question":"Where does remotion-maker's sealcoin-promo write its rendered MP4s, and why does the repository contain none?","answer":"`sealcoin-promo/out/` — the root `.gitignore` excludes `out/`, so every MP4 must be re-rendered.","explanation":"Re-running is safe: `Config.setOverwriteOutput(true)` lets the CLI overwrite and the concat step passes `-y`. The frame-exact results quoted in the runbook therefore cannot be checked from a clone without rendering.","evidence_quote":"# Dependencies / build output node_modules/ out/","source_refs":[{"path":".gitignore","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":1,"end":3},{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":52},{"path":"sealcoin-promo/remotion.config.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":11},{"path":"sealcoin-promo/scripts/concat-chunks.mjs","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":8}]},{"id":"remotion-maker:71","slug":"remotion-maker","code":"7071","category":7,"rank":1,"type":"compare","level":2,"concept":"-full.mp4 vs -75s.mp4","question":"remotion-maker · sealcoin-promo: `out/sealcoin-promo-full.mp4` vs `out/sealcoin-promo-75s.mp4`: what is the ONE difference?","answer":"`-full` is ONE single-pass render of `SealcoinPromo` (`render:full`, a reference); `-75s` is the CONCATENATION of the chunk files (`concat`), and the only one of the two that `verify:media` checks.","anchor":"A loaf baked whole sits on the shelf for comparison; the loaf rebuilt from three slices is the one the inspector measures.","confusables":"`out/sealcoin-promo-75s.mp4` — JOINED from chunk files by stream copy; `-full` never passes through the chunk pipeline.","evidence_quote":"\"render:full\": \"remotion render SealcoinPromo out/sealcoin-promo-full.mp4 --muted\",","tags":["chunked-render"],"source_refs":[{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":56},{"path":"sealcoin-promo/scripts/concat-chunks.mjs","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":10},{"path":"sealcoin-promo/scripts/verify-media.mjs","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":19,"end":22}]},{"id":"remotion-maker:72","slug":"remotion-maker","code":"7072","category":7,"rank":2,"type":"recall","level":2,"concept":"h2-promo excluded from git","question":"Where is the `h2-promo` reference implementation that remotion-maker's stage 3 scaffolds from?","answer":"NOT in this repository: the root `.gitignore` excludes `h2-promo/` because that folder owns its own nested git repo; the pristine copy lives outside, under `Codebase\\h2evo`.","explanation":"What survives here of the H2Evo exemplar: the root `workflow.md` (its completed brand dictionary), `Step1.md`-`Step4.md` (its phase prompts), the role prompt `Agents.md` and the tracker `task.md`. On a fresh clone the only app structure left to copy is `sealcoin-promo/`, itself replicated from h2-promo.","evidence_quote":"# h2-promo owns its own nested git repo (template lineage, left untouched).","tags":["trap"],"source_refs":[{"path":".gitignore","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":6,"end":8},{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":5},{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":14},{"path":"sealcoin-promo/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":3},{"path":"task.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":1},{"path":"Agents.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":10,"end":11}]},{"id":"remotion-maker:80","slug":"remotion-maker","code":"7080","category":8,"rank":0,"type":"recall","level":2,"concept":"Bundled ffmpeg and ffprobe","question":"What makes remotion-maker's concat and verify scripts able to run ffmpeg and ffprobe on a machine with no system install of them?","answer":"They call the binaries BUNDLED with Remotion: `npx remotion ffmpeg` and `npx remotion ffprobe`. Setting env `FFMPEG=ffmpeg` or `FFPROBE=ffprobe` switches to the system binaries.","explanation":"Nothing is deployed: preview and renders run locally through npm scripts. The runbook asks to record which binary was used.","example":"npm run con
