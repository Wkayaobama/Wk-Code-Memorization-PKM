kills under .claude/skills/: aider-scaffold (recipes + diff ledger), tree-f-visualizer (architecture tree), pass-sequence (sequence page, record, workbook), regen-workflow (generator-then-commit GitHub Actions); plus discovery and implementation agent definitions.","talks_to":["docs/diffs","docs/architecture.yaml",".github/workflows"]},{"component":"CI - offline checks (.github/workflows/ci.yml)","path":"README.md:51-62","responsibility":"On push and PR: pytest, bash -n on every script, node --check, build_workflow --check, workbook --verify, tree --check, ledger --check, README index --check and a DRYRUN=1 rehearsal of deploy.sh all and dry.","talks_to":["GitHub Actions"]}],"data_flow":["1. Cloud Scheduler (Mon 07:00 SEALSQ, 07:20 ICALPS, Europe/Zurich) sends GET \u003curl>?entity=E with an OIDC token of the function's service account to the private Cloud Run service.","2. new_deals_report truncates now to the second as run_ts, loads pipeline/stage/owner labels from HubSpot, and reads the watermark from report_state (first run: now minus FIRST_RUN_DAYS = 7).","3. A live window run takes the lease with one atomic UPDATE of report_state.lock_until; if another run holds it the function answers 409 and writes nothing. Dry runs take no lease.","4. HubSpot search: deals with createdate in [watermark - OVERLAP_MINUTES (5), run_ts), all pipelines; the entity's pipelines are in scope, the rest are kept as duplicate candidates.","5. Landing (the raw root): land_raw load-jobs the whole search result into deals_raw with properties as JSON and in_scope per deal, land_labels does the same for labels_raw; each loads first, then deletes older rows of the same (run_ts, entity, orchestrator) key. A landing failure fails the run (raw_landing_failed).","6. call_batch submits ONE statement, CALL new_deals_batch(run_ts, entity, orchestrator, mode, FALSE, NULL, watermark_in, query_start, query_end, started_ms, gaps), and waits up to CALL_TIMEOUT_S (240 s), cancelling the job on timeout.","7. Inside BigQuery the procedure builds a TEMP batch from new_deals_batch_rows (typed view, labels, hot_score_v1, duplicates over a 90-day horizon), then in one transaction MERGEs new_deals on deal_id (four frozen columns untouched), replaces the history slice and writes the runs row.","8. read_batch reads the run's rows back from new_deals_history (dry: from the table function) plus rows_written and data_gaps from the runs row; only then write_watermark sets watermark = run_ts and clears the lease in one statement.","9. The payload (report_id, window, row_count, rows_written, duplicate_suspects, day1_hot, data_gaps, rows) is returned and, on live runs, POSTed to DELIVERY_WEBHOOK_URL with three tries; a failed delivery amends the runs row to OK_DELIVERY_FAILED.","10. n8n NEW_DEALS_DELIVERY (lane B1) receives the payload behind Header Auth, builds the XLSX and sends the e-mail, or a text-only e-mail when row_count is 0.","11. Lane C in parallel or as fallback: DTS sync daily 02:00 UTC, scheduled queries Mon 03:53 / 04:23 UTC land the 90-day set and CALL the same procedure with advance_state = TRUE, then the write-back job (Mon 05:30 Zurich) PATCHes hot_score_v1 / hot_flag_v1 onto deals.","12. On any exception the function marks the procedure's row FAILED (or writes its own FAILED row if none exists), releases the lease and re-raises, so the window stays replayable."],"key_functions":[{"name":"new_deals_report","path":"cloud_function_new_deals/main.py:342","signature":"@functions_framework.http\ndef new_deals_report(request)","does":"HTTP entry point of lane A. Orchestrates lease, HubSpot search, landing, the CALL, read-back, watermark and delivery; decides the mode (window, event or dry) and returns (payload, 200). It is a synchronous request handler: there is no async def anywhere in the Python.","input_example":"GET ?entity=SEALSQ&dry_run=1","expected_output":"200 with a payload where dry_run is true and rows_written is 0 (the assertion of deploy.sh dry); an unknown entity returns ({'error': 'unknown entity X'}, 400); an overlapping live run returns 409."},{"name":"call_batch","path":"cloud_function_new_deals/main.py:233","signature":"def call_batch(client, entity, run_ts, mode, window, started, gaps)","does":"The asynchronous hand-off to BigQuery: client.query() submits the CALL new_deals_batch as a BigQuery job, job.result(timeout=CALL_TIMEOUT_S) blocks on it, and on timeout the job is cancelled so a late procedure cannot land a surprise OK row. Passes advance_state = FALSE and literal NULLs for a missing window.","input_example":"event mode (no window)","expected_output":"the CALL text ends with 'FALSE, NULL, NULL, NULL, NULL, @started_ms, @gaps)' and the gaps parameter is ['event_no_window'] (tests/test_main_offline.py:253)"},{"name":"land_raw","path":"cloud_function_new_deals/main.py:165","signature":"def land_raw(client, found, in_scope_ids, entity, run_ts, mode, source=\"hubspot_api\")","does":"Writes the raw root slice: a load job (load_table_from_json, WRITE_APPEND) of the whole search result into deals_raw, then a DELETE of older rows of the same key, both time-boxed by LAND_TIMEOUT_S. Returns (rows landed, whether an older slice was replaced).","expected_output":"For a search returning deals 1, 2, 3 where 1 and 3 belong to the entity: 3 rows landed, in_scope True for 1 and 3 and False for 2, source 'hubspot_api', properties a dict (tests/test_main_offline.py:306-314)"},{"name":"acquire_lease","path":"cloud_function_new_deals/main.py:143","signature":"def acquire_lease(client, entity, run_ts, start)","does":"One run per entity at a time: creates the report_state row on first run, then sets lock_until = run_ts + LEASE_MINUTES (12) with an UPDATE guarded by 'lock_until IS NULL OR lock_until \u003c @ts'; returns True only when exactly one row was affected.","expected_output":"False when another run holds a live lease; the caller then answers 409 and no load and no CALL happen (tests/test_main_offline.py:238-240)"},{"name":"write_watermark","path":"cloud_function_new_deals/main.py:154","signature":"def write_watermark(client, entity, ts)","does":"Advances report_state.watermark to run_ts and sets lock_until = NULL in one UPDATE. Called only for live window runs, after the CALL and the read-back succeeded, so a failed run leaves no gap."},{"name":"read_batch","path":"cloud_function_new_deals/main.py:260","signature":"def read_batch(client, entity, run_ts, mode, query_start=None, deal_ids=None)","does":"Renders the payload rows from the tables the run wrote: live runs read the history slice plus rows_written and data_gaps from the runs row; dry runs read the table function new_deals_batch_rows. Ordered by amount_kusd DESC, deal_id.","expected_output":"dry: (rows, 0, []); live: (rows, rows_written from the runs row, the procedure's data_gaps)"},{"name":"hot_score","path":"cloud_function_new_deals/main.py:76","signature":"def hot_score(p, now)","does":"Python test oracle of the day-1 hot score (not in the request path since pass 3): logistic of eight weighted features plus bias, 0-100, hot when >= 45. Only pipelines [id] and [id] are scored.","input_example":"vector hw_qualified_big_arr_2027: pipeline [id], stage probability 0.2, closedate 2027-03-31, ARR 16002, 3 contacted notes, revenue_state Pipeline, now 2026-10-05T07:00Z","expected_output":"(90.3, True); vector hw_identified_no_data gives (2.8, False); a non-scored pipeline gives (None, None) (tests/hot_score_vectors.json)"},{"name":"name_key","path":"cloud_function_new_deals/main.py:299","signature":"def name_key(p)","does":"Duplicate key of a deal: final_customer if present, else the part of dealname before the first '-', '/', '|' or '(' ; lower-cased, non-alphanumerics removed, cut to 40 chars. The SQL twin lives in deals_landed_v1.","input_example":"{'final_customer': 'Acme Corp.'}","expected_output":"'acmecorp'"},{"name":"new_deals_batch (procedure)","path":"sql/new_deals_batch.sql:16","signature":"PROCEDURE new_deals_batch(p_run_ts TIMESTAMP, p_entity STRING, p_orchestrator STRING, p_mode STRING, p_advance_state BOOL, p_state_report_id STRING, p_watermark_in TIMESTAMP, p_query_start TIMESTAMP, p_query_end TIMESTAMP, p_started_ms INT64, p_gaps ARRAY\u003cSTRING>)","does":"The one write path. Validates mode, checks lane A's lease when advancing state, adds labels_missing / dedup_horizon_partial to the gaps, then MERGE + history + runs row (+ state with GREATEST) in one transaction; dry writes one runs row only.","input_example":"p_mode = 'dry'","expected_output":"exactly one new_deals_runs row with dry_run = TRUE and rows_written = 0; no MERGE, no history, no state"},{"name":"new_deals_batch_rows (table function)","path":"sql/deals_landed_v1.sql:51","signature":"TABLE FUNCTION new_deals_batch_rows(p_run_ts TIMESTAMP, p_entity STRING, p_orchestrator STRING, p_window_start TIMESTAMP)","does":"The pure, read-only batch: in-scope deals of the slice (one row per deal, latest fetched_at), labels joined, hot_score_v1 applied with run_ts as now, duplicates from every deal the root knows within 90 days. Column order equals new_deals. Use it to debug a past run without writing.","input_example":"SELECT * FROM new_deals_batch_rows(X, 'SEALSQ', 'cloud-run-function', NULL)"},{"name":"hot_score_v1 (UDF)","path":"scoring/hot_score_v1.sql:4","signature":"FUNCTION hot_score_v1(pipeline STRING, hs_deal_stage_probability FLOAT64, closedate TIMESTAMP, calculation___pipeline_2026__k__ FLOAT64, services_value_2026 FLOAT64, asp_in_usd_q2_2022_calculation FLOAT64, tpm__k_y FLOAT64, product_hierarchy STRING, num_contacted_notes FLOAT64, notes_last_updated TIMESTAMP, revenue_state STRING, run_ts TIMESTAMP) RETURNS STRUCT\u003cscore, hot, raw>","does":"THE implementation of the score since pass 3 (12 positional arguments, pinned by tests/test_pass3_sql.py). Returns NULL when the pipeline has no conversion rate.","expected_output":"Every row of tests/hot_score_vectors.sql shows ok = TRUE (15 vectors); offline DuckDB parity on 15 vectors + 4,000 random deals"},{"name":"deploy (deploy.sh)","path":"cloud_function_new_deals/deploy.sh:112","signature":"deploy()  # gcloud run deploy $FN --source . --function new_deals_report --base-image python312 --no-allow-unauthenticated --timeout 540 --memory 512Mi --max-instances 1 --concurrency 1","does":"Canonical Cloud Run function deploy from source: private service, one instance, one request at a time, HUBSPOT_TOKEN from a pinned Secret Manager version. The 'deploy' step applies tables and routines first because the function lands and CALLs them."},{"name":"invoker (deploy.sh)","path":"cloud_function_new_deals/deploy.sh:126","signature":"invoker()  # gcloud scheduler jobs create http new-deals-$e --oidc-service-account-email ... --attempt-deadline 600s --max-retry-attempts 3","does":"Grants roles/run.invoker to the service account and creates the two Cloud Scheduler HTTP jobs (new-deals-SEALSQ, new-deals-ICALPS) PAUSED, with the service URL as OIDC audience; they are resumed only by 'enable' after the dry gate."},{"name":"patchBatch (write-back)","path":"writeback/index.mjs:22","signature":"async function patchBatch(batch)","does":"The only async function in the repo: POSTs up to 100 deals to /crm/v3/objects/deals/batch/update, retries 429 and 5xx up to 5 times honouring the rate-limit header, parses a 207 partial result and returns one status row per deal.","expected_output":"each row gets status OK or ERROR with http_status; after 5 failed attempts: status ERROR, error 'retries exhausted'"},{"name":"land_raw.sql (lane C landing)","path":"sql/land_raw.sql:9","signature":"INSERT INTO deals_raw ... SELECT ... TO_JSON(STRUCT(...), stringify_wide_numbers => TRUE) FROM \u003csync table>; DELETE older rows of the key","does":"Lane C's root writer, spliced into new_deals_weekly.sql at the marker '-- @include land_raw.sql' and reused by backfill_raw.sh: lands the 90-day set from the sync TABLE with HubSpot property names, then the labels; names raw_slice_replaced and labels_missing."}],"infra":[{"topic":"Async execution model on GCP","detail":"No asyncio: asynchrony is job-based. (1) BigQuery jobs: client.query()/load_table_from_json() submit jobs, .result(timeout=) waits, call_batch cancels on timeout. (2) Cloud Scheduler to the function is a synchronous HTTP GET (attempt deadline 600 s > service timeout 540 s, 3 retries). (3) Cloud Scheduler to the write-back is jobs.run, which returns an Operation at once, so Scheduler retries cover only start failures and the job's --max-retries 2 covers execution failures. (4) BigQuery scheduled queries run server-side with @run_time.","path":"cloud_function_new_deals/main.py:233-254"},{"topic":"Lane A deployment","detail":"Cloud Run service new-deals-report (python312 base image, source build via Cloud Build), region europe-west6, private, service account new-deals-fn with bigquery.jobUser + dataset dataEditor + secretAccessor. Env var names: BQ_PROJECT, BQ_DATASET, OVERLAP_MINUTES, FIRST_RUN_DAYS, PORTAL_ID, DELIVERY_WEBHOOK_URL, ORCHESTRATOR, HUBSPOT_TOKEN (secret), DELIVERY_WEBHOOK_TOKEN (optional secret), LAND_TIMEOUT_S, CALL_TIMEOUT_S, LEASE_MINUTES.","path":"cloud_function_new_deals/deploy.sh:112-124"},{"topic":"Concurrency and time budget","detail":"--max-instances 1 --concurrency 1, a per-entity lease in report_state.lock_until (12 minutes), and the two entity schedules 20 minutes apart. Budget inside Cloud Run's 540 s: 4 x LAND_TIMEOUT_S (45) + CALL_TIMEOUT_S (240) + 3 delivery tries x 30 + 20 = 530 s.","path":"cloud_function_new_deals/main.py:204-208"},{"topic":"Schedules (three clocks)","detail":"DTS HubSpot sync every day 02:00 UTC; lane C scheduled queries every monday 03:53 (SEALSQ) and 04:23 (ICALPS) UTC; company tiers refresh every day 03:37 UTC; write-back job 30 5 * * 1 Europe/Zurich; lane A Scheduler jobs 0 7 * * 1 and 20 7 * * 1 Europe/Zurich. Scheduled queries are UTC and ignore DST.","path":"sql/scheduled_query.sh:3-5"},{"topic":"Settings and secrets","detail":"Operator settings come from a gitignored .env (names listed in the file .env.example at the repository root: PROJECT, REGION, BQ_LOCATION, DATASET, FN, SA_NAME, PORTAL_ID, SYNC_DATASET, SYNC_DEALS_TABLE, SYNC_OWNERS_TABLE, SYNC_COMPANIES_TABLE, ARR_DATASET, SQL_SA_NAME, N8N_IMAGE ...). Scripts refuse placeholders. Tokens live in Secret Manager (hubspot-token read, hubspot-token-write for the job, three n8n secrets); check-env refuses a HUBSPOT_TOKEN line in .env.","path":"cloud_function_new_deals/deploy.sh:32-44"},{"topic":"Lane C infrastructure","detail":"BigQuery Data Transfer Service: the HubSpot connector (Preview, full refresh) fills SYNC_DATASET; scheduled queries are transfer configs with data_source scheduled_query run by service account new-deals-sql. The write-back is a Cloud Run job (node:22-slim, --tasks 1 --max-retries 2 --task-timeout 900s) started by Scheduler with an OAuth token of new-deals-scheduler.","path":"writeback/deploy_job.sh:27-34"},{"topic":"Lane B infrastructure (n8n)","detail":"Knative manifest applied with gcloud run services replace: pinned n8n image, Cloud SQL Postgres 17 (db-f1-micro), minScale 0 / maxScale 1, CPU always allocated, N8N_CONCURRENCY_PRODUCTION_LIMIT=1, encryption key and DB password from Secret Manager, health path /health. Workflows are imported by stable id through the n8n REST API.","path":"deploy/n8n/service.yaml"},{"topic":"CI and bot regeneration","detail":"ci.yml runs all offline checks on push and PR (Python 3.12, Node 22). update-readme-index.yml calls the reusable regenerate.yml to rebuild the README Documents index on pushes to main and commit it with a Regenerated-by trailer; it reads the secret named REGEN_TOKEN. Files: .github/workflows/ci.yml, regenerate.yml, update-readme-index.yml.","path":"UNIVERSAL_WORKFLOW.md:294"},{"topic":"Target project of the first run","detail":"The operator runbook targets GCP project [id] with dataset mrload in location EU and HubSpot portal [id]; BQ_LOCATION follows the dataset's location, not the Cloud Run region. A Vertex AI Workbench instance can run the same sequence from the notebook.","path":"docs/RUNBOOK_CLOUD_SHELL.md:11-16"}],"decisions":[{"decision":"Run lane A (Cloud Run function) as the production orchestrator, B1 (n8n) only as its delivery tail, and add lane C's compute + write-back when the score must be visible inside HubSpot","why":"A is the cheapest with the fewest parts, has the exact createdate window and the strongest guarantee set (lease, watermark after MERGE, paused-until-dry schedulers, keyless identity); only C can write back; n8n owning the whole pipeline duplicated everything.","alternative_rejected":"n8n owning the whole pipeline (B2), or BigQuery scheduled queries alone as the orchestrator","evidence":"docs/SCENARIOS.md:64-69"},{"decision":"Fix non-reconstructible runs with a run_ts-keyed landing table (the raw root: deals_raw + labels_raw), not with another orchestrator","why":"Both lanes persisted their outputs per run but never their inputs, so a past run's score, duplicates, labels and report could not be recomputed. An orchestrator sequences nodes; it does not persist the node that is missing. The three defects had one cause: inputs never landed.","alternative_rejected":"A DAG/orchestrator proposal; keeping four live copies of the batch arithmetic held together by tests","evidence":"docs/PASS3_RAW_ROOT.md:161-189"},{"decision":"Store landed properties as one JSON column and type them once in the adapter view deals_landed_v1","why":"Lane A delivers HubSpot strings and lane C typed sync values; the property set changes; with JSON a new property needs no DDL, old slices stay readable and 'as delivered' is kept.","alternative_rejected":"28 typed columns (every PROPS change is a migration plus a view change)","evidence":"docs/PASS3_RAW_ROOT.md:226-230"},{"decision":"Landing is plain DML outside the batch transaction, ordered load-first-then-delete-older","why":"A failed batch must leave its inputs queryable, BigQuery refuses nested transactions, and a failure between the two statements must never leave an empty slice.","alternative_rejected":"DELETE-then-INSERT, or landing inside the batch transaction","evidence":"docs/PASS3_RAW_ROOT.md:235-238"},{"decision":"D1: a dry run lands its slice with mode = 'dry' and writes one runs row, but no MERGE, no history, no state","why":"The rehearsal becomes visible in BigQuery and only one implementation (SQL) stays alive; the convention became 'writes nothing to the sink or the state'.","alternative_rejected":"Keep 'dry computes in memory and writes nothing at all', which would keep the Python shaper alive for dry only","evidence":"docs/PASS3_RAW_ROOT.md:361-368"},{"decision":"D2: lane A (the API extractor) is the root writer; lane C becomes the executor of the one SQL implementation and a fallback caller on its own state row NEW_DEALS_\u003centity>_C","why":"HubSpot's API is what the write-back needs; sharing A's report_state key would let C rewind A, and the procedure's lease check keeps a fallback run from colliding with a live lane-A run.","alternative_rejected":"Retire the DTS caller and the _C row, or share one state row","evidence":"docs/PASS3_RAW_ROOT.md:369-372"},{"decision":"D6: retire n8n B2 (NEW_DEALS_FULL, the generated Code node, the .mjs port)","why":"Once the batch is one SQL implementation over the raw root that every lane CALLs, a second shaper has nothing left to mirror.","alternative_rejected":"Keeping a JavaScript copy of the shaper and scorer in parity by tests","evidence":"docs/PASS3_RAW_ROOT.md:381-387"},{"decision":"Canonical deploy path gcloud run deploy --function --base-image, with the URL read from status.url","why":"Google documents it as the canonical form; mixing it with the compatibility path and a cloudfunctions.net audience breaks the Scheduler OIDC audience.","alternative_rejected":"gcloud functions deploy --gen2","evidence":"docs/EXECUTION_SURFACES.md:54"},{"decision":"Audit rows are written with query INSERTs and landings with load jobs, never streaming inserts","why":"A streaming buffer would block the DELETE that replaces a slice (and lane C's own DELETE in new_deals_runs).","alternative_rejected":"insert_rows_json / streaming inserts","evidence":"cloud_function_new_deals/main.py:218"},{"decision":"Store L2 tiers with a scheduled MERGE into a gold table (deal_tiers) plus a history table","why":"The transfer may drop and recreate its destination table, which breaks a materialized view; StackSync excludes views as sources; a view holds no history; the source is a full reload, not a change stream.","alternative_rejected":"Materialized view over the synced table; BigQuery CDC via the Storage Write API","evidence":"docs/PASS2_L2_TIERS.md:103-113"}],"gotchas":[{"issue":"Nothing has run against Google Cloud yet: pass 1, pass 2 and pass 3 are rehearsed offline only","consequence":"Every 'verified' claim is an offline test or a DRYRUN=1 rendering; the Evidence sections are empty and the first authenticated run may surface platform differences (for example strict-mode resolution of the TEMP table in the procedure).","fix_or_guard":"Follow docs/RUNBOOK_CLOUD_SHELL.md phase by phase, run tests/pass3_batch_vectors.sql in a dev dataset first, paste the probe output verbatim.","path":"docs/PASS1_SEQUENCE.md:9"},{"issue":"Event mode exists in code but cannot be reached: the service is private and a HubSpot workflow webhook cannot present a Google OIDC token","consequence":"The README's near-real-time path does not work as deployed; new deals appear only at the weekly window run.","fix_or_guard":"Needs a relay (n8n) or a public route validating the HubSpot signature; declared out of scope for lane A.","path":"docs/PASS1_SEQUENCE.md:123"},{"issue":"Cloud Scheduler retries do not retry a failed write-back execution, because jobs.run returns an Operation immediately","consequence":"Scheduler sees success once the execution started; overlapping executions of the job are allowed.","fix_or_guard":"The job exits non-zero on errors so Cloud Run's --max-retries 2 re-runs it; OK rows are logged, so the retry PATCHes only the rest.","path":"writeback/index.mjs:57"},{"issue":"Two BigQuery scheduled scripts in the same minute are cancelled as conflicting transactions, and an on-the-hour schedule can trigger twice","consequence":"A lost or doubled lane-C run.","fix_or_guard":"scheduled_query.sh refuses a shared minute or a ':00' schedule; defaults 03:53 and 04:23 UTC.","path":"sql/scheduled_query.sh:17-18"},{"issue":"Landing json.dumps(properties) instead of the dict stores a JSON string scalar","consequence":"Every JSON_VALUE in deals_landed_v1 reads NULL, so nothing is scored or shaped.","fix_or_guard":"land_raw passes the dict itself; test_landing_lands_the_whole_search_with_ddl_columns asserts it.","path":"cloud_function_new_deals/main.py:168-169"},{"issue":"Timeout defaults drift between docs and code: parts of PASS3_RAW_ROOT.md still say LAND_TIMEOUT_S 90 s and CALL_TIMEOUT_S 300 s","consequence":"With those values the budget would exceed Cloud Run's 540 s and the request could be killed with the lease left set.","fix_or_guard":"The code and the offline test pin 45 s and 240 s (4 x 45 + 240 + 90 + 20 = 530 s).","path":"tests/test_main_offline.py:197"},{"issue":"Redeploying the write-back job resets WRITEBACK_APPROVE to the .env value (default 0)","consequence":"A live job silently goes back to dry executions that only log DRY rows.","fix_or_guard":"Set WRITEBACK_APPROVE=1 in .env once the job is live.","path":"writeback/deploy_job.sh:13"},{"issue":"Lane C depends on names unknown until the first transfer run, and the sync is a full refresh that overwrites its tables","consequence":"deals_synced_v1 fails to create if a column is missing; derived columns added to a sync table do not survive the next run; a past run_time reads today's sync.","fix_or_guard":"Fill SYNC_* in .env after the first run; never write into a sync table; such runs carry raw_backfilled_from_current_sync; a 36 h freshness guard aborts stale runs.","path":"sql/new_deals_weekly.sql:18-29"},{"issue":"A crash after the lease is taken leaves lock_until in the future","consequence":"The next run for that entity gets 409 until LEASE_MINUTES (12) have passed.","fix_or_guard":"Landing and the CALL are time-boxed so failures surface inside the request and release_lease runs; deploy.sh status shows watermarks and leases.","path":"cloud_function_new_deals/main.py:143-152"},{"issue":"bq --dry_run cannot execute a CALL and stops at the first IF","consequence":"DRYRUN=1 on the SQL scripts proves rendering and syntax only, not the batch logic.","fix_or_guard":"Structure tests offline (tests/test_pass3_sql.py) and the executed vectors check in a dev dataset.","path":"docs/PASS3_RAW_ROOT.md:404-411"},{"issue":"DATASET=mrload in the runbook puts lane A's tables next to warehouse tables","consequence":"deploy.sh tables grants dataEditor on the whole dataset to the function's service account.","fix_or_guard":"Acceptable for a first pass; a dedicated dataset (hubspot) narrows the grant at no cost.","path":"docs/RUNBOOK_CLOUD_SHELL.md:14-16"}],"glossary":[{"term":"Lane A / B / C / R","meaning":"The execution surfaces compared in the workbook: A Cloud Run function, B n8n on Cloud Run, C hybrid (BigQuery scheduled queries + write-back job), R the raw root plus the one SQL implementation every lane CALLs."},{"term":"B1 / B2","meaning":"B1 = n8n only as delivery tail (webhook to XLSX to e-mail), kept. B2 = n8n owning the whole pipeline with a generated Code node, retired in pass 3 (decision D6)."},{"term":"Raw root","meaning":"deals_raw and labels_raw: a run_ts-keyed copy of what each run computed from, landed before anything is computed, so a past run is recomputable."},{"term":"Slice key","meaning":"(run_ts, entity, orchestrator): identifies one run's rows in deals_raw, labels_raw, new_deals_history and new_deals_runs; re-landing the same key replaces the slice."},{"term":"Watermark","meaning":"report_state.watermark per report_id (NEW_DEALS_\u003centity> for A, NEW_DEALS_\u003centity>_C for C): the end of the last successful window; it advances only after a successful MERGE."},{"term":"Lease","meaning":"report_state.lock_until: one run per entity at a time, taken by an atomic UPDATE; an overlapping run gets HTTP 409."},{"term":"Frozen four","meaning":"deal_id, first_seen_run, day1_hot_score, day1_hot_flag: columns the MERGE never overwrites on a re-observation or a replay."},{"term":"Day-1 hot score","meaning":"hot_score_v1: a 0-100 logistic score of a new deal computed at first observation (fitted 2026-10-01); hot when >= 45; only for SEALSQ pipelines [id] and [id]."},{"term":"name_key","meaning":"Normalised final customer (or first token of the deal name) used to flag duplicate suspects across pipelines and entities within 90 days."},{"term":"data_gaps","meaning":"ARRAY\u003cSTRING> on new_deals_runs naming what a run could not read or compute: sync_stale, labels_missing, dedup_horizon_partial, raw_landing_failed, raw_slice_replaced, raw_backfilled_from_current_sync, source_detail_unavailable, event_no_window."},{"term":"Dry gate","meaning":"deploy.sh dry: ?dry_run=1 for both entities; lands with mode = 'dry', one runs row, rows_written must be 0; schedulers are enabled only after it passes."},{"term":"Parallel / Conditional / Divergent","meaning":"Parity words of the lane workbook: same result on every lane (pinned by a test), same result under a stated condition, or a different mechanism with a named remediation."},{"term":"Layers L0-L17","meaning":"The 18 rows of the lane matrix: L0 deploy unit, L1 identity, L2 secrets, L3 trigger, L4 extraction window, L5 scoring, L6 shaping + duplicate flag, L7 MERGE, L8 watermark, L9 delivery, L10 write-back, L11 dry-run gate, L12 replay, L13 audit trail, L14 access control, L15 concurrency + retry safety, L16 observability, L17 cost."},{"term":"Pass 1 / 2 / 2b / 3","meaning":"Pass 1: the deploy sequence to the first weekly report. Pass 2: L2 likelihood tiers. Pass 2b: the company object by foreign-key resolution. Pass 3: the raw root and the single SQL implementation."},{"term":"Test oracle","meaning":"main.py hot_score() / shape() / name_key(): no longer in the request path, kept only to generate and check tests/hot_score_vectors.json against the SQL UDF."},{"term":"Recipe and diff ledger","meaning":"A recipe is a markdown file describing one block for aider; each resulting commit carries a 'Recipe:' trailer and gets one patch in docs/diffs/ with a row in INDEX.md."},{"term":"Entity","meaning":"SEALSQ (pipelines [id], [id], [id], [id]; USD home currency) or ICALPS (pipeline [id]; EUR as stored)."},{"term":"Witness","meaning":"In the notebook: executing a SQL statement from Python and showing its BigQuery job id, bytes processed and slot time next to its text."}],"directions":["Run pass 1 for real on [id] following docs/RUNBOOK_CLOUD_SHELL.md and paste the dry-run and probe output into the empty Evidence sections: every claim is still offline.","Execute tests/pass3_batch_vectors.sql and tests/hot_score_vectors.sql in a dev dataset: the first authenticated proof that the procedure, the table function and the UDF behave as the structure tests assume.","Create the hubspot-token-write private app and run bootstrap_property.sh so lane C's write-back can go live and Breeze / workflows can read hot_score_v1 as a deal property.","Build lane W for L2 tiers (a dedicated webhook route for HubSpot's array payload with signature validation) or accept the daily cadence; the function's current event path is not it.","Register the daily tier MERGE (deal_tiers_apply.sql) as a scheduled query: scheduled_query.sh registers only the weekly script today.","Deliver the report from new_deals_last_7d or the history slice so a re-send is the same report from any lane, and decide whether to retire the DTS fallback caller and its _C state row once lane A lands reliably."],"confidence":"high","coverage_notes":"Read in full: README, CONVENTIONS, main.py, deploy.sh, bigquery_schema.sql, all of sql/ except the middle of company_tiers_body.sql and company_tiers_v1/apply (headers and DDL lines only), scoring/, writeback/, deploy/n8n/, build_workflow.py, CI workflows, .env.example (names only), SCENARIOS, PASS1, PASS2, PASS3, EXECUTION_SURFACES.md, notebooks/README, the test names and key assertions. Skimmed: UNIVERSAL_WORKFLOW.md (sections 1-2 and headings), the skills' script docstrings, discovery reports (synthesis, parts of scenario A/C, scorer_repos). Not opened: the .ipynb files, the three .xlsx workbooks, the 1,347-line execution_surfaces.yaml body, docs/diffs patches, generated tree files. Single branch (main, one merge commit); no alternate worktrees. Expected outputs come from tests/hot_score_vectors.json and tests/test_main_offline.py; name_key example evaluated by reading. The async answer is by reading: no async def in Python, one async function in writeback/index.mjs. Nothing in the repo has been executed on GCP, so runtime behaviour is as designed, not as observed.","slug":"cloudbq","code":"20","repo":"CloudBQ","visibility":"public","fork":false,"pushed_at":"2026-10-22T17:55:58Z","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","alts":[],"aliases":["cloud run bigquery pipeline","big query cloud run","CloudBQ","the new-deals pipeline","the Cloud Run to BigQuery thing","the three lanes","the raw root project","the hot score pipeline"],"analyzed_at":"2026-11-12","card_count":48,"shelf":2,"github":"https://github.com/Wkayaobama/CloudBQ"},{"title":"SEALSQ revenue model: 'making' layer as a HubSpot custom object","one_liner":"Design, runbook and three scripts that give 20 manual-input revenue plan lines a HubSpot custom object (revenue_plan_line) bound to companies, with values mirrored one-way from a Google Sheet.","purpose":"Fork of a Google Sheets API tutorial (the Pygs wrapper); the owner's own work is the revenue_model/ directory. The SEALSQ revenue model has three feeds: baking (ARR snapshots), making (forward-looking lines typed in by planners) and retrieval (Sheets exports loaded for the final computation). The making feed had no CRM identity: 20 line items lived only as sheet rows. This project settles the granularity and gives each line a governed CRM home, a 'revenue_plan_line' custom object in HubSpot portal [id], associated to one canonical Company where a binding exists, with amounts 2025-2030 in $M mirrored from the Sheet. It is built to guarantee zero overlap with the 6 live deal pipelines and the ARR-snapshot object. Deliverables: a design document with DFMEA risk scoring, a gated S0-S9 deployment runbook, a schema payload, two idempotent HubSpot scripts (upsert, associate) and one Sheet re-sync script.","domain":"CRM revenue planning integration (HubSpot custom object + Google Sheets)","status":"paused","stack":["Python 3 (stdlib urllib, csv, argparse)","HubSpot CRM API v3 (objects, batch upsert, schemas)","HubSpot Associations API v4","Google Sheets API v4 (google-api-python-client)","google-auth service account","pandas (imported by pygs.py)","CSV source-of-truth files","Markdown runbook + design doc"],"entry_points":[{"command":"curl -X POST https://api.hubapi.com/crm-object-schemas/v3/schemas -H \"Authorization: Bearer $HUBSPOT_PRIVATE_APP_TOKEN\" -H \"Content-Type: application/json\" -d @revenue_model/schema_revenue_plan_line.json","what":"S2: creates the revenue_plan_line custom object from the versioned payload (one-time).","path":"revenue_model/WORKFLOW.md:97-102"},{"command":"python revenue_model/crm_upsert_plan_lines.py --object-type p[id]_revenue_plan_line --dry-run","what":"S4 preview: builds the 20 upsert inputs from the two CSVs and prints the first one; needs no token.","path":"revenue_model/crm_upsert_plan_lines.py:85-88"},{"command":"python revenue_model/crm_upsert_plan_lines.py --object-type p[id]_revenue_plan_line --execute","what":"S4: batch-upserts the 20 records by idProperty=li_key (records only, no associations).","path":"revenue_model/crm_upsert_plan_lines.py:90-95"},{"command":"python revenue_model/crm_associate_companies.py --object-type p[id]_revenue_plan_line --dry-run","what":"S5 preview: lists the bindable lines and their target company ids; needs no token.","path":"revenue_model/crm_associate_companies.py:117-120"},{"command":"python revenue_model/crm_associate_companies.py --object-type p[id]_revenue_plan_line --execute","what":"S5: guards the target company ids, resolves the 'Plan line' association type and batch-creates the 15 line-to-company edges.","path":"revenue_model/crm_associate_companies.py:139-151"},{"command":"python revenue_model/crm_associate_companies.py --object-type p[id]_revenue_plan_line --verify","what":"S5 gate: reads back associations and exits 0 only if every bindable line points to exactly its canonical company.","path":"revenue_model/crm_associate_companies.py:125-137"},{"command":"python revenue_model/deploy_line_items.py \u003cspreadsheet_id>","what":"S7: clears and rewrites the LI_CATALOG and LI_VALUES tabs from the CSVs and appends the per-year checksum block.","path":"revenue_model/deploy_line_items.py:50-53"}],"architecture":[{"component":"Implementation design","path":"revenue_model/implementation_design.md","responsibility":"The WHY: problem framing (baking / making / retrieval), portal probe evidence, the custom-object decision, isolation rules R1-R5, company bindings, lifecycle, DFMEA tables and the Phase 0-D deployment plan with acceptance checks.","talks_to":["WORKFLOW runbook"]},{"component":"WORKFLOW runbook (S0-S9)","path":"revenue_model/WORKFLOW.md","responsibility":"Sequential deployment runbook ordered by dependency; every step has an owner, a surface and a Verify gate that must pass before the next step starts.","talks_to":["HubSpot Settings UI","HubSpot API","all three scripts"]},{"component":"Line-item catalog","path":"revenue_model/li_catalog.csv","responsibility":"Single source of truth for the 20 lines: li_key, src_row, segment, label, pursuit_tag, entity, entity_share, company_binding_mode, canonical company name and HubSpot id, binding note.","talks_to":["Upsert script","Association script","Sheet deploy script"]},{"component":"Line-item values","path":"revenue_model/li_values.csv","responsibility":"120 rows in long format (20 lines x years 2025-2030), value_musd in $M; loader-compatible with the model's VARIABLES layout plus the li_key join column.","talks_to":["Upsert script","Sheet deploy script"]},{"component":"Custom object schema payload","path":"revenue_model/schema_revenue_plan_line.json","responsibility":"Exact body for the schema-creation call: object revenue_plan_line, li_key as unique-value property, enums (segment, pursuit_tag, entity, binding_mode), six amount_YYYY numbers, COMPANY as the only associated object.","talks_to":["HubSpot crm-object-schemas v3"]},{"component":"Record upsert script (S4)","path":"revenue_model/crm_upsert_plan_lines.py","responsibility":"Joins catalog and values in memory, pivots the six years into amount_2025..amount_2030 and POSTs batches of 100 to the batch/upsert endpoint keyed on li_key.","talks_to":["li_catalog.csv","li_values.csv","HubSpot CRM v3 objects API"]},{"component":"Company association script (S5)","path":"revenue_model/crm_associate_companies.py","responsibility":"Dedicated, separately auditable association step: filters bindable lines, guards company ids against merged/deleted records, resolves the labelled association type, creates edges, and verifies them.","talks_to":["li_catalog.csv","HubSpot CRM v3 batch read","HubSpot Associations v4"]},{"component":"Sheet deploy script (S7)","path":"revenue_model/deploy_line_items.py","responsibility":"Republishes both CSVs as the LI_CATALOG and LI_VALUES tabs of any spreadsheet id and appends live SUMIF checksums per year.","talks_to":["Pygs wrapper","Google Sheets API"]},{"component":"Pygs wrapper (upstream tutorial code)","path":"pygs.py","responsibility":"Service-account Google Sheets helper inherited from the fork: list_sheet_names, create_sheet, read_sheet, clear_sheet, append_to_sheet, overwrite_sheet, dataframe_to_sheet. Authenticates at import time.","talks_to":["Google Sheets API v4"]}],"data_flow":["1. Planners own per-year values in the Google Sheet; in the repo the same data is frozen as li_catalog.csv (20 lines) and li_values.csv (120 line-year values in $M).","2. S0 preflight: confirm Enterprise tier, a free custom-object slot, and a private app whose token is exported as HUBSPOT_PRIVATE_APP_TOKEN.","3. S1: merge duplicate company records INTO the operator-designated canonical record ([account], [account]); [account] site records are kept; [account] domainless records are reviewed one by one.","4. S2: POST schema_revenue_plan_line.json to create the object; record the fullyQualifiedName (expected p[id]_revenue_plan_line), which every later step takes as --object-type.","5. S3: create the 'Plan line' association label between the object and companies.","6. S4: crm_upsert_plan_lines.py build_inputs() joins catalog + values into 20 inputs and POSTs them to /crm/v3/objects/{object_type}/batch/upsert with idProperty=li_key.","7. S5: crm_associate_companies.py keeps the 15 VERIFIED / VERIFIED_WITH_DUPES lines, resolves their record ids by li_key, batch-reads the 6 target companies as a guard, resolves the association typeId by label name, then POSTs /crm/v4/associations/{object_type}/companies/batch/create.","8. S5 gate: --verify re-reads associations and must report 15/15; the 5 PROSPECTIVE / AGGREGATE lines stay unassociated by design.","9. S6: admin configures the company sidebar card and locks amount_* edits to the automation user.","10. S7: deploy_line_items.py rewrites LI_CATALOG and LI_VALUES in the Sheet and appends the checksum block (expected [amounts] $M for 2025-2030).","11. S8-S9: acceptance checks (20 records, segment sums, 15 associations, deal count unchanged), the R5 anti-double-counting audit, then DFMEA checkpoint 3 re-scoring.","12. Planned, not yet coded (Phase D): nightly export via the search API plus a separate associations call back into LI_VALUES staging, with checksum comparison to detect drift."],"key_functions":[{"name":"build_inputs","path":"revenue_model/crm_upsert_plan_lines.py:46","signature":"def build_inputs()","does":"Reads li_catalog.csv and li_values.csv, groups values by li_key and year, and returns one batch-upsert input per catalog row: {idProperty: 'li_key', id: \u003cli_key>, properties: {...}} with amount_2025..amount_2030 filled from the values (default '0'). granularity and active are hard-coded constants; binding_mode comes from the catalog column company_binding_mode and notes from binding_note.","input_example":"no arguments; reads the two CSVs next to the script","expected_output":"A list of 20 dicts; the first has id 'li_cat_new_sealsq_prospects' with amount_2030 = '[amount]' (values are sent as strings)."},{"name":"main (upsert)","path":"revenue_model/crm_upsert_plan_lines.py:74","signature":"def main()","does":"Parses --object-type plus a required, mutually exclusive --dry-run / --execute. Dry-run prints the first input and returns before the token is read; execute POSTs slices of 100 inputs to /crm/v3/objects/{object_type}/batch/upsert.","input_example":"--object-type p[id]_revenue_plan_line --dry-run","expected_output":"First line: '20 records to upsert into p[id]_revenue_plan_line', then the first input as indented JSON, then a reminder that associations are WORKFLOW S5."},{"name":"call","path":"revenue_model/crm_upsert_plan_lines.py:32","signature":"def call(token, method, path, payload=None)","does":"Minimal HubSpot HTTP client on urllib.request: Bearer header, JSON body, returns the parsed JSON response. Any HTTPError ends the process with sys.exit and the first 500 characters of the error body. Duplicated verbatim in the association script (crm_associate_companies.py:41)."},{"name":"bindable_lines","path":"revenue_model/crm_associate_companies.py:55","signature":"def bindable_lines()","does":"Splits the catalog into lines to associate (company_binding_mode in BINDABLE = {VERIFIED, VERIFIED_WITH_DUPES} and a non-empty company_hs_object_id) and skipped lines. This is the binding_mode governance gate in code.","expected_output":"With the committed catalog: 15 bindable lines and 5 skipped; the script prints '15 bindable lines; 5 skipped by binding_mode (AGGREGATE, PROSPECTIVE)'."},{"name":"guard_companies","path":"revenue_model/crm_associate_companies.py:64","signature":"def guard_companies(token, lines)","does":"Batch-reads every distinct target company id (name, domain) and aborts if any id is not returned as itself, i.e. deleted or merged away. This is the S1-before-S5 ordering protection against associating to a merged-away duplicate.","expected_output":"Prints one 'company \u003cid>: \u003cname> (\u003cdomain>) OK' line per id, or exits with 'ABORT: company ids not readable as themselves (deleted or merged away): [...]'."},{"name":"resolve_type","path":"revenue_model/crm_associate_companies.py:79","signature":"def resolve_type(token, object_type)","does":"GETs /crm/v4/associations/{object_type}/companies/labels and returns (typeId, category, label_used) for the label named 'Plan line'. If the label is missing it falls back to the default unlabeled type with a WARNING; if no type exists at all it aborts and points at S2.","expected_output":"(typeId, category, 'Plan line') when S3 was done, category defaulting to 'USER_DEFINED' if the API omits it; (typeId, category defaulting to 'HUBSPOT_DEFINED', '(default)') plus a WARNING line otherwise."},{"name":"resolve_line_ids","path":"revenue_model/crm_associate_companies.py:92","signature":"def resolve_line_ids(token, object_type, lines)","does":"Batch-reads the custom-object records with idProperty=li_key and returns a dict li_key -> HubSpot record id; aborts with the missing keys if S4 has not loaded them.","expected_output":"dict of 15 entries, or 'ABORT: line records not found (run WORKFLOW S4 upsert first): [...]'."},{"name":"main (associate)","path":"revenue_model/crm_associate_companies.py:104","signature":"def main()","does":"Three exclusive modes. --dry-run prints line -> company targets with no API call. --verify batch-reads associations and counts a line OK only when its associated company list equals exactly [canonical id]; exit code 0 only if all are OK. --execute runs guard_companies, resolve_type, then one batch/create call for all edges.","input_example":"--object-type p[id]_revenue_plan_line --verify","expected_output":"Final line 'verify: 15/15 correct; expected total = 15' and exit code 0 when the deployment is right; exit code 1 on any MISMATCH."},{"name":"main (sheet deploy)","path":"revenue_model/deploy_line_items.py:28","signature":"def main(spreadsheet_id)","does":"Imports Pygs late, lists existing tabs, and for each of LI_CATALOG and LI_VALUES: creates the tab if absent, clears it, appends all CSV rows. For LI_VALUES it first appends a blank row, a CHECKSUM title row and six rows [year, SUMIF formula].","input_example":"python revenue_model/deploy_line_items.py \u003cspreadsheet_id>","expected_output":"Prints 'deployed LI_CATALOG: 21 rows' and 'deployed LI_VALUES: 129 rows' (121 CSV rows + 2 + 6 checksum rows); the first checksum formula is =SUMIF(E2:E121,A124,F2:F121)."},{"name":"load_rows","path":"revenue_model/deploy_line_items.py:23","signature":"def load_rows(csv_name)","does":"Reads a CSV next to the script into a list of row lists, header included, for a values-only push to the Sheet."},{"name":"Pygs.append_to_sheet","path":"pygs.py:73","signature":"def append_to_sheet(self, sheet_name=None, sheet_range=None, values=None)","does":"Appends rows with valueInputOption=USER_ENTERED and insertDataOption=OVERWRITE; USER_ENTERED is what makes the SUMIF checksum strings evaluate as live formulas. A flat list is wrapped into a single row."},{"name":"Pygs.create_sheet","path":"pygs.py:30","signature":"def create_sheet(self, sheet_name, sheet_index=1)","does":"Adds a tab via batchUpdate addSheet. If the name already exists it silently appends a random ' (n)' suffix instead of failing, which is why the deploy script checks the existing tab names first."}],"infra":[{"topic":"Execution model","detail":"No service, no CI, no tests, no dependency manifest. Everything is run by hand from a terminal, step by step, following the S0-S9 runbook; each step has a Verify gate. Scripts take the object's fullyQualifiedName as --object-type so nothing is hard-wired to the portal.","path":"revenue_model/WORKFLOW.md:1-16"},{"topic":"HubSpot target and authentication","detail":"Portal [id] (Enterprise tier needed for custom objects, with at least one free definition slot). A private app token is read from env var HUBSPOT_PRIVATE_APP_TOKEN. Scopes: crm.objects.custom.read/write, crm.objects.companies.read/write (write only for S1 API merges), crm.schemas.custom.read/write.","path":"revenue_model/WORKFLOW.md:36-48"},{"topic":"HubSpot endpoints used","detail":"POST /crm-object-schemas/v3/schemas (S2); POST /crm/v3/objects/companies/merge (S1); POST /crm/v4/associations/{fqn}/companies/labels (S3); POST /crm/v3/objects/{fqn}/batch/upsert (S4); POST /crm/v3/objects/companies/batch/read and /crm/v3/objects/{fqn}/batch/read, GET /crm/v4/associations/{fqn}/companies/labels, POST .../batch/create and .../batch/read (S5).","path":"revenue_model/crm_associate_companies.py:67-149"},{"topic":"Google Sheets authentication","detail":"pygs.py authenticates with a service-account JSON key located at the repository root, with the Drive scope, at module import time. In this fork the key file is a placeholder: it must be replaced by a real key and the target spreadsheet shared with the service-account address as editor before S7 can run.","path":"pygs.py:7-15"},{"topic":"Dependencies","detail":"The two HubSpot scripts use only the Python standard library (urllib, csv, json, argparse). The Sheet deploy goes through pygs.py and therefore needs google-api-python-client, google-auth and pandas (pandas is imported by pygs even though the deploy does not use it).","path":"README.md"},{"topic":"Deployed spreadsheet","detail":"Phase C is already done: a spreadsheet titled 'SEALSQ Revenue Model - LINE_ITEMS (making layer)' exists with tabs ONTOLOGY_MAP, LI_CATALOG and LI_VALUES. Its id is recorded in the runbook. It was published before the canonical company ids were frozen, so its LI_CATALOG tab is stale until S7 is re-run.","path":"revenue_model/WORKFLOW.md:207-216"},{"topic":"Versioned schema","detail":"The custom object definition lives in git as the exact API payload; the UI path must recreate it field for field. The post-create gate checks li_key.hasUniqueValue == true and that COMPANY is the only associated object (isolation rule R1).","path":"revenue_model/schema_revenue_plan_line.json:8-10"}],"decisions":[{"decision":"A dedicated custom object (revenue_plan_line) instead of HubSpot native line items","why":"Native line items associate only with deals, quotes, invoices and similar commerce objects: no line_item-to-company association type exists, they are single-parent and cascade-deleted with the parent. The plan lines must hang on Companies.","alternative_rejected":"Native line_items (and the products catalog, which cannot be associated to other objects)","evidence":"revenue_model/implementation_design.md:109-112"},{"decision":"Not a second 'planning' deal pipeline","why":"A deal pipeline still leaks into forecast and win-rate analytics. With company as the object's only edge (R1), plan lines are structurally unable to appear in pipelines or forecasts (R3). The portal's own rotted weighted_20XX deal properties confirm what happens when year figures are bolted onto the shared deal object.","alternative_rejected":"A separate deal pipeline or per-year custom properties on deals","evidence":"revenue_model/implementation_design.md:174-180"},{"decision":"Object granularity: 1 record = 1 model line (20 records), years as six properties","why":"A company sidebar then shows at most 3 compact cards, the record maps 1:1 to an LI_CATALOG row and upserts idempotently by li_key. Extending the horizon is an annual governed event, whereas sidebar noise and 6x association maintenance would be a daily cost.","alternative_rejected":"One record per line x year (120 records)","evidence":"revenue_model/implementation_design.md:127-133"},{"decision":"Amounts are plain numbers in $M, not HubSpot currency properties","why":"Matches the model exactly (a figure is read as $M) and avoids the multi-currency conversion machinery of a portal that runs USD and EUR, for figures that are planning numbers.","alternative_rejected":"Currency-typed properties","evidence":"revenue_model/implementation_design.md:134-139"},{"decision":"System-of-record split: CRM owns identity and company relationship, the Sheet owns values; flow is one-way Sheet -> CRM","why":"Deciding the split once collapses every later granularity question, and a single write direction plus permission-locked amount_* fields plus a checksum is the mitigation for silent drift (RPN 175).","alternative_rejected":"Editing values in the CRM or two-way sync","evidence":"revenue_model/implementation_design.md:211-214"},{"decision":"Record load (S4) and company association (S5) are two separate scripts","why":"Associations can then be run, re-run and audited independently, and in particular after the S1 deduplication merges so that every edge lands on a canonical record that still exists.","alternative_rejected":"Associating inside the upsert call","evidence":"revenue_model/crm_associate_companies.py:1-9"},{"decision":"Merge duplicates before any association, with the canonical record always as PRIMARY","why":"HubSpot merges cannot be undone and the merged-away id stops resolving as itself, so an edge created to the wrong id would be lost or mis-bound.","alternative_rejected":"Associate first and clean up companies later","evidence":"revenue_model/WORKFLOW.md:56-62"},{"decision":"[account] site records are not merged","why":"The six site-level records are legitimate site accounts, not duplicates. The operator-designated canonical record is used only as the association target, so [account] lines stay VERIFIED_WITH_DUPES by design.","alternative_rejected":"Merging all [account] records into one","evidence":"revenue_model/WORKFLOW.md:70-74"},{"decision":"Upsert by unique idProperty=li_key, with li_key immutable","why":"Create-or-update without storing HubSpot record ids anywhere; re-running the script reconciles the mirror. The label may change freely because the key never does.","alternative_rejected":"Tracking HubSpot record ids in the catalog","evidence":"revenue_model/crm_upsert_plan_lines.py:16-17"},{"decision":"Deploy through the HubSpot UI or a private-app token, not through the MCP connector","why":"Custom object types are not exposed through the MCP connection used for the probe, so schema, quota and records cannot be verified or written from there.","alternative_rejected":"Driving the deployment through the HubSpot MCP tools","evidence":"revenue_model/implementation_design.md:84-89"}],"gotchas":[{"issue":"HubSpot company merges are irreversible and the merged-away id stops resolving as itself.","consequence":"Associating a plan line to a duplicate that is later merged, or merging in the wrong direction, mis-binds revenue lines.","fix_or_guard":"Run S1 before S5 with the canonical record as primary; guard_companies re-reads every target id and aborts on any id not returned as itself.","path":"revenue_model/crm_associate_companies.py:64-76"},{"issue":"The upsert hard-codes active = 'true' for every catalog row.","consequence":"The design says a line is retired with active=false, but the next upsert run sets it back to true for any line still in the catalog; the catalog has no active column.","fix_or_guard":"No guard in code. Remove the row from li_catalog.csv before retiring, or add an active column and read it in build_inputs.","path":"revenue_model/crm_upsert_plan_lines.py:65"},{"issue":"pygs.py builds Google credentials at import time and the key file in the fork is a placeholder.","consequence":"Importing pygs fails until a real service-account key is in place, so the Sheet deploy cannot run out of the box.","fix_or_guard":"deploy_line_items.py imports Pygs inside main() rather than at module level; replace the key and share the spreadsheet with the service account as editor (S7 step 1).","path":"revenue_model/deploy_line_items.py:29"},{"issue":"The already-deployed spreadsheet was published before the canonical company designation.","consequence":"Its LI_CATALOG tab shows pre-canonical binding modes and ids; reading it instead of the repo CSV gives the wrong targets.","fix_or_guard":"li_catalog.csv in the repo is the source of truth; re-run deploy_line_items.py (S7).","path":"revenue_model/WORKFLOW.md:207-211"},{"issue":"[account] and [account] rows are still VERIFIED_WITH_DUPES in the committed catalog.","consequence":"The post-merge bookkeeping (flip the 6 rows to VERIFIED, note the merge date, commit) is not reflected in the repo, so the repo does not tell whether S1 has been executed.","fix_or_guard":"After the S1 gate passes, edit the catalog and commit; [account] rows stay VERIFIED_WITH_DUPES by design.","path":"revenue_model/WORKFLOW.md:85-87"},{"issue":"The CRM search API does not return associations.","consequence":"An export built only on search silently drops the line-to-company mapping (DFMEA risk 6).","fix_or_guard":"Always make a second call (v4 associations batch read, or ?associations=companies on read) and reconcile row counts.","path":"revenue_model/implementation_design.md:92-94"},{"issue":"Enum values in the schema are case-sensitive and the upsert sends catalog strings verbatim.","consequence":"A custom object recreated by hand in the UI with slightly different option values makes the upsert fail or reject rows.","fix_or_guard":"Prefer the API path with the versioned JSON; otherwise recreate the schema field for field.","path":"revenue_model/WORKFLOW.md:104-109"},{"issue":"If the 'Plan line' label was not created (S3 skipped), the association script does not stop.","consequence":"Edges are created with the default unlabeled type: company cards do not read 'Plan line' and reports cannot filter on the label.","fix_or_guard":"resolve_type prints a WARNING on fallback; create the label first and re-run.","path":"revenue_model/crm_associate_companies.py:84-89"},{"issue":"Double counting: a pursuit can enter the model through a plan line and again through the deal weighted pipe.","consequence":"Highest-scored risk (RPN 216). Example in the design: a transactional [account] hardware deal coexists with the [amount] cumulative '[account] Units' plan line.","fix_or_guard":"Rule R5: the weighted pipe feeds only the Catalog segment line; quarterly audit of deals on the 6 bound companies. No script exists for the audit yet.","path":"revenue_model/implementation_design.md:184-190"},{"issue":"--verify demands that a line's associated companies equal exactly one id.","consequence":"A line that also carries a second company association (for example a leftover edge) is reported as MISMATCH and the gate exits 1, even though the canonical edge exists.","fix_or_guard":"Remove the extra association in HubSpot, then re-run --verify.","path":"revenue_model/crm_associate_companies.py:131-137"}],"glossary":[{"term":"making layer","meaning":"The feed of forward-looking revenue line items typed in manually by planners (granularity level 'Line item manual input'); the 20 lines this project covers."},{"term":"baking layer","meaning":"The ARR aggregation feed built from the existing ARR-snapshot custom object; untouched by this project."},{"term":"retrieval layer","meaning":"Sheets exports loaded by the model's 'ALL Sheet params' loader for the final computation."},{"term":"revenue_plan_line","meaning":"The new HubSpot custom object, one record per model line; expected fullyQualifiedName p[id]_revenue_plan_line."},{"term":"li_key","meaning":"Immutable unique text key of a line (for example li_\u003csegment>_\u003caccount>_\u003coffer>); the upsert idProperty and the join column between the CRM, LI_CATALOG and LI_VALUES."},{"term":"binding_mode","meaning":"Company-association governance gate on each line: VERIFIED, VERIFIED_WITH_DUPES, AMBIGUOUS_MULTI_SITE, AMBIGUOUS_DUPLICATE, PROSPECTIVE, AGGREGATE. Only the first two are associated."},{"term":"VERIFIED_WITH_DUPES","meaning":"The canonical company id is confirmed but other records for the same account still exist (duplicates awaiting merge, or site records kept by design)."},{"term":"PROSPECTIVE / AGGREGATE","meaning":"Lines left unassociated on purpose: next-wave pursuits whose account is unknown (3 lines) and aggregate lines with no single account (2 lines)."},{"term":"canonical record","meaning":"The one company record designated by the operator as the association target for an account; always the PRIMARY in a merge."},{"term":"Plan line","meaning":"The named association label between Revenue Plan Line and Company, created in S3 and resolved by name in S5."},{"term":"R1-R5","meaning":"Isolation rules: R1 company is the only edge; R2 no workflow writes in or out except the upsert; R3 no presence in pipelines or forecasts; R4 the deal weighted-pipe layer is read-only; R5 every dollar enters the model through exactly one feed."},{"term":"DFMEA / RPN","meaning":"Design failure-mode analysis used at three checkpoints; RPN = Severity x Occurrence x Detection (1-10 each). Top risks: double counting 216, Sheet/CRM drift 175, mis-binding 126."},{"term":"LI_CATALOG / LI_VALUES","meaning":"The two Sheet tabs mirroring the CSVs: the line catalog with bindings, and long-format per-year values plus the checksum block."},{"term":"checksum block","meaning":"Six SUMIF rows appended under LI_VALUES giving the per-year total of the 20 lines; expected [amounts] $M for 2025-2030 (grand total [amount])."},{"term":"entity / entity_share","meaning":"Delivering entity parsed from the label (SEALSQ, ICALPS or BLENDED) and its share as text such as 1/3 or 3/4; kept as properties rather than separate objects."},{"term":"S0-S9","meaning":"The runbook steps: preflight, dedup, schema, label, record load, association, surfaces and permissions, Sheet re-sync, acceptance and R5 audit, DFMEA checkpoint 3."}],"directions":["Write the Phase D export script (search active=true, v4 batch-read associations, write LI_VALUES staging, compare checksums): it is the only designed step with no code, and it is the detection mechanism for the drift risk.","Script the R5 anti-double-counting audit (list deals on the 6 canonical companies and compare with plan-line amounts) so the quarterly check is one command instead of a manual review.","Add an 'active' column to li_catalog.csv and read it in build_inputs, so retirement by active=false survives the next upsert instead of being reset to true.","Do the post-merge bookkeeping: flip the [account] and [account] rows to VERIFIED once S1 is verified, then re-run the Sheet deploy so the published LI_CATALOG matches the repo.","Prepare the annual horizon ritual: the year range 2025-2030 is hard-coded in the upsert (YEARS), in the deploy checksum loop and in the schema, so adding 2031 means three coordinated edits plus a new amount property.","Factor the duplicated urllib call() helper into one module and add per-row error inspection of batch responses, if the catalog grows beyond a handful of lines."],"confidence":"high","coverage_notes":"Fork: only revenue_model/ is the owner's work and all 8 files there were read in full (WORKFLOW.md, implementation_design.md, the three scripts, the schema JSON, both CSVs, which hold company-level planning data, no persons). pygs.py was read because the deploy script depends on it; the upstream tutorial scripts 00-07, the sample sales CSV and the certificate were skipped. The service-account key file at the repo root was not opened (only its size was checked: a few bytes, consistent with the documented placeholder). Nothing was executed; expected outputs come from reading the code and summing the committed CSV (per-year totals and the 15/5 split were recomputed and match the docs). Status 'paused' is inferred from the single commit dated 2026-07-30; whether S0-S9 were actually executed in the portal cannot be known from the repository. One shallow commit, so no history.","slug":"google-sheets-api-python","code":"35","repo":"google-sheets-api-python","visibility":"public","fork":true,"pushed_at":"2026-07-30T08:36:44Z","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","alts":[],"aliases":["revenue plan line","the making layer","the line-item integration layer","plan lines custom object","the Pygs fork","workflow-design-framework branch"],"analyzed_at":"2026-11-12","card_count":16,"shelf":3,"github":"https://github.com/Wkayaobama/google-sheets-api-python"},{"title":"IC-Ontology: CRM-agnostic ontology + probe substrate (ontology_substrate)","one_liner":"Python package that loads a YAML ontology of CRM entities/edges/property lineage, probes per-edge fill rates across bronze/silver/gold, and renders CSV/XLSX audit views.","purpose":"IC-Ontology is the standalone, CRM-agnostic distillation of the ic-load corrections framework (ontology.yaml -> probe_ontology.py -> ontology_workbook.xlsx -> the v7 mapping-checks workbook -> the ontology metagraph). It turns one declarative YAML document (layers, entities, edges with paired association type IDs, per-property lineage with drift flags) into typed dataclasses, a probe engine whose unit of work is one edge, and four renderers that reproduce the ic-load artefacts. It was built in a single reconstruction session (2026-05-29) from claude-mem observations, so it also ships a SQLite audit DB that records which memory observation underwrote which design claim. The operator uses it to validate an ontology (CLI dry-run) and, from scripts living in ic-load, to produce drift overviews of the IC'ALPS -> HubSpot migration. The Python import name is ontology_substrate because the package is generic; the repo name marks the IC'ALPS instantiation.","domain":"CRM data migration / ontology and lineage auditing","status":"paused","stack":["Python >=3.11","PyYAML","pandas","openpyxl","psycopg 3 (lazy import)","sqlite3 (stdlib)","argparse","hatchling build","pytest 8","gitpython (declared, unused in src)"],"entry_points":[{"command":"python -m ontology_substrate probe --ontology tests/fixtures/7_entity_icload_style.yaml --dry-run","what":"Loads and validates the ontology YAML, prints name/version, entity count, edge count and both adapter names, returns 0. No connector calls.","path":"src/ontology_substrate/cli.py:15"},{"command":"ontology-substrate probe --ontology \u003cpath> --dry-run","what":"Same CLI through the console script declared in pyproject ([project.scripts] -> ontology_substrate.cli:main).","path":"pyproject.toml:21"},{"command":"python -m ontology_substrate probe --ontology \u003cpath> --out-dir \u003cpath>","what":"Non-dry-run path: raises NotImplementedError by design; the live probe is wired by Phase B scripts kept in ic-load. --out-dir is parsed but never used.","path":"src/ontology_substrate/cli.py:40"},{"command":"pip install -e \".[dev]\" && pytest -v","what":"Editable install plus the 62-test suite (documented as 62 passing; 62 test functions counted by grep).","path":"README.md:27"}],"architecture":[{"component":"Schema dataclasses","path":"src/ontology_substrate/schema","responsibility":"Entity, Edge + EdgeTypeBinding, PropertyLineage, SilverMart, Layer and OntologyDocument: the typed shape of the ontology. Pure data, no I/O except the loader.","talks_to":["YAML loader","Probe engine","Renderers"]},{"component":"YAML loader","path":"src/ontology_substrate/schema/loader.py","responsibility":"load_ontology reads the file, takes the mandatory root key 'ontology' and composes layers, entities (with properties and silver marts), edges and the two adapter name/config pairs into one OntologyDocument.","talks_to":["Schema dataclasses","Drift flag vocabulary"]},{"component":"Drift flag vocabulary","path":"src/ontology_substrate/schema/drift_flags.py","responsibility":"Closed 7-value DriftFlag enum describing where property lineage breaks at the sync boundary, plus parse_drift_flag with two legacy aliases (renamed, gold_only) so ic-load YAML round-trips.","talks_to":["PropertyLineage","Renderers"]},{"component":"Adapter seams","path":"src/ontology_substrate/adapters/base.py","responsibility":"Two ABCs that make the package CRM-agnostic: TargetSystemAdapter (destination CRM, reconciliation-id naming) and SyncProviderAdapter (mirror record-id column, boundary drift modes).","talks_to":["Reference adapters"]},{"component":"Reference adapters","path":"src/ontology_substrate/adapters/reference","responsibility":"HubSpotTargetAdapter (prefix + entity + _id), StackSyncProviderAdapter (per-entity record-id columns registered at runtime, 3 drift modes) and DirectAPISyncProvider (no mirror, api_readonly only).","talks_to":["Adapter seams"]},{"component":"Layer connectors","path":"src/ontology_substrate/probe/connectors.py","responsibility":"LayerConnector ABC with row_count and filled_count; CsvConnector (pandas, per-file DataFrame cache) and PostgresConnector (lazy psycopg connection, COUNT(*) queries).","talks_to":["CSV files","Postgres","Fill-rate computation"]},{"component":"Probe engine","path":"src/ontology_substrate/probe/engine.py","responsibility":"ProbeEngine walks ontology.edges, resolves the source entity's bronze/silver/mirror tables into an edge context and dispatches each edge to the engagement or inter-entity processor.","talks_to":["Edge processors","Layer connectors","OntologyDocument"]},{"component":"Edge processors + fill rates","path":"src/ontology_substrate/probe/edge_processors.py","responsibility":"EdgeProbeResult (counts plus four zero-safe rate properties), the engagement test on the source entity, and thin wrappers over compute_interentity_counts / compute_engagement_counts in fill_rates.py.","talks_to":["Layer connectors","Renderers"]},{"component":"Renderers","path":"src/ontology_substrate/renderers","responsibility":"Four output shapes, each mirroring one ic-load artefact: 4 CSV sheets, the 6-sheet graph workbook, the 8-sheet v7-style flat coverage workbook and the 1-sheet 20-column metagraph with a live Fill Rate column.","talks_to":["openpyxl","csv","EdgeProbeResult"]},{"component":"Audit DB","path":"src/ontology_substrate/audit","responsibility":"SQLite table audit_observations (one row per claude-mem observation used in the reconstruction) with AuditDB wrapper and a JSON bulk populator: the fact-check trail for 'which memory supported which claim'.","talks_to":["sqlite3","JSON seed file"]},{"component":"CLI","path":"src/ontology_substrate/cli.py","responsibility":"argparse 'probe' subcommand; only --dry-run is implemented (load + print summary).","talks_to":["YAML loader"]},{"component":"Canonical fixture + tests","path":"tests/fixtures/7_entity_icload_style.yaml","responsibility":"Faithful translation of ic-load's corrections ontology (7 entities, 13 edges, task entity with 3 silver marts and 11 properties); proving ground for the loader, CLI and renderers.","talks_to":["YAML loader","CLI"]}],"data_flow":["1. Author an ontology YAML under the root key 'ontology': name, version, target_system.adapter(+config), sync_provider.adapter(+config), layers, entities (optional properties and silver_marts), edges (with a list of type bindings), registries.","2. load_ontology(path) runs yaml.safe_load and builds Layer, Entity, PropertyLineage, SilverMart and Edge dataclasses; every drift flag string passes through parse_drift_flag (legacy aliases mapped, unknown values raise ValueError).","3. CLI dry-run stops here: it prints five summary lines (ontology name and version, entities, edges, target_system_adapter, sync_provider_adapter) and returns 0.","4. For a live probe, calling code (the Phase B scripts in ic-load, not this repo) builds a dict of connectors keyed 'bronze', 'silver', 'gold' and constructs ProbeEngine(ontology, connectors).","5. ProbeEngine.run loops over ontology.edges; _edge_context looks up the SOURCE entity and returns its bronze_table / silver_table / mirror_table, because an edge names columns, not the tables that hold them.","6. Dispatch: if edge.source is one of note/call/meeting/task the edge goes to process_engagement, otherwise to process_interentity.","7. Counts: inter-entity = bronze.row_count(bronze_table), silver.filled_count(silver_table, silver_source_fk), gold.row_count(assoc_table); engagement uses bronze.filled_count(bronze_table, bronze_source_fk) instead of a bronze row count. Missing connectors or columns leave the count at 0.","8. Denominator: expected = bronze_count when edge.expected_from == 'bronze', else gold_count; materialized_default and materialized_all_types are both set to gold_count.","9. Each edge yields an EdgeProbeResult exposing bronze_to_silver_rate, silver_to_gold_rate, source_side_fill_rate and all_types_fill_rate (0.0 when the denominator is 0).","10. The caller assembles a payload dict {edges, entities, silver_marts: [(entity, mart)], properties: [(entity, prop)], probe_results} and hands it to the renderers (CSV sheets 1-4, ontology workbook, coverage workbook, metagraph).","11. Separately, AuditDB.init_schema + populate_from_json load the claude-mem observations that justified the design into SQLite; Phase B exports them as audit_summary.csv next to the drift overview."],"key_functions":[{"name":"main","path":"src/ontology_substrate/cli.py:15","signature":"def main(argv: list[str] | None = None) -> int","does":"argparse entry point with one subcommand, probe (--ontology required, --dry-run, --out-dir default ./probe_out). Dry-run loads the YAML and prints a 5-line summary; without --dry-run it raises NotImplementedError pointing to the Phase B scripts in ic-load.","input_example":"main([\"probe\", \"--ontology\", \"tests/fixtures/7_entity_icload_style.yaml\", \"--dry-run\"])","expected_output":"returns 0 and prints: ontology: ic-load-corrections v0.7.0 / entities: 7 / edges: 13 / target_system_adapter: hubspot / sync_provider_adapter: stacksync"},{"name":"load_ontology","path":"src/ontology_substrate/schema/loader.py:14","signature":"def load_ontology(path: str | Path) -> OntologyDocument","does":"The single YAML -> OntologyDocument composer. Requires the root key 'ontology' and the keys name, version, target_system.adapter and sync_provider.adapter (KeyError otherwise); layers, entities, edges and registries default to empty.","input_example":"load_ontology(\"tests/fixtures/7_entity_icload_style.yaml\")","expected_output":"name == 'ic-load-corrections', 7 entities {deal, contact, company, note, call, meeting, task}, 13 edges; the task entity has 3 silver_marts and 11 properties"},{"name":"parse_drift_flag","path":"src/ontology_substrate/schema/drift_flags.py:32","signature":"def parse_drift_flag(raw: str) -> DriftFlag","does":"Maps a YAML string to the closed DriftFlag enum, first through the legacy alias table so converted ic-load ontologies need no manual edits.","input_example":"parse_drift_flag(\"renamed\"); parse_drift_flag(\"gold_only\"); parse_drift_flag(\"foo\")","expected_output":"DriftFlag.NAMING_DRIFT; DriftFlag.MIRROR_ONLY; ValueError('unknown drift flag: foo')"},{"name":"EdgeTypeBinding.from_dict","path":"src/ontology_substrate/schema/edge.py:24","signature":"def from_dict(cls, raw: dict[str, Any]) -> EdgeTypeBinding","does":"Builds one mirror type id paired with its API-reverse counterpart from the nested 'api_reverse' block; this explicit pairing is how asymmetric association label semantics survive.","input_example":"EdgeTypeBinding.from_dict({\"id\": 99, \"role\": \"custom_label\", \"label\": \"Foo\"})","expected_output":"id == 99, api_reverse_id is None, api_reverse_label is None"},{"name":"Edge.from_dict","path":"src/ontology_substrate/schema/edge.py:54","signature":"def from_dict(cls, raw: dict[str, Any]) -> Edge","does":"Builds an edge with its per-layer FK columns, association table columns, expected_from, portal_constraint and the ordered list of type bindings. Only name, source, target and cardinality are required.","input_example":"Edge.from_dict({\"name\": \"x\", \"source\": \"a\", \"target\": \"b\", \"cardinality\": \"1:N\"})","expected_output":"expected_from == 'bronze' and types == []"},{"name":"ProbeEngine.run","path":"src/ontology_substrate/probe/engine.py:40","signature":"def run(self) -> list[EdgeProbeResult]","does":"The orchestrator: one EdgeProbeResult per edge, routed to process_engagement or process_interentity depending on the source entity. Connectors are a plain dict passed to the constructor.","input_example":"ProbeEngine(onto_with_edge task_company (assoc_table set, expected_from='mirror'), {\"gold\": gold}).run() where gold.row_count returns 145","expected_output":"results[0].gold_count == 145 and results[0].expected == 145"},{"name":"is_engagement_edge","path":"src/ontology_substrate/probe/edge_processors.py:45","signature":"def is_engagement_edge(edge: Edge) -> bool","does":"Returns True when edge.source is in the hard-coded set ENGAGEMENT_ENTITIES = {note, call, meeting, task}; this is the only branching rule of the engine."},{"name":"compute_interentity_counts","path":"src/ontology_substrate/probe/fill_rates.py:19","signature":"def compute_interentity_counts(edge, edge_context, bronze, silver, gold) -> EdgeProbeResult","does":"Layer-by-layer counts for a primary-FK edge: bronze row count, silver filled count on silver_source_fk, gold row count of the association table; picks the denominator from expected_from. Each connector is optional.","input_example":"edge deal_primary_company, context {bronze_table: staging.stg_opportunity, silver_table: staging.stg_opportunity_normalised}, mocks returning 749 / 749 / 747","expected_output":"bronze_count 749, silver_count 749, gold_count 747, expected 749; with all connectors None every count and expected are 0"},{"name":"compute_engagement_counts","path":"src/ontology_substrate/probe/fill_rates.py:51","signature":"def compute_engagement_counts(edge, edge_context, bronze, silver, gold) -> EdgeProbeResult","does":"Same shape for engagement edges, but the bronze side is filled_count on bronze_source_fk rather than a row count. The docstring mentions a comm_action filter; the code applies none."},{"name":"EdgeProbeResult","path":"src/ontology_substrate/probe/edge_processors.py:18","signature":"@dataclass class EdgeProbeResult(edge_name, bronze_count=0, silver_count=0, gold_count=0, expected=0, materialized_default=0, materialized_custom=0, materialized_all_types=0)","does":"The record that flows from probe to renderers, with four derived zero-safe rates: bronze_to_silver_rate, silver_to_gold_rate, source_side_fill_rate (materialized_default / expected), all_types_fill_rate (materialized_all_types / expected).","input_example":"EdgeProbeResult(edge_name='deal_primary_company', bronze_count=749, silver_count=749, gold_count=747, expected=749, materialized_default=747, materialized_all_types=747)","expected_output":"bronze_to_silver_rate == 1.0; the other three rates round to 0.9973; a result with only edge_name gives 0.0 for all four"},{"name":"CsvConnector.filled_count","path":"src/ontology_substrate/probe/connectors.py:44","signature":"def filled_count(self, table_or_file: str, column: str) -> int","does":"Counts non-null values of one CSV column through a cached pandas DataFrame; files are globbed in the parent directory of path_pattern and a missing file raises FileNotFoundError.","input_example":"CSV 'a,b,c / 1,2,3 / 4,5,6 / 7,,9': filled_count('Bronze_Deals.csv', 'b'), then column 'a', and row_count('Bronze_Deals.csv')","expected_output":"2, 3 and 3"},{"name":"HubSpotTargetAdapter.reconciliation_id_for","path":"src/ontology_substrate/adapters/reference/hubspot.py:10","signature":"def reconciliation_id_for(self, entity_name: str) -> str","does":"Returns the reconciliation-id column for an entity as prefix + entity + '_id', with prefix read from config key reconciliation_id_prefix (default icalps_).","input_example":"HubSpotTargetAdapter(config={\"reconciliation_id_prefix\": \"icalps_\"}).reconciliation_id_for(\"company\"); same with prefix \"legacy_\" and entity \"deal\"","expected_output":"'icalps_company_id'; 'legacy_deal_id'"},{"name":"StackSyncProviderAdapter.boundary_drift_modes","path":"src/ontology_substrate/adapters/reference/stacksync.py:28","signature":"def boundary_drift_modes(self) -> list[str]","does":"Declares the three drift modes possible at a StackSync mirror boundary; DirectAPISyncProvider returns only api_readonly. Record-id columns are registered per entity with register_entity_pattern because their suffixes are per-connection.","expected_output":"['naming_drift', 'mirror_only', 'api_readonly']; mirror_record_id_column('unknown') is None"},{"name":"write_sheet2_relationship_lineage","path":"src/ontology_substrate/renderers/csv_sheets.py:91","signature":"def write_sheet2_relationship_lineage(results: list[EdgeProbeResult], out: Path, edges: list[Edge] | None = None) -> None","does":"Writes the 22-column relationship lineage CSV (counts plus four rates formatted as one-decimal percentages), joining each result to its Edge by name for FK, table and type-id columns.","input_example":"the sample payload result 749 / 749 / 747","expected_output":"22 header columns; row[0] == 'deal_primary_company', bronze_count '749', silver_to_gold_rate '99.7%'"},{"name":"write_metagraph","path":
