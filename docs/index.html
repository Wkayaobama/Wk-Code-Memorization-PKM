window.RECURSER_BUNDLE = {"schema":1,"edition":"public","owner":"Wkayaobama","as_of":"2026-11-12","generated_at":"2026-11-12T17:15:54Z","taxonomy":{"categories":[{"digit":0,"name":"Purpose & fundamentals","mnemonic":"the origin: why it exists, for whom, the core idea"},{"digit":1,"name":"Data model & contracts","mnemonic":"a single node: entities, schemas, config keys, file formats"},{"digit":2,"name":"Flow & algorithms","mnemonic":"split in two: pipeline order, core logic, transformations"},{"digit":3,"name":"Functions & APIs","mnemonic":"input -> transform -> output: key functions, endpoints, CLI"},{"digit":4,"name":"Components & modules","mnemonic":"four pillars: the building blocks and their responsibilities"},{"digit":5,"name":"Runtime & orchestration","mnemonic":"five philosophers: async, concurrency, scheduling, jobs, agents"},{"digit":6,"name":"Architecture & decisions","mnemonic":"six sides of the hexagon: the big design and the WHY"},{"digit":7,"name":"Storage & persistence","mnemonic":"seven normal forms: databases, warehouses, files, state"},{"digit":8,"name":"Infra & integrations","mnemonic":"port 80: cloud, deployment, CI, external APIs, auth"},{"digit":9,"name":"Quality, ops & directions","mnemonic":"five nines: tests, failure modes, runbooks, next steps"}],"shelves":[{"digit":0,"name":"Workbench","mnemonic":"ground zero: editor, shell, kits and personal skills"},{"digit":1,"name":"Ingest & load pipelines","mnemonic":"the first mile: sources into bronze and silver"},{"digit":2,"name":"Warehouse & cloud runs","mnemonic":"two engines: BigQuery and Cloud Run jobs"},{"digit":3,"name":"CRM logic & HubSpot","mnemonic":"the triangle: contacts, companies, deals"},{"digit":4,"name":"Ontology & data modelling","mnemonic":"four corners of a schema"},{"digit":5,"name":"LLM apps & agent harnesses","mnemonic":"five fingers on the model: prompts, tools, runs"},{"digit":6,"name":"Memory & learning systems","mnemonic":"six sides of a die: drill until it lands"},{"digit":7,"name":"Media & storytelling","mnemonic":"seven frames: video and decks"},{"digit":8,"name":"Skill libraries & knowledge transfer","mnemonic":"the infinity loop: write it down, hand it on"},{"digit":9,"name":"Generated apps & experiments","mnemonic":"the last shelf: scaffolds and trials"}],"types":{"recall":"direct question -> short fact","locate":"which function / file / command does X","output":"predict the output (or the intended error) of a call or snippet","why":"design rationale: why X rather than Y","trace":"ordered chain: recite the steps in order","cloze":"fill the blank in a signature, command, config or statement","compare":"discriminate two confusable things by their one difference","scenario":"apply it: something breaks or must change, what do you do"},"levels":{"1":"on the go: one-line recall","2":"understanding: explain a mechanism","3":"application: trace or use it","4":"analysis: trade-offs, what-if, new directions"}},"tuning":{"base_half_life_days":21.0,"mastery_gain":9.0,"mature_days":21.0,"again_delay_ms":600000,"min_ease":1.3,"tiers":[{"max_days":14,"key":"hot","label":"in your hands"},{"max_days":45,"key":"warm","label":"still fresh"},{"max_days":120,"key":"cooling","label":"fading"},{"max_days":365,"key":"cold","label":"mostly gone"},{"max_days":1000000000,"key":"frozen","label":"archaeology"}]},"projects":[{"title":"wkayaobama-skills: personal Claude Code skills and commands library","one_liner":"Portable library of the owner's Claude Code commands and skills: pipeline salvation plans, Bronze ETL methodology, PDF-to-DOCX salvage scripts and a prompt-level rigor hook.","purpose":"A personal, cross-machine knowledge repo for Claude Code. It collects the methods the owner distilled while rescuing the IC'ALPS CRM pipeline (icalps-dashboard: Excel/xlwings + FastAPI bridge + 12-stage PowerShell Bronze ETL called Workflowps) and makes them reusable through one environment variable, CLAUDE__ROOT, that every file uses as its absolute root. It holds two commands (write a salvation plan, execute it checkpoint by checkpoint) and five skills: pipeline-salvation, workflowps (three documents), github-deployment, salvage-pdf-to-word and production-discipline. Only salvage-pdf-to-word ships runnable code (Node + Python scripts that rebuild an untagged PDF into a structured DOCX); production-discipline ships a PowerShell hook that injects a seven-point rigor checklist on decision-like prompts. Everything else is methodology text that is read on demand, never loaded wholesale into a session.","domain":"LLM tooling: Claude Code skills, ETL methodology, document salvage","status":"active","stack":["Markdown skills and commands (Claude Code)","Node.js ES modules","pdfjs-dist ^5.7.284 (legacy build)","docx ^9.6.1 (docx-js)","mammoth ^1.12.0","Python: pypdfium2 + Pillow","PowerShell hook script","Claude Code hooks (UserPromptSubmit, PreToolUse)","Documented only: PSDuckDB, ImportExcel, SQL Server, PostgreSQL, FastAPI, xlwings"],"entry_points":[{"command":"Read and follow ${CLAUDE__ROOT}/commands/write_plan.md","what":"Asks Claude to write a Pipeline Salvation plan (8 sections) and save it under ~/.claude/plans/ before any code is touched.","path":"README.md:66"},{"command":"Read and follow ${CLAUDE__ROOT}/commands/execute_plan.md","what":"Executes a saved plan task by task: sentinel check, run, verify, stop at every checkpoint for confirmation.","path":"commands/execute_plan.md:13"},{"command":"node ${CLAUDE__ROOT}/skills/salvage-pdf-to-word/scripts/parse.js \u003cinput.pdf> \u003cout-dir>","what":"Stage 1: walks the pdfjs operator list of page 1 and writes raw.json plus raw.stats.json in top-left coordinates.","path":"skills/salvage-pdf-to-word/scripts/parse.js:279"},{"command":"python render_canvas.py \u003cpdf> \u003cout_png> [dpi=50]  then  python slice_canvas.py \u003cin_png> \u003cout_dir> [n=6]","what":"Stage 2: renders the first page to PNG and cuts it into N horizontal bands used as visual ground truth.","path":"skills/salvage-pdf-to-word/scripts/render_canvas.py:25"},{"command":"node ${CLAUDE__ROOT}/skills/salvage-pdf-to-word/scripts/build.js \u003craw.json> \u003cconfig.json> \u003coutput.docx>","what":"Stage 3: clusters text items into lines, classifies them with the corpus config, groups blocks and emits output.docx plus output.ir.json.","path":"skills/salvage-pdf-to-word/scripts/build.js:37"},{"command":"node ${CLAUDE__ROOT}/skills/salvage-pdf-to-word/scripts/preview.js \u003coutput.docx> \u003cpreview.html>","what":"Stage 4: converts the DOCX to a self-contained HTML preview with mammoth.","path":"skills/salvage-pdf-to-word/scripts/preview.js:7"},{"command":"powershell -ExecutionPolicy Bypass -File \"$HOME/.claude/hooks/rigor-reminder.ps1\"","what":"The UserPromptSubmit hook command: prints the rigor checklist that Claude Code injects as extra context when the prompt matches the matcher regex.","path":"skills/production-discipline/references/settings-snippet.json:9"}],"architecture":[{"component":"README and the CLAUDE__ROOT convention","path":"README.md","responsibility":"Declares CLAUDE__ROOT (set once per machine in ~/.bashrc or the PowerShell profile) as the absolute root used by every skill file, maps the tree and says when to invoke each skill. Rule: do not load all skills into every session.","talks_to":["commands","skills"]},{"component":"write-plan command","path":"commands/write_plan.md","responsibility":"Forces a read-first step, an architecture baseline with a status per stage, then the eight plan sections and the five-level probe ladder. A plan that omits either execution system (Python dashboard or Workflowps) is declared invalid.","talks_to":["pipeline-salvation skill","execute-plan command"]},{"component":"execute-plan command","path":"commands/execute_plan.md","responsibility":"Loads and criticises the plan, executes each task with .done sentinel checks, verifies before marking complete, pauses at checkpoints and never declares success before the Success Threshold is met.","talks_to":["write-plan command","pipeline-salvation skill","workflowps skill"]},{"component":"pipeline-salvation skill","path":"skills/pipeline-salvation/SKILL.md","responsibility":"Methodology for recovering the working core of a messy pipeline: success threshold, canonical execution boundary, stage contracts, four buckets, runnable spine, probe discipline, guardrail assessment, recovery checkpoints, first action.","talks_to":["write-plan command"]},{"component":"workflowps: Bronze extraction reference card","path":"skills/workflowps/SKILL.md","responsibility":"Skill named bronze-extraction-pipeline: entity contract, query contract, run-context layout, snapshot capture, state ledger, structural and semantic gates, 12 numbered stages. Maps each concept to files of the PowerShell reference implementation.","talks_to":["metaskill","INTEGRATIONS"]},{"component":"workflowps: hierarchical incremental extraction (metaskill)","path":"skills/workflowps/metaskill.md","responsibility":"Domain-agnostic version of the same pipeline as six principles: entity is the query, content hash as CDC, FK graph propagation, layered gates, run state machine, filesystem as execution graph.","talks_to":["workflowps reference card"]},{"component":"workflowps: integrations reference","path":"skills/workflowps/INTEGRATIONS.md","responsibility":"Documents the two optional integrations of the PowerShell pipeline: the Excel approval gate for stage 09 (VBA button or xlwings function writing approved.json) and the FastAPI bridge used by the dashboard and as stage 11 load fallback.","talks_to":["FastAPI bridge (external)","Excel dashboard (external)"]},{"component":"github-deployment skill","path":"skills/github-deployment/SKILL.md","responsibility":"Seven-step recipe that created this repo from icalps-dashboard: create the repo with gh, set CLAUDE__ROOT, copy commands and skills, write the README, push, link back, and reference skills locally instead of remote plugins.","talks_to":["README"]},{"component":"salvage-pdf-to-word: parser (stage 1)","path":"skills/salvage-pdf-to-word/scripts/parse.js","responsibility":"pdfjs-dist walker for page 1: text items via getTextContent, path bounding boxes via getOperatorList with a save/restore/transform matrix stack, y flipped to top-left. Writes raw.json and raw.stats.json.","talks_to":["build.js"]},{"component":"salvage-pdf-to-word: builder (stage 3)","path":"skills/salvage-pdf-to-word/scripts/build.js","responsibility":"Corpus-agnostic core: loads config.json, clusters lines, classifies each line, folds lines into blocks (banner, form-question, proc-list, field-slot, paragraph) and emits the DOCX with docx-js plus the IR JSON for audit.","talks_to":["config.json","preview.js"]},{"component":"salvage-pdf-to-word: visual reference and preview","path":"skills/salvage-pdf-to-word/scripts","responsibility":"render_canvas.py and slice_canvas.py produce PNG bands to compare against the IR; preview.js turns the DOCX into HTML through mammoth for a fast browser check.","talks_to":["pypdfium2","Pillow","mammoth"]},{"component":"production-discipline skill and rigor hook","path":"skills/production-discipline/SKILL.md","responsibility":"Harness-level rigor gate: a UserPromptSubmit matcher regex runs rigor-reminder.ps1, which prints a seven-point checklist (sequential thinking, read docs, search memory, state assumptions, evidence). Option 2 documents a blocking PreToolUse variant.","talks_to":["~/.claude/settings.json","sequential-thinking MCP server"]}],"data_flow":["1. Library lifecycle: a skill is authored inside a source project (originally icalps-dashboard), copied into commands/ or skills/\u003cname>/ here, committed and pushed; the README tree and the 'When to Use Each Skill' table are updated.","2. On each machine the repo is cloned and CLAUDE__ROOT is exported once; skills are then invoked by asking Claude to read ${CLAUDE__ROOT}/commands/\u003cfile>.md, which pulls in the skills it needs by absolute path.","3. Plan flow: write_plan reads both orchestrators, the Workflowps contract and git state, then writes a plan with an architecture baseline and eight sections to ~/.claude/plans/YYYY-MM-DD-\u003cfeature-name>.md.","4. execute_plan reviews the plan, then per task: check the .done sentinel, run the stage or Python step, verify the artifact against its contract, mark completed; it stops at each checkpoint and finally runs probe levels 1 to 4.","5. Reference Bronze pipeline (documented, code lives elsewhere): 00_preflight, 01_extract, 02_repair, 03_delta, 04_cascade, 05_validate_structural, 06_validate_format, 07_validate_fuzzy, 08_report, 09_approval, 10_finalize, 11_load.","6. Stage 09 is a human gate: the reviewer opens review_package.xlsx and a VBA button or xlwings function writes approved.json or rejected.json into review/{entity}/{RunId}/approval/; a FileSystemWatcher resumes or aborts the run.","7. PDF salvage stage 1: parse.js reads the PDF with pdfjs-dist and writes raw.json (textItems, graphicsOps, canvas size, coordSpace top-left) and raw.stats.json (fonts seen, rect-size histogram, samples).","8. PDF salvage stage 2: render_canvas.py renders the page at 50 DPI by default; slice_canvas.py cuts the PNG into 6 bands by default; the slices are the ground truth for pattern authoring.","9. PDF salvage stage 3: build.js runs clusterLines, classifyLine on every line, groupBlocks, buildDocument, then writes output.docx and output.ir.json; console logs give line-class and block counts.","10. PDF salvage stage 4: preview.js writes preview.html; the author iterates on config.json (labels, regex, thresholds) until the preview matches the slices, then checks the DOCX in Word.","11. Rigor hook (as the skill describes it): Claude Code tests each user prompt against the matcher regex in ~/.claude/settings.json; on a match it runs rigor-reminder.ps1 (timeout 5 s) and injects its output as additional context before the assistant answers.","12. Escalation path (not enabled by default): the reminder writes a marker file, a PreToolUse hook blocks every tool call until the sequential-thinking tool has been invoked, and a Stop hook deletes the marker."],"key_functions":[{"name":"parse","path":"skills/salvage-pdf-to-word/scripts/parse.js:69","signature":"async function parse(pdfPath, outDir)","does":"Loads the PDF with the pdfjs legacy build, takes page 1 at scale 1.0, maps text items to {id, str, x, y, w, h, fontName, fontSize, color: null, hasEOL} with y flipped to top-left, walks the operator list for path boxes, then writes raw.json and raw.stats.json.","input_example":"node parse.js form.pdf ./work","expected_output":"./work/raw.json with keys source, canvas {width, height}, coordSpace \"top-left\", textItems, graphicsOps, images (always []); plus ./work/raw.stats.json"},{"name":"flushPath","path":"skills/salvage-pdf-to-word/scripts/parse.js:133","signature":"const flushPath = (mode) => { ... }  // mode: \"fill\" | \"stroke\" | \"fillStroke\"","does":"On a paint operator, transforms each pending path bounding box with the matrix captured when the path was built, flips y, and pushes a graphics op {id, op: \"path\", x, y, w, h, stroke, fill, opIdx}. Stroke or fill colour is kept only when the paint mode uses it."},{"name":"rgb","path":"skills/salvage-pdf-to-word/scripts/parse.js:62","signature":"function rgb(comps)","does":"Converts pdfjs colour components in the 0..1 range into a lowercase #rrggbb string, clamping each channel; returns null when fewer than three components are given.","input_example":"rgb([1, 0, 0])","expected_output":"\"#ff0000\""},{"name":"histogramRectSizes","path":"skills/salvage-pdf-to-word/scripts/parse.js:266","signature":"function histogramRectSizes(ops)","does":"Buckets graphics ops by their larger side: under 4 tiny, under 16 small, under 100 mid, under 800 large, otherwise huge. Written to raw.stats.json so the author can tell whether real form-field boxes exist.","input_example":"[{w:2,h:3},{w:10,h:1},{w:50,h:900}]","expected_output":"{ tiny: 1, small: 1, mid: 0, large: 0, huge: 1 }"},{"name":"clusterLines","path":"skills/salvage-pdf-to-word/scripts/build.js:105","signature":"function clusterLines(items, yTol)","does":"Drops blank items, sorts by y then x, and starts a new line whenever an item is more than yTol points from the y of the item that opened the current line. Each line gets text, xMin, xMax and the mode font size (rounded to 0.1) and mode font name."},{"name":"mode","path":"skills/salvage-pdf-to-word/scripts/build.js:135","signature":"function mode(arr)","does":"Most frequent value of an array; a tie keeps the value seen first. Used so one odd glyph does not change a line's font size.","input_example":"mode([11, 11, 40])","expected_output":"11"},{"name":"classifyLine","path":"skills/salvage-pdf-to-word/scripts/build.js:146","signature":"function classifyLine(line)","does":"Assigns a kind in fixed priority: empty, banner-heading (font size at or above bannerFontSize), form-heading, proc-section (procSection or procQuotite regex), field-label (exact label or label as first item with inline content), temps-total, proc-item (code, desc, optional badge), else body.","input_example":"one-item line with text \"10234 - Description\", font 11, formmed5 example config","expected_output":"{ kind: \"proc-item\", code: \"10234\", desc: \"Description\", badge: null, raw: \"10234 - Description\" }"},{"name":"groupBlocks","path":"skills/salvage-pdf-to-word/scripts/build.js:213","signature":"function groupBlocks(lines)","does":"Folds classified lines into blocks. A form-heading opens a form-question whose rows are label plus content lines (text before the first label becomes preamble); a proc-section opens a proc-list collecting items, notes and a tempsTotal flag. Both stop at the next form-heading, proc-section or banner."},{"name":"buildContentParagraphs","path":"skills/salvage-pdf-to-word/scripts/build.js:383","signature":"function buildContentParagraphs(lines, label, numberingRefs)","does":"Renders the content cell of a form row. If the label is an option-list host, the joined text starts with optionListPrefix and at least two 'N. text' options are found, it emits a real numbered list with a fresh numbering reference; otherwise one paragraph per line."},{"name":"badgeHighlight","path":"skills/salvage-pdf-to-word/scripts/build.js:459","signature":"function badgeHighlight(badge)","does":"Maps a badge text to a Word highlight colour: exact lowercase key in badgeHighlights first, then any key contained in the badge, else lightGray.","input_example":"badgeHighlight(\"30 min\") with the formmed5 example config","expected_output":"\"red\" (via the \"min\" key); an unknown badge returns \"lightGray\""},{"name":"NumberingRefs.makeUnique","path":"skills/salvage-pdf-to-word/scripts/build.js:531","signature":"makeUnique(prefix)  // method of class NumberingRefs","does":"Returns a fresh numbering reference and registers a decimal level-0 config for it, so every option list restarts at 1 instead of continuing the previous list.","input_example":"two calls of makeUnique(\"opts\") on a new instance","expected_output":"\"opts-1\" then \"opts-2\""},{"name":"buildDocument","path":"skills/salvage-pdf-to-word/scripts/build.js:550","signature":"function buildDocument(blocks)","does":"Dispatches each block kind to its emitter and assembles the docx Document: overridden Heading1 and Heading2 paragraph styles, numbering configs, page margins, a right-aligned italic header with meta.headerText and a 'Page X / Y' footer."},{"name":"render","path":"skills/salvage-pdf-to-word/scripts/render_canvas.py:14","signature":"def render(pdf_path: str, out_png: str, dpi: int = 50) -> None","does":"Renders the first page of the PDF with pypdfium2 at scale dpi/72 and saves an optimised PNG, creating the parent directory.","input_example":"render_canvas.py form.pdf work/canvas.png","expected_output":"work/canvas.png rendered at 50 DPI (scale 50/72)"},{"name":"slice_canvas","path":"skills/salvage-pdf-to-word/scripts/slice_canvas.py:14","signature":"def slice_canvas(in_png: str, out_dir: str, n: int = 6) -> None","does":"Cuts a tall PNG into n equal horizontal bands (the last band takes the remainder) named slice-NN-y\u003ctop>-\u003cbottom>.png. Pillow's pixel cap is disabled because the canvas is intentionally huge.","input_example":"a 1200 px tall PNG with the default n","expected_output":"slice-01-y0-200.png ... slice-06-y1000-1200.png"},{"name":"UserPromptSubmit matcher (rigor regex)","path":"skills/production-discipline/references/settings-snippet.json:5","signature":"(?i)(recommend|should i|should we|which (?:one|path|option|approach)|vs\\b|versus|compare|assess|evaluate|production|how would|why does|why is|tier|workflow|architecture|approach|trade[- ]?off|tradeoff|design)","does":"Decides which prompts get the rigor checklist. Case-insensitive and unanchored; only 'vs' has a word boundary, so the other words also match inside longer words.","input_example":"\"compare option A vs B\"  /  \"fix the typo in line 3\"","expected_output":"first prompt matches (hook fires); second does not match"}],"infra":[{"topic":"Installation on a machine","detail":"Clone the repo and export CLAUDE__ROOT pointing at the clone (bash profile or PowerShell profile). All skill files use ${CLAUDE__ROOT} absolute paths; relative paths are forbidden by the maintenance rules.","path":"README.md:5-17"},{"topic":"Node dependencies of the PDF salvage scripts","detail":"scripts/package.json is a private ES-module package: docx ^9.6.1, mammoth ^1.12.0, pdfjs-dist ^5.7.284, optional sharp ^0.34.5. Installed with npm install inside the scripts directory. pdfjs is imported from its legacy build because Node has no DOMMatrix.","path":"skills/salvage-pdf-to-word/scripts/package.json"},{"topic":"Python dependencies of the PDF salvage scripts","detail":"pypdfium2 for rendering and Pillow for slicing; installed with pip. No requirements file is committed.","path":"skills/salvage-pdf-to-word/SKILL.md:180"},{"topic":"Rigor hook installation","detail":"Copy hooks/rigor-reminder.ps1 to ~/.claude/hooks/, merge the UserPromptSubmit entry of references/settings-snippet.json into ~/.claude/settings.json (command type, timeout 5, status message 'Injecting rigor discipline reminder...'), restart Claude Code. Relies on the sequential-thinking MCP server (@modelcontextprotocol/server-sequential-thinking) being added at user scope.","path":"skills/production-discipline/SKILL.md:62-98"},{"topic":"Repository hosting and publishing","detail":"Plain GitHub repo, single branch master, no CI, no tests, no build. Updates are manual: copy the changed skill from the source project, commit, push. The deployment skill forbids committing connection strings, API keys, .env files and Bronze CSVs.","path":"skills/github-deployment/SKILL.md:151-156"},{"topic":"Plan storage","detail":"Plans produced by write_plan are saved outside the repo at ~/.claude/plans/YYYY-MM-DD-\u003cfeature-name>.md and consumed from there by execute_plan.","path":"commands/write_plan.md:20"},{"topic":"External infra of the documented pipeline (not in this repo)","detail":"FastAPI bridge started with uvicorn dashboard.server.main:app, deployed on Render as service [service]; endpoints POST /export-to-postgres, GET /query, /schema, /tables, /preview. Env var names: ICALPS_API_URL, ICALPS_SERVER (used in execute_plan), PG_HOST, PG_PORT, PG_DATABASE, PG_USER, PG_PASSWORD.","path":"skills/workflowps/INTEGRATIONS.md:252-335"}],"decisions":[{"decision":"Reference skills locally through ${CLAUDE__ROOT} absolute paths instead of remote plugin or marketplace skills","why":"The owner wants one portable, versioned source of truth that works across machines; if a remote plugin conflicts with a local skill, the local skill takes precedence. Cached plugin paths under ~/.claude/plugins/cache/ must not be referenced.","alternative_rejected":"The obra/superpowers plugin, remote marketplace skills, cached plugin paths","evidence":"skills/github-deployment/SKILL.md:131-147"},{"decision":"Salvage the working core of a messy pipeline instead of rewriting it","why":"Proven business behaviour must be preserved before style is cleaned; confidence thresholds are deliverables defined before touching code, the clean plan must stay smaller than the legacy workspace, and live writes are refused until boundary and evidence threshold are explicit.","alternative_rejected":"A rewrite, or process metrics such as 'all files migrated' or '100% test coverage' as the definition of done","evidence":"skills/pipeline-salvation/SKILL.md:13-43"},{"decision":"New guardrails are wired warn-only first and promoted to hard-block only after a Level 4 staging run","why":"A premature guardrail can block the core path; evidence from a full staging run (for example a false-positive rate under 5%) must justify promotion. If a guardrail blocks too much it is downgraded to probe-only.","alternative_rejected":"Wiring a new gate as a hard block on first integration","evidence":"skills/pipeline-salvation/SKILL.md:136-137"},{"decision":"Detect changes with a content hash and a FULL OUTER JOIN between two snapshots instead of CDC","why":"Legacy and commercial source systems give no reliable change feed or updated_at; they only answer 'what is the current state'. Two CSVs and a SQL engine classify every row as NEW, DELETED, MODIFIED or UNCHANGED in one pass, with no hooks or streaming infrastructure.","alternative_rejected":"CDC, event streams, trusting updated_at timestamps","evidence":"skills/workflowps/metaskill.md:68-86"},{"decision":"Numeric-prefixed stage files plus .done sentinels instead of a scheduler or DAG engine","why":"For 10 to 20 stages on one machine an orchestration tool is unjustified overhead. A generic loop sorts filenames and stops on non-zero exit; sentinels give resume-from-failure without an external state store; adding, removing or reordering a stage is a file operation.","alternative_rejected":"Schedulers, DAG engines, workflow platforms","evidence":"skills/workflowps/metaskill.md:217-255"},{"decision":"The delta baseline comes from run_registry.json, written only after finalize, never from scanning the filesystem","why":"A failed partial run leaves files with later timestamps than the last good run, so picking the newest file would select a bad baseline. Engine-local load state is kept separately so two engines can upsert into the same staging tables without corrupting each other.","alternative_rejected":"Deriving the previous run from the newest file on disk; one shared state file for all engines","evidence":"skills/workflowps/SKILL.md:179-210"},{"decision":"Rebuild PDF structure from positions and vector operators instead of trusting PDF tags","why":"For forms, templates and scanned documents the structure is visual only (position, font size, proximity); one-shot converters flatten it into paragraphs in scan order. pdfjs-dist exposes both the text stream and the operator list, enough to rebuild structure.","alternative_rejected":"pdf2docx, Acrobat export, mammoth on an already converted file","evidence":"skills/salvage-pdf-to-word/references/methodology.md:1-23"},{"decision":"Everything corpus-specific lives in config.json; build.js stays corpus-agnostic","why":"The same script must work on a French medical form, an English questionnaire or a contract template. A wrong classification is fixed by adding a label or regex to that corpus's config, not by making the script smarter for one document family.","alternative_rejected":"Hard-coding patterns of one corpus in build.js","evidence":"skills/salvage-pdf-to-word/SKILL.md:192-198"},{"decision":"Enforce rigor in the harness with a hook instead of relying on a memory or CLAUDE.md rule","why":"The rule 'use sequential thinking before recommending' already existed in a project feedback memory file and the assistant still skipped it, costing a full review cycle. Memory-only enforcement was judged insufficient, so the harness injects the checklist mechanically.","alternative_rejected":"Memory-only or CLAUDE.md-only instruction","evidence":"skills/production-discipline/SKILL.md:22-26"},{"decision":"Default to the soft UserPromptSubmit reminder (Option 1); keep the blocking PreToolUse hook (Option 2) as an escalation","why":"Option 1 costs nothing per tool call, has cheap false positives and cannot deadlock. Option 2 is hard enforcement but needs three scripts, three settings entries and a marker-file lifecycle, adds about 50 to 200 ms per tool call and can block sequential thinking itself if the allowlist check fails.","alternative_rejected":"Enabling the PreToolUse block from the start","evidence":"skills/production-discipline/SKILL.md:102-116"}],"gotchas":[{"issue":"The two commands point at ${CLAUDE__ROOT}/dashboard/... and ${CLAUDE__ROOT}/Workflowps/... files that do not exist in this repository.","consequence":"With CLAUDE__ROOT set to this repo (as the README says) the 'read before writing' step and the Workflowps skill reference cannot be resolved; the commands only work as written inside the icalps-dashboard layout.","fix_or_guard":"Use them from the source project, or repoint the paths (the Workflowps card lives here at skills/workflowps/SKILL.md).","path":"commands/write_plan.md:28-44"},{"issue":"The github-deployment skill has drifted from the real repo: it lists writing-plans and executing-plans skills that are absent, recommends a private repo and 'git push origin main', and does not mention the two newer skills.","consequence":"Following it literally misdescribes the tree; the checkout is on branch master and the orchestrator's inventory lists the repo as public.","fix_or_guard":"Treat the README directory map as the source of truth and refresh the deployment skill.","path":"skills/github-deployment/SKILL.md:16-34"},{"issue":"parse.js assigns to an undeclared variable pendingRects in the endPath case; the declared variable is pendingPaths.","consequence":"By reading (not executed): in an ES module this throws a ReferenceError the first time an endPath operator is handled, and pending paths are never discarded for clip-only paths.","fix_or_guard":"Rename to pendingPaths = [].","path":"skills/salvage-pdf-to-word/scripts/parse.js:231"},{"issue":"Only the first page is processed: parse.js calls getPage(1) and render_canvas.py takes pdf[0], although SKILL.md says single- or multi-page sources are supported.","consequence":"Pages after the first are silently ignored; the worked example is one very tall canvas page, which hides the limit.","fix_or_guard":"Loop over pages with a per-page y offset before using the skill on a normal multi-page PDF.","path":"skills/salvage-pdf-to-word/scripts/parse.js:82"},{"issue":"build.js derives the IR path with outArg.replace(/\\.docx$/, \".ir.json\").","consequence":"If the output argument does not end in .docx the IR path equals the output path and the IR JSON overwrites the DOCX just written.","fix_or_guard":"Always pass an output name ending in .docx.","path":"skills/salvage-pdf-to-word/scripts/build.js:638"},{"issue":"Config regexes are case-sensitive unless the pattern starts with the literal prefix (?i); a comment in build.js claims the opposite, and the schema sample in SKILL.md omits the prefix that the real example config uses.","consequence":"A copied pattern such as '^Section' misses lower-case or upper-case variants and those lines fall through to body.","fix_or_guard":"Prefix patterns with (?i) as the example config does; check line-class counts printed by build.js.","path":"skills/salvage-pdf-to-word/scripts/build.js:48-61"},{"issue":"Corpus-specific leftovers remain in the 'corpus-agnostic' scripts: preview.js hard-codes the formmed5 title and header, build.js hard-codes the 'Temps total' label and the default 'Options disponibles:' prefix, and usage strings still name old files under src/.","consequence":"A new corpus gets French labels and the wrong preview title unless the scripts are edited; option texts containing digits also defeat the option-list regex.","fix_or_guard":"Move these literals into config.json when the next corpus is added.","path":"skills/salvage-pdf-to-word/scripts/preview.js:43-47"},{"issue":"Extracted but unused data: graphicsOps are written to raw.json but build.js reads only textItems and canvas; style.colors.badge is loaded and never applied; the optional sharp dependency is never imported; images is always [] and text colour always null.","consequence":"Rectangles, images and colour play no role in classification yet, despite the description mentioning boxes and visual cues.","fix_or_guard":"Known deferral for colour and images (methodology); rectangle-based field detection is still to be built.","path":"skills/salvage-pdf-to-word/scripts/build.js:615-618"},{"issue":"The rigor matcher is an unanchored substring regex: tier, design, workflow, approach or production also match inside longer words, and plain mentions of a workflow trigger it.","consequence":"The checklist is injected on prompts that are not decisions (for example any word containing 'tier').","fix_or_guard":"Documented stance: narrow the regex locally, or accept the reminder as cheap context noise.","path":"skills/production-discipline/SKILL.md:48-58"},{"issue":"The Option 2 blocking script assumes PreToolUse stdin JSON has tool_name and tool_use_history fields; the document itself says this contract is unverified.","consequence":"If the fields differ, the allowlist check fails and the hook can block the sequential-thinking call itself (deadlock) on rigor-gated turns.","fix_or_guard":"Run the diagnostic variant that logs the received JSON first; rollback is removing the PreToolUse and Stop blocks.","path":"skills/production-discipline/hooks/RIGOR_HOOK_OPTION_2.md:141-150"}],"glossary":[{"term":"CLAUDE__ROOT","meaning":"Environment variable (two underscores) holding the absolute path of the skills clone; every skill and command path starts with ${CLAUDE__ROOT}."},{"term":"Command vs skill","meaning":"A command (commands/*.md) is the thing the owner asks Claude to read and follow; a skill (skills/\u003cname>/SKILL.md) is a methodology reference that commands pull in when needed."},{"term":"Pipeline Salvation","meaning":"The owner's method for recovering the runnable core of a messy, half-understood pipeline without a rewrite."},{"term":"Success Threshold","meaning":"Three to six measurable behaviours that define 'saved', written before any task; process metrics are not accepted."},{"term":"Four Buckets","meaning":"File classification of a salvage plan: KEEP, REWRITE-MINIMAL, DEFER, DROP. Every file of the main package goes into exactly one."},{"term":"Runnable Spine","meaning":"One-sentence statement of the gap per system plus at most three file edits per system to close it."},{"term":"Probe ladder","meaning":"Five ascending risk levels: 1 local contract tests, 2 dry run or server start, 3 read-only live probe, 4 full staging run, 5 approved live write (human approval, no exceptions)."},{"term":"Workflowps","meaning":"The 12-stage PowerShell Bronze ETL engine of the IC'ALPS project (SQL Server to PostgreSQL stg_ tables). Its code is not in this repo; only its methodology documents are."},{"term":"Entity contract / query contract","meaning":"Entity contract: name, primary key, updated column, source table, extraction order, staging table, required properties, expected output columns, plus the FK graph. Query contract: the full SQL with JOINs, explicit aliases, ORDER BY primary key and source-side computed fields."},{"term":"run_id","meaning":"Timestamp identifier (yyyyMMdd_HHmmss) declared once by the orchestrator and threaded to every stage; it namespaces every artifact and sorts chronologically as a string."},{"term":"Sentinel (.done)","meaning":"Small file {stage_name}_{run_id}.done written by a stage on success; the orchestrator skips stages whose sentinel exists unless -Force is passed."},{"term":"Run registry vs engine-local load state","meaning":"run_registry.json maps each entity to its last successfully finalized run_id (the delta baseline). Load state files hold engine-internal metadata (row count, schema, fingerprint) per engine."},{"term":"BRZ-05 / BRZ-02","meaning":"Risk labels of the Bronze pipeline: BRZ-05 is the 85% schema-coverage threshold (below it, abort before extracting); BRZ-02 flags empty-string foreign keys that silently drop rows in joins."},{"term":"raw.json / IR (output.ir.json)","meaning":"raw.json is the stage 1 dump of text items and path boxes in top-left coordinates. The IR is the list of classified blocks written next to the DOCX, used to tell a classification error from an emission error."},{"term":"Block kinds","meaning":"banner (centred heading with page break), form-question (heading plus two-column label/content table), proc-list (checkbox items with optional badges and a total-time row), field-slot (label plus blank line), paragraph."},{"term":"DXA and half-points","meaning":"Word units used in config.json: table widths and margins are in DXA (1 inch is about 1440), font sizes are in half-points (22 means 11 pt)."},{"term":"Rigor gate, Option 1 and Option 2","meaning":"Option 1: UserPromptSubmit hook that injects the seven-point discipline checklist (soft). Option 2: PreToolUse hook that blocks tool calls until sequential thinking was invoked, driven by a marker file (hard, deferred)."}],"relations":[{"project":"cloudbq","relation":"Its discovery docs survey this repo (scorer_repos.md cites skills/workflowps/INTEGRATIONS.md) and plan to install a new pass-sequence skill into this library following the README conventions (pass_sequence_port.md)."}],"directions":["Fix parse.js: rename pendingRects to pendingPaths and loop over all pages, because the skill claims multi-page support but handles page 1 only.","Use graphicsOps in build.js to detect real form-field boxes and checkboxes; rectangles are already extracted and histogrammed but ignored by classification.","Move the remaining formmed5 and French literals (preview title, 'Temps total', option prefix) into config.json and add a second corpus example to prove the corpus-agnostic claim.","Repoint the commands to paths that exist under this repo (or document that they must run inside icalps-dashboard) and refresh github-deployment so it matches the README tree and branch master.","Add the pass-sequence skill planned in the cloudbq discovery notes, with a row in the README 'When to Use Each Skill' table.","If the soft reminder keeps being ignored, verify the PreToolUse JSON contract with the diagnostic logger and then enable Option 2; also tighten the matcher with word boundaries to cut false positives."],"confidence":"high","coverage_notes":"Read all 24 tracked files in full (README, 2 commands, 5 skills with references, 5 scripts, package.json, example config and README, hook script, settings snippet). Nothing was executed: behaviours and expected outputs come from reading simple logic; the parse.js ReferenceError and the pdfjs v5 operator format were not verified by running, so whether stage 1 works end to end with the pinned pdfjs version is uncertain. Shallow clone with one commit (2026-06-10, adds production-discipline), single branch master, no alternate worktrees; 'active' status is a judgement. The Workflowps, dashboard and FastAPI code described by several documents is not in this repo (source project icalps-dashboard is not among the listed projects), so those parts are documentation of external code. The worked-example subdirectory name under skills/salvage-pdf-to-word/examples was deliberately not reproduced because it may be a personal name; a local Windows user path in github-deployment was also left out. Not verified: whether Claude Code applies a matcher to UserPromptSubmit events; if it does not, the reminder fires on every prompt.","slug":"wkayaobama-skills","code":"03","repo":"wkayaobama-skills","visibility":"public","fork":false,"pushed_at":"2026-06-10T11:34:45Z","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","alts":[],"aliases":["the skills repo","my personal skills library","CLAUDE__ROOT repo","the pipeline salvation skill","the rigor hook","the PDF salvage skill","workflowps skill"],"analyzed_at":"2026-11-12","card_count":16,"shelf":0,"github":"https://github.com/Wkayaobama/wkayaobama-skills"},{"title":"mr-load scaffold: Miraex -> HubSpot loading plan (inside an rsync fork)","one_liner":"Plan, binding questions and skeleton scripts (rclone Drive mirror, path indexer, staging DDL, ontology YAML) for loading the Miraex estate into HubSpot; precursor of [private project].","purpose":"The repository is a fork of upstream rsync whose only owner-added content is the mr-load/ directory (13 files, 1137 lines, one commit dated 2026-08-06). mr-load replicates the proven icalps loading system for a new source estate, Miraex: legacy CRM entities (companies, fair contacts, Odoo deals) plus a document library that exists only as a Google Drive account with no index. Where icalps had a legacy database supplying per-file metadata, mr-load first mirrors the Drive folder tree to local disk with rclone, derives a hierarchical path index by walking it, then links each file to its company through the top-level folder name. The directory holds the sanitized memory of the prior project (RETRIEVAL.md), a seven-phase gated plan, the agent-team scaffold, the binding questions with four dated answers, and runnable skeletons for Phase 5 only. No loader, uploader or FK resolver exists here; the work continued in the separate [private project] repository.","domain":"CRM data migration planning (Google Drive / Odoo -> HubSpot)","status":"scaffold","stack":["Markdown plan docs","Bash + rclone (Google Drive backend, drive.readonly)","Python 3 stdlib (argparse, csv, hashlib, pathlib)","PostgreSQL DDL (staging_miraex schema)","YAML ontology for the ontology_substrate package","HubSpot CRM: Files API, Notes, v4 associations (planned)","Sync-provider mirrored Postgres (planned, hybrid write path)","DuckDB bronze with md5 row-hash watermark (planned)","Odoo CSV / Drive spreadsheet exports (source)","C (upstream rsync sources, unrelated)"],"entry_points":[{"command":"./mr-load/scripts/rclone/sync_miraex_drive.sh [--tree companies|opportunities|tradeshows] [--live]","what":"rclone sync of each configured Drive tree to $MRLOAD_LOCAL_ROOT/\u003ctree>. Dry-run diff unless --live is passed; writes one timestamped log per tree.","path":"mr-load/scripts/rclone/sync_miraex_drive.sh:59"},{"command":"python mr-load/scripts/indexer/walk_index.py --root /srv/mr-load/drive/companies --tree companies -o artifacts/index_companies.csv","what":"Walks the local mirror in sorted order and writes one CSV row per file (synthetic id, path, segments, depth, company key, size, mtime, exclusion flag), then prints a one-line count summary.","path":"mr-load/scripts/indexer/walk_index.py:90"},{"command":"python -m ontology_substrate probe --ontology miraex_ontology.yaml --dry-run","what":"Validation of the filled ontology YAML with the external ontology_substrate package (the Phase 0 gate). The package is not in this repository.","path":"mr-load/ontology/miraex_ontology.skeleton.yaml:10"}],"architecture":[{"component":"README (system overview)","path":"mr-load/README.md","responsibility":"States what mr-load is, the seven-phase sequential flow, why rclone is used, the repository map and the non-negotiable safety model inherited from icalps.","talks_to":["PLAN.md","RETRIEVAL.md"]},{"component":"RETRIEVAL.md (past-project memory)","path":"mr-load/RETRIEVAL.md","responsibility":"Sanitized synthesis of what ten retrieval agents reconstructed from five prior repos, the live portal and Drive: library pattern, dedup scoring, association mechanisms, deal failure catalog, sync architecture, ontology substrate, live findings, and what has no prior art.","talks_to":["ic-load","ic-ontology","icalps_pipeline"]},{"component":"PLAN.md (phase plan)","path":"mr-load/PLAN.md","responsibility":"Phase 0-6 execution plan. Each phase lists objective, prior art to reuse, steps and gates; nothing writes to the live portal without passing its gates.","talks_to":["BINDING-QUESTIONS.md","AGENTS.md"]},{"component":"BINDING-QUESTIONS.md","path":"mr-load/BINDING-QUESTIONS.md","responsibility":"Open requirements that bind the ETL design. Four starred questions (Q1-Q4) carry dated answers; the rest are grouped by phase and still open (including Q5 dedup mode and Q6 event properties).","talks_to":["PLAN.md"]},{"component":"AGENTS.md (agent teams)","path":"mr-load/AGENTS.md","responsibility":"One agent team per plan phase (Team 0 retrieval done, Teams 1-6), each agent with a mission and a reviewable output artifact, plus the blocking contract between teams. Phase 0 is operator-executed.","talks_to":["PLAN.md"]},{"component":"rclone sync script","path":"mr-load/scripts/rclone/sync_miraex_drive.sh","responsibility":"Phase 5 step 1. Mirrors three Drive trees (one rclone remote each) to local disk with checksum comparison and Office export of native Google files; dry-run by default.","talks_to":["Google Drive","local disk","Path indexer"]},{"component":"rclone config templates","path":"mr-load/scripts/rclone/rclone.conf.example","responsibility":"Example remotes miraex-companies, miraex-opportunities, miraex-tradeshows (type drive, read-only scope, own root_folder_id), plus .env.example and exclude.txt. Real config files are git-ignored.","talks_to":["rclone sync script"]},{"component":"Path indexer","path":"mr-load/scripts/indexer/walk_index.py","responsibility":"Phase 5 step 2. Stdlib-only walker that turns the local mirror into the hierarchical path index CSV; replaces the legacy-database metadata the icalps library relied on.","talks_to":["local disk","stg_library_normalised"]},{"component":"Staging DDL","path":"mr-load/scripts/indexer/init_silver_library.sql","responsibility":"Creates the path-index table, the curated folder-to-company mapping table, the two upload ledgers and the blast-radius exemptions table in a {schema} placeholder schema.","talks_to":["PostgreSQL"]},{"component":"Ontology skeleton","path":"mr-load/ontology/miraex_ontology.skeleton.yaml","responsibility":"Declares layers, four entities (company, contact, deal, document) and four edges with miraex_* keys for the ontology_substrate ProbeEngine. Portal constants are null / FILL_ME.","talks_to":["ontology_substrate","HubSpot"]}],"data_flow":["1. Phase 0 (operator, not agents): fix the write path, create unique miraex_company_id / miraex_contact_id / miraex_deal_id properties, discover association type IDs and pipeline/stage IDs, install staging_miraex.*, confirm the sandbox portal.","2. Phase 1: build the company universe (Odoo export + Drive folder names + summary sheet), bronze row-hash watermark, silver normalisation (+41 phones), dedup probe against a fresh portal export, gated upsert keyed on miraex_company_id.","3. Phase 2: harvest fair/exhibition contact lists, mint a deterministic key (Odoo id, else evt:\u003csha1(event|email|name)[:12]>), batch upsert; no dedup, the key is the only duplicate protection.","4. Phase 3: measure cardinality per entity pair, probe per-edge FK readiness, enumerate the blast radius by BFS and give each edge a verdict (sandbox-required, prod-safe-gated, deferred) before any association write.","5. Phase 4: replicate the minimal deal property set and pipeline first, then load deals from the existing Drive exports with a synthetic frozen miraex_deal_id; stages mapped by ID through a fail-loud two-field mapper.","6. Phase 5 step 1: sync_miraex_drive.sh mirrors the Drive tree to $MRLOAD_LOCAL_ROOT/\u003ctree> (dry-run diff reviewed before --live).","7. Phase 5 step 2: walk_index.py emits one CSV row per file; the CSV is COPYed with an explicit column list into staging_miraex.stg_library_normalised.","8. Phase 5 step 3: the top-level folder (company_key_raw) is resolved to miraex_company_id through map_folder_company; unresolved folders are skipped and reported; the ProbeEngine fill rate is the go/no-go metric.","9. Phase 5 step 5: two-phase upload per file (Files API upload, then a Note carrying the attachment and the original relative path, attached via the v4 default association), tracked in fct_files_uploaded and fct_file_notes_posted.","10. Phase 6: only after Phase 5 acceptance, generalise into an internal two-way sync coded against SyncProviderAdapter, in shadow (log-only) mode first."],"key_functions":[{"name":"synthetic_id","path":"mr-load/scripts/indexer/walk_index.py:57","signature":"def synthetic_id(relpath: str) -> str","does":"Returns 'fs:' plus the first 12 hex characters of the SHA-1 of the UTF-8 string. The caller passes '\u003ctree>/\u003crelative posix path>', so the id is deterministic across re-runs and unique across trees. It becomes miraex_doc_id, the primary key of the index and of both ledgers.","input_example":"synthetic_id('companies/Acme/Contracts/nda.pdf')","expected_output":"'fs:dd0a94aa93c5' (15 characters; the same relative path under 'opportunities/' gives 'fs:ed36b2eee116')"},{"name":"walk","path":"mr-load/scripts/indexer/walk_index.py:61","signature":"def walk(root: Path, tree: str)","does":"Generator over sorted(root.rglob('*')), files only. Yields one dict per file with the ten FIELDS: id, tree, parent directory path, file name, '|'-joined directory segments, depth, top-level segment as company key, size, UTC ISO mtime, exclusion flag.","input_example":"file \u003croot>/Acme/Contracts/nda.pdf with tree='companies'","expected_output":"relative_path='Acme/Contracts', file_name='nda.pdf', path_segments='Acme|Contracts', depth=2, company_key_raw='Acme', excluded=''"},{"name":"exclusion rule (EXCLUDED_EXTS / EXCLUDED_NAMES / MAX_UPLOAD_BYTES)","path":"mr-load/scripts/indexer/walk_index.py:37-41","signature":"EXCLUDED_EXTS = {'.ini', '.db', '.lnk', '.tmp'}; EXCLUDED_NAMES = {'.ds_store', 'desktop.ini', 'thumbs.db'}; MAX_UPLOAD_BYTES = 100 * 1024 * 1024","does":"A file is flagged excluded='ext' when its lower-cased suffix or name matches, else 'oversize' when larger than 100 MiB, else '' (loadable). Excluded files still get an index row. Junk dotfiles are matched by name because pathlib gives them no suffix.","input_example":"a file named .DS_Store; a 150 MiB .zip","expected_output":"'ext'; 'oversize'"},{"name":"FIELDS","path":"mr-load/scripts/indexer/walk_index.py:43-54","signature":"FIELDS = [miraex_doc_id, tree, relative_path, file_name, path_segments, depth, company_key_raw, file_size, modified_at, excluded]","does":"The CSV header and column order written by the indexer. It is the contract with the staging table, which has three more columns (miraex_company_id, resolution_method, _indexed_at), hence the explicit COPY column list."},{"name":"main (walk_index CLI)","path":"mr-load/scripts/indexer/walk_index.py:90","signature":"def main() -> int  # --root PATH --tree {companies,opportunities,tradeshows} -o OUTPUT","does":"Parses the three required arguments, errors if --root is not a directory, materialises all rows, writes the CSV with a header, prints the summary line and returns 0.","expected_output":"'\u003cN> files indexed (\u003cloadable> loadable, \u003cexcluded> excluded), \u003cK> distinct top-level company keys -> \u003coutput>'"},{"name":"TREES map","path":"mr-load/scripts/rclone/sync_miraex_drive.sh:24-28","signature":"declare -A TREES=([companies]=\"miraex-companies:\" [opportunities]=\"miraex-opportunities:\" [tradeshows]=\"miraex-tradeshows:\")","does":"Maps a tree name to its rclone remote. Each remote is defined in rclone.conf with its own root_folder_id. --tree must be one of these keys or the script exits with status 2."},{"name":"FLAGS and the dry-run gate","path":"mr-load/scripts/rclone/sync_miraex_drive.sh:44-52","signature":"FLAGS=(--checksum --create-empty-src-dirs --drive-export-formats \"docx,xlsx,pptx\" --exclude-from exclude.txt --transfers 4 --checkers 8 --log-level INFO); [ \"$LIVE\" -eq 1 ] || FLAGS+=(--dry-run)","does":"The rclone options for every tree. --checksum compares content on re-runs, --create-empty-src-dirs keeps empty folders as part of the hierarchy, native Google files are exported to Office formats, and --dry-run is appended unless --live was given.","input_example":"./sync_miraex_drive.sh --tree companies","expected_output":"a dry-run diff for the companies tree only; nothing is copied"},{"name":"rclone sync loop","path":"mr-load/scripts/rclone/sync_miraex_drive.sh:54-61","signature":"rclone sync \"${TREES[$tree]}\" \"$MRLOAD_LOCAL_ROOT/$tree\" \"${FLAGS[@]}\" --log-file $MRLOAD_LOCAL_ROOT/logs/sync_\u003ctree>_\u003cUTC timestamp>.log","does":"For every tree (or only the --tree one) creates the destination directory and runs rclone sync from the remote to it. MRLOAD_LOCAL_ROOT is mandatory (the script aborts if unset); RCLONE_CONFIG defaults to rclone.conf next to the script."},{"name":"stg_library_normalised","path":"mr-load/scripts/indexer/init_silver_library.sql:18-32","signature":"CREATE TABLE IF NOT EXISTS {schema}.stg_library_normalised (miraex_doc_id TEXT PRIMARY KEY, tree, relative_path, file_name, path_segments, depth, company_key_raw, miraex_company_id, resolution_method, file_size, modified_at, excluded, _indexed_at)","does":"The hierarchical path index: one row per mirrored file. miraex_company_id and resolution_method (mapping|exact|fuzzy_reviewed|NULL) are filled later by the FK resolver; excluded gains a fourth value 'no_company'. Indexed on miraex_company_id and company_key_raw."},{"name":"map_folder_company","path":"mr-load/scripts/indexer/init_silver_library.sql:41-49","signature":"CREATE TABLE IF NOT EXISTS {schema}.map_folder_company (tree, company_key_raw, miraex_company_id, confidence DEFAULT 'curated', reviewed_by, reviewed_at, PRIMARY KEY (tree, company_key_raw))","does":"Curated, human-reviewed mapping from a folder name to a company key. Needed because folder names alias across trees (YYYY_ prefixes, trailing spaces). confidence is 'curated' or 'fuzzy_reviewed'."},{"name":"fct_files_uploaded","path":"mr-load/scripts/indexer/init_silver_library.sql:54-62","signature":"CREATE TABLE IF NOT EXISTS {schema}.fct_files_uploaded (miraex_doc_id TEXT PRIMARY KEY, hs_file_id, status DEFAULT 'pending', error, attempts, first_seen_at, last_attempt_at)","does":"Phase-1 upload ledger (file to HubSpot Files). Status values: pending|uploaded|failed|dry_run. Re-runs skip rows that already succeeded."},{"name":"fct_file_notes_posted","path":"mr-load/scripts/indexer/init_silver_library.sql:65-75","signature":"CREATE TABLE IF NOT EXISTS {schema}.fct_file_notes_posted (miraex_doc_id TEXT PRIMARY KEY, hs_note_id, idempotency_key NOT NULL, status DEFAULT 'pending', error, attempts, first_seen_at, last_attempt_at)","does":"Phase-2 ledger (note + association). idempotency_key is 'miraex_libfile_' || miraex_doc_id. Status: pending|attached|partial|failed|dry_run|unattached_via_unmigrate; unmigrate reads status='attached' as its rollback index."},{"name":"fct_cleanup_exemptions","path":"mr-load/scripts/indexer/init_silver_library.sql:78-87","signature":"CREATE TABLE IF NOT EXISTS {schema}.fct_cleanup_exemptions (object_type, hubspot_id, legacy_id, label, reason, source, created_at, PRIMARY KEY (object_type, hubspot_id))","does":"Blast-radius exemptions for Phase 3: records protected from any bulk operation (the pre-existing Miraex records and the companies flagged by the in-flight duplicate cleanup)."},{"name":"document_company edge","path":"mr-load/ontology/miraex_ontology.skeleton.yaml:122-128","signature":"edge document_company: source document, target company, cardinality \"N:1\", silver_source_fk miraex_company_id, expected_from bronze, types []","does":"Declares the library FK for the ProbeEngine: resolved from the path via map_folder_company, denominator is the filesystem file count, and no type IDs are needed because the note carrier uses the v4 default association."}],"infra":[{"topic":"Where it runs","detail":"Planned for a local or dedicated Ubuntu server holding the Drive mirror under MRLOAD_LOCAL_ROOT (example /srv/mr-load/drive). There is no CI, container or deployment file for mr-load; the .github directory at the repository root belongs to upstream rsync.","path":"mr-load/README.md:32-34"},{"topic":"rclone configuration","detail":"One remote per tree (miraex-companies, miraex-opportunities, miraex-tradeshows), type drive, scope drive.readonly, each with its own root_folder_id because trees shared item by item have no visible parent. A dedicated service/ops Google account is required. Env var names: MRLOAD_LOCAL_ROOT (mandatory), RCLONE_CONFIG (defaults to rclone.conf beside the script).","path":"mr-load/scripts/rclone/rclone.conf.example"},{"topic":"Secrets and private material","detail":"Git-ignored: scripts/rclone/.env, scripts/rclone/rclone.conf, logs, bronze_layer/, artifacts/, index*.csv, the filled ontology/miraex_ontology.yaml, *recon*.json and *digest*. The fork is public, so portal IDs, Drive folder IDs, record IDs and contact data stay in the operator's private digest.","path":"mr-load/.gitignore"},{"topic":"Staging database","detail":"PostgreSQL schema staging_miraex.* created from init_silver_library.sql with {schema} substituted by a loader (allowlist-validated replace). Which Postgres instance hosts it is still an open binding question.","path":"mr-load/scripts/indexer/init_silver_library.sql:1-9"},{"topic":"HubSpot access","detail":"Same portal as the prior icalps load, sandbox-first. Planned token names MIRAEX_SANDBOX_TOKEN and MIRAEX_PROD_TOKEN, sandbox wins when both are set. A Private App token with crm.schemas.*, crm.objects.* and files scopes is needed; the MCP connection used for recon cannot create schemas, notes or files.","path":"mr-load/PLAN.md:31-33"},{"topic":"rclone exclusions","detail":"exclude.txt drops desktop.ini, Thumbs.db, .DS_Store, Office lock files (~$*), *.tmp and *.lnk; to be extended after the first dry-run diff is reviewed.","path":"mr-load/scripts/rclone/exclude.txt"}],"decisions":[{"decision":"Mirror the Drive tree to local disk with rclone before indexing, even though a bidirectionally synced Postgres exists","why":"Downloading the Drive directly would not preserve parts of the folder hierarchy that must be kept, and precision would be lower than the icalps load. A local replica is also a safety net for messy data and the seedbed for the later internal two-way sync.","alternative_rejected":"Direct Drive download, or relying only on the synced Postgres","evidence":"mr-load/README.md:38-42"},{"decision":"Q1: hybrid write path, like icalps","why":"Mirror-Postgres upserts for companies/contacts/deals (sync checkpoint, two-pass association bridge); direct API plus ledger for library files and notes. Consequence: a sync connection for the Miraex objects must exist and its mirror record-id columns are discovered in Phase 0.","alternative_rejected":"Pure mirror-Postgres, or pure direct HubSpot API for everything","evidence":"mr-load/BINDING-QUESTIONS.md:7-19"},{"decision":"Q2: same portal as the prior loading, sandbox-first","why":"Every phase rehearses in the sandbox (round-trip, 1-row prod pilot, 10-row batch, full run). Because it is the same portal, the pre-existing Miraex records and the in-flight cleanup are dedup and blast-radius concerns from day one.","alternative_rejected":"A separate Miraex portal","evidence":"mr-load/BINDING-QUESTIONS.md:21-31"},{"decision":"Q3: load deals from the existing Drive spreadsheets, with a synthetic miraex_deal_id","why":"No fresh ID-bearing Odoo export in v1. The key is a deterministic hash of normalised opportunity name + business line, frozen at first write; company FK resolved by name with mandatory fuzzy review; duplicates deduped keep-latest at silver; dates accepted as lossy. A later export reconciles onto these keys.","alternative_rejected":"Wait for a fresh Odoo export with database ids, dates and currency","evidence":"mr-load/BINDING-QUESTIONS.md:33-47"},{"decision":"Q4: per-company tree only in v1, resolved through a curated folder-to-company mapping table","why":"Top-level folder segment is the company key. Known aliasing (YYYY_ prefixes, trailing spaces) makes pure fuzzy matching unsafe, so a reviewed table with fuzzy assist is used and unresolved folders are skipped and reported, never guessed.","alternative_rejected":"Mirroring all trees in v1; pure fuzzy matching of folder names","evidence":"mr-load/BINDING-QUESTIONS.md:49-61"},{"decision":"Tree-prefixed synthetic id fs:\u003csha1(tree/relpath)[:12]> instead of the icalps fs:\u003csha1(relpath)[:12]>","why":"Identical relative paths in different trees must not collide, and the id must be stable across re-runs because it keys the index and both ledgers.","alternative_rejected":"Hashing the relative path alone (the prior walker.py idiom)","evidence":"mr-load/scripts/indexer/walk_index.py:4-9"},{"decision":"One rclone remote per tree, each with its own root_folder_id","why":"The per-opportunity and tradeshow trees are shared item by item, so their parents are invisible; a single remote for the whole drive could not reach them.","alternative_rejected":"One remote for the whole Drive","evidence":"mr-load/scripts/rclone/sync_miraex_drive.sh:5-7"},{"decision":"Library target is Files + Notes with the path in the note body, not a custom object or a folder replica","why":"It is the proven icalps pattern, and the portal is standard tier with no custom objects (entitlement must be verified). Files go flat into one folder; the hierarchy survives in Postgres and in the note body.","alternative_rejected":"A document custom object; replicating the folder tree in HubSpot Files","evidence":"mr-load/RETRIEVAL.md:26-30"},{"decision":"Reconciliation properties always hold the source-system id, never the HubSpot record id","why":"In the prior project the legacy-id semantics drifted between load waves (external id vs own record id) and that drift was expensive. Properties are created once by a setup script or the UI, never inside the data pipeline.","alternative_rejected":"Reusing the property for HubSpot record ids in later waves","evidence":"mr-load/PLAN.md:20-24"},{"decision":"Phase 0 is executed by the operator, with no autonomous agent team","why":"Schema-changing operations require per-operation human approval (the prior project's boundary rule). Agents may prepare scripts, checklists and probe read-outs, but the operator runs them; Phase 0 blocks every team.","alternative_rejected":"Delegating one-time setup to agents","evidence":"mr-load/AGENTS.md:20-27"}],"gotchas":[{"issue":"The ontology skeleton still documents the document key as fs:\u003csha1(relpath)[:12]> while the indexer hashes tree/relpath","consequence":"Anyone rebuilding ids from the YAML comment gets keys that do not match stg_library_normalised or the ledgers.","fix_or_guard":"Trust walk_index.py; correct the skeleton comment.","path":"mr-load/ontology/miraex_ontology.skeleton.yaml:87"},{"issue":"sync_miraex_drive.sh without --tree loops over all three trees, although the v1 scope (Q4) is the per-company tree only","consequence":"A --live run without --tree would mirror the opportunities and tradeshow trees too.","fix_or_guard":"Always pass --tree companies in v1; the default run is a dry-run diff anyway.","path":"mr-load/scripts/rclone/sync_miraex_drive.sh:54-56"},{"issue":"The indexer CSV has 10 columns but the staging table interposes resolver columns","consequence":"A COPY without a column list misaligns or fails.","fix_or_guard":"COPY with the explicit ten-column list given in both the script docstring and the DDL comment.","path":"mr-load/scripts/indexer/init_silver_library.sql:13-17"},{"issue":"{schema} in the DDL is a placeholder and the loader that substitutes it is not in this repository","consequence":"The SQL cannot be run as is; using str.format would break on literal braces in SQL comments (a prior-project lesson).","fix_or_guard":"Substitute with an allowlist-validated string replace.","path":"mr-load/scripts/indexer/init_silver_library.sql:5-7"},{"issue":"All four edges are declared with cardinality \"N:1\", but the substrate's documented vocabulary is 1:1 / 1:N / N:M","consequence":"The ontology may fail to parse.","fix_or_guard":"Check with the probe dry-run; if N:1 is rejected, flip source/target on the affected edges and use 1:N.","path":"mr-load/ontology/miraex_ontology.skeleton.yaml:12-14"},{"issue":"Running association writes before the sync checkpoint has hydrated record ids","consequence":"The bridge silently matches nothing. The icalps checkpoint stage was only a stub.","fix_or_guard":"Hard ordering: gold upsert, then sync checkpoint, then associations; discover mirror record-id columns per connection.","path":"mr-load/RETRIEVAL.md:67-68"},{"issue":"A file sitting directly at the tree root gets an empty company_key_raw, and folder names alias across trees","consequence":"Those files cannot be linked to a company.","fix_or_guard":"They stay unresolved: skipped and reported (excluded='no_company'), never guessed; the fill rate decides go/no-go.","path":"mr-load/scripts/indexer/walk_index.py:81"},{"issue":"Several values are provisional placeholders: the 100 MiB size cap, the excluded-extension list and the docx/xlsx/pptx export formats","consequence":"They are not verified against the real HubSpot Files limit or an agreed policy.","fix_or_guard":"Answer the Library binding questions before the first live upload.","path":"mr-load/BINDING-QUESTIONS.md:109-117"}],"glossary":[{"term":"mr-load","meaning":"The Miraex-to-HubSpot loading system planned in this directory; it replicates the icalps loading system for a new source estate."},{"term":"Miraex","meaning":"The source estate: legacy CRM entities, Odoo deal exports and a Google Drive document library with a numbered filing scheme."},{"term":"icalps","meaning":"The prior loading project whose pattern, safety model and code (ic-load, ic-d-load, icalps_etl, ic-ontology, icalps_pipeline) mr-load reuses."},{"term":"binding question","meaning":"An open requirement whose answer fixes a design decision; answers are recorded with a date in BINDING-QUESTIONS.md. Q1-Q4 are the starred critical path."},{"term":"miraex_doc_id","meaning":"Synthetic stable file id fs:\u003csha1(tree/relpath)[:12]>; primary key of the path index and of both upload ledgers."},{"term":"company_key_raw","meaning":"The top-level folder segment of a file's path, taken as the company key before resolution to miraex_company_id."},{"term":"hierarchical path index","meaning":"One row per file where the hierarchy is carried by relative_path and '|'-joined path_segments (materialized-path style)."},{"term":"two-phase upload","meaning":"Per file: (1) upload the binary to the HubSpot Files API, (2) create a Note carrier with the attachment and associate it to the company via the v4 default association."},{"term":"ledger","meaning":"A Postgres table keyed by a deterministic source id that records every direct API write, so re-runs are no-ops and unmigrate can roll back."},{"term":"blast radius","meaning":"The set of records an association load would touch, enumerated by BFS over the FK graph and classified as new-record-only or touching pre-existing portal records."},{"term":"readiness probe","meaning":"Read-only measurement of the per-edge FK resolution rate against loaded parents; an edge below the gate is deferred, not half-loaded."},{"term":"fill rate","meaning":"Fraction of files (or rows) resolved at a layer, computed by the ontology ProbeEngine; the go/no-go metric for the library FK."},{"term":"exemptions table","meaning":"fct_cleanup_exemptions: records protected from any bulk operation."},{"term":"FILL_ME","meaning":"Marker in the ontology skeleton for a portal constant (association type IDs, mirror columns) that must be probed from the live portal, never copied from icalps."},{"term":"preview == execution","meaning":"Every write statement is composed from the same SELECT body as the read-only preview, so preview CSVs match what would land."}],"relations":[{"project":"ic-ontology","relation":"Provides the ontology_substrate package (ProbeEngine, LayerConnector, SyncProviderAdapter with StackSync and DirectAPI reference implementations) that the ontology skeleton targets and that Phase 6 is to be coded against."}],"directions":["Treat this directory as frozen history: the live Miraex work is in [private project], which dropped rclone as primary source because an rclone manifest flattens multi-parent Drive nodes. Decide whether to delete mr-load/ from the rsync fork or leave a pointer to [private project].","Fix the id drift in the ontology skeleton (document bronze_pk comment) so it states the tree-prefixed formula used by walk_index.py.","Close the remaining binding questions that are still open here: Q5 (dedup guard live-blocking vs probe-only), Q6 (reuse event_* contact properties), library cadence/export/exclusion policy, conflict policy for the two-way sync.","Write the pieces the plan names but the scaffold lacks: the folder-to-company FK resolver, the loader that renders {schema} and COPYs the index, and the FilesystemConnector (described as a roughly 30-line LayerConnector subclass).","Phase 6 remains the long-term direction: an internal two-way sync independent of the vendor mirror, built against SyncProviderAdapter and started in shadow mode.","The fork carries all upstream rsync C sources for no functional reason; a clean home for the plan documents would make the repository searchable and smaller."],"confidence":"high","coverage_notes":"Read every owner-added file in full: the 13 files under mr-load/ (README, PLAN, RETRIEVAL, AGENTS, BINDING-QUESTIONS, both scripts, the DDL, exclude list, .gitignore, ontology skeleton; the two example config files only for pass 3 every lane lands its inputs in a run_ts-keyed raw root (deals_raw / labels_raw) and CALLs the same procedure new_deals_batch, so any past run can be recomputed from BigQuery. Pass 2 adds L2 likelihood tiers per deal and a company rollup. The repo also carries four reusable documentation/scaffolding skills. Nothing has run against Google Cloud yet: every step is rehearsed offline.","domain":"CRM analytics pipeline (HubSpot to BigQuery on GCP)","status":"active","stack":["Python 3.12 (functions-framework 3.x)","google-cloud-bigquery","requests","BigQuery standard SQL (procedure, table function, UDF, JSON)","Cloud Run (function service + job)","Cloud Scheduler (OIDC / OAuth)","Secret Manager","BigQuery Data Transfer Service (scheduled queries, HubSpot connector)","Node 22 (@google-cloud/bigquery)","n8n 2.41.7 on Cloud Run + Cloud SQL Postgres 17","bash (gcloud, bq)","Vertex AI Workbench notebooks","GitHub Actions","pytest + DuckDB (offline SQL parity)","aider (recipe scaffolding)","openpyxl / PyYAML (lane workbook)"],"entry_points":[{"command":"cloud_function_new_deals/deploy.sh all","what":"Lane A step runner: check-env, enable-apis, iam, tables, routines, secret, deploy, invoker (everything up to, not including, the dry gate). DRYRUN=1 prints every gcloud/bq command instead of running it.","path":"cloud_function_new_deals/deploy.sh:210-230"},{"command":"cloud_function_new_deals/deploy.sh dry   # then: run ENTITY, probe, enable","what":"The gate: calls ?dry_run=1 for both entities and asserts rows_written == 0 and dry_run is true; only after it passes does 'enable' resume the two paused Scheduler jobs.","path":"cloud_function_new_deals/deploy.sh:155-170"},{"command":"GET https://\u003cservice-url>?entity=SEALSQ|ICALPS[&dry_run=1]","what":"The Cloud Run function new_deals_report: one scheduled window run per entity (Cloud Scheduler, OIDC). POST {objectId, mode: event} is the single-deal event path (code only, not deployed).","path":"cloud_function_new_deals/main.py:341-342"},{"command":"cloud_function_new_deals/deploy.sh replay ENTITY FROM_ISO","what":"Idempotency check and backfill: rewinds report_state.watermark to FROM_ISO, then runs one live window; MERGE on deal_id keeps the counts unchanged.","path":"cloud_function_new_deals/deploy.sh:187-193"},{"command":"sql/apply.sh","what":"Lane C: renders and applies every SQL object in dependency order (tables, UDF, adapter views, scoring views, tier views, root adapter + table function, procedure, optional company views). DRYRUN=1 renders only.","path":"sql/apply.sh:23"},{"command":"sql/scheduled_query.sh   # DISABLE_SCHEDULE=1 first","what":"Registers or updates one BigQuery scheduled query per entity (new-deals-SEALSQ-C, new-deals-ICALPS-C) running new_deals_weekly.sql with land_raw.sql spliced in.","path":"sql/scheduled_query.sh:46-54"},{"command":"sql/sync_transfer.sh","what":"Creates the Data Transfer Service config hubspot-sync-deals-owners (HubSpot connector, assets Deals + Owners, daily 02:00 UTC, full refresh).","path":"sql/sync_transfer.sh:20"},{"command":"writeback/deploy_job.sh [execute|live]","what":"Deploys the Node 22 Cloud Run job new-deals-writeback plus its Scheduler trigger (jobs.run); 'execute' runs once and waits; 'live' flips WRITEBACK_APPROVE=1.","path":"writeback/deploy_job.sh:19-38"},{"command":"python3 workflows/src/build_workflow.py [--check]","what":"Generates the two n8n workflow JSON files (NEW_DEALS_DELIVERY, NEW_DEALS_ERRORS); --check exits 1 when a committed file is stale.","path":"workflows/src/build_workflow.py:84"},{"command":"python3 tests/test_hot_score.py && python3 tests/test_main_offline.py && python3 tests/test_pass3_sql.py","what":"Offline proof before any push or deploy: score vectors, the function against a fake BigQuery/HubSpot, and the structure of the pass-3 SQL.","path":"README.md:54"},{"command":"python3 .claude/skills/aider-scaffold/scripts/aider_scaffold.py \u003crecipe.md> [files]","what":"Runs one recipe through aider as an auto-committed step with a 'Recipe:' trailer, then updates the diff ledger docs/diffs/ (script main() at line 37 of that file; documented in UNIVERSAL_WORKFLOW.md section 4.1).","path":"UNIVERSAL_WORKFLOW.md:84"}],"architecture":[{"component":"Lane A - Cloud Run function new_deals_report","path":"cloud_function_new_deals/main.py","responsibility":"Extract and land only: reads the watermark, takes a lease, searches HubSpot for deals created in the window, lands them in deals_raw/labels_raw, CALLs new_deals_batch, reads the result back, advances the watermark, POSTs the payload to the delivery webhook.","talks_to":["HubSpot CRM API","BigQuery","n8n delivery webhook","Cloud Scheduler"]},{"component":"deploy.sh step runner","path":"cloud_function_new_deals/deploy.sh","responsibility":"The single execution surface of lane A: create-or-update steps for APIs, IAM, tables, routines, secret, deploy, Scheduler jobs (created paused), plus the dry gate, run, replay, probe, status, logs.","talks_to":["gcloud","bq","Secret Manager","Cloud Run","Cloud Scheduler"]},{"component":"State, sink and audit tables","path":"cloud_function_new_deals/bigquery_schema.sql","responsibility":"DDL for report_state (watermark + lock_until lease), new_deals (sink, MERGE key deal_id), new_deals_runs (one row per run, data_gaps), new_deals_history (per-run slice), deals_raw / labels_raw (the raw root) and the view new_deals_last_7d.","talks_to":["BigQuery"]},{"component":"Raw-root adapter + pure batch (lane R)","path":"sql/deals_landed_v1.sql","responsibility":"View deals_landed_v1 types the landed JSON once with SAFE_CAST and computes name_key; table function new_deals_batch_rows returns the shaped, scored, de-duplicated batch of one run, read-only.","talks_to":["deals_raw","labels_raw","hot_score_v1 UDF"]},{"component":"The one write path: procedure new_deals_batch","path":"sql/new_deals_batch.sql","responsibility":"Stored procedure every lane CALLs after landing: TEMP batch, then one transaction of MERGE new_deals, history slice, runs row and (if asked) report_state; dry mode writes only one runs row; any error rolls back, writes a FAILED row and re-raises.","talks_to":["new_deals","new_deals_history","new_deals_runs","report_state"]},{"component":"Hot score v1","path":"scoring/hot_score_v1.sql","responsibility":"BigQuery UDF returning STRUCT\u003cscore, hot, raw>: a logistic score over eight features, hot when >= 45, NULL for pipelines without a conversion rate. Constants live once in scoring/hot_score_v1.constants.json; Python hot_score() is only the test oracle.","talks_to":["new_deals_batch_rows","hot_deals_v1"]},{"component":"Lane C - scheduled compute over the sync","path":"sql/new_deals_weekly.sql","responsibility":"BigQuery scheduled script per entity: 36 h freshness guard on the synced deals, lands the 90-day set from the sync table (land_raw.sql), then CALLs new_deals_batch with advance_state = TRUE on its own state row NEW_DEALS_\u003centity>_C.","talks_to":["Data Transfer Service sync dataset","new_deals_batch"]},{"component":"Lane C - sync adapters and ranking views","path":"sql/deals_synced_v1.sql","responsibility":"Adapter views over the HubSpot to BigQuery transfer (deals_synced_v1, owners_synced_v1, pipeline label views); sql/hot_deals_v1.sql ranks open deals per region and exposes hot_deals_v1_writeback, the delta the write-back must PATCH.","talks_to":["sync dataset","pipeline_labels","writeback_log"]},{"component":"Write-back job (Node 22 Cloud Run job)","path":"writeback/index.mjs","responsibility":"Reads hot_deals_v1_writeback, PATCHes hot_score_v1 / hot_flag_v1 onto HubSpot deals in batches of 100 with 429/5xx backoff, logs one row per deal to writeback_log; dry unless WRITEBACK_APPROVE=1; never sends a NULL score.","talks_to":["BigQuery","HubSpot batch update API","Cloud Scheduler (jobs.run)"]},{"component":"Lane B1 - n8n delivery tail","path":"workflows/src/build_workflow.py","responsibility":"Generates NEW_DEALS_DELIVERY (webhook with Header Auth, rows to XLSX to e-mail, text-only e-mail on a zero-row week) and NEW_DEALS_ERRORS; deploy/n8n/ holds the Cloud Run service manifest, Cloud SQL, secrets and import scripts.","talks_to":["Cloud Run function payload","SMTP","Cloud SQL Postgres"]},{"component":"Pass 2 - L2 deal tiers","path":"sql/deal_tiers_v1.sql","responsibility":"Classifies every deal by certainty with RANGE_BUCKET on edges 0.5 / 0.75 / 0.9 into Tier4..Tier1 or Closed_won / Closed_lost; deal_tiers_apply.sql is the scheduled MERGE into the gold table deal_tiers with history and retirement.","talks_to":["deals_synced_v1","deal_tiers","deal_tiers_history","StackSync"]},{"component":"Pass 2b - company tiers rollup","path":"sql/company_tiers_body.sql","responsibility":"One CTE chain resolving each deal to a company through five resolvers in precedence, spliced into the views of company_tiers_v1.sql and into the notebook dry run; company_tiers_apply.sql refreshes the snapshot in one transaction.","talks_to":["ARR dashboard dataset (stg_deals, rec_three_layer)","companies_synced_v1","deal_tiers_v1"]},{"component":"Notebooks (Vertex AI Workbench lane)","path":"notebooks/README.md","responsibility":"cloudbq_deploy_and_witness.ipynb runs the deploy.sh sequence cell by cell and witnesses the SQL from Python; l2_deal_tiers.ipynb is the tier lab (numpy.digitize vs RANGE_BUCKET); company_tiers.ipynb is the dry-run, ship, gate probe of pass 2b.","talks_to":["deploy.sh","BigQuery","HubSpot client of main.py"]},{"component":"Lane workbook and records","path":"docs/execution_surfaces.yaml","responsibility":"The lane matrix source: layers L0-L17 across lanes A/B/C/R with a parity word, remediation rows and equality checks; built into docs/EXECUTION_SURFACES.xlsx; docs/EXECUTION_SURFACES.md is the append-only timeline.","talks_to":["pass-sequence skill"]},{"component":"Reusable skills and agents (.claude/skills, .claude/agents)","path":"UNIVERSAL_WORKFLOW.md:79","responsibility":"Four project-agnostic s
