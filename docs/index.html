"src/ontology_substrate/renderers/metagraph.py:30","signature":"def write_metagraph(payload: dict[str, Any], out: Path) -> None","does":"Writes the operator's 'living tool': one sheet 'Metagraph - Edges', 20 columns, one row per type binding, first column the human association label (falls back to the edge name), last column Fill Rate taken from all_types_fill_rate of the latest probe.","input_example":"sample payload with binding id 6 labelled 'Deal with Primary Company'","expected_output":"sheetnames == ['Metagraph - Edges']; header[0] == 'Hubspot Association Label View', header[-1] == 'Fill Rate'; first data cell 'Deal with Primary Company'; last cell contains '%'"},{"name":"write_ontology_workbook","path":"src/ontology_substrate/renderers/workbook.py:40","signature":"def write_ontology_workbook(payload: dict[str, Any], out: Path) -> None","does":"Writes the 6-sheet graph-shaped workbook; the Metagraph-Edges sheet emits one row per type binding so mirror type id (column index 12) and API-reverse id (index 14) stay paired.","expected_output":"sheets: Entity-Pair Inventory, Relationship Lineage, Metagraph-Entities, Metagraph-Edges, Ingestion Paths, Property Lineage; with bindings 6/5 and 342/341 the rows carry (6, 5) then (342, 341)"},{"name":"write_coverage_workbook","path":"src/ontology_substrate/renderers/coverage.py:37","signature":"def write_coverage_workbook(payload: dict[str, Any], out: Path) -> None","does":"Writes the v7-style flat coverage workbook: a 26-column Ontologie sheet with one row per property plus seven register/config/mapping sheets that contain headers only.","expected_output":"8 sheets: Ontologie, HubSpot_property_check, Silver_property_check, Bronze_property_check, Source_property_check, Check_config, Source_to_bronze_map, Bronze_to_silver_map; Ontologie header has 26 columns starting with 'hubspot_helper'"},{"name":"AuditDB.insert","path":"src/ontology_substrate/audit/db.py:51","signature":"def insert(self, obs: Observation) -> None","does":"INSERT OR REPLACE of one observation keyed by observation_id, committed immediately; makes re-seeding idempotent. populate_from_json (audit/populator.py:14) bulk-loads a JSON list through insert_many and returns the count.","input_example":"insert obs id 1 with claim 'first claim', then id 1 again with 'first claim refined'","expected_output":"fetch_all() returns 1 row whose claim_supported == 'first claim refined'"}],"infra":[{"topic":"Packaging","detail":"Distribution name ontology-substrate 0.1.0, import name ontology_substrate, hatchling backend with the wheel built from src/ontology_substrate, requires Python >=3.11. Runtime deps: pyyaml, pandas, openpyxl, psycopg[binary], gitpython; dev extra: pytest. Console script ontology-substrate -> ontology_substrate.cli:main.","path":"pyproject.toml"},{"topic":"How it is consumed","detail":"No deployment, no CI, no Docker. The package is installed editable (pip install -e) into the ic-load virtualenv and imported by the Phase B scripts under ic-load-main/_scratch/ontology_probe_phase_b/, which live outside this repository.","path":"docs/phases/phase_b_probe_drift.md:8"},{"topic":"Tests","detail":"62 pytest tests across schema (23 incl. smoke), adapters (8), probe (12), renderers (12), CLI (2) and audit (5). tests/conftest.py puts src/ on sys.path and provides the sample_probe_payload fixture. Connectors are mocked with MagicMock; no database is needed.","path":"tests/conftest.py"},{"topic":"pytest temp directory","detail":"addopts = --basetemp=.pytest_tmp with tmp_path_retention_policy = failed, because the default per-user pytest temp directory on the Windows workstation was locked. .pytest_tmp/ is git-ignored.","path":"pyproject.toml:31"},{"topic":"External systems the connectors target","detail":"Bronze = CSV files (glob Bronze_*.csv), silver = Postgres schema staging, gold = the hubspot.* Postgres mirror maintained by the sync provider (StackSync). PostgresConnector takes a DSN string and connects lazily; no environment variable names are defined in this repo.","path":"src/ontology_substrate/probe/connectors.py:49"},{"topic":"Audit database location","detail":"The SQLite schema ships in the package (audit/schema.sql: one table, three indexes), but the database file itself is created in the ic-load working tree under _scratch/audit/ontology_reconstruction.sqlite, seeded by the Phase B step 01 script.","path":"docs/phases/phase_audit_db.md:85"},{"topic":"Per-phase build documentation","detail":"docs/phases holds one markdown per build phase (schema, adapters+probe, renderers+CLI, audit DB, Phase B execution), each listing files, test counts, verification commands and the claude-mem observation numbers that justified it. The CLAUDE.md files are empty claude-mem stubs.","path":"docs/phases"}],"decisions":[{"decision":"The probe's unit of work is one edge, not one target record.","why":"Carried over from ic-load's probe_ontology.py, which overrides Correction.run() for exactly that reason: reconciliation questions are about relationships materialising layer by layer.","alternative_rejected":"Per-target (per-record) correction runs as in the rest of the ic-load corrections framework","evidence":"src/ontology_substrate/probe/edge_processors.py:3"},{"decision":"Each mirror association type id is explicitly paired with its API-reverse id inside one list item (types: [{id, role, label, api_reverse: {id, label}}]).","why":"ic-load used three parallel dicts and relied on YAML dict insertion order to align mirror ids with reverse ids. Making the pair explicit removes the dependency on ordering while preserving asymmetric label semantics.","alternative_rejected":"ic-load's types / type_labels / api_reverse_labels parallel dicts","evidence":"docs/phases/phase_a_schema.md:74"},{"decision":"Two adapter seams (TargetSystemAdapter and SyncProviderAdapter) instead of only abstracting the CRM.","why":"The docs argue that 'CRM-agnostic' loses meaning if the mirror layer is hard-coded; a user who only varies the CRM can keep a single StackSync provider instance.","alternative_rejected":"Hard-coding the StackSync mirror and parameterising only the target CRM","evidence":"docs/phases/phase_a_adapters_probe.md:78"},{"decision":"A closed 7-flag drift vocabulary with legacy aliases rather than free-text drift notes.","why":"ic-load locked seven canonical modes for where property lineage breaks at the sync boundary; a closed enum lets renderers emit seven yes/blank flag columns and makes unknown flags fail loudly. Aliases renamed -> naming_drift and gold_only -> mirror_only keep old YAML loadable.","alternative_rejected":"Open strings or per-project flag names","evidence":"docs/phases/phase_a_schema.md:103"},{"decision":"A per-edge expected_from switch (bronze or mirror) selects the fill-rate denominator.","why":"Task edges are fed by phaseA-created call tasks that bypass bronze entirely, so a bronze denominator would be wrong for them; they declare expected_from: mirror and the engine uses the gold count.","alternative_rejected":"Always using bronze_count as the expected count","evidence":"docs/phases/phase_a_adapters_probe.md:129"},{"decision":"Three output shapes are kept separate: graph workbook (6 sheets), flat coverage workbook (8 sheets) and distilled metagraph (1 sheet).","why":"Each has a different audience: the workbook is the engineering build artefact, the coverage workbook is the operator audit, the metagraph is the living tool carried while throttling association writes against the mirror.","alternative_rejected":"One merged workbook","evidence":"docs/phases/phase_a_renderers_cli.md:51"},{"decision":"The CLI implements only --dry-run; live probing is wired by scripts in ic-load.","why":"Dry-run is the substrate-side contract check (does the YAML parse into the schema). Real connectors, credentials and outputs belong to the consuming project, so the standalone tool stays free of environment specifics.","alternative_rejected":"Wiring connectors, engine and renderers inside the package CLI","evidence":"src/ontology_substrate/cli.py:38"},{"decision":"Ship a SQLite audit DB of the claude-mem observations used to rebuild the design, written with INSERT OR REPLACE.","why":"The operator asked for a database of the memory indexes to fact-check which memory supported which reconstruction step; idempotent inserts let every Phase B script re-seed without duplicates.","alternative_rejected":"Citations left only in prose documentation","evidence":"docs/phases/phase_audit_db.md:97"},{"decision":"Import name ontology_substrate differs from the repo name IC-Ontology.","why":"The package is generic and CRM-agnostic by design, while the repository holds the specific instantiation rooted in the IC'ALPS -> HubSpot work.","alternative_rejected":"Naming the package after the tenant","evidence":"README.md:7"},{"decision":"Gold-layer deletion candidates are reported, never executed, and the removal mechanism is the HubSpot v3 REST archive endpoint.","why":"Every schema change touching hubspot.* needs per-operation operator authorisation, and a SQL DELETE against the StackSync mirror leaves a visible deleted-record shell.","alternative_rejected":"SQL DELETE on the mirror tables","evidence":"docs/phases/phase_b_probe_drift.md:95"}],"gotchas":[{"issue":"Running the CLI without --dry-run raises NotImplementedError, and --out-dir is accepted but never read.","consequence":"There is no one-command live probe; nothing in this repo wires connectors -> engine -> renderers outside the tests.","fix_or_guard":"Use --dry-run for validation; write the wiring in the consuming project (as the Phase B scripts did) or implement it in cli.py.","path":"src/ontology_substrate/cli.py:40"},{"issue":"With expected_from: mirror the denominator is gold_count while materialized_default and materialized_all_types are also gold_count.","consequence":"source_side_fill_rate and all_types_fill_rate are 100% for any task edge with gold rows (0% when empty): the rate carries no signal for mirror-expected edges.","fix_or_guard":"Read the raw counts for those edges, or introduce a real mirror-side expected count.","path":"src/ontology_substrate/probe/fill_rates.py:43"},{"issue":"Fill rates are per edge, not per type id: materialized_custom is never set and materialized_default equals the association table row count.","consequence":"Every type binding row of an edge shows the same Fill Rate in the metagraph, and the 'resolvable' column of sheet 2 is always blank.","fix_or_guard":"Filter the association table by type id before counting if per-label rates are needed.","path":"src/ontology_substrate/renderers/metagraph.py:42"},{"issue":"Adapters and layers are declarative only: the loader stores adapter names as strings and nothing instantiates an adapter or builds a connector from ontology.layers.","consequence":"Changing target_system.adapter in the YAML changes only what dry-run prints; there is no adapter registry or factory.","fix_or_guard":"Instantiate adapters and connectors by hand in calling code.","path":"src/ontology_substrate/schema/loader.py:31"},{"issue":"The engagement entity set {note, call, meeting, task} is hard-coded, and the engagement processor does not apply the comm_action filter its docstring describes.","consequence":"A new tenant whose activity entities have other names is silently probed as inter-entity; engagement bronze counts are plain non-null counts.","fix_or_guard":"Rename entities to match, or move the set into the ontology/adapter.","path":"src/ontology_substrate/probe/edge_processors.py:14"},{"issue":"The loader requires the root key 'ontology' plus name, version, target_system.adapter and sync_provider.adapter; cardinality and role are unvalidated free strings.","consequence":"A YAML that starts directly at target_system fails with KeyError, while a typo in a cardinality or role loads without complaint.","fix_or_guard":"Wrap the document under 'ontology:' and validate with the CLI dry-run.","path":"src/ontology_substrate/schema/loader.py:15"},{"issue":"PostgresConnector interpolates table and column names into SQL with f-strings and has no cache, although the module docstring promises cached counts and the docs call the query parameterised.","consequence":"Only trusted ontology YAML should be probed; repeated edges re-scan the same tables.","fix_or_guard":"Keep ontology files under version control; add identifier quoting and a count cache if reused widely.","path":"src/ontology_substrate/probe/connectors.py:63"},{"issue":"The coverage workbook is a shape skeleton: fill-rate and count columns are empty, the four 'is in ...' columns are hard-coded 'True', and seven of the eight sheets contain only a header row.","consequence":"It looks like the v7 mapping-checks workbook but carries no measured coverage.","fix_or_guard":"Treat it as a template until property-level fill rates are computed and passed in.","path":"src/ontology_substrate/renderers/coverage.py:51"},{"issue":"CsvConnector ignores the glob part of path_pattern: it globs the requested file name in the pattern's parent directory and reads the first match.","consequence":"The 'Bronze_*.csv' pattern only selects a directory; an ambiguous name silently picks one file, and the cache hides later file changes.","fix_or_guard":"Pass exact file names as table_or_file; create a new connector to re-read.","path":"src/ontology_substrate/probe/connectors.py:32"}],"glossary":[{"term":"Substrate","meaning":"The generic package ontology_substrate: schema + adapters + probe + renderers + audit, independent of any one CRM."},{"term":"Layer (bronze / silver / gold)","meaning":"Bronze = extracted CSV files, silver = normalised Postgres staging tables, gold = the hubspot.* mirror tables written through the sync provider. The fixture also declares a 'source' SQL Server layer."},{"term":"Edge","meaning":"One relationship between two entities, carrying its FK column at each layer, the association table and columns, cardinality, expected_from and a list of type bindings. The fixture has 13: 4 inter-entity and 9 engagement edges."},{"term":"EdgeTypeBinding","meaning":"One association type id with role (default_forward, primary_reverse, custom_label, primary_label), label and its API-reverse id and label. Example in the fixture: mirror id 6 pairs with reverse id 5, 342 with 341."},{"term":"Ordinal pairing","meaning":"The rule that the n-th mirror type id corresponds to the n-th API-reverse id; implicit in ic-load's YAML ordering, explicit in the substrate's binding list."},{"term":"expected_from","meaning":"Per-edge switch choosing the fill-rate denominator: 'bronze' (default) uses the bronze count, 'mirror' uses the gold count (task edges)."},{"term":"Engagement edge","meaning":"An edge whose source entity is note, call, meeting or task; routed to process_engagement instead of process_interentity."},{"term":"Drift flag","meaning":"One of seven closed labels for where a property's lineage breaks: naming_drift, mirror_only, api_readonly, sync_pending, silver_value_discarded, silver_hardcoded_then_backfilled, canonical_render_omits."},{"term":"PropertyLineage","meaning":"Per-property record: bronze column (+ bronze_alt), silver column, api_property, gold_column, drift_flags, remediation_script, notes."},{"term":"SilverMart","meaning":"One silver ingestion path feeding a gold entity (name, path, unique_id_pattern, gold_writer, scope, cardinality_note, write_mode default direct-insert). The task entity has three."},{"term":"Reconciliation id","meaning":"The legacy-key column that ties a record across layers, e.g. icalps_company_id; produced by HubSpotTargetAdapter as prefix + entity + _id."},{"term":"Mirror","meaning":"The Postgres copy of the CRM kept in sync by the sync provider (StackSync): schema hubspot, primary key column id, plus a per-entity record-id column with a per-connection suffix."},{"term":"Metagraph","meaning":"The one-sheet, 20-column edge view with a live Fill Rate column; the operator sorts it to find under-materialised edges while throttling association writes."},{"term":"v7 coverage workbook","meaning":"The flat 8-sheet operator audit workbook (Ontologie + four property-check registers + Check_config + two mapping sheets) that coverage.py reproduces in shape."},{"term":"Phase A / Phase B","meaning":"Phase A built the package (schema, adapters, probe, renderers, CLI, audit). Phase B executed it from ic-load scripts to produce the drift overview (v7 drift, remote drift, deletion candidates, audit summary)."},{"term":"Deletion candidate","meaning":"A HubSpot property that is not in the substrate ontology and is not platform-native; Phase B found 7 high-confidence ones from the v7 curation. Candidates only, never auto-deleted."}],"relations":[{"project":"rsync_hubspot","relation":"Its mr-load directory reuses this package for the Miraex tenant: ontology/miraex_ontology.skeleton.yaml is modelled on the 7-entity fixture and is meant to be validated with the dry-run CLI, and its PLAN/RETRIEVAL notes cite SyncProviderAdapter as the existing seam. That skeleton starts at target_system with no 'ontology:' root key, which load_ontology requires."}],"directions":["Implement the live path in cli.py (layers -> connectors, ProbeEngine, renderers writing into --out-dir) so the probe is one command instead of scripts in another repo; the argument already exists and is unused.","Add an adapter registry keyed by the YAML adapter names and build connectors from ontology.layers, so swapping target_system.adapter actually changes behaviour (today the names are only printed).","Make fill rates per type id (fill materialized_custom and the 'resolvable' column) and give mirror-expected edges a real denominator; today task edges always read 100% or 0%.","Extend the ontology YAML with property blocks for Company, Contact, Deal and Case: Phase B found 122 properties documented only in the v7 workbook and zero string overlap because the two sources key on different naming conventions.","Compute property-level fill rates and populate the coverage workbook's empty rate, count and register sheets so it becomes a real replacement for the hand-maintained v7 file.","Prove the CRM-agnostic claim with a second tenant: finish the Miraex ontology from the rsync_hubspot/mr-load skeleton and move the hard-coded engagement entity set into the ontology or the target adapter."],"confidence":"high","coverage_notes":"Read every source file under src/ontology_substrate, all five docs/phases files, README, pyproject, conftest, the tests for CLI, probe, adapters, audit, loader, edge, drift flags and renderers, and most of the 7-entity fixture (lines 1-128 fully, the edge section by grep). Nothing was executed; expected outputs come from test assertions and the README. Single branch (main), shallow clone with one commit visible, no alternate worktrees. The Phase B scripts, converted ontology, drift outputs and the audit SQLite file are described in docs but live in ic-load's _scratch tree and are absent from both this repo and the analysed ic-load checkout, so Phase B numbers (62 tests passing, 122 / 18 / 0 v7 drift, 7 deletion candidates) are as documented, not verified. The CLAUDE.md files are empty claude-mem stubs. Status 'paused' is inferred from a single-day build with no later commits. The repo is small (about 137 KB tracked, 82 files).","slug":"ic-ontology","code":"40","repo":"IC-Ontology","visibility":"public","fork":false,"pushed_at":"2026-05-29T15:00:14Z","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","alts":[],"aliases":["ontology substrate","ontology_substrate","the ontology probe","the metagraph tool","IC ontology","the 7-flag drift thing"],"analyzed_at":"2026-11-12","card_count":30,"shelf":4,"github":"https://github.com/Wkayaobama/IC-Ontology"},{"title":"HR Scout (Bhead-Claude): job-intel app + Claude SDK/headless scaffold","one_liner":"FastAPI + React + Mongo job-scraping app (HR Scout) whose Claude wiring was decoupled from Understand Studio; main also ships a scaffold with an SDK rail and a headless `claude -p` rail.","purpose":"The repo began as an Understand Studio (App Builder) generated app: HR Scout scrapes configured job boards, has Claude extract structured postings, scores each extraction with deterministic quality rules, and runs an interview-prep coach over documents uploaded per job. Two lines of work exist. Line `main` keeps the Studio-coupled app and adds `claude-template/`, a barebone scaffold distilled from it with two Claude rails: the in-process Anthropic SDK (llm.py) and headless Claude Code CLI runs (`claude -p`, headless.py) driven by a workflow registry, scheduler and Cloud Run deploy script. Line `claude/standalone-app` (freshest, primary) translates the app itself into a self-contained product: one AI seam calling api.anthropic.com directly, one Settings class with guardrails, quality rules as data, tests and system maps; it deletes the scaffold, so no headless rail remains there. It exists so the owner owns the app end to end instead of depending on the builder's proxy, key and metering.","domain":"LLM tooling / job-scraping intelligence app","status":"active","stack":["Python 3.12","FastAPI","Motor (async MongoDB driver)","MongoDB 7","pydantic-settings","anthropic Python SDK (AsyncAnthropic)","httpx","pypdf","cryptography (Fernet)","pytest + pytest-asyncio","React 18","Vite 5","Tailwind CSS","TypeScript","Docker Compose","Claude Code CLI print mode (main line only)","Click (scaffold.py, main line only)","Google Cloud Run + Secret Manager (main line template only)","Apify actor API"],"entry_points":[{"command":"cp .env.example .env && docker compose up --build","what":"[standalone-app] Starts frontend (:5173), backend (:8000) and mongo; needs ANTHROPIC_API_KEY for scraping and the coach.","path":"docker-compose.yml"},{"command":"cd backend && uvicorn app.main:app --reload","what":"[standalone-app] Bare-metal backend; Settings finds the repo-root .env by __file__, not cwd.","path":"backend/app/main.py:53"},{"command":"cd backend && pytest","what":"[standalone-app] Runs the suite with a fake Mongo and fake Anthropic client (README states 47 tests, no network).","path":"backend/pytest.ini"},{"command":"GET /api/health","what":"[standalone-app] Liveness plus wiring facts: mongo state, llm.describe(), quality threshold/rule count, vault on/off, caps.","path":"backend/app/main.py:84"},{"command":"POST /api/scraper/run/{target_id}","what":"[standalone-app] Marks the target running and queues the HTML-fetch scrape as a FastAPI background task; 409 if already running.","path":"backend/app/routes/scraper.py:372"},{"command":"POST /api/monitor/analyze","what":"[standalone-app] Re-scores every job posting with the quality engine and persists score, band, flags and fired rules.","path":"backend/app/routes/monitor.py:234"},{"command":"python scaffold.py new my-app [--no-frontend] [--dir PATH]","what":"[main] Click CLI that copies claude-template/template into a new project and replaces the __app_name__ token with the slug.","path":"claude-template/scaffold.py:46"},{"command":"POST /api/workflows/{id-or-name}/run","what":"[main, template] Fires one headless `claude -p` run in the background; returns 202 with the run record, 409 if that workflow is in flight.","path":"claude-template/template/backend/app/routes/workflows.py:78"},{"command":"GCP_PROJECT=... ./deploy/cloudrun.sh","what":"[main, template] Enables APIs, creates the anthropic-api-key secret, then `gcloud run deploy --source .` with no CPU throttling and min-instances 1.","path":"claude-template/template/deploy/cloudrun.sh:35"}],"architecture":[{"component":"AI seam (standalone)","path":"backend/app/llm.py","responsibility":"Only module importing `anthropic`. Shared AsyncAnthropic client; extract_structured, stream_chat, chat_once; turns refusal and max_tokens stop reasons into exceptions; optional server-side refusal fallback on the beta surface.","talks_to":["Anthropic API","Settings"]},{"component":"Settings (config as a class)","path":"backend/app/config.py","responsibility":"Every tunable as a typed field with a default and bounds; reads env first, then repo-root .env, then backend/.env (which overrides). Mirrored by the compose env allowlist and .env.example.","talks_to":["docker-compose.yml","all backend modules"]},{"component":"FastAPI app + lifespan","path":"backend/app/main.py","responsibility":"Opens the Motor client, creates indexes, starts the scheduler task, mounts nine routers, serves /api/health; CORS middleware only when CORS_ORIGINS is set.","talks_to":["MongoDB","Scheduler","Routes"]},{"component":"Scraper routes (two paths)","path":"backend/app/routes/scraper.py","responsibility":"HTML path (httpx fetch -> _html_to_text -> truncate) and Apify path (actor items -> text blocks -> truncate), both ending in extract_structured with one job schema, then dedup-insert and session bookkeeping.","talks_to":["AI seam","Apify runner","MongoDB","Job boards"]},{"component":"Apify runner","path":"backend/app/routes/apify_scraper.py","responsibility":"Starts the lexis-solutions~jobup-scraper actor, polls every 6 s up to 600 s, fetches dataset items and flattens each into a labelled text block. Lives under routes/ but defines no router.","talks_to":["Apify API"]},{"component":"Cron scheduler","path":"backend/app/scheduler.py","responsibility":"asyncio loop in the lifespan: every SCHEDULER_TICK_SECONDS finds active, cron-enabled, non-running targets that are due, reserves them (status running, next run) and fires _do_scrape(triggered_by='cron').","talks_to":["MongoDB","Scraper routes"]},{"component":"Quality engine","path":"backend/app/quality/engine.py","responsibility":"Pure interpreter (no I/O, no clock) over the registry: evaluate -> QualityResult(score, issues, fired, flagged, band); describe for payloads; validate_registry run at package import.","talks_to":["Quality registry","Field extractor","Monitor routes"]},{"component":"Quality registry + extractor","path":"backend/app/quality/registry.py","responsibility":"Ten rules, three bands and FLAG_THRESHOLD=70 as frozen dataclasses; extractor.py normalises the four scored fields (title, description, company, salary_range) to stripped strings for rules and dedup.","talks_to":["Quality engine"]},{"component":"Monitor routes","path":"backend/app/routes/monitor.py","responsibility":"KPI overview, 7-day timeline, per-target performance, category split, quality-config (registry as data), hallucinations list, analyze (persist scores) and a unified audit log.","talks_to":["Quality engine","MongoDB"]},{"component":"Documents + interview coach","path":"backend/app/routes/documents.py","responsibility":"Upload (10 MB cap) and store files in Mongo per job; /chat builds a system prompt from job fields plus extracted document text (20k chars) and bridges stream_chat to SSE.","talks_to":["AI seam","MongoDB","Browser"]},{"component":"Secrets vault","path":"backend/app/routes/secrets.py","responsibility":"Fernet-encrypted key-value store; key derived by SHA-256 from SECRETS_ENCRYPTION_KEY with a fixed prefix; whole router returns 503 while the passphrase is empty.","talks_to":["MongoDB","Settings"]},{"component":"React operator UI","path":"frontend/src/App.tsx","responsibility":"Seven tabs (Job Feed, URL Manager, Agent Config, Sessions, Documents, Monitor, Secrets) calling relative /api paths through the Vite proxy; holds no AI credentials.","talks_to":["Vite proxy","FastAPI"]},{"component":"[main] Studio-coupled Claude cookbook","path":"backend/app/claude_examples.py","responsibility":"Parent version of the seam: get_client picks Studio proxy mode (UT_API_KEY + UT_LLM_BASE_URL) or standalone mode, prepends a whitelabel identity prelude and calls increment_prompt for usage metering.","talks_to":["Understand Studio proxy","Anthropic API","ut_usage"]},{"component":"[main] Headless seam","path":"claude-template/template/backend/app/headless.py","responsibility":"Only place a `claude` subprocess is spawned: run_headless builds `claude -p \u003cprompt> --output-format text` with optional model, allowed tools and extra args, caps output at 200 KB and kills on timeout.","talks_to":["Claude Code CLI","git","Settings"]},{"component":"[main] Workflow registry, runner, scheduler","path":"claude-template/template/backend/app/workflows.py","responsibility":"File-backed workflow definitions (data/workflows.json) and run history (data/runs.jsonl); start_run with an overlap guard; 30 s interval scheduler started from the lifespan.","talks_to":["Headless seam","Workflow routes"]},{"component":"[main] Template SDK seam","path":"claude-template/template/backend/app/llm.py","responsibility":"No-args AsyncAnthropic singleton with adaptive thinking; chat_once, stream_chat, chat_with_tools (manual tool loop) and extract_structured via output_config.format.","talks_to":["Anthropic API"]},{"component":"[main] Scaffold CLI","path":"claude-template/scaffold.py","responsibility":"Copies template/ to a new slugged directory, optionally drops the frontend and its marker-delimited infra blocks, then substitutes __app_name__ everywhere.","talks_to":["claude-template/template"]}],"data_flow":["1. [standalone-app] Operator adds a job-board URL in the URL Manager tab; the browser calls /api/targets through the Vite proxy and a scrape_targets document is stored (unique index on url).","2. A scrape starts either manually (POST /api/scraper/run/{id} or run-apify/{id}, queued as a background task) or from scheduler_loop when a cron-enabled target is due; the target is marked `running` first.","3. _build_system_prompt composes the prompt: agent_config.system_prompt (or the default) + domain focus + the target's goal; an agent_sessions record is inserted with status running, prompt_used and the model name.","4. HTML path: httpx GET with a browser User-Agent, _html_to_text strips tags, text is cut to SCRAPE_PAGE_CHARS (12000). Apify path: run_apify_scrape polls the actor, items become text blocks cut to APIFY_TEXT_CHARS (15000).","5. extract_structured sends the text with _JOB_EXTRACTION_SCHEMA under output_config.format (json_schema, additionalProperties false added by _strict_schema) and returns {jobs: [...]}; refusal or truncation raises instead.","6. _persist_jobs skips empty titles, dedups by case-insensitive exact title + company within the target, inserts new job_postings, then sets target status completed and session jobs_found/new_jobs; any exception goes to _mark_error.","7. POST /api/monitor/analyze runs quality.evaluate on every posting: score = 100 minus fired-rule penalties (floor 0), flagged when score \u003c 70, band clean/review/flagged; results are persisted on the posting.","8. The Monitor page reads /api/monitor/quality-config (registry as data) plus overview, timeline, hallucinations and audit endpoints, so thresholds and rule labels are rendered from payloads.","9. Interview coach: a document is uploaded against a job; POST /api/documents/chat extracts its text, builds a job + document system prompt and streams stream_chat chunks as SSE (`data: {text}` ... `data: {done: true}`, errors in-band).","10. [main, template] Headless rail: scheduler_loop (30 s) or POST /api/workflows/{id}/run -> start_run stamps last_run and spawns _execute -> run_headless runs `claude -p` in /repo -> the run record is appended to data/runs.jsonl."],"key_functions":[{"name":"extract_structured","path":"backend/app/llm.py:253","signature":"async def extract_structured(*, user_message: str, schema: dict, system_prompt: Optional[str] = None, model: Optional[str] = None, max_tokens: Optional[int] = None) -> dict","does":"The single structured-output call used by both scrape paths. Sends the schema as output_config.format json_schema (no tools, no tool_choice), checks stop_reason, and json.loads the text block.","input_example":"user_message='extract', schema={jobs: array of {title}} with the fake client returning '{\"jobs\": [{\"title\": \"Dev\"}]}'","expected_output":"{'jobs': [{'title': 'Dev'}]} (backend/tests/test_llm.py:85)"},{"name":"stream_chat","path":"backend/app/llm.py:187","signature":"async def stream_chat(*, user_message: str, system_prompt: Optional[str] = None, history: Optional[list[dict]] = None, model: Optional[str] = None, max_tokens: Optional[int] = None) -> AsyncIterator[str]","does":"Yields text chunks from messages.stream for the coach's SSE bridge, then inspects the final message so a refusal or truncation is raised after the stream ends.","input_example":"user_message='hi', system_prompt='coach', fake chunks ['Hello', ' world']","expected_output":"['Hello', ' world'] (backend/tests/test_llm.py:139)"},{"name":"get_client","path":"backend/app/llm.py:80","signature":"def get_client() -> AsyncAnthropic","does":"Builds the shared client once. Raises LLMNotConfigured when neither ANTHROPIC_API_KEY nor ANTHROPIC_AUTH_TOKEN is present, so a missing key is a clear message at the first AI call rather than a connection error.","input_example":"no credentials in settings or env","expected_output":"raises LLMNotConfigured mentioning ANTHROPIC_API_KEY; llm.describe()['configured'] is False"},{"name":"_api","path":"backend/app/llm.py:114","signature":"def _api()","does":"Returns (messages resource, extra kwargs). With AI_REFUSAL_FALLBACK on it returns client.beta.messages plus betas=['server-side-fallback-2026-07-01'] and fallbacks='default'; otherwise client.messages and {}.","input_example":"settings.ai_refusal_fallback = True","expected_output":"call lands on client.beta.messages with fallbacks == 'default' (backend/tests/test_llm.py:112)"},{"name":"_raise_for_stop","path":"backend/app/llm.py:130","signature":"def _raise_for_stop(resp: Any, max_tokens: int) -> None","does":"Guard shared by all three helpers: stop_reason 'refusal' raises LLMRefused(category, explanation); 'max_tokens' raises LLMTruncated, so a declined or cut-off answer is never persisted as a result."},{"name":"_strict_schema","path":"backend/app/llm.py:225","signature":"def _strict_schema(schema: dict) -> dict","does":"Deep-copies a JSON schema and sets additionalProperties: false on every object node that does not set it (walking properties, $defs, items, anyOf/oneOf/allOf); explicit values are kept and the input is not mutated."},{"name":"evaluate","path":"backend/app/quality/engine.py:94","signature":"def evaluate(job: dict, *, registry: Iterable[Rule] = RULES, bands: Iterable[Band] = BANDS, threshold: int = FLAG_THRESHOLD) -> QualityResult","does":"Pure scoring: start at 100, subtract each fired rule's penalty, floor at 0, flag when score \u003c threshold, attach the band key.","input_example":"clean job whose description is '\u003cdiv>Great role\u003c/div> with a long enough text'","expected_output":"score 80, band 'review', flagged False, issue 'HTML artefacts in description' (backend/tests/test_quality_engine.py:120)"},{"name":"validate_registry","path":"backend/app/quality/engine.py:154","signature":"def validate_registry(registry=RULES, bands=BANDS, threshold=FLAG_THRESHOLD) -> None","does":"Fail-fast check run when app.quality is imported: unique keys, known predicate kinds, positive penalties, fields that are extracted, compilable patterns, bands that tile 0..100 and one band starting at the threshold."},{"name":"extract_fields","path":"backend/app/quality/extractor.py:21","signature":"def extract_fields(job: dict) -> dict[str, str]","does":"The one normalisation of a job document into the four scored fields; None and non-strings become stripped strings, so no rule regex ever sees a non-string. Also used by dedup in _persist_jobs.","input_example":"{'title': None, 'company': 42, 'description': '  padded  '}","expected_output":"{'title': '', 'description': 'padded', 'company': '42', 'salary_range': ''}"},{"name":"_do_scrape","path":"backend/app/routes/scraper.py:211","signature":"async def _do_scrape(db, target_id: str, triggered_by: str = 'manual') -> None","does":"HTML scrape path end to end: session record, fetch, text cut to scrape_page_chars, extract_structured, _persist_jobs; every exception is routed to _mark_error (target and session set to error)."},{"name":"_persist_jobs","path":"backend/app/routes/scraper.py:129","signature":"async def _persist_jobs(db, jobs: list, target_id: str, target: dict, session_id, triggered_by: str) -> tuple[int, int]","does":"Dedup-insert by re.escape'd case-insensitive title + company per target, then update target (status completed, job_count, scrape_count) and session (jobs_found, new_jobs). Returns (found, new)."},{"name":"scheduler_loop","path":"backend/app/scheduler.py:16","signature":"async def scheduler_loop(db) -> None","does":"Cron loop: selects active, cron-enabled, non-running targets whose cron_next_run is past or missing, reserves each (status running, next run = now + interval, default 1440 min) and fires _do_scrape with asyncio.create_task."},{"name":"run_apify_scrape","path":"backend/app/routes/apify_scraper.py:102","signature":"async def run_apify_scrape(target_url: str, apify_token: str, max_items: int | None = None) -> list[dict[str, Any]]","does":"Starts the jobup actor run, polls status every 6 s for up to 600 s, raises RuntimeError on FAILED/ABORTED/TIMED-OUT or timeout, then returns the dataset items."},{"name":"run_headless [main]","path":"claude-template/template/backend/app/headless.py:91","signature":"async def run_headless(prompt: str, *, workdir=None, output_format='text', model=None, allowed_tools=None, extra_args=None, timeout: float = 1800) -> dict","does":"The headless Anthropic call: spawns `claude -p \u003cprompt> --output-format \u003cfmt>` (plus --model, --allowedTools, extra args) in the workdir with the process env, returns exit_code/stdout/stderr/duration_s and never raises on a failed run.","input_example":"a run that exceeds the default timeout","expected_output":"{'exit_code': -1, 'stdout': '', 'stderr': 'timed out after 1800s', 'duration_s': \u003celapsed>}"},{"name":"start_run [main]","path":"claude-template/template/backend/app/workflows.py:143","signature":"def start_run(workflow: dict) -> Optional[dict]","does":"Overlap gate and launcher: returns None if the workflow id is in _active, else records a run with status 'running', stamps last_run at the START of the run, and schedules _execute as a background task."},{"name":"_ensure_workdir [main]","path":"claude-template/template/backend/app/headless.py:55","signature":"async def _ensure_workdir(workdir: str) -> None","does":"No-op for local bind mounts; when WORKFLOW_REPO_URL is set (Cloud Run) it shallow-clones the repo on first run and fetches + hard-resets to FETCH_HEAD before later runs, serialised by an asyncio lock."}],"infra":[{"topic":"Local runtime (standalone-app)","detail":"docker compose with three services: frontend (node:20-alpine, `npm run dev` on 5173), backend (python:3.12-slim, `uvicorn --reload` on 8000, app dir bind-mounted) and mongo:7 with a named volume. Mongo's port is not published. Host ports via FRONTEND_PORT / BACKEND_PORT.","path":"docker-compose.yml"},{"topic":"Environment contract (standalone-app)","detail":"Compose passes an explicit allowlist into the backend: PROJECT_NAME, MONGO_URL, MONGO_DB, ANTHROPIC_API_KEY, AI_MODEL, AI_EFFORT, AI_REFUSAL_FALLBACK, EXTRACT_MAX_TOKENS, CHAT_MAX_TOKENS, SCRAPE_PAGE_CHARS, APIFY_TEXT_CHARS, APIFY_API_KEY, SECRETS_ENCRYPTION_KEY, CORS_ORIGINS, SCHEDULER_TICK_SECONDS. A new setting needs three edits: Settings field, allowlist line, .env.example row.","path":"docker-compose.yml:18"},{"topic":"Same-origin API via Vite proxy","detail":"The Vite dev server proxies /api to http://backend:8000, so the browser never calls the API cross-origin and no CORS middleware is installed unless CORS_ORIGINS is set. Change the proxy target to localhost:8000 when the API runs outside Docker.","path":"frontend/vite.config.ts"},{"topic":"Tests (standalone-app)","detail":"pytest with asyncio_mode=auto; conftest provides FakeDB/FakeCollection (a literal slice of the Motor surface) and a TestClient that skips the lifespan, so no Mongo, scheduler or network is needed. Pinned deps in requirements.txt; requirements-dev.txt adds pytest and pytest-asyncio.","path":"backend/tests/conftest.py"},{"topic":"MongoDB collections and indexes","detail":"Created in the lifespan: scrape_targets (unique url; active, cron_enabled, cron_next_run), job_postings (target_id, category, scraped_at, text index on title+company), agent_sessions (target_id, started_at, status), documents (job_id, uploaded_at), secrets (unique variable_name). agent_config is a singleton with _id 'default'.","path":"backend/app/main.py:22"},{"topic":"Headless image build (main, template)","detail":"The template backend Dockerfile installs git and the Claude Code CLI via the official install script, adds /root/.local/bin to PATH and marks all directories git-safe, because the mounted target repo belongs to the host user. Compose bind-mounts WORKFLOW_TARGET_DIR (default .) at /repo.","path":"claude-template/template/backend/Dockerfile"},{"topic":"Cloud Run deployment (main, template)","detail":"Root Dockerfile builds the Vite app and has FastAPI serve it from static/ in one container honouring PORT. deploy/cloudrun.sh uses GCP_PROJECT, GCP_REGION (default europe-west1), SERVICE_NAME, MIN_INSTANCES, AI_MODEL, WORKFLOW_REPO_URL; ANTHROPIC_API_KEY comes from Secret Manager secret anthropic-api-key; flags --no-cpu-throttling, --min-instances 1, --timeout 3600, --memory 1Gi, --max-instances 2.","path":"claude-template/template/deploy/cloudrun.sh"},{"topic":"Studio coupling (main, parent app)","detail":"Parent env names: UT_API_KEY, UT_LLM_BASE_URL, UNDERSTAND_API_URL, LLM_MODE, AI_MODEL, PREVIEW_DOMAIN_SUFFIX. Claude calls go through the Studio proxy unless ANTHROPIC_API_KEY is set and UT_LLM_BASE_URL is empty; analytics and error-tracker middleware plus a CORS wildcard are installed.","path":"backend/app/claude_examples.py:90"}],"decisions":[{"decision":"[main] Add a headless Claude Code CLI rail (`claude -p`) next to the SDK rail instead of doing agentic repo work through the SDK","why":"Print mode runs the CLI's own agent loop with file, grep and git tools and accepts slash commands such as /review, which are a CLI concept; varying the workload is just varying a prompt string. Stated rule of thumb: SDK when your code knows the steps, headless when the model must discover them by exploring a filesystem. The rail is added, not substituted: chat, extraction and tool calls stay on the SDK.","alternative_rejected":"Hand-writing the agent loop and file tools on top of the Messages API (chat_with_tools) for repo reviews","evidence":"claude-template/template/docs/llm-modes.md:346-359"},{"decision":"One seam module per Claude mode: only llm.py imports `anthropic`, only headless.py spawns `claude`","why":"Every cross-cutting change (auth, gateway base_url, caching, metering, sandboxing, CLI flags) becomes a one-file edit; the same property is what made the generated parent app easy to dissect.","alternative_rejected":"Inline SDK calls or subprocess spawns inside routes","evidence":"claude-template/template/docs/llm-modes.md:20-23"},{"decision":"[standalone-app] Call api.anthropic.com directly with the owner's key; delete the Studio proxy, per-app key, usage callbacks and whitelabel identity prelude","why":"Outside Studio the proxy URL has nothing on the other end and the first AI call fails. The vendor never forked the protocol, it only moved the endpoint, so the dependency was trivially removable.","alternative_rejected":"Keeping the dual Studio/standalone mode switch of claude_examples.get_client","evidence":"README.md:140-148"},{"decision":"[standalone-app] Structured extraction via output_config.format json_schema instead of a forced tool call","why":"The API guarantees the first text block is valid JSON for the schema, so no markdown stripping is needed, and the code comment records that forced tool_choice is rejected by current models. The parent version used tool_choice with a named tool.","alternative_rejected":"tool_choice {type: tool, name: ...} as in the parent claude_examples.extract_structured","evidence":"backend/app/llm.py:261-266"},{"decision":"[standalone-app] Treat stop_reason refusal and max_tokens as exceptions (LLMRefused, LLMTruncated)","why":"Callers must never persist a declined or truncated answer as if it were a complete extraction; the scrape then ends in _mark_error with a readable message.","alternative_rejected":"Returning whatever text came back, as the template helpers on main do","evidence":"backend/app/llm.py:18-20"},{"decision":"[standalone-app] Server-side refusal fallback, chosen once in _api() and switchable with AI_REFUSAL_FALLBACK","why":"When the model declines, the API re-runs the request on Anthropic's recommended fallback model inside the same call; the feature lives on the beta surface, so the choice is made in one place rather than at each call site.","alternative_rejected":"Surfacing every refusal as an error (still available by setting the flag false)","evidence":"backend/app/llm.py:114-120"},{"decision":"[standalone-app] Quality rules as data in a registry, interpreted by a pure engine","why":"Adding a check is adding a row; the engine has no I/O or clock so tests need only dicts; the registry is validated at import and served to the UI, so the frontend never restates a threshold. A parity test proves equivalence with the generated app's inline heuristics.","alternative_rejected":"The hard-coded heuristics inside the generated monitor route","evidence":"backend/tests/test_quality_engine.py:30-41"},{"decision":"[standalone-app] Empty SECRETS_ENCRYPTION_KEY disables the vault with 503","why":"Encrypting with a guessable constant would only look safe. The derivation salt is unchanged, so setting the passphrase to the old host per-app key keeps previously stored secrets readable.","alternative_rejected":"Deriving the Fernet key from a built-in default","evidence":"backend/app/routes/secrets.py:5-11"},{"decision":"[standalone-app] Explicit compose environment allowlist plus a Settings class anchored on __file__","why":"A variable reaches the container only if listed, so the env contract is visible; anchoring .env lookup on the module path means uvicorn and pytest find the same file from any directory and never pick up an unrelated .env.","alternative_rejected":"env_file passthrough and cwd-relative .env lookup (the parent and template approach)","evidence":"backend/app/config.py:1-15"},{"decision":"[main, template] On Cloud Run deploy with --no-cpu-throttling and --min-instances 1","why":"A triggered headless run returns 202 and keeps working after the response; throttled CPU would stall it. The in-process scheduler only lives while an instance exists. Option B moves cadence to Cloud Scheduler hitting the run endpoint by workflow name, allowing min-instances 0.","alternative_rejected":"Default Cloud Run scale-to-zero with throttled background CPU","evidence":"claude-template/template/deploy/cloudrun.sh:28-34"}],"gotchas":[{"issue":"No authentication on any route (both lines)","consequence":"Anyone reaching port 8000 can trigger scrapes that spend Anthropic and Apify budget, delete data, and read vault values in plaintext via GET /api/secrets/{name}/value; on main the workflow API runs an agent against the mounted repo.","fix_or_guard":"Keep it on localhost or put a reverse proxy with auth in front; on Cloud Run remove unauthenticated access and use an OIDC invoker.","path":"docs/SYSTEM_MAPS.md:278"},{"issue":"A target can stick in status `running`","consequence":"A crash or --reload mid-scrape leaves target and session running; the scheduler skips it and manual triggers return 409. No route resets the status.","fix_or_guard":"None in code; reset the document by hand. Listed as known drift.","path":"docs/SYSTEM_MAPS.md:282"},{"issue":"Scheduler claims are not atomic and tasks are fire-and-forget","consequence":"With more than one backend process the same target can be scraped twice; create_task results are not referenced.","fix_or_guard":"Run a single backend process; an atomic find-and-update claim is the natural fix.","path":"backend/app/scheduler.py:28-61"},{"issue":"Adding a setting to Settings but not to the compose allowlist","consequence":"The container silently runs on the default value.","fix_or_guard":"Always make the three edits together: Settings field, docker-compose environment line, .env.example row.","path":"backend/app/config.py:12-14"},{"issue":"Coach SSE parser splits each chunk on newline without buffering partial frames","consequence":"A frame split across network reads can drop a token on slow connections.","fix_or_guard":"Buffer on blank-line frame boundaries as the template frontend does; open drift.","path":"frontend/src/pages/DocumentsPage.tsx:224-232"},{"issue":"cron_interval_minutes is not validated","consequence":"A value of 0 or below makes the target due on every scheduler tick, spending model budget continuously.","fix_or_guard":"Add a lower bound on the target models; open drift.","path":"docs/SYSTEM_MAPS.md:296"},{"issue":"[main] Headless print mode cannot ask for permission","consequence":"Any tool that would prompt is denied, so workflows that edit files or run state-changing commands fail silently unless granted.","fix_or_guard":"Grant per workflow with allowed_tools (e.g. Edit, Bash(git diff:*)) or extra_args; never pass a permission-bypass flag for unattended runs.","path":"claude-template/template/backend/app/headless.py:19-25"},{"issue":"[main] Workflow state is file-backed and ephemeral on Cloud Run","consequence":"After an instance replacement the two seed workflows return disabled with new ids and run history is gone.","fix_or_guard":"Address workflows by name (find_workflow accepts id or exact name), re-enable after deploy, or swap load_workflows/save_workflows for a database.","path":"claude-template/template/backend/app/workflows.py:90-97"}],"glossary":[{"term":"HR Scout","meaning":"The product name of the app in this repo: job-board scraper + Claude extraction + quality scoring + interview coach."},{"term":"AI seam","meaning":"The single module allowed to talk to Claude in a given mode: llm.py for the SDK, headless.py for the CLI. Nothing else imports `anthropic` or spawns `claude`."},{"term":"Mode 1 / SDK rail","meaning":"In-process Anthropic Python SDK calls over HTTPS to the Messages API; your code drives any loop. Used for chat, streaming, extraction and tool calls."},{"term":"Mode 2 / headless rail","meaning":"Claude Code CLI in print mode (`claude -p \"\u003cprompt>\" --output-format text`) run as a subprocess against a mounted repo; the CLI drives its own agent loop. Exists only in claude-template on main."},{"term":"Print mode","meaning":"The non-interactive `-p` mode of the Claude Code CLI: runs the agent loop, prints the final result to stdout and exits; exit code 0 means success."},{"term":"Workflow","meaning":"On main's template, a named repeatable headless prompt with a cadence: {name, prompt, interval_minutes, enabled, model, allowed_tools, extra_args, last_run}."},{"term":"Studio mode vs standalone mode","meaning":"The parent app's two auth modes: Studio routes the SDK through Understand Tech's Anthropic-compatible proxy with UT_API_KEY; standalone uses ANTHROPIC_API_KEY directly and is chosen only when UT_LLM_BASE_URL is empty."},{"term":"Identity prelude","meaning":"The whitelabel instruction the generated app silently prepended to every system prompt to hide the underlying model; removed in the standalone line and covered by a test."},{"term":"Scrape target","meaning":"A configured job-board URL with name, optional goal (prompt suffix), active flag, cron settings and a status of idle/running/completed/error."},{"term":"Agent session","meaning":"The log record of one scrape run: prompt used, domain focus, trigger (manual or cron), scrape mode (html or apify), model, jobs found and new jobs, error."},{"term":"Quality registry","meaning":"RULES (10), BANDS (clean 90-100, review 70-89, flagged 0-69) and FLAG_THRESHOLD = 70 as frozen dataclasses; the only place a rule or threshold is defined."},{"term":"Predicate kind","meaning":"The rule type the engine interprets: shorter_than, longer_than, matches, repeated_words, missing, shorter_than_if_present, lacks_if_present."},{"term":"confidence_score","meaning":"The 0-100 quality score written on a job posting by /api/monitor/analyze: 100 minus the penalties of fired rules; below 70 sets flagged true."},{"term":"Refusal fallback","meaning":"Beta API option (fallbacks: 'default') that re-runs a declined request on Anthropic's recommended fallback model within the same call; toggled by AI_REFUSAL_FALLBACK."},{"term":"Known drift","meaning":"The closing list in docs/SYSTEM_MAPS.md of behaviours the maps describe honestly but the code does not yet fix (no auth, stuck targets, naive UTC datetimes, non-cascading deletes, ...)."}],"directions":["Decide the fate of the headless rail: the standalone line deleted claude-template, so `claude -p` workflows exist only on main. Either extract the scaffold into its own repo or port headless.py + workflows.py into the standalone app (e.g. scheduled /review of a repo).","Add authentication before exposing beyond localhost: every route, including plaintext secret reads and scrape triggers, is open (first item of known drift).","Make scheduler claims atomic and add a reset for targets stuck in `running`, then validate cron_interval_minutes with a lower bound.","Build a production image: both services run dev servers only; main's template already shows the pattern (root Dockerfile building Vite and serving static/ from FastAPI, Cloud Run script).","Fix the coach SSE parser to buffer partial frames and switch datetimes to timezone-aware UTC (utcnow is deprecated on Python 3.12).","Wire agent_config.goal into the system prompt or remove the field, and drop unused surface (text index, /api/admin/revoke-keys clears collections nothing writes to); replace the placeholder LICENSE."],"confidence":"high","coverage_notes":"Read in full on claude/standalone-app: README, docs/SYSTEM_MAPS.md, compose, Dockerfiles, config, llm, main, scheduler, quality package, routes scraper/apify_scraper/documents/monitor/secrets/admin/agent_config, all three test files; skimmed jobs/targets/sessions routes and frontend pages (grep only). On main: claude-template README, scaffold.py, template headless/workflows/llm/config/main/routes, llm-modes.md, deploy-cloudrun.md, cheatsheet, cloudrun.sh; parent claude_examples.py head and config; ut_api_v3, ut_usage, analytics, error_tracker by signature only. .env.example read for variable names only. Nothing was executed, so test counts and expected outputs come from test source and README. Uncertain: no Bun code or config exists in either line despite the 'headless-bun-claude' nickname; the third remote branch (claude/upbeat-lovelace-qsjaby, merged into main by PR 2) was not checked out separately. Model ids and beta header are quoted as written in the repo, not verified.","slug":"bhead-claude","code":"50","repo":"Bhead-Claude","visibility":"public","fork":false,"pushed_at":"2026-10-25T20:45:53Z","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","alts":[{"branch":"main","note":"earlier template-based version (88 files)","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d"}],"aliases":["headless-bun-claude","headless bun claude","HR Scout","Bhead","the job scraper","claude-template","the headless claude scaffold","the standalone-app refactor"],"analyzed_at":"2026-11-12","card_count":30,"shelf":5,"github":"https://github.com/Wkayaobama/Bhead-Claude"},{"title":"DeepSeek Harness local launcher (dsh Web UI on 127.0.0.1:3080)","one_liner":"Thin cross-platform launcher that runs a pinned release of DeepSeek's agent harness (dsh) and opens its browser Web UI on http://127.0.0.1:3080.","purpose":"The repository contains no agent code of its own: it wraps the upstream npm package @deepseek-ai/dsh (DeepSeek Harness, an open-source agent harness with a browser Web UI, described by the README as a fast-changing developer preview) so that one command starts it locally. Two launcher scripts (POSIX sh and Windows cmd) check for Node.js, pin the release the setup was last verified against (0.1.1-rc.2), prefer pnpm over npx because npm's resolver can hang on the package's dependency graph, and forward any extra flags to `dsh web`. A package.json offers the same thing as an installed dependency (`pnpm start`). The README is the runbook: first-run configuration (API key, workspace, first task), flags, SSH port-forwarding for remote machines, security warnings (no authentication, loopback only), updating and troubleshooting. It exists so the owner can try a DeepSeek-backed coding agent in the browser without cloning or building the harness.","domain":"LLM tooling / agent harness launcher","status":"paused","stack":["POSIX sh","Windows cmd batch","Node.js 22.19+ or 24+","pnpm (dlx) preferred","npx fallback","@deepseek-ai/dsh 0.1.1-rc.2 (upstream npm package)","DeepSeek API"],"entry_points":[{"command":"./start-harness.sh [flags for dsh web]","what":"macOS/Linux launcher: checks Node, resolves DSH_VERSION, then execs `pnpm dlx @deepseek-ai/dsh@\u003cversion> web \"$@\"` (or `npx -y ...` when pnpm is absent).","path":"start-harness.sh:1"},{"command":"start-harness.cmd [flags for dsh web]","what":"Windows launcher: checks that node is on PATH, defaults DSH_VERSION, then runs pnpm dlx or npx -y with `web %*`.","path":"start-harness.cmd:1"},{"command":"pnpm install && pnpm start","what":"Alternative path through the pinned dependency in package.json; `start` runs `dsh web` from node_modules.","path":"package.json:7"},{"command":"pnpm run start:no-open","what":"Same as start but passes --no-open so no browser is launched.","path":"package.json:8"},{"command":"npm run update:dsh","what":"Bumps the package.json dependency to the latest upstream release (`npm install @deepseek-ai/dsh@latest`); does not touch the DSH_VERSION default in the launcher scripts.","path":"package.json:9"},{"command":"DSH_VERSION=latest ./start-harness.sh","what":"One-off run of the newest upstream release without editing any file.","path":"README.md:104"}],"architecture":[{"component":"POSIX launcher","path":"start-harness.sh","responsibility":"Guards on Node presence and major version, sets the DSH_VERSION default, prints a first-run notice, then replaces itself (exec) with pnpm dlx or npx running `dsh web` plus forwarded arguments.","talks_to":["node","pnpm","npx","upstream dsh package"]},{"component":"Windows launcher","path":"start-harness.cmd","responsibility":"Batch equivalent of the POSIX launcher: node presence check, DSH_VERSION default, pnpm-or-npx dispatch with `%*`. It has no Node version check.","talks_to":["node","pnpm","npx","upstream dsh package"]},{"component":"Pinned dependency manifest","path":"package.json","responsibility":"Declares @deepseek-ai/dsh at the exact version 0.1.1-rc.2 and three scripts (start, start:no-open, update:dsh) for people who prefer an installed copy over dlx/npx.","talks_to":["upstream dsh package","npm registry"]},{"component":"API key template (.env.example)","path":"README.md:53","responsibility":"Tracked file .env.example at the repo root: a template with the single variable name DEEPSEEK_API_KEY (empty). Copied to a git-ignored .env, it is read by dsh from the directory the launcher is invoked in.","talks_to":["upstream dsh package"]},{"component":"Runbook (README)","path":"README.md","responsibility":"The only documentation: requirements, quick start, first-run configuration in the Web UI, flags, SSH port-forwarding, security notes, run-from-source, updating, troubleshooting.","talks_to":[]},{"component":"Upstream DeepSeek Harness (external)","path":"package.json:12","responsibility":"The actual product: the `dsh` CLI whose `web` subcommand serves the agent Web UI on loopback port 3080. Not vendored here; downloaded at launch (dlx/npx) or by install.","talks_to":["DeepSeek API","local workspace files and shell","browser"]},{"component":"Web UI screenshot","path":"docs/web-ui.png","responsibility":"1440x900 PNG embedded in the README to show what the harness looks like; documentation asset only.","talks_to":[]}],"data_flow":["1. The user changes into the project directory the agent should work in (it becomes the default workspace root, and a .env there supplies DEEPSEEK_API_KEY) and calls the launcher script.","2. The script checks that `node` is on PATH; the sh version also extracts the Node major version and exits 1 when it is below 22.","3. DSH_VERSION is resolved: the environment variable if set, otherwise the pinned default 0.1.1-rc.2.","4. A notice is printed that the first run downloads the package and can take a few minutes.","5. If pnpm is on PATH the script runs `pnpm dlx @deepseek-ai/dsh@\u003cversion> web \u003cextra args>`; otherwise it prints a hint about the npm resolver and runs `npx -y @deepseek-ai/dsh@\u003cversion> web \u003cextra args>`.","6. The package manager downloads (first run) or reuses its cache, then starts `dsh web`, which serves the Web UI on http://127.0.0.1:3080 and opens the default browser unless --no-open is passed or an SSH session is detected (README claim about upstream).","7. First run in the browser: Settings -> Models to paste the DeepSeek API key (effective without restart), then Choose workspace; the session composer stays disabled until a workspace is selected.","8. The user starts a session; the agent reads and edits workspace files, runs commands, keeps a plan and asks for approval under the active permission policy. Ctrl+C in the terminal stops the server."],"key_functions":[{"name":"Node presence guard (sh)","path":"start-harness.sh:6-9","signature":"if ! command -v node >/dev/null 2>&1; then ... exit 1; fi","does":"Fails fast with a readable message when Node.js is not installed, instead of letting pnpm/npx fail obscurely.","input_example":"./start-harness.sh on a machine without node","expected_output":"stderr: 'error: Node.js is required (v22.19+ or v24+). Install it from https://nodejs.org/' and exit code 1"},{"name":"Node major-version guard (sh)","path":"start-harness.sh:11-15","signature":"NODE_MAJOR=$(node -p 'process.versions.node.split(\".\")[0]'); if [ \"$NODE_MAJOR\" -lt 22 ]; then ... exit 1; fi","does":"Rejects Node majors below 22. It compares only the major number, so it is looser than the documented requirement (22.19+ or 24+): 22.0-22.18 and 23.x pass the guard.","input_example":"./start-harness.sh with Node 20","expected_output":"stderr: 'error: Node.js v22.19+ or v24+ is required (found v20.x.y).' and exit code 1"},{"name":"DSH_VERSION pin with env override (sh)","path":"start-harness.sh:18","signature":"DSH_VERSION=\"${DSH_VERSION:-0.1.1-rc.2}\"","does":"Single line that pins the upstream release the setup was verified against while letting a per-run environment variable override it (for example DSH_VERSION=latest).","input_example":"DSH_VERSION unset","expected_output":"DSH_VERSION is 0.1.1-rc.2"},{"name":"pnpm-or-npx dispatch (sh)","path":"start-harness.sh:24-29","signature":"if command -v pnpm ...; then exec pnpm dlx \"@deepseek-ai/dsh@${DSH_VERSION}\" web \"$@\"; else exec npx -y \"@deepseek-ai/dsh@${DSH_VERSION}\" web \"$@\"; fi","does":"The core of the repo: picks pnpm when available (fast resolution), falls back to npx with a warning, and uses exec so the shell is replaced by the package-manager process. All script arguments are forwarded after `web`.","input_example":"./start-harness.sh --port 4000 --no-open (pnpm installed, DSH_VERSION unset)","expected_output":"runs: pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 web --port 4000 --no-open"},{"name":"Windows version default","path":"start-harness.cmd:12","signature":"if \"%DSH_VERSION%\"==\"\" set DSH_VERSION=0.1.1-rc.2","does":"Batch counterpart of the sh pin: sets the default only when the variable is empty. This is the second place the pin lives.","input_example":"DSH_VERSION not set in the environment","expected_output":"DSH_VERSION is 0.1.1-rc.2"},{"name":"pnpm-or-npx dispatch (cmd)","path":"start-harness.cmd:18-24","signature":"where pnpm >nul 2>nul / if errorlevel 1 ( npx -y @deepseek-ai/dsh@%DSH_VERSION% web %* ) else ( pnpm dlx @deepseek-ai/dsh@%DSH_VERSION% web %* )","does":"Windows version of the dispatch. `where pnpm` sets errorlevel 1 when pnpm is missing, which selects the npx branch and prints the resolver hint.","input_example":"start-harness.cmd --no-open (pnpm missing)","expected_output":"prints the 'install pnpm' note, then runs: npx -y @deepseek-ai/dsh@0.1.1-rc.2 web --no-open"},{"name":"npm script: start","path":"package.json:7","signature":"\"start\": \"dsh web\"","does":"Runs the locally installed dsh binary (from the pinned dependency) instead of an ephemeral dlx/npx download. Requires `pnpm install` first.","input_example":"pnpm start","expected_output":"runs: dsh web"},{"name":"npm script: update:dsh","path":"package.json:9","signature":"\"update:dsh\": \"npm install @deepseek-ai/dsh@latest\"","does":"Moves the package.json pin to the latest upstream release. Uses npm (the resolver the README warns about) and leaves the launcher scripts' DSH_VERSION default unchanged."}],"infra":[{"topic":"Runtime requirements","detail":"Node.js 22.19+ or 24+ on the local machine; pnpm optional but strongly preferred (npm i -g pnpm or corepack enable pnpm). README states the setup was verified on a clean Linux container with Node v22.22 and pnpm 10.33.","path":"README.md:11-14"},{"topic":"Network binding and port","detail":"The upstream server binds loopback 127.0.0.1 only, default port 3080; `--port \u003cn>` changes the port, `--trusted-host \u003cauthority>` accepts another Host header (reverse-proxy / named-host setups), `--no-open` skips the browser.","path":"README.md:59-70"},{"topic":"Remote access","detail":"Supported remote use is SSH local port-forwarding (-L 3080:127.0.0.1:3080) and then opening the loopback URL in the local browser. README says dsh detects an SSH session and only prints the URL.","path":"README.md:72-80"},{"topic":"Secrets","detail":"One secret: the DeepSeek API key. Either pasted in the Web UI (Settings -> Models) or supplied as DEEPSEEK_API_KEY in a .env file in the launch directory. .env is git-ignored; only the empty .env.example is tracked.","path":"README.md:52-53"},{"topic":"Version pinning","detail":"Pin lives in three spots: DSH_VERSION default in start-harness.sh, the same default in start-harness.cmd, and the exact dependency version in package.json. package-lock.json is git-ignored and no pnpm lockfile is tracked, so transitive dependencies are not locked.","path":"README.md:99-105"},{"topic":"Proxy environments","detail":"Behind a corporate proxy set HTTPS_PROXY and NODE_USE_ENV_PROXY=1 so Node honours it.","path":"README.md:112"},{"topic":"Deployment / CI","detail":"None. No CI workflow, no tests, no Dockerfile, no cloud resources: the repo is meant to be cloned and run on a workstation. The only verification is the manual end-to-end check recorded in the README (HTTP 200 on the loopback URL with --no-open).","path":"README.md:48"}],"decisions":[{"decision":"Prefer `pnpm dlx` and fall back to `npx -y` only when pnpm is missing","why":"pnpm resolves the package's large release-candidate dependency graph in seconds, whereas npm's resolver (observed with npm 10.x) can grind for a very long time on 'resolving dependencies'.","alternative_rejected":"npx / npm install as the default path","evidence":"start-harness.sh:22-23"},{"decision":"Pin the exact upstream version 0.1.1-rc.2 instead of tracking latest","why":"DeepSeek Harness is in developer preview and changes fast; the repo pins the version the setup was last verified against, with DSH_VERSION=latest as an explicit opt-in.","alternative_rejected":"Always running @latest","evidence":"README.md:9"},{"decision":"Keep the server on 127.0.0.1 and reach remote machines through SSH port-forwarding","why":"The Web UI has no authentication and its API drives an agent that can execute shell commands in the workspace; exposing it is remote code execution. README notes the CLI itself refuses --host 0.0.0.0.","alternative_rejected":"Public tunnel (ngrok, cloudflared) or a reverse proxy on a public interface","evidence":"README.md:84-85"},{"decision":"Wrap the published npm package rather than clone and build the harness","why":"Goal is one command that opens the UI. Building from source needs pnpm 11.7 plus an install and build step, so it is relegated to an 'advanced' section for hacking on the harness itself (rationale evident from the README structure, not stated).","alternative_rejected":"git clone + pnpm install + pnpm run build + pnpm dsh web as the normal path","evidence":"README.md:87-97"},{"decision":"API key entered in the Web UI or a git-ignored .env, never in the repo","why":"The key takes effect in the UI without restarting the server; the .env route exists for people who prefer files, and .gitignore excludes .env so the key cannot be committed.","alternative_rejected":"Hard-coding or committing the key","evidence":"README.md:52-53"},{"decision":"Launch from the directory the agent should work in","why":"The invoking directory becomes the default workspace root and is where dsh looks for .env, so the launcher is designed to be called from the target project, with extra flags simply appended.","evidence":"README.md:18"}],"gotchas":[{"issue":"npx or npm install hangs on 'resolving dependencies'","consequence":"The first launch appears frozen for a very long time when pnpm is not installed.","fix_or_guard":"Install pnpm (npm i -g pnpm or corepack enable pnpm) and rerun; the launcher picks it up automatically. The scripts print this hint before using npx.","path":"README.md:109"},{"issue":"The version pin is duplicated in three places and `update:dsh` only changes package.json","consequence":"After `npm run update:dsh`, `pnpm start` runs the new release while the launcher scripts still run 0.1.1-rc.2: silent drift between the two launch paths.","fix_or_guard":"When bumping, edit the DSH_VERSION default in both scripts and the package.json dependency together, or use DSH_VERSION=latest for a one-off.","path":"package.json:9"},{"issue":"The Node guard is looser than the documented requirement","consequence":"start-harness.sh only rejects majors below 22 (so 22.0-22.18 and 23.x pass), and start-harness.cmd checks only that node exists. An unsupported Node fails later inside dsh with a less clear error.","fix_or_guard":"Check `node --version` manually against 22.19+ or 24+.","path":"start-harness.sh:11-15"},{"issue":"The Web UI has no authentication and can run shell commands","consequence":"Anyone who can reach the port can drive the agent in the workspace (remote code execution).","fix_or_guard":"Never expose it via a public tunnel or public reverse proxy; use SSH -L. Upstream binds loopback by default and refuses --host 0.0.0.0 (README claim).","path":"README.md:84"},{"issue":"Running ./start-harness.sh from inside this repo makes the launcher repo itself the workspace","consequence":"The agent works on the launcher files rather than the intended project, and a .env placed next to the script is not found when launching from elsewhere.","fix_or_guard":"cd into the target project and call the script by its path; keep .env in the directory you launch from (the comment on line 1 of .env.example says it is picked up from the invoking directory).","path":"README.md:18"},{"issue":"No lockfile is tracked (.gitignore line 2 excludes package-lock.json, and there is no pnpm-lock.yaml)","consequence":"Only the top-level dsh version is exact; transitive dependencies can resolve differently over time, so a later install is not guaranteed identical to the verified one.","fix_or_guard":"None in the repo; commit a pnpm lockfile if reproducibility matters."},{"issue":"First run is slow even with pnpm, and the session composer is disabled until a workspace is chosen","consequence":"Easy to mistake for a broken install or a broken UI.","fix_or_guard":"Wait a few minutes on first download (later starts use the cache); in the UI click Choose workspace and select the project directory.","path":"README.md:54"}],"glossary":[{"term":"DeepSeek Harness","meaning":"DeepSeek's open-source agent harness with a browser Web UI; the upstream project this repo launches. Described in the README as a developer preview."},{"term":"dsh","meaning":"The CLI binary of the npm package @deepseek-ai/dsh. `dsh web` starts the Web UI server."},{"term":"DSH_VERSION","meaning":"Environment variable read by both launcher scripts to choose the upstream release; defaults to 0.1.1-rc.2, can be set to latest."},{"term":"pnpm dlx","meaning":"pnpm's download-and-execute command (its npx equivalent); the launcher's preferred way to run dsh without installing it."},{"term":"npx -y","meaning":"npm's download-and-execute fallback, with -y to skip the install confirmation prompt."},{"term":"workspace","meaning":"The project directory the agent is allowed to read, edit and run commands in. Defaults to the directory dsh was started from and must be selected in the UI before a session can start."},{"term":"--no-open","meaning":"Flag for `dsh web` that starts the server without opening the default browser."},{"term":"--trusted-host","meaning":"Repeatable flag that makes the server accept requests carrying another Host authority, for reverse-proxy or named-host setups."},{"term":"loopback binding","meaning":"The server listens only on 127.0.0.1, so it is reachable only from the same machine (or through an SSH forward)."},{"term":"permission policy","meaning":"Upstream setting that decides which agent operations require the user's approval before they run."},{"term":"DEEPSEEK_API_KEY","meaning":"Name of the environment variable (in .env) that carries the DeepSeek platform API key, as an alternative to entering it under Settings -> Models."}],"relations":[{"project":"cloudbq","relation":"Thematic only, no code link: its aider-scaffold skill (also present in [private project]) accepts DEEPSEEK_API_KEY as one of the provider keys, so the same DeepSeek key can serve both tools."}],"directions":["Make the pin single-sourced: have the scripts read the version from package.json, or change update:dsh to pnpm and to rewrite the DSH_VERSION defaults, because today a bump leaves the three pins out of sync.","Re-verify against the current upstream release (DSH_VERSION=latest): the pin is a release candidate of a developer preview recorded in August 2026, so flags and first-run steps in the README may have moved.","Tighten the Node guard to the documented 22.19+ / 24+ rule and add the same check to start-harness.cmd, since both currently let unsupported versions through.","Turn the manual verification into a smoke test (start with --no-open, expect HTTP 200 on the loopback URL) and track a pnpm lockfile, so a broken upstream release is caught before use.","For use from another machine, script the documented SSH -L forward (or run the launcher as a service on a remote box and tunnel to it) rather than exposing the port: the UI has no authentication."],"confidence":"high","coverage_notes":"Read every tracked file (8 files, one merge commit from August 2026): README.md, both launcher scripts, package.json, .env.example (holds only an empty variable name), .gitignore, .cursorindexingignore; docs/web-ui.png was identified by file type only, not viewed. Everything about what the upstream harness does (loopback binding, refusal of --host 0.0.0.0, SSH detection, Web UI steps, flags) is taken from this repo's README and was not checked against the upstream source, which is not vendored here. No tests, CI or history exist. Status 'paused' is a judgement: the launcher is complete but there is a single commit and no later activity. The 'functions' listed are script blocks and npm scripts; the repo has no real functions. [private project] (.env.example, .gitignore) are cited through README lines or in prose because the validator cannot resolve paths that start with a dot.","slug":"deep-seek-harness","code":"51","repo":"deep-seek-harness","visibility":"public","fork":false,"pushed_at":"2026-08-23T18:59:05Z","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","alts":[],"aliases":["deepseek harness","the dsh launcher","start-harness","the DeepSeek web UI thing","deep seek harness"],"analyzed_at":"2026-11-12","card_count":16,"shelf":5,"github":"https://github.com/Wkayaobama/deep-seek-harness"},{"title":"Programming Millenium matrix + PAO starter kit (Anki decks fork)","one_liner":"Fork of a memory-systems/Anki repo where the owner added a 1000-concept programming peg matrix (CSV -> xlsx -> Anki), executed demo notebooks and a blank PAO spreadsheet kit.","purpose":"The upstream repository is someone else's collection of memory systems (a French Major-system 'Millenium' of 1000 number images, card systems, Anki decks). The owner's own work, on branch claude/programming-memory-system-mqtcef, re-uses that spreadsheet 'matrix method' for programming: 1000 concepts get fixed 3-digit addresses (hundreds = domain, tens = category, units = rank), each with a definition, an anchor image, an example and a confusable. A single CSV is the source of truth; build.py regenerates the Excel workbook and ten semicolon-separated Anki import files, and ten executed Jupyter notebooks add a predict-the-output 'procedural layer'. A second folder is a beginner kit for peg systems, the Major system and PAO, with a generated blank workbook and an F9 drill tab. It exists so the owner can memorise programming fundamentals with the same peg technique, with Anki as the last step only.","domain":"Memory techniques / spaced-repetition content generation","status":"paused","stack":["Python 3","openpyxl","csv (stdlib)","nbformat","nbclient","ipykernel","Jupyter notebooks","Excel workbook formulas","Anki import (CSV / tab-delimited txt)"],"entry_points":[{"command":"cd 00.Memory_systems/06.Programming_Millenium && python3 build.py","what":"Reads programming_millenium.csv (must be exactly 1000 rows) and rewrites Programming_Millenium.xlsx (tabs matrix / taxonomy / tuto) plus export_for_anki/000.csv ... 900.csv.","path":"00.Memory_systems/06.Programming_Millenium/build.py:160"},{"command":"cd 00.Memory_systems/06.Programming_Millenium/notebooks && python3 make_notebooks.py [spec.json ...]","what":"Assembles each specs/*.json into a v4 notebook, executes it with nbclient and writes the executed .ipynb beside the script; exits 1 if a cell without the INTENDED ERROR marker raised.","path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py:53"},{"command":"cd 00.Memory_systems/07.PAO_multiple_encoding && python3 make_template.py","what":"Rewrites PAO_starter_blank.xlsx with tabs instructions / digits_0-9 / pao_00-99 / drill.","path":"00.Memory_systems/07.PAO_multiple_encoding/make_template.py:113"}],"architecture":[{"component":"Source-of-truth CSV","path":"00.Memory_systems/06.Programming_Millenium/programming_millenium.csv","responsibility":"One row per code 000-999 with 11 columns: code, concept, definition, anchor, example, confusables, alternates, domain_name, category_name, mnemonic, learned. Everything else in the folder is generated from it.","talks_to":["build.py"]},{"component":"Workbook + export builder","path":"00.Memory_systems/06.Programming_Millenium/build.py","responsibility":"Turns the CSV into the three-tab Excel curation matrix and into ten per-hundred Anki import files. Holds the column layout (HEADERS), the seeded backlog (BACKLOG) and the tuto steps (TUTO) as module constants.","talks_to":["Source-of-truth C
