SV","Programming_Millenium.xlsx","Anki exports"]},{"component":"Generated curation workbook","path":"00.Memory_systems/06.Programming_Millenium/Programming_Millenium.xlsx","responsibility":"Tab matrix = the 1000 rows with Learned flag, collision and bench columns and a SUM progress cell; tab taxonomy = digit mnemonics and the 10x10 category grid; tab tuto = the Anki import steps. Generated, not hand-edited.","talks_to":["Anki (pathways 2 and 3)"]},{"component":"Anki exports","path":"00.Memory_systems/06.Programming_Millenium/export_for_anki","responsibility":"Ten headerless, semicolon-separated files of 100 rows each, fields code;concept;anchor;definition;example;confusables, one file per hundred-block so each becomes an Anki subdeck.","talks_to":["Anki (pathway 1)"]},{"component":"Notebook specs","path":"00.Memory_systems/06.Programming_Millenium/notebooks/specs","responsibility":"Ten JSON files {notebook, cells:[{type: md|code, source}]}; each holds ten 'engraver' demos, one per category of its hundred-block, written as markdown intro + code cells.","talks_to":["make_notebooks.py"]},{"component":"Notebook builder/executor","path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py","responsibility":"Builds a notebook from a spec with nbformat, runs it top to bottom with nbclient (allow_errors=True), flags unexpected errors, and writes the executed notebook so outputs are committed.","talks_to":["Notebook specs","Executed notebooks"]},{"component":"Executed notebooks (procedural layer)","path":"00.Memory_systems/06.Programming_Millenium/notebooks/500_concurrency.ipynb","responsibility":"Ten notebooks 000_fundamentals ... 900_quality_ops, 10 demos each, committed with outputs. Reviewed by read -> predict -> run -> compare; 13 code cells raise on purpose so the traceback is the lesson.","talks_to":[]},{"component":"PAO template generator","path":"00.Memory_systems/07.PAO_multiple_encoding/make_template.py","responsibility":"Generates the blank PAO starter workbook: a 9-step instructions tab, a digits tab (shape + rhyme images, Major consonants prefilled), a 100-row P/A/O matrix with Major-sound hints and a random 6-digit drill tab.","talks_to":["PAO_starter_blank.xlsx"]},{"component":"Method documentation","path":"00.Memory_systems/06.Programming_Millenium/README.md","responsibility":"Decodes the original Millenium sheet column by column, maps each memory component to its programming equivalent, explains address/anchor fusion and documents the three Anki export pathways. The PAO README is the companion concept primer.","talks_to":[]}],"data_flow":["1. Edit programming_millenium.csv, the source of truth: one row per code 000-999 (11 columns, learned starts at 0).","2. build.py read_rows() loads it with csv.DictReader and asserts exactly 1000 rows.","3. build_matrix_sheet() writes tab 'matrix': A Learned, B Code, C Concept, D Anchor, E Definition, F Example, G confusables, H alternates, J Domain, K Category; column I is left empty for the owner's rejects; N/O/P receive the seeded backlog.","4. It adds =SUM(A2:A1003) at A1004 (progress counter, same cell as the original sheet), freezes panes at C2 and sets an autofilter on A1:P1001.","5. build_taxonomy_sheet() derives the digit -> domain -> mnemonic table and the 10x10 category grid from the rows; build_tuto_sheet() writes the import steps.","6. The workbook is saved as Programming_Millenium.xlsx, then export_anki() writes export_for_anki/000.csv ... 900.csv (rows grouped by first digit of the code, semicolon delimiter, utf-8-sig, no header, 6 fields).","7. Anki comes last: File -> Import each export into a subdeck per hundred (pathway 1), or save the matrix tab as UTF-8 text (pathway 2), or build a multi-card note type with conditional templates and import tab-delimited text (pathway 3).","8. In parallel, make_notebooks.py turns notebooks/specs/*.json into executed notebooks: assemble cells, run with nbclient, report any error outside an INTENDED ERROR cell, write \u003cnotebook>.ipynb with outputs.","9. Review loop: predict each notebook cell's output before reading it; once a block is stable, set Learned to 1 so the SUM row tracks progress."],"key_functions":[{"name":"read_rows","path":"00.Memory_systems/06.Programming_Millenium/build.py:71","signature":"def read_rows()","does":"Loads programming_millenium.csv as a list of dicts and asserts len(rows) == 1000; the guard that keeps the 000-999 address space complete.","input_example":"a CSV with 999 data rows","expected_output":"AssertionError: expected 1000 rows, got 999"},{"name":"build_matrix_sheet","path":"00.Memory_systems/06.Programming_Millenium/build.py:78","signature":"def build_matrix_sheet(ws, rows)","does":"Writes the 'matrix' tab: styled headers, one row per code from row 2, the SUM progress formula at A1004 with label 'learned / 1000' at B1004, backlog in N/O/P, column widths, freeze panes C2, autofilter A1:P1001."},{"name":"build_taxonomy_sheet","path":"00.Memory_systems/06.Programming_Millenium/build.py:108","signature":"def build_taxonomy_sheet(ws, rows)","does":"Derives domains from the first digit of each code and categories from the first two digits, then writes the digit/domain/mnemonic table (rows 5-14) and the 10x10 category grid (row = domain digit, column = tens digit, from row 18)."},{"name":"build_tuto_sheet","path":"00.Memory_systems/06.Programming_Millenium/build.py:140","signature":"def build_tuto_sheet(ws)","does":"Writes the TUTO constant (6 numbered steps, a tip, the five '3rd way' rows and the video reference) into columns A-C of the 'tuto' tab."},{"name":"export_anki","path":"00.Memory_systems/06.Programming_Millenium/build.py:148","signature":"def export_anki(rows)","does":"For each hundred h in 0-9, writes export_for_anki/{h}00.csv with the rows whose code starts with that digit: semicolon-delimited, utf-8-sig, no header, field order code, concept, anchor, definition, example, confusables.","expected_output":"10 files of 100 lines each; 500.csv starts with the row for 500 'Concurrency vs parallelism'"},{"name":"main (build.py)","path":"00.Memory_systems/06.Programming_Millenium/build.py:160","signature":"def main()","does":"Orchestrates the build: read rows, create workbook with tabs matrix / taxonomy / tuto, save the xlsx, write the Anki exports, print one summary line.","expected_output":"prints 'wrote \u003cxlsx path> and \u003cexport dir>/*.csv from 1000 rows'"},{"name":"build (make_notebooks.py)","path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py:26","signature":"def build(spec_path)","does":"Loads one spec, creates markdown/code cells, executes with NotebookClient(timeout=90, allow_errors=True, kernel_name='python3'), collects errors from code cells whose source lacks 'INTENDED ERROR', writes the notebook and returns (out_path, unexpected).","input_example":"specs/500_concurrency.json","expected_output":"writes notebooks/500_concurrency.ipynb; unexpected == [] when every error is intended"},{"name":"main (make_notebooks.py)","path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py:53","signature":"def main()","does":"Builds the specs given on the command line, or all of specs/*.json sorted; prints '\u003cname>.ipynb: OK' or 'UNEXPECTED ERRORS: [...]' and exits 1 if any notebook had an unexpected error."},{"name":"sheet_pao","path":"00.Memory_systems/07.PAO_multiple_encoding/make_template.py:74","signature":"def sheet_pao(ws)","does":"Writes the 100-row PAO matrix: Learned=0, Number as two-digit text, empty Person/Action/Object/collision/bench columns, a grey Major-sound hint built from the first sound of each digit, SUM at A104.","input_example":"row for n = 25","expected_output":"Number '25', hint 'n + l'"},{"name":"sheet_drill","path":"00.Memory_systems/07.PAO_multiple_encoding/make_template.py:94","signature":"def sheet_drill(ws)","does":"Builds the drill tab: B3 = random 6-digit text via RANDBETWEEN (new value on F9), then MID slices pairs 1-2, 3-4, 5-6 and VLOOKUPs return the Person of pair 1, the Action of pair 2 and the Object of pair 3 from the pao tab.","input_example":"pao tab still blank","expected_output":"column C shows '(fill pao tab)'"},{"name":"sheet_digits","path":"00.Memory_systems/07.PAO_multiple_encoding/make_template.py:54","signature":"def sheet_digits(ws)","does":"Writes the digits 0-9 tab with empty shape-image and rhyme-image columns, the Major consonants prefilled from the MAJOR dict, a grey example hint and SUM at A14."},{"name":"Engraver demo 253 Memoization","path":"00.Memory_systems/06.Programming_Millenium/notebooks/specs/200_algorithms.json:58","does":"Notebook cell comparing a naive recursive fib with an lru_cache version by counting real calls; typical of the predict-the-output demos.","input_example":"fib_naive(24) and fib_memo(24)","expected_output":"fib_naive(24) = 46368 in 150049 calls; fib_memo(24) = 46368 in 25 calls"},{"name":"Engraver demo 046 Off-by-one (intended error)","path":"00.Memory_systems/06.Programming_Millenium/notebooks/specs/000_fundamentals.json:46","does":"Cell marked '# INTENDED ERROR' that loops range(len(rails) + 1) over a 3-element list; shows how intended failures are kept as output.","input_example":"rails = ['rail-0', 'rail-1', 'rail-2']","expected_output":"prints indexes 0, 1, 2 then IndexError: list index out of range"},{"name":"Engraver demo 716 EXPLAIN query plan","path":"00.Memory_systems/06.Programming_Millenium/notebooks/specs/700_data_persistence.json:18","does":"SQLite demo printing the query plan before and after creating an index on events(city); the one demo chosen to teach all of query performance.","expected_output":"before index: SCAN events / after index: SEARCH events USING INDEX idx_events_city (city=?) / rows matched, total amount: (1250, 9371250)"}],"infra":[{"topic":"Runtime","detail":"Local scripts only: no server, no CI, no cloud resources and no environment variables. Each script resolves paths from its own directory (HERE), so it can be launched from anywhere.","path":"00.Memory_systems/06.Programming_Millenium/build.py:17"},{"topic":"Dependencies","detail":"No requirements file. build.py and make_template.py need openpyxl; make_notebooks.py needs nbformat, nbclient and ipykernel (a 'python3' Jupyter kernel). The install commands are documented in the READMEs and docstrings only.","path":"00.Memory_systems/06.Programming_Millenium/README.md:106-108"},{"topic":"Branch layout","detail":"master is the untouched upstream fork (last upstream commit dated 2024-09); all owner work (38 added files) sits on branch claude/programming-memory-system-mqtcef, not merged into master."},{"topic":"Generated artefacts are committed","detail":"Programming_Millenium.xlsx, the ten export CSVs, the ten executed notebooks and PAO_starter_blank.xlsx are all checked in, so the material can be reviewed or imported without running anything.","path":"00.Memory_systems/06.Programming_Millenium/README.md:96-98"},{"topic":"Git attributes","detail":".gitattributes marks *.ipynb and *.html as linguist-detectable=false (inherited repository setting), so notebooks do not count in language statistics.","path":".gitattributes"}],"decisions":[{"decision":"Encode addresses with a decimal taxonomy (hundreds = domain, tens = category, units = rank, 0 = most fundamental) instead of the phonetic Major code of the original Millenium","why":"The generative rule must let you derive the shelf from the digits; for concepts the meaningful derivation is domain -> category -> rank, each hundred carrying a digit mnemonic (5 = five dining philosophers, 9 = five nines).","alternative_rejected":"Phonetic digits -> consonant sounds -> word, as in the French Millenium","evidence":"00.Memory_systems/06.Programming_Millenium/README.md:29"},{"decision":"The digits are decoded by the taxonomy, never by the anchor; the anchor encodes only the concept","why":"The two halves carry different information and mixing them is called the main source of confusion. Fusion happens afterwards by staging the anchor scene at the address or merging it with the existing French peg image for that number.","alternative_rejected":"An anchor image that tries to encode the number as well","evidence":"00.Memory_systems/06.Programming_Millenium/README.md:50-59"},{"decision":"The CSV is the single source of truth; xlsx and Anki exports are generated","why":"Mirrors the original pipeline (notebook -> csv -> xlsx -> Anki): the spreadsheet is the curation matrix and Anki is only the drill, so content is edited in one place and everything else is rebuilt.","alternative_rejected":"Editing cards directly in Anki or hand-maintaining the workbook","evidence":"00.Memory_systems/06.Programming_Millenium/build.py:4-6"},{"decision":"Anki comes last, only once a block is stable","why":"Drilling unstable pegs burns wrong images in; the matrix is the living source and progress is tracked there with the Learned flag and SUM row.","alternative_rejected":"Creating Anki cards first and curating inside Anki","evidence":"00.Memory_systems/07.PAO_multiple_encoding/README.md:125"},{"decision":"Keep the original sheet's columns: collision registry (attention doublon), bench (non retenu mais convient), rejects, Learned flag + SUM, far-column backlog","why":"Each column has a memory-engineering reason: two addresses sharing an image merge in memory, so near-misses are logged; benched and rejected ideas are kept so they are never re-evaluated from scratch.","alternative_rejected":"A plain code/concept/definition list","evidence":"00.Memory_systems/07.PAO_multiple_encoding/README.md:79-86"},{"decision":"Add a procedural layer of executed notebooks with ONE engraver concept per category (100 demos) rather than a demo for all 1000 codes","why":"Images and definitions are declarative memory; seeing the net effect of code is procedural memory. One carefully chosen demo per category burns in the larger idea, not the particulars.","alternative_rejected":"Flashcards only, or one demo per code","evidence":"00.Memory_systems/06.Programming_Millenium/README.md:82-87"},{"decision":"Notebooks are built from JSON specs and committed with their outputs; errors are allowed only in cells marked INTENDED ERROR","why":"Review must work without running anything, and for those cells the real traceback is the lesson; any other error is treated as a build failure.","alternative_rejected":"Hand-edited notebooks without outputs, or stopping at the first error","evidence":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py:4-10"},{"decision":"Formalise a third Anki pathway: one note per row generating several cards through conditional templates {{#Field}}...{{/Field}}","why":"It yields Definition, Anchor and reverse Concept->Code cards from one note, and a blank field produces no card, removing the need to fill blanks with N/A. The video's '10 Question' note type is not shipped, so the steps recreate it by cloning Basic.","alternative_rejected":"Depending on the downloadable '10 Question' note type, or padding blanks with N/A","evidence":"00.Memory_systems/06.Programming_Millenium/README.md:119-130"},{"decision":"PAO compression: Person of pair 1 + Action of pair 2 + Object of pair 3 = one scene for 6 digits","why":"One image per 6 digits instead of per 2 means three times fewer palace loci, and the unique combinations do not blur into each other.","alternative_rejected":"One image per 2-digit pair","evidence":"00.Memory_systems/07.PAO_multiple_encoding/README.md:45-54"}],"gotchas":[{"issue":"Field order differs between the CSV and the exports: the CSV has definition before anchor, the exports and the workbook have anchor before definition.","consequence":"Importing programming_millenium.csv straight into Anki, or mapping fields by the CSV header order, swaps Anchor and Definition.","fix_or_guard":"Import only export_for_anki/*.csv (or the matrix tab); the Anki fields must be Code, Concept, Anchor, Definition, Example, Confusables in that order.","path":"00.Memory_systems/06.Programming_Millenium/build.py:156-157"},{"issue":"build.py always creates a fresh workbook and overwrites Programming_Millenium.xlsx.","consequence":"Anything typed into the workbook (Learned flags, column I rejects, backlog notes) is lost on the next build, although the README says progress lives in the matrix.","fix_or_guard":"Record progress in the 'learned' column of the CSV (read at build time) or work in a copy of the workbook.","path":"00.Memory_systems/06.Programming_Millenium/build.py:162-168"},{"issue":"read_rows asserts exactly 1000 rows.","consequence":"Adding or deleting a concept aborts the build with an AssertionError; the address space is closed.","fix_or_guard":"Replace a concept in place instead of inserting; never renumber addresses.","path":"00.Memory_systems/06.Programming_Millenium/build.py:74"},{"issue":"Exports are written as utf-8-sig (with a BOM) and without a header row.","consequence":"The first field of each file starts with a BOM character for tools that do not strip it, and nothing names the columns at import time.","fix_or_guard":"Set the separator to semicolon in Anki and map the six fields in order; treat the first row as data.","path":"00.Memory_systems/06.Programming_Millenium/build.py:153"},{"issue":"make_notebooks.py writes the notebook even when unexpected errors were found, and only signals them through the printed status and exit code 1.","consequence":"A broken demo can be committed with its traceback if the exit status is ignored.","fix_or_guard":"Check for 'UNEXPECTED ERRORS' in the output; every deliberate failure must contain the literal text 'INTENDED ERROR' in the cell source.","path":"00.Memory_systems/06.Programming_Millenium/notebooks/make_notebooks.py:45-50"},{"issue":"The PAO drill matches text: Number is stored as two-digit text ('00'-'99') and the drill slices text with MID.","consequence":"If the Number column is retyped as real numbers the exact-match VLOOKUP fails and the drill shows '(fill pao tab)', the same fallback as an empty matrix.","fix_or_guard":"Never reorder, renumber or retype the Number column; regenerate with make_template.py if damaged.","path":"00.Memory_systems/07.PAO_multiple_encoding/make_template.py:83"},{"issue":"The workbook's tuto tab (steps 5-6) describes simple Code-front and Concept-front templates, while the README recommends conditional templates in pathway 3.","consequence":"Two slightly different card designs are documented; decks built from each differ.","fix_or_guard":"Treat the README section 'Exporting to Anki - the three pathways' as the reference.","path":"00.Memory_systems/06.Programming_Millenium/build.py:57-58"},{"issue":"Changing a peg after starting to learn it.","consequence":"Old and new images compete in memory.","fix_or_guard":"Resolve collisions before Learned=1; afterwards log them in the 'deja pris' column instead of improving the peg.","path":"00.Memory_systems/07.PAO_multiple_encoding/README.md:119-120"}],"glossary":[{"term":"Millenium","meaning":"The upstream French Major-system peg list: numbers 0-999, one vivid image each, kept in an Excel matrix. The original the owner's work refactors."},{"term":"Programming Millenium","meaning":"The owner's variant: 1000 programming concepts at codes 000-999 (10 domains x 10 categories x 10 concepts). Code 000 = Value, code 999 = Blameless postmortem."},{"term":"Matrix","meaning":"The curation spreadsheet with one row per fixed address; in the generated workbook it is the tab named 'matrix'."},{"term":"Anchor","meaning":"One vivid mental scene that encodes the concept's mechanism or name (never the digits), e.g. 520 Mutex = a restroom key chained to your own belt loop."},{"term":"Digit mnemonic","meaning":"The image tied to each hundreds digit: 0 origin/null, 1 single node, 2 binary split, 3 input-transform-output, 4 four pillars, 5 five dining philosophers, 6 hexagon, 7 seven normal forms, 8 port 80, 9 five nines."},{"term":"Attention doublon / deja pris","meaning":"Collision registry column: the nearest confusable concept and the one discriminating difference, or a 'cf. XXX (deja pris)' cross-reference."},{"term":"Non retenu mais convient","meaning":"The bench: valid alternate images that were not kept, stored so they are never re-evaluated from scratch (CSV column 'alternates')."},{"term":"Learned flag + SUM","meaning":"Column A holds 0/1 per row; a SUM cell under the data is the progress bar (the original sheet stood at 809/1000, the programming one starts at 0/1000)."},{"term":"Engraver concept","meaning":"The single demo chosen per category for the notebooks, whose input -> output burns in the larger idea (037 Nesting depth for branching, 716 EXPLAIN for query performance)."},{"term":"Procedural layer","meaning":"The ten executed notebooks: read the code, predict the output, run, compare."},{"term":"INTENDED ERROR","meaning":"Marker text in a code cell that is meant to raise; make_notebooks.py tolerates errors only in cells containing it."},{"term":"Peg system","meaning":"A permanent vivid image for every slot of a fixed address space, learned once and reused to hang anything on."},{"term":"Major system","meaning":"Phonetic encoding digits -> consonant sounds (0 s/z, 1 t/d, 2 n, 3 m, 4 r, 5 l, 6 j/ch/sh, 7 k/hard g, 8 f/v, 9 p/b); vowels are free filler."},{"term":"PAO","meaning":"Person-Action-Object: each number 00-99 gets a person with a signature action and object; three pairs compress into one scene."},{"term":"Multiple encoding","meaning":"Several independent retrieval routes for one address (shape, rhyme, Major, PAO, palace); each extra route is a backup path."}],"relations":[{"project":"Wk-Code-Memorization-PKM","relation":"The Recurser card schema states that its category digits 0-9 deliberately reuse the digit mnemonics of this Programming Millenium matrix, and its address module cites the same rule of learning addresses once."}],"directions":["Fuse each code with the French Millenium peg image for the same number: the only backlog item flagged '!!!!' in build.py, and the README's strongest two-way address \u003c-> concept binding.","Add per-language variants (Python / JS / Go) as extra columns and a picture per anchor: both are seeded backlog rows in the matrix.","Persist progress properly: let build.py read Learned flags back from the workbook (or make the CSV the documented place to flip them), since rebuilding currently overwrites the xlsx.","Generate pathway 3 directly: emit a tab-delimited UTF-8 text file (or an .apkg with the conditional note type) from build.py so the manual Save As and note-type steps disappear.","Review the confusables column after a first learning pass (backlog row) and fill column I with rejected anchors.","Merge the branch into master or move the two folders to a dedicated repository: the work lives only on a claude/ branch of a fork."],"confidence":"high","coverage_notes":"Read in full: both READMEs, build.py, make_notebooks.py, make_template.py, and the CSV structure (headers, 10 domains, 100 categories, sample rows). Sampled the notebook specs and the executed notebooks (titles of all 100 demos, outputs of 046, 063, 253, 716, first cells of 500). Not opened, as instructed: the .xlsx workbooks, .apkg/.zip binaries and the upstream decks; workbook contents are described from the generator code only. Upstream folders (01.Millenium etc.) were used as context through the owner's README, not analysed. The clone is shallow, so authorship of the 38 added files is inferred from the diff against master. Status 'paused' is a judgement: the content is complete, learned is 0/1000 and the last push was 2026-07.","slug":"memory-systems-anki-decks","code":"62","repo":"Memory_systems_-_Anki_decks","visibility":"public","fork":true,"pushed_at":"2026-07-13T15:40:30Z","branch":"claude/programming-memory-system-mqtcef","commit":"e2d922443a26a779055cbfa0e54436f03e4465a1","alts":[],"aliases":["anki decks","programming millenium","PAO matrix","Programming Millenium","the 1000 programming concepts matrix","the matrix method","PAO starter kit","the Anki decks fork","PAO multiple encoding"],"analyzed_at":"2026-11-12","card_count":30,"shelf":6,"github":"https://github.com/Wkayaobama/Memory_systems_-_Anki_decks"},{"title":"Remotion Maker - brand video workflow + SEALCOIN 75 s promo","one_liner":"A repeatable workflow that turns a website's brand identity plus an operator script into a Remotion explainer video rendered in 30-second chunks; sealcoin-promo is its first full instance.","purpose":"The owner makes short motion-graphics explainer videos in code (Remotion = React components rendered frame by frame to MP4). The repo holds two things. First, a reusable 'Brand Video Maker' pipeline (workflow/): decompose a brand into a 12-section token dictionary, take the operator's script through a hard gate, scaffold a Remotion app, build scenes and procedural SVG assets, then render in 1800-frame chunks and verify the files with ffprobe. Second, sealcoin-promo/: a finished 75-second, 8-scene explainer for the Eco Wave Power x SEALCOIN x SEALSQ renewable-energy marketplace proof of concept, built by following that pipeline. The earlier H2Evo hydrogen-water promo is the exemplar the workflow was distilled from; its design system survives as root workflow.md, but its code (h2-promo/) is deliberately excluded from this repository.","domain":"Programmatic video rendering / motion graphics","status":"paused","stack":["TypeScript 5.9","React 19.2","Remotion 4.0.438 (pinned)","@remotion/transitions","@remotion/google-fonts","@remotion/renderer + @remotion/bundler","Electron 40 + Electron Forge (Vite plugin)","Tailwind CSS 4 (Electron UI only)","ESLint 9 (@remotion/eslint-config-flat)","Node ESM scripts","ffmpeg / ffprobe"],"entry_points":[{"command":"npm run studio   (cwd sealcoin-promo)","what":"Starts Remotion Studio for local preview: the master composition SealcoinPromo plus the three chunk compositions are all scrubbable.","path":"sealcoin-promo/package.json:49"},{"command":"npm run lint","what":"eslint (ignoring .vite and out) followed by tsc --noEmit; must be clean before any render.","path":"sealcoin-promo/package.json:60"},{"command":"npm run render:chunks","what":"Runs render:chunk1..3 in sequence: remotion render SealcoinChunk0N out/sealcoin-chunk-0N.mp4 --muted (30 s / 30 s / 15 s).","path":"sealcoin-promo/package.json:55"},{"command":"npm run render:full","what":"Single-pass 75 s reference render of SealcoinPromo to out/sealcoin-promo-full.mp4, muted.","path":"sealcoin-promo/package.json:56"},{"command":"npm run concat","what":"Joins every out/sealcoin-chunk-NN.mp4 into out/sealcoin-promo-75s.mp4 with the ffmpeg concat demuxer and stream copy (no re-encode).","path":"sealcoin-promo/scripts/concat-chunks.mjs:32"},{"command":"npm run verify:media","what":"ffprobes each chunk and the concatenated file and fails unless video-stream durations match the chunk map within one frame.","path":"sealcoin-promo/scripts/verify-media.mjs:45"},{"command":"npm run dev","what":"electron-forge start: opens the inherited Electron render UI. Its export button is known broken in this project (see gotchas).","path":"sealcoin-promo/package.json:48"}],"architecture":[{"component":"Workflow pipeline docs","path":"workflow/README.md","responsibility":"Defines the six stages (0 checkpoint, 1 brand decomposition, 2 script intake, 3 scaffold, 4 scenes + assets, 5 chunked render + verify), the hard rules and the Remotion version caveat. Each stage ends in a commit and a reviewable artifact.","talks_to":["Brand decomposition template","Scene manifest template","Chunk render runbook"]},{"component":"Templates and runbook","path":"workflow/CHUNK-RENDER.md","responsibility":"CHUNK-RENDER.md is the render/verify runbook with the learned caveats; BRAND-DECOMPOSITION.template.md and SCENE-MANIFEST.template.md are the blank forms a new project fills in.","talks_to":["sealcoin-promo docs"]},{"component":"H2Evo exemplar design system","path":"workflow.md","responsibility":"Completed 12-section key=value design dictionary from the H2Evo promo (colours, type, shape, motion, layout, scenes, assets, copy, production rules). Reference for every later brand decomposition. Step1-4.md and Agents.md are the original phase prompts.","talks_to":["Brand decomposition template"]},{"component":"Operator script","path":"sealcoin/synopsis.md","responsibility":"Read-only ground truth for the SEALCOIN video: summary, seven steps to illustrate, and the section 3 timed map of eight segments from 0 to 75 s that fixes every scene duration and every on-screen line.","talks_to":["Scene manifest","manifest.ts"]},{"component":"Project docs (BRAND / SCENE-MANIFEST / script)","path":"sealcoin-promo/docs/BRAND.md","responsibility":"Human-readable instances of the templates: brand tokens with [V]/[I] provenance, the scene table tracing each on-screen line to the script, and the chunk math worksheet. They mirror the code; the code wins on disagreement.","talks_to":["theme.ts","manifest.ts"]},{"component":"Design tokens","path":"sealcoin-promo/remotion/theme.ts","responsibility":"COLORS, FONTS, FONT_SIZES, SPRING, DURATIONS (motion micro-timing) and VIDEO (1920x1080 at 60 fps). Tokens only: no scene timing lives here.","talks_to":["manifest.ts","components","assets","scenes"]},{"component":"Timing manifest","path":"sealcoin-promo/remotion/manifest.ts","responsibility":"Single source of truth for timing: SCENES, TRANSITION_FRAMES, CHUNK_FRAMES, TOTAL_FRAMES, seriesDuration, sceneStart, CHUNKS, plus a module-scope drift guard that throws when the scenes stop summing to 4500 frames.","talks_to":["Root.tsx","SealcoinPromo","SealcoinChunk"]},{"component":"Composition registry","path":"sealcoin-promo/remotion/Root.tsx","responsibility":"Loads the three Google Fonts before registration, then registers the master composition and one composition per entry of CHUNKS. index.ts calls registerRoot on it.","talks_to":["manifest.ts","theme.ts","Remotion Studio / CLI"]},{"component":"Master composition","path":"sealcoin-promo/remotion/SealcoinPromo.tsx","responsibility":"Maps SCENES onto a TransitionSeries with 12-frame fade transitions, looking each scene component up in SCENE_COMPONENTS by manifest id.","talks_to":["manifest.ts","scenes"]},{"component":"Chunk window","path":"sealcoin-promo/remotion/SealcoinChunk.tsx","responsibility":"Wraps the master in a Sequence shifted back by fromFrame so chunk frame 0 shows master frame fromFrame. This is what makes chunk boundaries continuous.","talks_to":["SealcoinPromo"]},{"component":"Scenes, assets and reusable components","path":"sealcoin-promo/remotion/scenes/SceneAutonomy.tsx","responsibility":"Eight scene files (ocean, identity, marketplace, autonomy, trust, scale, pqc, finale) compose seven generic components (SceneBackdrop, AnimatedText, FadeSlideIn, GlowCircle, Bubble, BubbleField, StatCallout) and eight procedural SVG assets (WaveField, WaveEnergyUnit, IdentityShield, MarketNetwork, BuyerIcon, SequenceChips, CheckItem, HexBadge).","talks_to":["theme.ts"]},{"component":"Concat and verify scripts","path":"sealcoin-promo/scripts/verify-media.mjs","responsibility":"Plain Node ESM helpers: concat-chunks.mjs discovers chunk files in out/ and stream-copies them into one MP4; verify-media.mjs asserts probed durations against the expected chunk map.","talks_to":["ffmpeg","ffprobe","out/ directory"]},{"component":"Electron shell (inherited template)","path":"sealcoin-promo/src/main.ts","responsibility":"Electron main/preload/renderer plus render-video.ts and forge.config.ts from the Remotion Electron template. Kept only for structure parity with h2-promo; the render button still targets the template's HelloWorld composition.","talks_to":["@remotion/renderer","@remotion/bundler"]},{"component":"Vendored Remotion skill","path":"skills-lock.json","responsibility":"Third-party remotion-best-practices rule set (SKILL.md plus 38 files under .agents/skills/remotion-best-practices/rules/) pulled from remotion-dev/skills and pinned by hash in skills-lock.json. Reference material, not the owner's code.","talks_to":[]}],"data_flow":["1. Stage 0 checkpoint: commit and push the baseline before starting a new video.","2. Stage 1 brand decomposition: probe the brand website (computed styles) and fill docs/BRAND.md, tagging every value [VERIFIED] or [INFERRED]; for SEALCOIN the verified items are the orange #FF9C1E, the Poppins and Bai Jamjuree fonts and the hexagon + lightning-bolt logo geometry.","3. Stage 2 script gate: the operator supplies the script (sealcoin/synopsis.md). Its timed map is used as-is; docs/SCENE-MANIFEST.md lists each scene with seconds, frames (seconds x 60) and on-screen copy traced to a script line. Until a script exists, scenes are only neutral timing stubs.","4. Stage 3 scaffold: copy the h2-promo app structure, write BRAND.md tokens into remotion/theme.ts and the scene durations into remotion/manifest.ts.","5. manifest.ts derives everything else: TOTAL_FRAMES = sum of scene durations (4500), CHUNKS = ceil(4500 / 1800) = 3 windows, and it throws 'Manifest drift' at import time if the total is not EXPECTED_TOTAL_FRAMES.","6. Stage 4 scenes: each scene wraps content in SceneBackdrop (gradient, glow, particles) and places text components and SVG assets with frame delays; all colours, fonts and springs come from theme.ts.","7. SealcoinPromo lays the scenes on a TransitionSeries; each scene except the last is lengthened by the 12-frame crossfade so the overlaps cancel and the timeline is still exactly 4500 frames.","8. Root.tsx registers SealcoinPromo (4500 f) and SealcoinChunk01/02/03 (1800 / 1800 / 900 f), each chunk being the master shifted by -fromFrame.","9. Stage 5 render: npm run lint, then npm run render:chunks writes out/sealcoin-chunk-01..03.mp4 with --muted.","10. npm run concat stream-copies the chunks into out/sealcoin-promo-75s.mp4; npm run verify:media probes the video stream of every file and asserts 30 s / 30 s / 15 s / 75 s within one frame.","11. Boundary proof: a still of the master at frame k x 1800 and a still of chunk k+1 at frame 0 must be byte-identical PNGs."],"key_functions":[{"name":"SCENES","path":"sealcoin-promo/remotion/manifest.ts:24","signature":"export const SCENES: readonly SceneSpec[]","does":"The eight scene specs (id, label, durationInFrames, scriptRef). Retiming or reordering the video means editing this array and nothing else in the Remotion tree.","expected_output":"Durations in order: ocean 480, identity 540, marketplace 660, autonomy 720, trust 540, scale 660, pqc 540, finale 360 = 4500 frames (75 s)."},{"name":"seriesDuration","path":"sealcoin-promo/remotion/manifest.ts:44","signature":"export const seriesDuration = (index: number): number","does":"Duration handed to TransitionSeries.Sequence: the scene's script-true length plus TRANSITION_FRAMES for every scene except the last, because a crossfade overlaps two neighbours and would otherwise shorten the timeline.","input_example":"seriesDuration(0); seriesDuration(7)","expected_output":"492 (480 + 12) and 360 (last scene, no extension). Sum of all eight = 4584; 4584 - 7 x 12 = 4500."},{"name":"sceneStart","path":"sealcoin-promo/remotion/manifest.ts:49","signature":"export const sceneStart = (index: number): number","does":"Script-true start frame of a scene: the sum of the durations before it (segment boundary, not the TransitionSeries offset).","input_example":"sceneStart(3)","expected_output":"1680 (480 + 540 + 660), i.e. the autonomy scene starts at 28 s."},{"name":"CHUNKS","path":"sealcoin-promo/remotion/manifest.ts:59","signature":"export const CHUNKS: readonly ChunkSpec[]","does":"Computes the render windows: ceil(TOTAL_FRAMES / CHUNK_FRAMES) entries with a 1-based index, a zero-padded composition id, fromFrame = i x 1800 and a duration capped by what is left.","expected_output":"[{index 1, id SealcoinChunk01, fromFrame 0, durationInFrames 1800}, {index 2, SealcoinChunk02, 1800, 1800}, {index 3, SealcoinChunk03, 3600, 900}]"},{"name":"Manifest drift guard","path":"sealcoin-promo/remotion/manifest.ts:70","signature":"if (TOTAL_FRAMES !== EXPECTED_TOTAL_FRAMES) throw new Error(...)","does":"Module-scope check that fails Studio and every render loudly when the scene durations no longer sum to the script's 75 s.","expected_output":"Error message starting 'Manifest drift: scene durations sum to \u003cn> frames, expected 4500.'"},{"name":"SealcoinChunk","path":"sealcoin-promo/remotion/SealcoinChunk.tsx:14","signature":"export const SealcoinChunk: React.FC\u003c{ fromFrame: number }>","does":"Renders the master inside \u003cSequence from={-fromFrame} durationInFrames={TOTAL_FRAMES}>. A negative 'from' shifts the master back in time, so the chunk is a window onto the same timeline and never a separate edit.","input_example":"fromFrame = 1800","expected_output":"Chunk frame 0 shows master frame 1800."},{"name":"SealcoinPromo","path":"sealcoin-promo/remotion/SealcoinPromo.tsx:30","signature":"export const SealcoinPromo: React.FC","does":"Master composition. flatMaps SCENES into TransitionSeries.Sequence elements (duration from seriesDuration) with a fade() transition of linearTiming TRANSITION_FRAMES between consecutive scenes; components come from the SCENE_COMPONENTS record keyed by SceneId."},{"name":"RemotionRoot","path":"sealcoin-promo/remotion/Root.tsx:16","signature":"export const RemotionRoot: React.FC","does":"Registers the compositions. Fonts (Poppins, Inter, Bai Jamjuree) are loaded at module top before registration so no frame renders with a fallback font; chunk compositions get defaultProps { fromFrame }.","expected_output":"Four compositions: SealcoinPromo plus SealcoinChunk01, SealcoinChunk02, SealcoinChunk03, all 1920x1080 at 60 fps."},{"name":"SceneBackdrop","path":"sealcoin-promo/remotion/components/SceneBackdrop.tsx:23","signature":"export const SceneBackdrop: React.FC\u003cSceneBackdropProps>","does":"The standard scene canvas implementing the three depth layers: vertical gradient bgDeep to bgSurface, one or two pulsing GlowCircles, a BubbleField of particles, then the scene's children on top."},{"name":"AnimatedText","path":"sealcoin-promo/remotion/components/AnimatedText.tsx:53","signature":"export const AnimatedText: React.FC\u003cAnimatedTextProps>","does":"Text that enters on the smooth spring (damping 200): opacity 0 to 1 and translateY 30 px to 0, delayed by 'delay' frames. A variant (headline, subheadline, body, stats, caption) picks size, weight and font from the theme."},{"name":"seededRandom","path":"sealcoin-promo/remotion/components/BubbleField.tsx:14","signature":"const seededRandom = (seed: number) => number","does":"Deterministic pseudo-random (fraction of sin(seed x 9301 + 49297) x 233280) used for particle position, size, speed and delay, so every render and every chunk draws identical particles. Math.random would break chunk continuity."},{"name":"MarketNetwork","path":"sealcoin-promo/remotion/assets/MarketNetwork.tsx:41","signature":"export const MarketNetwork: React.FC\u003cMarketNetworkProps>  // hub, nodes[], delay, edgeColor, pulses, labelSize","does":"Parameterised hub-and-satellites graph reused by four scenes (marketplace, autonomy, scale, finale). The hub pops in on the snappy spring, edges grow from the hub with a 6-frame stagger, nodes pop on the bouncy spring, and optional pulses travel each edge on a 90-frame loop."},{"name":"SequenceChips","path":"sealcoin-promo/remotion/assets/SequenceChips.tsx:20","signature":"export const SequenceChips: React.FC\u003c{ steps: string[]; delay?: number; color?: string; stepEvery?: number }>","does":"Chip rail for IDENTIFY, DISCOVER, VERIFY, TRANSACT, SETTLE, RECORD. Chips pop in staggered, then a highlight moves one chip every stepEvery (34) frames and wraps round, reading as an automated sequence.","input_example":"SceneAutonomy: 6 steps, delay 70","expected_output":"Sweep starts at scene frame 130 (70 + 6 x 6 + 24)."},{"name":"concat-chunks.mjs","path":"sealcoin-promo/scripts/concat-chunks.mjs:12","signature":"node scripts/concat-chunks.mjs","does":"Lists out/ for files matching sealcoin-chunk-\u003cdigits>.mp4, sorts them, writes out/concat-list.txt and runs ffmpeg -f concat -safe 0 -c copy. Uses 'npx remotion ffmpeg' unless the env var FFMPEG is set to 'ffmpeg'.","expected_output":"out/sealcoin-promo-75s.mp4; exits 1 with 'No chunk files found in out/' when nothing was rendered."},{"name":"verify-media.mjs probe loop","path":"sealcoin-promo/scripts/verify-media.mjs:26","signature":"const probe = (file) => number  // seconds","does":"Runs ffprobe with -select_streams v:0 -show_entries stream=duration and compares against the expected chunk durations with a tolerance of 1/60 s. Uses 'npx remotion ffprobe' unless FFPROBE is set to 'ffprobe'.","expected_output":"Expected 30.00 s, 30.00 s, 15.00 s for the chunks and 75.00 s for sealcoin-promo-75s.mp4; prints 'All media checks passed.' or exits 1."},{"name":"renderVideo","path":"sealcoin-promo/src/render-video.ts:90","signature":"export const renderVideo = async ({ isPackaged, outputPath, projectRoot, titleText, onUpdate, cancelSignal }) => Promise\u003cRenderResult>","does":"Inherited Electron render path: ensureBrowser, bundle or reuse the prebuilt bundle, selectComposition, renderMedia with h264, reporting progress and honouring cancellation. Not usable here because compositionId is still the template value 'HelloWorld'."}],"infra":[{"topic":"Runtime","detail":"Everything runs locally on the owner's machine (Windows paths in the docs): Remotion Studio for preview, the Remotion CLI for renders. No CI workflow, no cloud deployment, no Dockerfile in the repository.","path":"sealcoin-promo/README.md:10"},{"topic":"Version pin","detail":"remotion, @remotion/cli, @remotion/renderer and @remotion/bundler are pinned to exactly 4.0.438; react and react-dom 19.2.3; electron 40.8.0; typescript 5.9.3. An 'upgrade' script (remotion upgrade) exists but the workflow treats the pin as authoritative.","path":"sealcoin-promo/package.json:19"},{"topic":"CLI render config","detail":"remotion.config.ts sets the intermediate frame format to jpeg and overwrite-output to true. It applies to CLI and Studio only; the Node renderMedia() API ignores it.","path":"sealcoin-promo/remotion.config.ts:10"},{"topic":"ffmpeg / ffprobe selection","detail":"Scripts default to the binaries bundled with Remotion (npx remotion ffmpeg / ffprobe). Setting env FFMPEG=ffmpeg or FFPROBE=ffprobe switches to system binaries; the runbook asks to record which was used.","path":"sealcoin-promo/scripts/concat-chunks.mjs:28"},{"topic":"Browser download","detail":"The first render on a machine downloads Chrome Headless Shell and must be allowed once.","path":"workflow/CHUNK-RENDER.md:21"},{"topic":"Electron packaging (inherited)","detail":"forge.config.ts packageAfterCopy pre-bundles the Remotion project into remotion-bundle/, stages the platform compositor package into app.asar.unpacked, and packs Chrome Headless Shell only when REMOTION_ELECTRON_PACKAGE_BROWSER=true (not supported for macOS universal builds).","path":"sealcoin-promo/forge.config.ts:172"},{"topic":"Git hygiene","detail":"Root .gitignore (lines 6-8) excludes node_modules/, out/, .vite/, .specstory/ and the whole h2-promo/ directory because that folder owns its own nested git repo; the pristine copy lives outside this repo. Rendered MP4s are therefore never committed.","path":"workflow/README.md:5"},{"topic":"Vendored agent skill","detail":"skills-lock.json pins the remotion-best-practices skill (source remotion-dev/skills, github) by computed hash; the files live under .agents/skills/.","path":"skills-lock.json:4"}],"decisions":[{"decision":"Render chunks are registered compositions that window the master timeline, not separately edited videos.","why":"With \u003cSequence from={-fromFrame}> every chunk shows the same frames the master would, so chunk boundaries are pixel-continuous by construction and the split can fall anywhere, even mid-scene.","alternative_rejected":"Building or cutting each 30 s chunk as its own edit.","evidence":"workflow/README.md:25"},{"decision":"One timing source of truth: scene durations live only in remotion/manifest.ts; theme.ts holds design tokens only.","why":"The H2Evo exemplar kept a SCENES table in its theme that drifted from the real durations in the master composition. A single source plus a module-scope throw makes drift impossible to miss.","alternative_rejected":"Scene timing inside theme.ts (theme.SCENES).","evidence":"workflow/README.md:23"},{"decision":"Hard script gate: scene visuals and copy are built only from the operator's script, never inferred.","why":"Final on-screen copy must be ground truth. Until the script is provided, scenes are neutral timing stubs; once the decomposition is approved the build switches to auto-mode.","alternative_rejected":"Letting the assistant draft the narrative and copy from the website.","evidence":"workflow/SCENE-MANIFEST.template.md:6-9"},{"decision":"Every brand token and on-screen line carries provenance: VERIFIED (seen on the live site or in the script) or INFERRED (proposed, needs sign-off).","why":"Keeps observed brand facts separate from art-direction guesses; inferred values are never silently promoted and stay retunable in one file.","alternative_rejected":"An untagged token dictionary.","evidence":"workflow/README.md:22"},{"decision":"Semantic colour role names (accentPrimary / Secondary / Tertiary) instead of brand-substance names.","why":"A name like accentHydrogen does not survive a brand swap; role names let the same components serve the next brand unchanged.","alternative_rejected":"accentHydrogen-style keys from the H2Evo theme.","evidence":"workflow/README.md:24"},{"decision":"Dark canvas for the SEALCOIN video although the live site is light (white background, black text).","why":"Art-direction choice tagged inferred: standard for kinetic explainers, fits the script's ocean and night-infrastructure imagery, and lets the verified orange accent carry the brand.","alternative_rejected":"Mirroring the site's light theme.","evidence":"sealcoin-promo/docs/BRAND.md:5"},{"decision":"Procedural SVG assets only; partner names are styled text wordmarks.","why":"Assets must be parameterised, flat-filled from theme tokens, layered for independent animation and scene-agnostic; drawing a partner's logo would be fabricating brand artwork.","alternative_rejected":"Raster images or recreated partner logos.","evidence":"workflow/README.md:26"},{"decision":"When a vendored skill rule and the pinned Remotion version disagree, the pinned version wins.","why":"The remotion-best-practices rules describe newer APIs that do not exist at 4.0.438, notably Sequence premountFor, which had to be stripped from the H2Evo project.","alternative_rejected":"Following the skill rules verbatim or upgrading Remotion mid-project.","evidence":"workflow/README.md:30"},{"decision":"Render chunks with --muted and concatenate by stream copy.","why":"Without --muted Remotion embeds a silent AAC track slightly longer than the video; the concat demuxer aligns on the longest stream and leaves gaps of about three frames at each boundary. Stream copy avoids re-encoding.","alternative_rejected":"Unmuted chunk renders, or a re-encoding concat.","evidence":"workflow/CHUNK-RENDER.md:39"},{"decision":"Verify by artifacts, not exit codes, and assert on the video stream duration.","why":"A clean exit proves nothing; the MP4 with the right probed duration is the proof. Format duration includes container overhead (chunk 1 read 30.059 s) while the stream is frame-exact (30.000 s, 1800 frames).","alternative_rejected":"Trusting the render's exit status or ffprobe format=duration.","evidence":"workflow/CHUNK-RENDER.md:35-40"}],"gotchas":[{"issue":"Chunks rendered without --muted carry a silent AAC track longer than the video.","consequence":"The concatenated file gets timestamp gaps of about three frames at every boundary (75.117 s instead of 75.000 s).","fix_or_guard":"All render scripts pass --muted while the composition has no audio.","path":"sealcoin-promo/package.json:52"},{"issue":"ffprobe format=duration over-reports because of MP4 muxing overhead.","consequence":"A correct 1800-frame chunk looks like 30.059 s and fails a one-frame tolerance.","fix_or_guard":"verify-media.mjs probes -select_streams v:0 stream=duration.","path":"sealcoin-promo/scripts/verify-media.mjs:29"},{"issue":"The Electron export button is broken: render-video.ts hardcodes composition id 'HelloWorld', which Root.tsx does not register (types.ts still only holds HelloWorldProps).","consequence":"Rendering from the Electron UI fails at selectComposition.","fix_or_guard":"Render through the npm CLI scripts; the src/ tree is kept only for parity with the template.","path":"sealcoin-promo/src/render-video.ts:25"},{"issue":"Retiming is not truly one-file: verify-media.mjs repeats CHUNK_FRAMES and EXPECTED_TOTAL_FRAMES, package.json has exactly three render:chunkN scripts, and the concat output name contains '75s'.","consequence":"Changing the total length or chunk count without touching these leaves stale checks, an unrendered chunk or a misleading file name.","fix_or_guard":"Only a 'keep in sync' comment guards it; update manifest.ts (SCENES and EXPECTED_TOTAL_FRAMES), verify-media.mjs and package.json together.","path":"sealcoin-promo/scripts/verify-media.mjs:10"},{"issue":"The vendored remotion-best-practices rules use APIs missing at the 4.0.438 pin (for example Sequence premountFor, shown in .agents/skills/remotion-best-practices/rules/sequencing.md line 15).","consequence":"Code written from the skill fails type-checking; ten usages had to be stripped in the H2Evo project.","fix_or_guard":"Pinned version wins; run npm run lint before rendering.","path":"workflow/README.md:30"},{"issue":"remotion.config.ts is ignored by the Node renderMedia() API.","consequence":"Settings such as the jpeg frame format do not apply to the Electron render path.","fix_or_guard":"Pass options explicitly when using the Node API.","path":"sealcoin-promo/remotion.config.ts:2"},{"issue":"Root-level briefs are stale and mixed: Agents.md and Step2/Step4 describe the H2Evo hydrogen-water video, Step1 still says the topic is Mars, and task.md tracks an h2-promo build that is gitignored here.","consequence":"Reading the root files first gives the wrong idea of what the repository currently contains; the H2Evo code is not in this repo.","fix_or_guard":"Start from workflow/README.md and sealcoin-promo/README.md.","path":"task.md:1"},{"issue":"One benign lint warning in theme.ts: the @remotion/non-pure-animation rule pattern-matches the token name 'transition:'.","consequence":"Looks like a real finding but is a false positive.","fix_or_guard":"Documented as known and inherited from h2-promo.","path":"sealcoin-promo/README.md:27"}],"glossary":[{"term":"Remotion","meaning":"React framework where a video is a function of the current frame; compositions are rendered frame by frame in a headless browser and encoded to MP4."},{"term":"Composition","meaning":"A registered renderable video (id, component, duration, fps, size). This project registers one master and three chunks."},{"term":"Master composition","meaning":"SealcoinPromo: the full 4500-frame, 75 s timeline that all chunks window."},{"term":"Chunk","meaning":"A 1800-frame (30 s at 60 fps) window onto the master, registered as its own composition so it can be rendered separately; the last chunk may be partial."},{"term":"Manifest","meaning":"remotion/manifest.ts, the code-truth for scene and chunk timing. docs/SCENE-MANIFEST.md is only its human mirror."},{"term":"Drift guard","meaning":"The module-scope throw in manifest.ts that fires when scene durations stop summing to EXPECTED_TOTAL_FRAMES."},{"term":"Script gate","meaning":"Hard stop at stage 2: no scene visuals or copy until the operator provides the script."},{"term":"[V] / [I] provenance","meaning":"VERIFIED (observed on the live site, in computed CSS, or stated in the operator's script) versus INFERRED (proposed by the assistant, needs sign-off)."},{"term":"Brand decomposition","meaning":"The 12-section key=value token dictionary (identity, colour, type, shape, background, icons, motion, layout, scenes, assets, copy, production) written to docs/BRAND.md."},{"term":"TransitionSeries","meaning":"@remotion/transitions component that plays sequences back to back with overlapping transitions; each overlap shortens the total, hence seriesDuration."},{"term":"Script-true","meaning":"A duration taken directly from the script's timed map (seconds x 60), as opposed to an inferred or series-extended one."},{"term":"Auto-mode","meaning":"After the script is received and the decomposition approved, scenes, assets and chunked render run without stopping for review at each step."},{"term":"H2Evo / h2-promo","meaning":"The earlier hydrogen-water promo (10 s, 5 scenes) that served as exemplar and structural template; its code is outside this repo."},{"term":"PoC","meaning":"The Eco Wave Power x SEALCOIN x SEALSQ proof of concept: wave-generated energy offered to buyers through a machine-to-machine marketplace with hardware-rooted identity."},{"term":"Safe zone","meaning":"80 px margin on all sides of the 1920x1080 canvas where no critical content may sit."}],"relations":[{"project":"cloudbq","relation":"Shared business context only: its discovery docs treat SEALCOIN as one of the SEALSQ deal pipelines; this repo makes the marketing video for that same product line."},{"project":"presentation-builder","relation":"Loose parallel: both turn a brief into a visual deliverable through evidence-traced, staged artifacts, and its crm-three-scenarios brief mentions the SEALCOIN pipeline. No shared code."}],"directions":["Add audio: the scene manifest says all voice-over text is production metadata only in this pass, and task.md lists voiceover integration as future work. Chunks would then need audio-aware concat instead of --muted.","Make retiming genuinely one-file: have verify-media.mjs and the render scripts read chunk count and totals from manifest.ts (or a generated JSON) instead of repeating 1800 / 4500 and three hardcoded scripts.","Repair or remove the Electron shell: point render-video.ts at SealcoinPromo (or a chosen chunk) and drop HelloWorldProps, or delete src/ and forge config if CLI rendering is the only path.","Turn the workflow into a real scaffolder: stage 3 is currently a manual copy of h2-promo, which is not even in this repo; a template directory or generator would make the next brand video start in minutes.","Clean the root: Agents.md, Step1-4.md and task.md still describe H2Evo and Mars; move them under an exemplar folder and write a real root README (currently a single heading).","Resolve the inferred tokens: the secondary cyan, tertiary green, dark backgrounds and Inter body font are all tagged inferred and await operator sign-off."],"confidence":"high","coverage_notes":"Read in full: workflow/ (README, runbook, both templates), root workflow.md, Agents.md, Step1-4, task.md, the sealcoin-promo README, package.json, docs (BRAND, SCENE-MANIFEST, script), manifest.ts, theme.ts, Root, SealcoinPromo, SealcoinChunk, all seven components, six of eight scenes fully (identity and marketplace partly), MarketNetwork, SequenceChips, WaveField, IdentityShield, both scripts, src/main.ts, render-video.ts, remotion-bundle.ts, preload, electron-api and the forge packaging hook. Skimmed: BuyerIcon, CheckItem, HexBadge, WaveEnergyUnit, App.tsx, packaged-browser.ts, synopsis.md. Skipped: the 38 vendored skill rule files (third-party), ressources/1studio.md (a copy of Remotion's Studio docs page), package-lock.json. Single branch, single shallow commit ('Phase 6: chunked render pipeline verified frame-exact'). Nothing was executed, so the frame-exact render claims come from the runbook, not from my own check. Rendered outputs (out/) and the h2-promo exemplar code are not in the repository.","slug":"remotion-maker","code":"70","repo":"remotion-maker","visibility":"public","fork":false,"pushed_at":"2026-08-31T15:02:48Z","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","alts":[],"aliases":["remotion maker","the brand video maker","the sealcoin promo","the chunked render thing","the H2Evo video workflow","the Eco Wave Power video"],"analyzed_at":"2026-11-12","card_count":30,"shelf":7,"github":"https://github.com/Wkayaobama/remotion-maker"},{"title":"Presentation Builder fork: grounded CRM deck + citation-metagraph skill","one_liner":"Fork of an HTML deck factory, extended with an evidence-graph method where every slide number carries a claim id traced to source, locator and quote; worked case: a 27-slide CRM scenario deck.","purpose":"Upstream is a Claude Code deck factory: a script in scripts/ plus a style reference become one self-contained HTML presentation under design rules in Claude.MD. The owner's added work turns it into a grounded-presentation pipeline. For the executive deck 'Three stories, three scenarios' (WISeKey group CRM, HubSpot portal [id]) a multi-agent workflow explored six source families, ranked what was built (keep / simplify / consolidate / pay for), built an evidence metagraph, attacked every claim with two verification lenses, then rendered the deck from the graph so each number carries data-claim and data-source. It deliberately presents three scenarios (DIY, DIY + partner, HubSpot-native) without recommending one: a presentation layer, not a decision layer. The method was distilled into the reusable skill structured-citation-metagraph with two stdlib guard scripts, and a second producer converts the HTML deck to Markdown and then PowerPoint. A sequel on 2026-10-12 appended three remediation-plan slides (layers L1-L3).","domain":"Evidence-grounded presentation generation (LLM multi-agent tooling, CRM audit)","status":"active","stack":["HTML/CSS/vanilla JS (single-file deck, inline SVG)","Python 3 (stdlib guard scripts)","Python lxml (HTML to Markdown converter)","pandoc (Markdown to pptx)","Node.js + Playwright/Chromium (SVG rasterising, render QA)","Claude Code workflow script (agent / parallel / phase)","Claude Code skill (SKILL.md + references + scripts)","HubSpot MCP read-only HubSQL (as a source)","LibreOffice + pdftoppm + markitdown (pptx QA)"],"entry_points":[{"command":"Create a new presentation using @scripts/your-script.txt in the style of @style-references/your-chosen-style.html","what":"Upstream usage: a Claude Code prompt that turns a script into a single HTML deck saved in Finished Presentations/, following Claude.MD.","path":"README.md:38"},{"command":"python3 scripts/citation_graph.py --graph metagraph.json --out metagraph.md --top-n 5","what":"Run from the skill folder (a copy also sits in projects/crm-three-scenarios/). Scores co-cited node pairs, rewrites metagraph.md idempotently, and exits 2 if any planned view cites an ungrounded node (the presentation-layer guard).","path":"projects/crm-three-scenarios/citation_graph.py:189"},{"command":"python3 scripts/citation_graph.py --graph metagraph.json --dry-run [--weights 0.7 0.3]","what":"Prints the top-N neighbours of every node with combined / co / prox values, writes nothing, still runs the guard.","path":"projects/crm-three-scenarios/citation_graph.py:205"},{"command":"python3 scripts/deck_cites_check.py --graph metagraph.json --deck \u003cdeck.html|deck.md> [--strict]","what":"Skill script (.claude/skills/structured-citation-metagraph/scripts/). Checks the built deck against the graph: unknown, non-fact or refuted claim ids exit 1; --strict also fails on ids no view planned; lists every caveated claim.","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:123-127"},{"command":"node render_figures.js \"../../Finished Presentations/crm-three-scenarios.html\" figures","what":"Opens the deck in headless Chromium at 1920x1080 @2x, exhausts each slide's animations, screenshots every inline SVG of at least 200x80 px to slideNN-figK.png and writes manifest.json.","path":"projects/crm-three-scenarios/pptx/render_figures.js:2"},{"command":"python3 build_pptx.py [--pptx] [--budget N] [--reference reference.pptx]","what":"Parses the HTML deck into pandoc slide-show Markdown (crm-three-scenarios.md), chunked by an 11-line budget; --pptx also runs pandoc with the 16 pt reference template.","path":"projects/crm-three-scenarios/pptx/build_pptx.py:434"},{"command":"open Finished Presentations/crm-three-scenarios.html; Space / ArrowRight = next step, ArrowLeft = previous slide, N = notes, Home / End","what":"Runs the deck: each key press reveals the next animation step or the next slide; N opens the provenance notes panel.","path":"Finished Presentations/crm-three-scenarios.html:923"}],"architecture":[{"component":"Upstream deck factory (context only)","path":"Claude.MD","responsibility":"Design rules for script -> HTML decks: colour psychology, typography maxima (h1 max 60px), safe zones, sequential animations, keyboard controls, mandatory lead-magnet CTA for YouTube decks. scripts/, style-references/ and Finished Presentations/ are its folders.","talks_to":["Presentation agent","Design-rule QA"]},{"component":"Boundary brief","path":"projects/crm-three-scenarios/brief.md","responsibility":"The only context boundary: the request verbatim (3 scenarios, 6-row gates table, stories and images), admissible sources with provenance tags, output conventions, and section 5 for the sequel request and its tracker source.","talks_to":["Every agent","Evidence ledger"]},{"component":"Source extracts","path":"projects/crm-three-scenarios/sources","responsibility":"Text extracts of the owner's 2026 review deck and roadmap tracker, two CRM-health screenshots, and the 13-Oct remediation-plan CSV (22 task rows), copied beside the brief so locators stay repository-relative.","talks_to":["Explorers","Verifiers"]},{"component":"Explorer outputs","path":"projects/crm-three-scenarios/explore","responsibility":"One JSON per source family (hs-logic, hubspot-ruler, deck-tracker, live-crm, pricing, remediation-plan) holding items, facts and gaps; every fact has a story_link and evidence.","talks_to":["Health check","Metagraph builder"]},{"component":"Implementation health check + cost lines","path":"projects/crm-three-scenarios/implementation-health-check.md","responsibility":"15 built items ranked with exactly one verdict word each (keep, simplify, consolidate, pay_for), where each lives and what it is built on; cost-lines.md prices each scenario with provenance and a confidence tier.","talks_to":["Metagraph builder","Presentation agent"]},{"component":"Metagraph","path":"projects/crm-three-scenarios/metagraph.json","responsibility":"The evidence graph: 282 nodes, 736 edges, 25 views. Narrative nodes sit at depths 1-3, evidence_fact nodes (183: 85 confirmed, 98 caveat) at depth 4; views are the planned slides with the node ids they cite.","talks_to":["citation_graph.py","deck_cites_check.py","Presentation agent"]},{"component":"Citation scorer and guard","path":"projects/crm-three-scenarios/citation_graph.py","responsibility":"Stdlib script: co-citation x folder-proximity scores, idempotent metagraph.md with wikilinks and Co-cited tables, and the grounded-path guard that fails the run. Canonical copy in the skill at .claude/skills/structured-citation-metagraph/scripts/citation_graph.py; this project copy differs only at line 137.","talks_to":["metagraph.json","metagraph.md"]},{"component":"Deck fidelity check","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:123-127","responsibility":"Stdlib script at .claude/skills/structured-citation-metagraph/scripts/deck_cites_check.py closing the plan-to-build gap: reads data-claim ids (HTML) or ^Cxxx^ / [Cxxx] (Markdown) from the built deck and checks them against the graph.","talks_to":["metagraph.json","HTML deck"]},{"component":"Evidence ledger","path":"projects/crm-three-scenarios/evidence-ledger.md","responsibility":"One row per claim id (id, kind, claim, used by, source, locator, quote) with a Verification header (counts, refuted ids with the verifier's corrected reading) and the list of unsupported, illustrative story elements.","talks_to":["Fact-drift QA","HTML deck notes"]},{"component":"HTML deck","path":"Finished Presentations/crm-three-scenarios.html","responsibility":"27 self-contained slides, inline SVG metaphors, every number in an element with data-claim and data-source, per-slide .notes block with claim status / caveat / provenance, animation map keyed by data-view.","talks_to":["render_figures.js","build_pptx.py","deck_cites_check.py"]},{"component":"PPTX producer","path":"projects/crm-three-scenarios/pptx/build_pptx.py","responsibility":"HTML -> pandoc Markdown -> pptx. SlideConverter maps deck classes to blocks, chunk() splits by line budget, notes become speaker notes; render_figures.js supplies the PNG figures and manifest.","talks_to":["pandoc","reference.pptx","figures/manifest.json"]},{"component":"Skill: structured-citation-metagraph","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:288-313","responsibility":"Skill folder at .claude/skills/structured-citation-metagraph/: SKILL.md (roles 0-6, invariants, pitfalls), references/ (schemas, brief template, method.md, the workflow script that ran the case), scripts/ (both guards), evals/ (3 prompts).","talks_to":["Claude Code skill loader","Workflow script"]}],"data_flow":["0. Scout and brief: the orchestrator lists the repos, extracts uploaded deck and tracker text, pulls screenshots, probes the read-only HubSpot connector once, then writes brief.md with the request verbatim, tagged admissible sources and output conventions.","1. Explore: five explorers run in parallel, one per source family (Hs-Logic repo, HubSpot-Ruler repo, deck + tracker, live CRM via read-only HubSQL, public pricing), each returning items / facts / gaps validated by INVENTORY_SCHEMA and written to an explore-*.json file. Worked case: 63 items, 135 facts, 55 gaps.","2. Rank: one health-check agent reads all explorer files and writes implementation-health-check.md (15 ranked items, one verdict word each) and cost-lines.md (per-scenario cost lines with confidence).","3. Metagraph: one agent builds metagraph.json (stories and scenarios at depth 1, images and gate cells at 2, data problems / examples / projects / cost lines at 3, evidence facts at 4), plans the views, writes evidence-ledger.md, then runs citation_graph.py until the guard passes.","4. Verify: claims are sliced into batches of 8; each batch gets two verifiers in parallel (source fidelity, numeric and logical consistency). Any refuted verdict wins, else any caveat, else confirmed. First pass: 69 confirmed, 83 caveat, 4 refuted (C058, C126, C128, C146).","5. Maintain: a maintainer agent writes caveats into attrs.caveat, removes refuted claims from view cites, adds the Verification section to the ledger and re-runs the guard to exit 0.","6. Present: one agent writes the spoken script (scripts/crm-three-scenarios-script.txt) then the HTML deck from the graph: views become slides, numbers carry data-claim, caveated wording is the wording shown, deviations from the view plan are logged in notes.","7. QA loop (max 3 rounds): render, fact-drift and design-rule checks run in parallel; a fixer agent repairs blocker / major issues between rounds. Worked case: round 1 had 18 issues (5 blocking, all layout), round 2 had 16 minor.","8. Hygiene and commit: scratch paths rewritten to repository-relative, forbidden tokens scrubbed, metagraph.md regenerated, guard and idempotency re-checked.","9. PPTX: render_figures.js rasterises SVGs to PNG + manifest.json; build_pptx.py writes crm-three-scenarios.md; pandoc with reference.pptx produces the pptx (27 HTML slides -> 90 pptx slides after the sequel).","10. Sequel (2026-10-12): remediation tracker CSV added as a source, claims C158-C171 verified (1 confirmed, 13 caveat), side findings filed as C172-C187, node types plan / plan_layer and views V23-V25 added, three slides inserted before the appendices, pptx regenerated."],"key_functions":[{"name":"folder_proximity","path":"projects/crm-three-scenarios/citation_graph.py:59","signature":"def folder_proximity(a, b, chains, max_depth)","does":"Returns 1 / 2 ** (max_depth - shared_ancestor_depth): the hierarchy bonus that halves for every level two nodes do not share. It only breaks ties between equally co-cited nodes.","input_example":"max_depth = 4; dp_modelling and its own child fact C067 (shared ancestor depth 3)","expected_output":"0.5 (documented dry-run row: prox 0.500). Sibling scenarios s1_diy / s2_partner share nothing: 1/2**4 = 0.0625, printed as 0.062."},{"name":"score_pairs","path":"projects/crm-three-scenarios/citation_graph.py:73","signature":"def score_pairs(nodes, views, co, chains, max_depth, w_co, w_prox)","does":"combined = w_co * co_citation + w_prox * folder_proximity, computed only for pairs that share at least one view (not all N^2 pairs). Default weights 0.7 / 0.3.","input_example":"dp_modelling \u003c-> C067: co = 2, prox = 0.5","expected_output":"0.7*2 + 0.3*0.5 = 1.550 (method.md table); s2_partner \u003c-> s1_diy with co = 3 gives 2.119"},{"name":"build_co_citation_matrix","path":"projects/crm-three-scenarios/citation_graph.py:63","signature":"def build_co_citation_matrix(views)","does":"For each view, de-duplicates and sorts its cites and adds 1 to both (a, b) and (b, a) for every pair: co-citation = number of views (slides) citing both nodes.","input_example":"views = [{'cites': ['A','B']}, {'cites': ['A','B','C']}]","expected_output":"co[('A','B')] == 2, co[('A','C')] == 1, symmetric entries equal (by reading the loop)"},{"name":"grounded_ok","path":"projects/crm-three-scenarios/citation_graph.py:82","signature":"def grounded_ok(nodes, edges)","does":"Returns a memoised predicate: a node is grounded if it is an evidence_fact with at least one evidence entry holding source AND locator AND quote, or if a grounded_in edge leads (transitively, cycle-safe) to such a fact. Unknown ids are not grounded.","input_example":"an evidence_fact whose evidence has source and locator but an empty quote","expected_output":"False"},{"name":"guard","path":"projects/crm-three-scenarios/citation_graph.py:113","signature":"def guard(nodes, edges, views)","does":"Lists (view id, title, bad ids) for every view citing an ungrounded node. main() prints 'PRESENTATION-LAYER GUARD FAILED' on stderr and exits 2 when the list is non-empty, else prints 'guard OK'.","expected_output":"On success: guard OK: every cited node in 25 views is grounded (format string at line 223, 25 views in the committed graph)"},{"name":"render_md","path":"projects/crm-three-scenarios/citation_graph.py:131","signature":"def render_md(g, nodes, edges, views, scores, top_n, w_co, w_prox)","does":"Builds metagraph.md: a Views list, then one section per node grouped by type with attributes, an Edges list as [[wikilinks]] and a Co-cited table of the top-N scores. The file is replaced on every run, never appended."},{"name":"deck_cites_check (script body)","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:123-127","signature":"python3 deck_cites_check.py --graph G --deck D [--strict]","does":"At .claude/skills/structured-citation-metagraph/scripts/deck_cites_check.py:33. Extracts data-claim=\"Cxxx\" ids (falls back to ^Cxxx^ / [Cxxx] only when no HTML attribute matched), reports unknown, not-an-evidence-fact, refuted and unplanned ids plus a caveat roll-call. Exit 1 on unknown / non-fact / refuted; --strict also on unplanned.","expected_output":"Worked case before the sequel (method.md): 153 distinct ids shown, all planned, none refuted or unknown, 83 caveated"},{"name":"Verdict merge (workflow)","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:151-154","signature":"const resolved = meta_.claims.map(c => ...)","does":"workflow-crm-three-scenarios.js:289-294 in the skill's references/. Merges the two lenses per claim: refuted if any verdict is refuted, else caveat if any is caveat, else confirmed if at least one verdict exists, else unverified. Only non-confirmed entries go to the maintainer agent.","input_example":"source lens: confirmed; numeric lens: caveat","expected_output":"status 'caveat'"},{"name":"Verify fan-out (workflow)","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:215-218","signature":"await parallel(batches.flatMap((b, bi) => LENSES.map(l => () => agent(...))))","does":"workflow-crm-three-scenarios.js:263-284 in the skill's references/. Slices claims into batches of BATCH = 8 and runs every batch under both lenses in parallel with VERDICT_SCHEMA; the claim batch travels inline in the prompt (about 5 KB).","input_example":"156 claims","expected_output":"20 batches x 2 lenses = 40 verifier agents"},{"name":"QA loop (workflow)","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:154","signature":"while (!qaPass && round \u003c 3) { ... }","does":"workflow-crm-three-scenarios.js:398 in the skill's references/. Runs render, facts and design QA agents in parallel; passes when no blocker / major issue remains, otherwise a fixer agent repairs the deck (and script / ledger for factual issues) and the loop repeats, up to 3 rounds."},{"name":"SlideConverter.visit","path":"projects/crm-three-scenarios/pptx/build_pptx.py:204","signature":"def visit(self, el, top=False)","does":"Maps the deck's HTML vocabulary to Block objects: h1 -> slide title, svg -> image from the figure manifest, .tiles and .bars -> bullet lists, .chips -> one line, table.gates -> one table per scenario, .notes skipped (emitted later as speaker notes)."},{"name":"chunk","path":"projects/crm-three-scenarios/pptx/build_pptx.py:322","signature":"def chunk(blocks: list[Block]) -> list[dict]","does":"Groups blocks into pptx slides: a picture is alone on its slide and its caption opens the next text slide; a table is alone on its slide; text slides stay within LINES_PLAIN (11) estimated lines; a heading never ends a slide.","expected_output":"Deck level: 24 HTML slides became 74 pptx slides (method.md); 27 became 90 after the sequel (89 '## ' slides in the Markdown plus the YAML title slide)"},{"name":"build_markdown","path":"projects/crm-three-scenarios/pptx/build_pptx.py:406","signature":"def build_markdown(deck_path, figures_dir)","does":"Loads figures/manifest.json, parses every section.slide with lxml, emits a YAML title block from slide 1, then one '## ' slide per chunk titled '... (k/n)'; provenance notes go on the first pptx slide of each HTML slide. Returns (markdown, pptx slide count, HTML slide count)."},{"name":"nextAction / goToSlide (deck JS)","path":"Finished Presentations/crm-three-scenarios.html:917","signature":"function nextAction()","does":"If the current slide still has animation steps in slideAnimations[slide.dataset.view], reveals the next selector group by adding .animate-in; otherwise moves to the next slide. goToSlide resets steps and auto-reveals step 0 after 80 ms."}],"infra":[{"topic":"Deployment","detail":"No server, CI, Docker or cloud resources. Deliverables are static files committed to the repo: a self-contained HTML deck (system fonts, inline SVG, no external assets) and a .pptx in Finished Presentations/. Work lives on branch claude/affectionate-brahmagupta-r8n7t5 of a public fork.","path":"Finished Presentations/crm-three-scenarios.html:2"},{"topic":"Agent orchestration","detail":"Claude Code workflow script (skill references/workflow-crm-three-scenarios.js) with six phases (Explore, Health check, Metagraph, Verify, Presentation, QA) using phase(), log(), agent() with JSON schemas, and parallel(). Paths are placeholders (\u003cwork-dir>, \u003crepo>, \u003ccheckout>). Worked-case cost: 56 agents, 1,208 tool calls, 6.98 M tokens, 254.7 min wall clock; verification took 53 % of tokens.","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:133-154"},{"topic":"External sources used at run time","detail":"HubSpot MCP tools in read-only mode (query_crm_data HubSQL, search_properties, get_organization_details) against portal [id]; WebSearch / WebFetch for public pricing pages with as-of dates; sibling repositories Hs-Logic and HubSpot-Ruler read from disk.","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:22-32"},{"topic":"PPTX toolchain","detail":"Node with Playwright + Chromium (env var PLAYWRIGHT_MODULE points at the module when not resolvable), Python 3 with lxml, pandoc with --reference-doc reference.pptx (pandoc's own template with body 16 pt and titles 26 pt). QA used the pptx skill's validate.py, LibreOffice --convert-to pdf, pdftoppm contact sheets and markitdown.","path":"projects/crm-three-scenarios/pptx/README.md"},{"topic":"Skill packaging","detail":"Claude Code skill folder .claude/skills/structured-citation-metagraph/: SKILL.md (frontmatter name + trigger description), scripts/ (two stdlib Python guards), references/ (method, schemas, brief template, workflow) and evals/evals.json with three test prompts. Not yet run on a second project.","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:311-313"},{"topic":"Render QA","detail":"The render QA agent (workflow script, QA_CHECKS) opens the deck with Playwright at 1920x1080, 1440x900, 1366x768 and 375x667, steps through every slide and animation, and asserts no clipping, overflow or console errors (env var PLAYWRIGHT_BROWSERS_PATH locates Chromium). The deck exposes window.deckState() and window.goToSlide for this.","path":"Finished Presentations/crm-three-scenarios.html:933"}],"decisions":[{"decision":"Build a presentation layer, not a decision layer: show grounded truth against three scenarios and never recommend one.","why":"The request says the citation algorithm keeps the context that governs the scenarios; a tight boundary between desired outcome and reality yields a presentation layer rather than a decision layer. Verdict words apply to built items, never to scenarios.","alternative_rejected":"A persuasive pitch or a recommendation slide","evidence":"projects/crm-three-scenarios/brief.md:31-33"},{"decision":"A view may cite a node only if it has a grounded_in path to an evidence fact carrying source, locator and quote; the script exits non-zero otherwise.","why":"It is this gate, not the scoring, that keeps the deck honest: a story node with no grounded path cannot appear on a slide except as a labelled metaphor. A fact without the triple cannot be verified by anyone later.","alternative_rejected":"Trusting prose synthesis or relaxing the triple for 'obvious' facts","evidence":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:81-84"},{"decision":"Verify every claim before the deck is written, not after.","why":"The presentation agent writes with caveated wording already decided, so QA only has layout to fix; verifying after writing makes every refutation a slide rewrite. In the run, no QA blocker was factual.","alternative_rejected":"Write the deck first and fact-check it afterwards","evidence":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:258-262"},{"decision":"Two different verification lenses per batch (source fidelity, numeric and logical consistency) instead of N identical refuters.","why":"The two lenses found different things: the four refutations were fabrications, and the 83 caveats re-scoped numbers (partial scan, subset denominator, as-of date) rather than rejecting them, which was the real return of 3.7 M tokens.","alternative_rejected":"Several identical adversarial reviewers, or a single verifier","evidence":"proj
