enai-Logic release: re-run the Provenance one-liners, check whether the A8 logging bug is fixed, and re-stamp the version labels.","Apply the campaign to a real workbook instead of the basic_demo stand-in: design the schema the spreadsheet implies and fill the P0 defect table and P3 translation table with its actual formulas."],"confidence":"medium","coverage_notes":"Read in full: turbo3.5_excel_vba, the three diagnostic scripts, the modernization-campaign skill, and the main bodies of declarative-rules-reference, architecture-contract, change-control, failure-archaeology (index, A8-A10), research-frontier (ledger, F5) and research-methodology. Skimmed by frontmatter, headings and targeted sections only: api-contract, build-and-env, cli-and-config, data-modeling, genai-development, integration-patterns, logic-patterns, operate-and-deploy, security-model, validation-and-qa, archaeology A1-A7. api_Key.xlsm was not opened (binary workbook said to carry a key). Nothing was executed: every 'verified' statement is the library's own claim about an external ALS install, and the ALS behaviour described is upstream product behaviour, not code in this repo. Shallow clone: history, the upstream fork source and the claimed '2 legacy commits' could not be confirmed. PATH CAVEAT: the validator strips the leading dot of dot-directories, so files under .claude/ cannot be cited in path fields; such entries carry path '.' and the real path:line in [brackets] at the start of the companion text (what / responsibility / does / detail / why / fix_or_guard).","slug":"gpt3.5_vba","code":"81","repo":"GPT3.5_VBA","visibility":"public","fork":true,"pushed_at":"2026-08-28T14:04:51Z","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","alts":[],"aliases":["the GPT VBA fork","GPT in a cell","the Excel OpenAI macro","the API Logic Server skill library","apilogicserver skills","the Genai-Logic runbooks","the spreadsheet modernization campaign"],"analyzed_at":"2026-11-12","card_count":16,"shelf":8,"github":"https://github.com/Wkayaobama/GPT3.5_VBA"}],"cards":[{"id":"wkayaobama-skills:00","slug":"wkayaobama-skills","code":"0300","category":0,"rank":0,"type":"recall","level":1,"concept":"Personal Claude Code skills library","question":"What is wkayaobama-skills, and what kinds of content does it hold?","answer":"A personal library of Claude Code commands and skills: salvation plans, ETL method, PDF salvage, a rigor hook.","explanation":"A command is what you ask Claude to read; skills are pulled in on demand (see 40). Only the PDF salvage skill ships Node and Python scripts; the rigor skill ships one PowerShell hook; the rest is methodology text.","anchor":"A toolbox that travels in the car boot: at each garage you open only the drawer the job needs and never tip the whole box out.","evidence_quote":"Personal skills and commands for Claude Code.","tags":["skills-library"],"source_refs":[{"path":"README.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":1,"end":3},{"path":"README.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":46,"end":60}]},{"id":"wkayaobama-skills:01","slug":"wkayaobama-skills","code":"0301","category":0,"rank":1,"type":"recall","level":1,"concept":"CLAUDE__ROOT absolute root","question":"Which single environment variable makes wkayaobama-skills portable from one machine to the next?","answer":"`CLAUDE__ROOT` (TWO underscores): set once per machine; every skill and command path starts from it.","explanation":"The maintenance rules forbid relative paths in skill files. Breaks if unset: every `${CLAUDE__ROOT}/...` reference inside a command resolves to nothing.","example":"export CLAUDE__ROOT=\"$HOME/Documents/wkayaobama-skills\"  # once, in ~/.bashrc","evidence_quote":"All skill files use `${CLAUDE__ROOT}` as the absolute root. Set once per machine.","tags":["env-var","portability"],"source_refs":[{"path":"README.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":5,"end":17},{"path":"skills/github-deployment/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":155}]},{"id":"wkayaobama-skills:10","slug":"wkayaobama-skills","code":"0310","category":1,"rank":0,"type":"recall","level":1,"concept":"Per-corpus config.json","question":"Which file holds everything corpus-specific in wkayaobama-skills' PDF salvage, so `build.js` never changes per document family?","answer":"`config.json`, one per corpus: labels, regex, thresholds, style, badge highlights, meta.","explanation":"A wrong classification is fixed by adding a label or a regex there, never by editing `build.js`. Not fully true yet: `preview.js` still hard-codes one corpus's page title.","example":"node build.js raw.json config.json output.docx  # same script, another corpus = another config","confusables":"`raw.json` — it is the stage-1 DUMP of text items and path boxes produced by `parse.js`; `config.json` is AUTHORED by hand per corpus.","evidence_quote":"**Don't make `build.js` smarter to fit one corpus.** Add a regex or label to that corpus's `config.json` instead. The script should stay corpus-agnostic.","tags":["config-contract","corpus-agnostic"],"source_refs":[{"path":"skills/salvage-pdf-to-word/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":192,"end":198},{"path":"skills/salvage-pdf-to-word/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":105,"end":108},{"path":"skills/salvage-pdf-to-word/scripts/build.js","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":43},{"path":"skills/salvage-pdf-to-word/scripts/preview.js","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":43}]},{"id":"wkayaobama-skills:11","slug":"wkayaobama-skills","code":"0311","category":1,"rank":1,"type":"cloze","level":1,"concept":"Four buckets file classification","question":"wkayaobama-skills · pipeline-salvation: complete the four buckets into which a salvation plan classifies every file.","answer":"REWRITE-MINIMAL · DEFER","explanation":"KEEP powers the runnable core; REWRITE-MINIMAL is boundary cleanup only (say WHAT changes, not 'refactor'); DEFER is useful later; DROP is noise. Every file of the main package goes into exactly one.","confusables":"cf. [private project] skills/pipeline-salvation: the GENERIC variant of the same four buckets; the copy here adds separate tables per system (Python layer and Workflowps).","cloze":"KEEP · {{c1::REWRITE-MINIMAL}} · {{c1::DEFER}} · DROP","evidence_quote":"3. **Four Buckets** — Keep / Rewrite-minimal / Defer / Drop (separate tables per system)","tags":["per-docs","four-buckets"],"source_refs":[{"path":"commands/write_plan.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":93},{"path":"skills/pipeline-salvation/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":95,"end":113}]},{"id":"wkayaobama-skills:20","slug":"wkayaobama-skills","code":"0320","category":2,"rank":0,"type":"trace","level":3,"concept":"Four-stage PDF salvage flow","question":"wkayaobama-skills · salvage-pdf-to-word: recite the 5 script runs from the source PDF to `preview.html`.","answer":"parse · render · slice · build · preview","explanation":"Stage 2 is two scripts (render, then slice). You then iterate build -> preview on `config.json` until the preview matches the slices; `output.ir.json` tells a classification error from an emission error. Stage 1 carries a latent, unconfirmed crash: see 91.","anchor":"A tailor unpicks a coat into numbered pieces, pins a photo of it on the wall in strips, sews a new coat from the pieces, then tries it on facing the photo.","steps":["`node parse.js \u003cinput.pdf> \u003cout-dir>` -> `raw.json` + `raw.stats.json` (top-left coords)","`render_canvas.py \u003cpdf> \u003cout_png>` -> PNG of the first page, 50 DPI by default","`slice_canvas.py \u003cin_png> \u003cout_dir>` -> 6 horizontal bands by default: the ground truth","`node build.js \u003craw.json> \u003cconfig.json> \u003coutput.docx>` -> the DOCX + `output.ir.json`","`node preview.js \u003coutput.docx> \u003cpreview.html>` -> HTML preview through mammoth"],"evidence_quote":"PDF ─► (1) parse.js ─► raw.json (text items + rect ops, top-left coords) (2) render_canvas.py + slice_canvas.py ─► PNG bands for visual reference (3) build.js + config.json ─► output.docx + output.ir.json (IR for review)","tags":["pdf-salvage","pipeline-order"],"source_refs":[{"path":"skills/salvage-pdf-to-word/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":49,"end":101},{"path":"skills/salvage-pdf-to-word/scripts/build.js","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":632,"end":640},{"path":"skills/salvage-pdf-to-word/scripts/render_canvas.py","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":14,"end":17},{"path":"skills/salvage-pdf-to-word/scripts/slice_canvas.py","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":14}]},{"id":"wkayaobama-skills:21","slug":"wkayaobama-skills","code":"0321","category":2,"rank":1,"type":"recall","level":1,"concept":"Probe ladder Level 5","question":"At which level of wkayaobama-skills' probe ladder does a live production write happen, and what does it require?","answer":"Level 5, the LAST: explicit human approval, no exceptions; levels are never skipped.","explanation":"Ascending risk: 1 local contract tests, 2 dry run or server start, 3 read-only live probe, 4 full staging run, 5 approved live. `execute_plan` runs levels 1 to 4 itself and stops before 5.","confusables":"cf. [private project] skills/pipeline-salvation Probe Discipline: also five steps ending in an approved live run, but its step 2 is GENERATED ARTIFACTS; here level 2 is a DRY RUN or server start.","evidence_quote":"| 5 | Approved live | Requires explicit human approval. No exceptions. |","tags":["per-docs","probe-ladder"],"source_refs":[{"path":"skills/pipeline-salvation/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":174,"end":184},{"path":"commands/write_plan.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":102,"end":112},{"path":"commands/execute_plan.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":75}]},{"id":"wkayaobama-skills:30","slug":"wkayaobama-skills","code":"0330","category":3,"rank":0,"type":"locate","level":1,"concept":"write_plan entry command","question":"Which command file of wkayaobama-skills do you ask Claude to read and follow first, before touching code on a multi-step task?","answer":"`commands/write_plan.md`: it writes a salvation plan and saves it under `~/.claude/plans/`.","explanation":"Trap: its Step 0 reads `${CLAUDE__ROOT}/dashboard/...` and `${CLAUDE__ROOT}/Workflowps/...`; neither directory exists in this repository, so that step only resolves inside the source project's layout.","example":"Read and follow `${CLAUDE__ROOT}/commands/write_plan.md`  # plan -> ~/.claude/plans/YYYY-MM-DD-\u003cfeature-name>.md","confusables":"`commands/execute_plan.md` — it EXECUTES an existing plan checkpoint by checkpoint; `write_plan.md` only WRITES the plan and touches no code.","evidence_quote":"| `commands/write_plan.md` | Before touching code on a multi-step task |","tags":["entry-point","drift"],"source_refs":[{"path":"README.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":52},{"path":"README.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":62,"end":68},{"path":"commands/write_plan.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":15,"end":20},{"path":"commands/write_plan.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":28,"end":35}]},{"id":"wkayaobama-skills:31","slug":"wkayaobama-skills","code":"0331","category":3,"rank":1,"type":"output","level":3,"concept":"classifyLine() banner priority","question":"wkayaobama-skills · `classifyLine` in `build.js`: predict the `kind` returned by the call below.","answer":"`banner-heading` — the font-size test runs BEFORE every regex, so a big line is a banner even when its text matches `formHeading`.","explanation":"(1) `t` is non-empty, so not `empty`. (2) 32 >= 30, so the function returns at once. (3) The `formHeading` test below is never reached. At font size 11 the same text would be `form-heading`.","confusables":"`form-heading` — decided by the `formHeading` REGEX on the text; `banner-heading` is decided by FONT SIZE alone and is tested first.","code_snippet":"// TH.bannerFontSize = 30 (default)\n// cfg.regex.formHeading = \"^(AA|BB)\\\\d+[a-z]?\\\\.\\\\s+\"\nfunction classifyLine(line) {\n  const t = line.text;\n  if (!t) return { kind: \"empty\" };\n  if (line.fontSize >= TH.bannerFontSize) {\n    return { kind: \"banner-heading\", text: t };\n  }\n  // ... formHeading, procSection, labels, procItem, body\n}\nclassifyLine({ text: \"AA12. Objectif\", fontSize: 32, items: [] }).kind","expected_output":"banner-heading","evidence_quote":"if (line.fontSize >= TH.bannerFontSize) {","tags":["grounded:logic","classification-order"],"source_refs":[{"path":"skills/salvage-pdf-to-word/scripts/build.js","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":146,"end":160},{"path":"skills/salvage-pdf-to-word/scripts/build.js","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":63,"end":66},{"path":"skills/salvage-pdf-to-word/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":114}]},{"id":"wkayaobama-skills:40","slug":"wkayaobama-skills","code":"0340","category":4,"rank":0,"type":"compare","level":2,"concept":"Command file","question":"wkayaobama-skills: a command (`commands/*.md`) vs a skill (`skills/\u003cname>/SKILL.md`): what is the ONE difference?","answer":"A command is what you ASK Claude to read and follow; a skill is a methodology reference that the command PULLS IN by its `${CLAUDE__ROOT}` path when needed.","explanation":"Hence the rule not to load all skills into every session. Breaks if undone: every session carries the whole library as context.","anchor":"You hand the cook one recipe card; the card itself sends him to fetch only the jars it names from the shelf.","confusables":"skill (`SKILL.md`) — it is REFERENCED from inside a command; a command is INVOKED directly by the owner.","evidence_quote":"**Do not load all skills into every session.** Each skill is referenced from within a command when needed.","tags":["command-vs-skill"],"source_refs":[{"path":"README.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":46,"end":68}]},{"id":"wkayaobama-skills:50","slug":"wkayaobama-skills","code":"0350","category":5,"rank":0,"type":"recall","level":1,"concept":"UserPromptSubmit rigor hook","question":"Which Claude Code hook event runs wkayaobama-skills' `rigor-reminder.ps1`?","answer":"`UserPromptSubmit`: the seven-point checklist is injected BEFORE the assistant answers.","explanation":"The settings entry attaches a `matcher` regex of decision words (recommend, compare, vs, design ...) and a 5-second timeout; per the skill, only matching prompts get the checklist.","confusables":"`PreToolUse` (Option 2, not enabled) — it BLOCKS tool calls until sequential thinking has run; `UserPromptSubmit` only INJECTS a reminder.","evidence_quote":"# Wired in ~/.claude/settings.json under \"hooks\" -> \"UserPromptSubmit\".","tags":["per-docs","hook-event"],"source_refs":[{"path":"skills/production-discipline/hooks/rigor-reminder.ps1","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":1,"end":4},{"path":"skills/production-discipline/references/settings-snippet.json","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":3,"end":12}]},{"id":"wkayaobama-skills:60","slug":"wkayaobama-skills","code":"0360","category":6,"rank":0,"type":"why","level":2,"concept":"Harness hook over memory rule","question":"Why does wkayaobama-skills enforce the rigor checklist with a harness hook rather than a memory or `CLAUDE.md` rule?","answer":"The memory rule already existed and the assistant still skipped it; a hook injects the checklist MECHANICALLY, whatever the assistant chooses to recall.","explanation":"Breaks if undone: back to the cycle where the owner pushes back, the assistant acknowledges the rule, and skips it again next session. The hook enforces the PROCESS only; the assistant may still ignore the injected text (see 99).","anchor":"A note pinned in the corridor that everyone walks past, replaced by a doorman who puts the note in your hand each time you come in.","confusables":"memory / `CLAUDE.md` rule — it depends on the assistant CHOOSING to apply it; the hook fires in the harness regardless.","evidence_quote":"Memory-only enforcement is insufficient — the rule existed in the project's `feedback_research_rigor.md` and the assistant still skipped it. The harness must enforce it mechanically.","tags":["rigor-gate"],"source_refs":[{"path":"skills/production-discipline/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":22,"end":26},{"path":"skills/production-discipline/references/settings-snippet.json","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":3,"end":12}]},{"id":"wkayaobama-skills:61","slug":"wkayaobama-skills","code":"0361","category":6,"rank":1,"type":"why","level":2,"concept":"Rebuild from positions, not tags","question":"Why does wkayaobama-skills' salvage-pdf-to-word rebuild structure from positions and vector operators rather than trust the PDF's tags, as `pdf2docx` does?","answer":"In forms and flat PDFs the structure is VISUAL only (position, font size, proximity); a tag-trusting converter returns flat paragraphs in scan order.","explanation":"`pdfjs-dist` exposes both `getTextContent()` and `getOperatorList()`, enough to rebuild lines and blocks. Breaks if undone: two-column form rows and checkbox lists are flattened. For a clean, tagged PDF the cheap converter is still tried first.","anchor":"A form shredded on the floor: you ignore the label on its folder and rebuild the page from where each scrap landed and how big its letters are.","confusables":"`pdf2docx` / Acrobat export — they ASSUME the PDF carries tagged structure; the salvage scripts IGNORE tags.","evidence_quote":"Salvage flips the strategy: ignore tags, rebuild structure from positions.","tags":["pdf-salvage"],"source_refs":[{"path":"skills/salvage-pdf-to-word/references/methodology.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":3,"end":12},{"path":"skills/salvage-pdf-to-word/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":194},{"path":"skills/salvage-pdf-to-word/scripts/parse.js","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":92,"end":120}]},{"id":"wkayaobama-skills:90","slug":"wkayaobama-skills","code":"0390","category":9,"rank":0,"type":"recall","level":2,"concept":"Hook smoke check","question":"After installing wkayaobama-skills' rigor hook, how do you check that it fires, and what is the passing sign?","answer":"Restart Claude Code and send a prompt containing a trigger word such as \"recommend\"; the status line briefly shows `Injecting rigor discipline reminder...`.","explanation":"Hooks are loaded at startup, hence the restart. No automated test is committed; for the PDF scripts the check is visual: the preview against the slices.","confusables":"cf. [private project] claude/settings.json: the INSTALLED hook entry with the same matcher; this repository holds only the SNIPPET to merge.","evidence_quote":"\"statusMessage\": \"Injecting rigor discipline reminder...\"","tags":["per-docs","smoke-check"],"source_refs":[{"path":"skills/production-discipline/references/settings-snippet.json","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":9,"end":11},{"path":"skills/production-discipline/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":96,"end":98}]},{"id":"wkayaobama-skills:91","slug":"wkayaobama-skills","code":"0391","category":9,"rank":1,"type":"locate","level":3,"concept":"pendingRects ReferenceError","question":"wkayaobama-skills · stage 1 of the PDF salvage stops with `ReferenceError: pendingRects is not defined`. Which statement raised it, and what is the fix?","answer":"`pendingRects = [];` in the `OPS.endPath` case of `parse()` in `parse.js` — the declared variable is `pendingPaths`; an ES module is strict, so assigning an undeclared name THROWS. Fix: `pendingPaths = [];`.","explanation":"Derived by reading, not by running: `scripts/package.json` sets `\"type\": \"module\"`, and the only declaration is `let pendingPaths = [];`. It fires the first time a no-paint (clipping) path reaches `endPath`.","code_snippet":"case OPS.endPath:\n  // discard pending rects (clipping/no-paint path)\n  pendingRects = [];\n  break;","evidence_quote":"pendingRects = [];","tags":["trap","inferred"],"source_refs":[{"path":"skills/salvage-pdf-to-word/scripts/parse.js","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":229,"end":232},{"path":"skills/salvage-pdf-to-word/scripts/parse.js","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":128},{"path":"skills/salvage-pdf-to-word/scripts/package.json","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":5}]},{"id":"wkayaobama-skills:92","slug":"wkayaobama-skills","code":"0392","category":9,"rank":2,"type":"recall","level":2,"concept":"First page only","question":"wkayaobama-skills' salvage-pdf-to-word SKILL.md accepts single- or multi-page PDFs; how many pages does `parse.js` actually read?","answer":"ONE: `pdf.getPage(1)`. Later pages are silently ignored, and `render_canvas.py` likewise renders only `pdf[0]`.","explanation":"The scripts were written for one very tall canvas page (`slice_canvas.py` even uncaps Pillow's pixel limit), which hides the gap. Fix: loop over pages with a per-page y offset.","evidence_quote":"const page = await pdf.getPage(1);","tags":["drift"],"source_refs":[{"path":"skills/salvage-pdf-to-word/scripts/parse.js","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":80,"end":83},{"path":"skills/salvage-pdf-to-word/scripts/render_canvas.py","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":15,"end":16},{"path":"skills/salvage-pdf-to-word/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":39}]},{"id":"wkayaobama-skills:99","slug":"wkayaobama-skills","code":"0399","category":9,"rank":9,"type":"scenario","level":4,"concept":"Escalating to Option 2","question":"wkayaobama-skills: the soft rigor reminder (Option 1) keeps being ignored and you decide to escalate to the blocking `PreToolUse` hook (Option 2). What do you verify first, what is the risk, and how do you roll back?","answer":"Verify the hook's stdin JSON BEFORE enforcing. (1) The blocking script ASSUMES fields `tool_name` and `tool_use_history`; first run the diagnostic variant that only logs the JSON. (2) Risk: if the allowlist check fails, the sequential-thinking call itself is blocked, a deadlock. (3) Rollback: remove the `PreToolUse` and `Stop` blocks from `~/.claude/settings.json`; Option 1 keeps firing.","explanation":"This is the documented next step of the rigor gate: Option 2 costs three scripts, three settings entries and a marker-file lifecycle, so it stays deferred until Option 1 is shown to be insufficient. See 60.","confusables":"Option 1 (`UserPromptSubmit` reminder) — SOFT: the reminder is injected and may be ignored; Option 2 is HARD: the tool call is blocked.","evidence_quote":"The exact shape of the JSON delivered to PreToolUse hooks via stdin should be verified against the Claude Code hook documentation before enabling.","tags":["per-docs","resume","rigor-gate"],"source_refs":[{"path":"skills/production-discipline/hooks/RIGOR_HOOK_OPTION_2.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":141,"end":150},{"path":"skills/production-discipline/hooks/RIGOR_HOOK_OPTION_2.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":130,"end":139},{"path":"skills/production-discipline/hooks/RIGOR_HOOK_OPTION_2.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":3,"end":11},{"path":"skills/production-discipline/SKILL.md","branch":"master","commit":"5bb549447b96c74710a571242b7bcf72dd5b698e","line":102,"end":116}]},{"id":"rsync_hubspot:00","slug":"rsync_hubspot","code":"1300","category":0,"rank":0,"type":"recall","level":1,"concept":"mr-load plan scaffold","question":"rsync_hubspot: what is `mr-load/`, the one directory this rsync fork was made for?","answer":"The PLAN and Phase-5 skeletons for loading the Miraex estate into HubSpot, replicating the icalps loading system.","explanation":"Miraex = legacy CRM entities plus a document library that exists only as a Google Drive account with no index. The upstream rsync C sources are unrelated. Only the rclone sync, the path indexer and the staging DDL are code; every other phase is a plan.","anchor":"A borrowed toolbox full of someone else's file-copy tools; taped under the lid is your own hand-drawn map for carrying one firm's archive into the CRM.","confusables":"cf. [private project]: the SUCCESSOR repo where the Miraex load was actually built; rsync_hubspot holds only the plan and the Phase-5 skeletons.","evidence_quote":"`mr-load` replicates the proven **icalps loading system** for a new source estate","tags":["per-docs"],"source_refs":[{"path":"mr-load/README.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":3,"end":11},{"path":"mr-load/README.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":44,"end":54}]},{"id":"rsync_hubspot:01","slug":"rsync_hubspot","code":"1301","category":0,"rank":1,"type":"recall","level":1,"concept":"Gate before live write","question":"rsync_hubspot (mr-load): which one-sentence safety invariant governs every phase of the plan?","answer":"NOTHING writes to the live portal without passing its phase gate; every run is a dry-run by default.","explanation":"Inherited from icalps as non-negotiable: dry-run default, preview == execution, ledgers everywhere, sandbox-first, portal constants discovered and never copied. The one executable instance here is the sync script's `--live` switch (see 30).","evidence_quote":"Nothing writes to the live portal without passing its gates.","tags":["per-docs","dry-run-default"],"source_refs":[{"path":"mr-load/PLAN.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":5},{"path":"mr-load/README.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":56,"end":67}]},{"id":"rsync_hubspot:20","slug":"rsync_hubspot","code":"1320","category":2,"rank":0,"type":"trace","level":3,"concept":"Seven-phase sequential flow","question":"rsync_hubspot · mr-load plan: recite the 7 phases from Phase 0 to Phase 6 in execution order.","answer":"foundations · companies · fair contacts · associations · deals · library · two-way sync","explanation":"Phase 0 is run by the operator and blocks every agent team. Parents (companies, contacts) load before the links, and the library comes late because each file needs a loaded company to attach to. Only Phase 5 steps 1-2 have runnable scripts here (the staging DDL is declared, with no loader).","anchor":"Moving day into a new tower: pour the slab, seat the firms, let in the expo visitors, string badges between them, wheel in the contracts, shelve the archive, switch on a lift that runs both ways.","steps":["Phase 0 Foundations -> write path fixed, `miraex_*` id properties, staging schema, sandbox","Phase 1 Companies -> every legacy company loaded once, checked against duplicates","Phase 2 Fair contacts -> loaded without dedup, idempotent through a deterministic key","Phase 3 Associations -> cardinality and blast radius assessed BEFORE any link is written","Phase 4 Deals -> loaded only after the property set and pipeline/stage IDs exist","Phase 5 Library -> rclone mirror, path index, file-to-company FK, two-phase upload","Phase 6 Two-way sync -> internal sync independent of the vendor mirror, shadow mode first"],"evidence_quote":"7. **Phase 6 — Internal two-way sync**: if the above succeeds, it becomes the ground","tags":["per-docs"],"source_refs":[{"path":"mr-load/README.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":18,"end":36},{"path":"mr-load/AGENTS.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":20,"end":27},{"path":"mr-load/PLAN.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":212,"end":228}]},{"id":"rsync_hubspot:21","slug":"rsync_hubspot","code":"1321","category":2,"rank":1,"type":"locate","level":1,"concept":"map_folder_company lookup table","question":"Which table in rsync_hubspot (mr-load) is declared to resolve a file's top-level folder name to a `miraex_company_id`?","answer":"`map_folder_company` — curated, PK `(tree, company_key_raw)`; unresolved folders are SKIPPED, never guessed.","explanation":"Folder names alias across trees (`YYYY_` prefixes, trailing spaces), so pure fuzzy matching is unsafe (Q4). DESIGN TARGET: the table is declared in `init_silver_library.sql`, but the resolver that fills `stg_library_normalised.miraex_company_id` is not in the repository.","confusables":"`stg_library_normalised` — one row per FILE, with `company_key_raw` as found on disk; `map_folder_company` holds one reviewed row per FOLDER name.","evidence_quote":"makes a reviewed table mandatory; unresolved folders are -- skipped and reported, never guessed","tags":["folder-company-fk"],"source_refs":[{"path":"mr-load/scripts/indexer/init_silver_library.sql","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":38,"end":49},{"path":"mr-load/BINDING-QUESTIONS.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":57,"end":61}]},{"id":"rsync_hubspot:30","slug":"rsync_hubspot","code":"1330","category":3,"rank":0,"type":"locate","level":1,"concept":"sync_miraex_drive.sh entry point","question":"Which script in rsync_hubspot (mr-load) mirrors the Drive trees to local disk, the first command of Phase 5?","answer":"`mr-load/scripts/rclone/sync_miraex_drive.sh` — a DRY-RUN diff unless you pass `--live`.","explanation":"`--dry-run` is appended to the rclone flags unless `--live` was parsed. `MRLOAD_LOCAL_ROOT` is mandatory: the script aborts when it is unset. Each tree lands in `$MRLOAD_LOCAL_ROOT/\u003ctree>` with one timestamped log.","anchor":"A photocopier that first prints only the list of pages it WOULD copy, and feeds paper only when you press the green button.","example":"./sync_miraex_drive.sh --tree companies  # dry-run diff to review / ./sync_miraex_drive.sh --tree companies --live  # real rclone sync","confusables":"`walk_index.py` — runs AFTER the mirror exists and only reads local disk; `sync_miraex_drive.sh` is the only script that talks to Drive.","evidence_quote":"[ \"$LIVE\" -eq 1 ] || FLAGS+=(--dry-run)","tags":["dry-run-default"],"source_refs":[{"path":"mr-load/scripts/rclone/sync_miraex_drive.sh","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":4,"end":12},{"path":"mr-load/scripts/rclone/sync_miraex_drive.sh","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":52,"end":61}]},{"id":"rsync_hubspot:31","slug":"rsync_hubspot","code":"1331","category":3,"rank":1,"type":"output","level":3,"concept":"walk() index row","question":"rsync_hubspot · `walk()` in `walk_index.py`: predict the values of `path_segments`, `depth` and `company_key_raw` in the row yielded for the file below.","answer":"`'Acme|Contracts'`, `2`, `'Acme'` — the directory segments are joined with `|`, depth counts DIRECTORIES only, and the top-level folder is taken as the company key.","explanation":"(1) `segments` = Acme, Contracts, nda.pdf. (2) `segments[:-1]` drops the file name, giving Acme|Contracts. (3) 3 - 1 = 2. (4) More than one segment, so `segments[0]`. Edge: a file directly at the tree root gets depth 0 and an EMPTY company key, so it cannot be linked.","code_snippet":"# file on disk: \u003croot>/Acme/Contracts/nda.pdf\n# call: walk(root, \"companies\")\nrel = path.relative_to(root)\nrelposix = rel.as_posix()\nsegments = relposix.split(\"/\")\n# ...\nyield {\n    # ...\n    \"path_segments\": \"|\".join(segments[:-1]),\n    \"depth\": len(segments) - 1,\n    \"company_key_raw\": segments[0] if len(segments) > 1 else \"\",\n}","expected_output":"path_segments: 'Acme|Contracts'\ndepth: 2\ncompany_key_raw: 'Acme'","evidence_quote":"\"company_key_raw\": segments[0] if len(segments) > 1 else \"\",","tags":["grounded:logic","path-index"],"source_refs":[{"path":"mr-load/scripts/indexer/walk_index.py","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":61,"end":87}]},{"id":"rsync_hubspot:40","slug":"rsync_hubspot","code":"1340","category":4,"rank":0,"type":"compare","level":2,"concept":"rclone exclude.txt filter","question":"rsync_hubspot (mr-load): rclone's `exclude.txt` vs the indexer's `excluded` column: what is the ONE difference?","answer":"`exclude.txt` makes rclone SKIP the file, so it never reaches the local mirror; `excluded` only FLAGS a mirrored file (`ext` or `oversize`), which still gets its index row.","explanation":"The two lists overlap (`desktop.ini`, `Thumbs.db`, `.DS_Store`, `*.tmp`, `*.lnk`), so the flag also catches junk that reached the mirror anyway, and it is the only home of the 100 MiB size guard. The summary line counts flagged rows as excluded, not loadable.","anchor":"At the door a bouncer turns junk away on the pavement; inside, a clerk writes every guest in the book but pins a red tag on those who may not go upstairs.","confusables":"`excluded` column — `exclude.txt` removes a file BEFORE the mirror; `excluded` marks a row that stays in the index as not loadable.","evidence_quote":"loadable = sum(1 for r in rows if not r[\"excluded\"])","tags":["exclusion-policy"],"source_refs":[{"path":"mr-load/scripts/indexer/walk_index.py","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":69,"end":73},{"path":"mr-load/scripts/indexer/walk_index.py","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":104,"end":111},{"path":"mr-load/scripts/rclone/sync_miraex_drive.sh","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":48},{"path":"mr-load/scripts/rclone/exclude.txt","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":1,"end":8}]},{"id":"rsync_hubspot:60","slug":"rsync_hubspot","code":"1360","category":6,"rank":0,"type":"why","level":2,"concept":"rclone mirror before indexing","question":"Why does rsync_hubspot's mr-load mirror the Drive tree to local disk with rclone first rather than download the Drive files directly?","answer":"A direct download would NOT preserve parts of the folder hierarchy, and the hierarchy is the only metadata there is: the index and each file's company link are derived by walking it.","explanation":"icalps got per-file metadata (path, file name, CRM FKs) from a legacy database; Miraex has only a Drive account, so the walked mirror replaces that contract. The replica is also a safety net for messy data and the seedbed of Phase 6. Breaks if undone: no stable paths, so no `company_key_raw` and no file-to-company FK.","anchor":"Emptying a filing cabinet into one sack: every sheet arrives, but nobody can say which drawer, and so which client, it came from.","confusables":"cf. [private project] `dfs_entries`: the successor walks the Drive API depth-first and REPLACED the rclone mirror; here the tree is first copied to local disk.","evidence_quote":"Drive directly would not preserve parts of the hierarchical structure we want to keep","tags":["per-docs","drive-mirror"],"source_refs":[{"path":"mr-load/README.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":38,"end":42},{"path":"mr-load/README.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":5,"end":11},{"path":"mr-load/scripts/rclone/sync_miraex_drive.sh","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":54,"end":61}]},{"id":"rsync_hubspot:61","slug":"rsync_hubspot","code":"1361","category":6,"rank":1,"type":"why","level":2,"concept":"Tree-prefixed miraex_doc_id","question":"Why does rsync_hubspot's `walk_index.py` hash `tree/relpath` into `miraex_doc_id` rather than the relative path alone, as the icalps walker did?","answer":"Identical relative paths in DIFFERENT trees would collide on one id, and that id is the primary key of the path index and of both upload ledgers.","explanation":"`walk()` passes the tree name, a slash and the relative posix path to `synthetic_id()`, which returns `fs:` plus the first 12 hex characters of the SHA-1, stable across re-runs. Breaks if undone: a file under opportunities collides with the same-path file under companies. Drift on this formula: see 91.","anchor":"Two cloakrooms both hand out ticket 12 for different coats; stamp the room's name on every ticket and the mix-up cannot happen.","confusables":"cf. ic-load `walker.py` `fs:\u003csha1(relpath)[:12]>`: hashes the relative path ALONE, which is safe only when there is a single tree.","evidence_quote":"the tree prefixed so identical relative paths in different trees cannot collide","tags":["synthetic-id"],"source_refs":[{"path":"mr-load/scripts/indexer/walk_index.py","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":4,"end":9},{"path":"mr-load/scripts/indexer/walk_index.py","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":57,"end":58},{"path":"mr-load/scripts/indexer/walk_index.py","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":75},{"path":"mr-load/scripts/indexer/init_silver_library.sql","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":19},{"path":"mr-load/scripts/indexer/init_silver_library.sql","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":54,"end":66}]},{"id":"rsync_hubspot:62","slug":"rsync_hubspot","code":"1362","category":6,"rank":2,"type":"recall","level":1,"concept":"Q1 hybrid write path","question":"Which write path did rsync_hubspot's mr-load plan choose for binding question Q1?","answer":"HYBRID, as in icalps: companies/contacts/deals via mirror-Postgres upserts; library files/notes via direct API + ledger.","explanation":"Q1 is the biggest fork: it binds the whole gold layer, the association mechanism and the checkpoint stage. Consequence: a sync connection for the Miraex objects must exist, and its mirror record-id columns are DISCOVERED in Phase 0, never copied.","confusables":"Pure direct API — everything through batch upsert and per-object ledgers; the hybrid keeps the mirror for CRM OBJECTS and uses the API only for files and notes.","evidence_quote":"**Hybrid, like icalps** — mirror-Postgres upserts for","tags":["per-docs","write-path"],"source_refs":[{"path":"mr-load/BINDING-QUESTIONS.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":7,"end":19},{"path":"mr-load/PLAN.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":14,"end":19}]},{"id":"rsync_hubspot:70","slug":"rsync_hubspot","code":"1370","category":7,"rank":0,"type":"recall","level":1,"concept":"Two-phase upload ledgers","question":"rsync_hubspot (mr-load): which two ledger tables are declared to make a re-run of the two-phase library upload a no-op?","answer":"`fct_files_uploaded` (file upload) and `fct_file_notes_posted` (note + association), both keyed by `miraex_doc_id`.","explanation":"Re-runs skip rows that already succeeded; `unmigrate` reads `status='attached'` as its rollback index. DESIGN TARGET: only the DDL exists here, the uploader that writes the ledgers is not in the repository.","anchor":"A courier with two receipt books: one stamp when the parcel is dropped at the depot, a second when it is pinned to the right door; a stamped line is never walked twice.","confusables":"cf. [private project] `SqliteLedger`: the successor keeps its ledger in a local SQLITE file; here both ledgers are Postgres tables in the staging schema.","evidence_quote":"upload, phase 2 note+association. Re-runs skip rows already succeeded;","tags":["idempotency"],"source_refs":[{"path":"mr-load/scripts/indexer/init_silver_library.sql","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":51,"end":75}]},{"id":"rsync_hubspot:80","slug":"rsync_hubspot","code":"1380","category":8,"rank":0,"type":"recall","level":2,"concept":"One rclone remote per tree","question":"What makes the rclone setup of rsync_hubspot's mr-load able to reach Drive trees that are shared item by item?","answer":"One rclone remote PER tree, each with its own `root_folder_id`: item-shared trees have no visible parent, so a single remote for the whole drive could not reach them.","explanation":"`TREES` maps companies, opportunities and tradeshows to the remotes `miraex-companies:`, `miraex-opportunities:` and `miraex-tradeshows:`. Every remote is `type = drive` with the read-only scope; the filled `rclone.conf` is git-ignored.","anchor":"The front entrance of the archive is bricked up, so each wing gets its own side door and its own key.","example":"[miraex-companies] / type = drive / scope = drive.readonly / root_folder_id = FILL_ME","evidence_quote":"gets its own remote with root_folder_id rather than one remote for the drive.","tags":["rclone-remote"],"source_refs":[{"path":"mr-load/scripts/rclone/sync_miraex_drive.sh","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":4,"end":7},{"path":"mr-load/scripts/rclone/sync_miraex_drive.sh","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":23,"end":28},{"path":"mr-load/scripts/rclone/rclone.conf.example","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":1,"end":20}]},{"id":"rsync_hubspot:90","slug":"rsync_hubspot","code":"1390","category":9,"rank":0,"type":"recall","level":1,"concept":"Ontology probe dry-run gate","question":"Which command validates the filled ontology YAML of rsync_hubspot's mr-load, the Phase 0 gate?","answer":"`python -m ontology_substrate probe --ontology miraex_ontology.yaml --dry-run`","explanation":"The skeleton is copied to the git-ignored `ontology/miraex_ontology.yaml`, its FILL_ME constants are probed from the live portal, then the dry-run must accept it. The package comes from ic-ontology, not from this fork. Watch whether cardinality \"N:1\" parses: the documented vocabulary is 1:1 / 1:N / N:M.","evidence_quote":"python -m ontology_substrate probe --ontology miraex_ontology.yaml --dry-run","tags":["per-docs"],"source_refs":[{"path":"mr-load/ontology/miraex_ontology.skeleton.yaml","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":7,"end":14},{"path":"mr-load/PLAN.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":35,"end":38}]},{"id":"rsync_hubspot:91","slug":"rsync_hubspot","code":"1391","category":9,"rank":1,"type":"recall","level":2,"concept":"Document key comment drift","question":"rsync_hubspot (mr-load): the ontology skeleton comments the document key as `fs:\u003csha1(relpath)[:12]>`. Which string does `walk_index.py` actually hash?","answer":"The tree name, a slash, then the relative posix path: the tree is PREFIXED. Trust the indexer; ids rebuilt from the YAML comment match neither the index nor the ledgers.","explanation":"The staging DDL comment and PLAN.md agree with the code; only the `bronze_pk` comment of the `document` entity in `miraex_ontology.skeleton.yaml` kept the older icalps idiom. Fix: correct that comment. Why the prefix exists: see 61.","confusables":"`fs:\u003csha1(relpath)[:12]>` — the STALE idiom left in the YAML comment; the code and the DDL say `fs:\u003csha1(tree/relpath)[:12]>`.","evidence_quote":"\"miraex_doc_id\": synthetic_id(f\"{tree}/{relposix}\"),","tags":["drift","synthetic-id"],"source_refs":[{"path":"mr-load/scripts/indexer/walk_index.py","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":75},{"path":"mr-load/ontology/miraex_ontology.skeleton.yaml","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":87},{"path":"mr-load/scripts/indexer/init_silver_library.sql","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":19},{"path":"mr-load/PLAN.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":186,"end":192}]},{"id":"rsync_hubspot:92","slug":"rsync_hubspot","code":"1392","category":9,"rank":2,"type":"output","level":3,"concept":"Live sync without --tree","question":"rsync_hubspot · `sync_miraex_drive.sh`: predict how many `rclone sync` calls the command below makes.","answer":"3 — with no `--tree`, `ONLY` stays empty, so the loop never skips: companies, opportunities AND tradeshows are all mirrored live.","explanation":"(1) `--live` sets `LIVE=1`, so `--dry-run` is not appended. (2) `ONLY` is empty, the first test fails and `continue` never runs. (3) `TREES` has 3 keys, so 3 syncs (while each one succeeds). Trap: Q4 fixed the v1 scope to the per-company tree only, so pass `--tree companies`.","example":"./sync_miraex_drive.sh --tree companies --live  # 1 rclone sync, the v1 scope","code_snippet":"./sync_miraex_drive.sh --live\n\n# inside the script:\nONLY=\"\"   # filled only by --tree\n# ...\nfor tree in \"${!TREES[@]}\"; do   # companies, opportunities, tradeshows\n  [ -n \"$ONLY\" ] && [ \"$tree\" != \"$ONLY\" ] && continue\n  dest=\"$MRLOAD_LOCAL_ROOT/$tree\"\n  # ...\n  rclone sync \"${TREES[$tree]}\" \"$dest\" \"${FLAGS[@]}\" # ...\ndone","expected_output":"3","evidence_quote":"[ -n \"$ONLY\" ] && [ \"$tree\" != \"$ONLY\" ] && continue","tags":["grounded:logic","trap"],"source_refs":[{"path":"mr-load/scripts/rclone/sync_miraex_drive.sh","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":24,"end":39},{"path":"mr-load/scripts/rclone/sync_miraex_drive.sh","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":52,"end":61},{"path":"mr-load/BINDING-QUESTIONS.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":57,"end":61}]},{"id":"rsync_hubspot:99","slug":"rsync_hubspot","code":"1399","category":9,"rank":9,"type":"scenario","level":4,"concept":"Resume: provisional Phase-5 values","question":"You reopen rsync_hubspot's mr-load to take Phase 5 to its first live upload. Which three values hard-coded in the two skeleton scripts are provisional, and what must be done about them first?","answer":"Answer the open Library binding questions first; three values are placeholders: (1) `MAX_UPLOAD_BYTES = 100 * 1024 * 1024` in `walk_index.py`: the real HubSpot Files limit is unverified. (2) `EXCLUDED_EXTS` / `EXCLUDED_NAMES`: a pattern borrowed from the prior walker; mr-load's own extension policy is pending. (3) `--drive-export-formats \"docx,xlsx,pptx\"` in `sync_miraex_drive.sh`: a provisional default for native Google files.","explanation":"Each value decides which files are mirrored, flagged or uploaded. Still unbuilt after that: the loader for the index CSV, the folder-to-company resolver and the uploader. The Miraex work itself continued in the successor project (see 00).","evidence_quote":"Placeholder pre-upload size guard — the actual HubSpot Files API limit must be","tags":["binding-questions"],"source_refs":[{"path":"mr-load/scripts/indexer/walk_index.py","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":33,"end":41},{"path":"mr-load/scripts/rclone/sync_miraex_drive.sh","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":47},{"path":"mr-load/BINDING-QUESTIONS.md","branch":"claude/mr-load-library-system-3b63h0","commit":"fe922cb1bd9b0d3668fcb7e48eaee878faa41192","line":109,"end":117}]},{"id":"cloudbq:00","slug":"cloudbq","code":"2000","category":0,"rank":0,"type":"recall","level":1,"concept":"CloudBQ new-deals pipeline","question":"What is cloudbq: what does it read, where does it land it, and what does it deliver?","answer":"HubSpot deals created since the last run -> `hubspot.new_deals` (hot score + duplicate flag) -> a weekly report.","explanation":"It reports by `createdate`, per entity (SEALSQ, ICALPS), independently of deal stage: orthogonal to the stage/probability reports. Three candidate orchestrators (lanes A, B, C) are scaffolded side by side so the choice is made on evidence; see 03.","anchor":"A maternity-ward register: every deal BORN since last Monday gets a line, a temperature reading and a 'twin?' tick, whatever stage it has grown to since.","confusables":"cf. ic-dbt-bq: same working session and the same four `.claude/skills`, but it is the dlt-to-BigQuery LOADER; the new-deals pipeline lives only here.","evidence_quote":"HubSpot deals created since the last run → `hubspot.new_deals` in BigQuery with a day-1 hot score and a duplicate flag","source_refs":[{"path":"README.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":3,"end":4},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":4,"end":5},{"path":"README.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":41}]},{"id":"cloudbq:01","slug":"cloudbq","code":"2001","category":0,"rank":1,"type":"recall","level":1,"concept":"The idempotent outcome","question":"Which invariant does cloudbq exist to protect, whichever lane runs?","answer":"One idempotent outcome: re-running a window NEVER duplicates a deal, and a failed run leaves no gap.","explanation":"Three mechanisms carry it: `createdate` is immutable, so the half-open window is exact (see 22); rows MERGE on `deal_id` (see 40); the watermark advances only AFTER a successful MERGE (see 61).","evidence_quote":"Rows are MERGEd into BigQuery on deal_id → re-running a window never duplicates.","tags":["idempotency"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":7,"end":11},{"path":"CONVENTIONS.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":3,"end":5}]},{"id":"cloudbq:02","slug":"cloudbq","code":"2002","category":0,"rank":2,"type":"recall","level":1,"concept":"Raw root (term)","question":"In cloudbq, what does 'the raw root' mean?","answer":"`deals_raw` + `labels_raw`: a `run_ts`-keyed copy of what each run computed FROM, landed before anything is computed.","explanation":"Why it matters: before pass 3 the lanes persisted their outputs per run but never their inputs, so a past run's score, duplicates and labels could not be recomputed. See 60.","confusables":"`new_deals_history` — it keeps what a run PRODUCED (the shaped, scored rows); the raw root keeps what the run READ.","evidence_quote":"the raw root (layers L4 + L13): what each run computed from, landed as delivered","tags":["raw-root"],"source_refs":[{"path":"cloud_function_new_deals/bigquery_schema.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":41,"end":45},{"path":"CONVENTIONS.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":18,"end":20}]},{"id":"cloudbq:03","slug":"cloudbq","code":"2003","category":0,"rank":3,"type":"recall","level":1,"concept":"Lanes A, B, C","question":"Which three orchestrator lanes does cloudbq scaffold side by side?","answer":"A = Cloud Run function · B = n8n on Cloud Run · C = hybrid: BigQuery scheduled queries + a Node 22 write-back job.","explanation":"A fourth letter, R, names the raw root plus the one SQL implementation every lane CALLs (since pass 3). The lanes are compared layer by layer (L0-L17) in the workbook built from `docs/execution_surfaces.yaml`.","evidence_quote":"| **A** Cloud Run function | `cloud_function_new_deals/` |","source_refs":[{"path":"README.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":6,"end":10},{"path":"README.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":22,"end":24}]},{"id":"cloudbq:04","slug":"cloudbq","code":"2004","category":0,"rank":4,"type":"compare","level":2,"concept":"n8n B1 delivery tail","question":"cloudbq: n8n lane `B1` vs `B2`: what is the ONE difference?","answer":"B1 uses n8n ONLY as the delivery tail (webhook -> XLSX -> e-mail) and is kept; B2 had n8n own the WHOLE pipeline and was retired in pass 3 (decision D6).","explanation":"Once the batch became one SQL procedure over the raw root, a second shaper had nothing left to mirror. B1 needs no BigQuery credential: the function renders the payload from the tables and POSTs it.","anchor":"A waiter who only carries the plate (B1) versus a waiter who insists on re-cooking the dish in the dining room (B2): the second was let go.","confusables":"`B2` — it carried its own JavaScript copy of the shaper and scorer; B1 computes NOTHING and only delivers the payload it receives.","evidence_quote":"B1 delivery tail (recommended); B2 whole pipeline retired in pass 3 (D6)","tags":["n8n"],"source_refs":[{"path":"README.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":9},{"path":"docs/PASS3_RAW_ROOT.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":381,"end":387}]},{"id":"cloudbq:10","slug":"cloudbq","code":"2010","category":1,"rank":0,"type":"recall","level":1,"concept":"Slice key of a run","question":"Which three columns key one run's slice in cloudbq's `deals_raw` and `new_deals_history`?","answer":"`(run_ts, entity, orchestrator)` — re-landing the same key REPLACES the slice.","explanation":"`run_ts` is the start of the run truncated to the second. The same key finds the run's rows in `labels_raw` and `new_deals_runs`, so one run can be followed across all four tables.","anchor":"A cloakroom ticket in three parts, torn from one strip: the hour, the guest and the doorman who took the coat; the same ticket opens every locker of that evening.","evidence_quote":"keyed by (run_ts, entity, orchestrator) like the history slice","tags":["raw-root"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":166},{"path":"cloud_function_new_deals/bigquery_schema.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":41,"end":45},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":344}]},{"id":"cloudbq:11","slug":"cloudbq","code":"2011","category":1,"rank":1,"type":"cloze","level":1,"concept":"Frozen four columns","question":"cloudbq: complete the tuple of columns the MERGE never overwrites on a re-observation or a replay.","answer":"day1_hot_score · day1_hot_flag","explanation":"The day-1 score is a first-observation fact: a later run sees a deal that has moved on and would rewrite it. Enforced in `sql/new_deals_batch.sql`, whose UPDATE list omits the four; `tests/test_pass3_sql.py` pins it.","cloze":"FROZEN = (\"deal_id\", \"first_seen_run\", \"{{c1::day1_hot_score}}\", \"{{c1::day1_hot_flag}}\")","evidence_quote":"FROZEN = (\"deal_id\", \"first_seen_run\", \"day1_hot_score\", \"day1_hot_flag\")","tags":["merge"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":163},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":67,"end":68},{"path":"tests/test_pass3_sql.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":86,"end":88}]},{"id":"cloudbq:12","slug":"cloudbq","code":"2012","category":1,"rank":2,"type":"recall","level":2,"concept":"data_gaps on the runs row","question":"In cloudbq, what does the `data_gaps` column of `new_deals_runs` record, and who fills it?","answer":"An `ARRAY\u003cSTRING>` naming what a run could NOT read or compute, e.g. `raw_landing_failed` or `event_no_window`. The caller passes its gaps in `p_gaps`; the procedure adds `labels_missing` and `dedup_horizon_partial`.","explanation":"It makes a degraded run honest instead of silent: a run can be `OK` and still say that its duplicate horizon was partial or that an older slice was replaced (`raw_slice_replaced`).","confusables":"`error` — it holds the message of a run that FAILED; `data_gaps` can be non-empty on a run whose status is `OK`.","evidence_quote":"data_gaps: what a run could not read or compute","tags":["audit"],"source_refs":[{"path":"cloud_function_new_deals/bigquery_schema.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":65,"end":67},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":14,"end":15},{"path":"tests/test_main_offline.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":184}]},{"id":"cloudbq:13","slug":"cloudbq","code":"2013","category":1,"rank":3,"type":"compare","level":2,"concept":"first_seen_run","question":"cloudbq · table `new_deals`: `first_seen_run` vs `last_seen_run`: what is the ONE difference?","answer":"`first_seen_run` is FROZEN at the first observation; `last_seen_run` moves to each newer run and is the guard that stops an older slice from overwriting a newer observation.","explanation":"The MERGE updates a matched row only when the incoming `last_seen_run` is at least the stored one, so a replayed run_time or a late retry cannot roll a deal back.","anchor":"A passport: the birth date is printed once; the border stamp is renewed at each crossing, and an older stamp is never inked over a newer one.","confusables":"`last_seen_run` — updated by every MERGE whose slice is at least as new; `first_seen_run` belongs to the frozen four and is NEVER updated.","evidence_quote":"WHEN MATCHED AND s.last_seen_run >= IFNULL(t.last_seen_run, TIMESTAMP '1970-01-01') THEN UPDATE SET","tags":["merge"],"source_refs":[{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":67,"end":70},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":76},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":163}]},{"id":"cloudbq:20","slug":"cloudbq","code":"2020","category":2,"rank":0,"type":"trace","level":3,"concept":"Lane A live window run","question":"cloudbq · lane A, one live window run: recite the 9 steps from the Cloud Scheduler GET to the delivered payload.","answer":"run_ts · watermark · lease · search · land · CALL · read back · advance · deliver","explanation":"The order is pinned by `test_live_lands_before_the_call_and_advances_the_watermark_after_it`. A dry run skips the lease, the watermark and the delivery (see 24); on any exception the lease is released and the watermark stays (see 61).","anchor":"A Monday milk round: read last week's marker, hang the 'on round' tag, count the new doorsteps, copy the addresses, hand the sheet to the dairy, read back the tally, move the marker, post the bill.","steps":["`new_deals_report(request)` -> `run_ts` = now truncated to the second","`read_watermark()` -> window start (first run: now minus 7 days)","`acquire_lease()` -> sets `lock_until`; a held lease answers 409","`hs.search_created()` -> deals created in the window, ALL pipelines","`land_raw()` + `land_labels()` -> the slice lands in `deals_raw` / `labels_raw`","`call_batch()` -> `CALL new_deals_batch`: score, MERGE, history, runs row","`read_batch()` -> payload rows read back from `new_deals_history`","`write_watermark()` -> watermark = `run_ts`, lease cleared","`_deliver()` -> POST the payload to `DELIVERY_WEBHOOK_URL`"],"evidence_quote":"if not dry and not event: write_watermark(client, entity, run_ts)","tags":["lane-a"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":359,"end":378},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":344},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":385,"end":387},{"path":"tests/test_main_offline.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":175,"end":179}]},{"id":"cloudbq:21","slug":"cloudbq","code":"2021","category":2,"rank":1,"type":"trace","level":3,"concept":"Steps inside new_deals_batch","question":"cloudbq · procedure `new_deals_batch`, a window run with `p_advance_state` TRUE: recite the 9 steps from the mode check to COMMIT.","answer":"mode check · lease check · gaps · TEMP batch · BEGIN · MERGE · history · runs row · state + COMMIT","explanation":"On any error the handler rolls back, writes a `FAILED` runs row with the message and re-raises. With `p_mode = 'dry'` only ONE runs row is written. Lane A passes `p_advance_state = FALSE`, so the lease check and the state step are skipped and the function moves its own watermark (see 61).","anchor":"A notary: checks the form, checks the file is free, notes what is missing, spreads the papers, locks the door, signs the deed, files the copy, fills the register, moves the bookmark, unlocks.","steps":["`p_mode` not in window | event | dry -> RAISE","`report_state.lock_until` in the future -> RAISE: a lane-A run holds the lease","no labels slice or a short horizon -> `labels_missing` / `dedup_horizon_partial` added","`CREATE OR REPLACE TEMP TABLE batch` \u003c- `new_deals_batch_rows(...)`","`BEGIN TRANSACTION` -> everything below commits or rolls back together","`MERGE new_deals` on `deal_id` -> `v_written` = `@@row_count`","history slice of the key deleted, then re-inserted from `batch`","runs row of the key replaced: status `OK`, `rows_written` = `v_written`","`MERGE report_state` -> watermark never rewinds; `COMMIT TRANSACTION`"],"evidence_quote":"SET v_written = @@row_count;","tags":["procedure"],"source_refs":[{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":64,"end":78},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":28,"end":53},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":80,"end":104},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":107,"end":115}]},{"id":"cloudbq:22","slug":"cloudbq","code":"2022","category":2,"rank":2,"type":"recall","level":2,"concept":"createdate extraction window","question":"Which window of HubSpot deals does one cloudbq lane-A run search, and why is it exact?","answer":"The half-open window `[watermark - OVERLAP_MINUTES, run_ts)` on `createdate`, overlap 5 minutes. `createdate` is IMMUTABLE in HubSpot, so the same window always returns the same deals and a replay is exact.","explanation":"The overlap re-reads the deals at the edge; the MERGE on `deal_id` absorbs them. Lane C has no watermark search: it uses a 14-day lookback over its 90-day slice.","confusables":"`hs_lastmodifieddate` — a last-modified date MOVES with every edit, so a window on it would not be replayable; it is landed only to order re-observations.","evidence_quote":"createdate is immutable in HubSpot → a half-open window [watermark − overlap, run_ts) is exact and replayable.","tags":["watermark"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":8},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":365,"end":366},{"path":"sql/new_deals_weekly.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":8},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":65}]},{"id":"cloudbq:23","slug":"cloudbq","code":"2023","category":2,"rank":3,"type":"recall","level":2,"concept":"Duplicate suspect rule","question":"In cloudbq, when does `new_deals_batch_rows` flag a deal as `duplicate_suspect`?","answer":"When another deal the root knows has the SAME non-empty `name_key` and was created within the 90 days before `run_ts`: any entity, any orchestrator, in scope or not.","explanation":"`duplicate_of` lists the twins' ids ordered by `createdate`. Deals of other pipelines are landed with `in_scope = FALSE` precisely to serve as duplicate candidates. When the oldest deal the root holds is younger than 83 days, the run carries `dedup_horizon_partial`.","evidence_quote":"JOIN horizon h ON h.name_key = w.name_key AND h.deal_id \u003c> w.deal_id AND w.name_key \u003c> ''","tags":["dedup"],"source_refs":[{"path":"sql/deals_landed_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":59,"end":67},{"path":"sql/deals_landed_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":47,"end":49},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":44,"end":50}]},{"id":"cloudbq:24","slug":"cloudbq","code":"2024","category":2,"rank":4,"type":"compare","level":2,"concept":"Dry run (decision D1)","question":"cloudbq: a `?dry_run=1` run vs a live window run: what is the ONE difference in what reaches BigQuery?","answer":"A dry run lands its slice with `mode = 'dry'` and leaves ONE runs row (`dry_run = TRUE`, `rows_written = 0`); a live run ALSO writes the sink, the history slice and the state.","explanation":"Dry reads the watermark like a live run but takes no lease and delivers nothing; its payload comes from the table function instead of the history slice. The rule since pass 3 is 'writes nothing to the sink or the state', no longer 'writes nothing at all'.","anchor":"A fire drill: everyone walks to the yard and the drill is entered in the logbook, but no hose is opened and no room is flooded.","confusables":"live window run — it takes the lease, MERGEs `new_deals`, moves the watermark and delivers; dry does NONE of these.","evidence_quote":"Dry mode (decision D1) lands its slice with mode = 'dry' and CALLs with mode = 'dry': one runs row (dry_run = TRUE,","tags":["dry-run"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":23,"end":24},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":55,"end":62},{"path":"tests/test_main_offline.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":159,"end":166}]},{"id":"cloudbq:30","slug":"cloudbq","code":"2030","category":3,"rank":0,"type":"recall","level":1,"concept":"deploy.sh all","question":"Which command brings cloudbq's lane A up to, but not including, the dry gate?","answer":"`cloud_function_new_deals/deploy.sh all` — check-env, enable-apis, iam, tables, routines, secret, deploy, invoker.","explanation":"Every step is create-or-update, so re-running is safe. `DRYRUN=1` prints every gcloud/bq command instead of running it. Next come `deploy.sh dry`, then `enable` (see 90).","example":"DRYRUN=1 PROJECT=ci-project ./deploy.sh all  # prints the commands, runs nothing (the CI rehearsal)","evidence_quote":"all) check_env; enable_apis; iam; tables; routines; secret; deploy; invoker ;;","tags":["lane-a"],"source_refs":[{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":219},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":4,"end":9},{"path":".github/workflows/ci.yml","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":22}]},{"id":"cloudbq:31","slug":"cloudbq","code":"2031","category":3,"rank":1,"type":"output","level":3,"concept":"name_key() dealname fallback","question":"cloudbq · `name_key`: predict the exact return value of the call below.","answer":"`'acmecorp'` — a blank `final_customer` falls back to the deal name cut at the first `-`, `/`, `|` or `(`, then lower-cased and stripped to `a-z0-9`.","explanation":"(1) `\" \".strip()` is empty, so the fallback runs. (2) The split keeps `\"Acme Corp. \"`. (3) Lower-casing and the regex drop the space and the dot. (4) `[:40]` changes nothing. The SQL twin in `deals_landed_v1` computes the same key; see 23 for its use.","confusables":"`dealname` — the raw label a salesperson typed; `name_key` is the NORMALISED customer token that two differently named deals can share.","code_snippet":"def name_key(p):\n    base = (p.get(\"final_customer\") or \"\").strip() or re.split(r\"[-/|(]\", p.get(\"dealname\") or \"\")[0]\n    return re.sub(r\"[^a-z0-9]\", \"\", base.lower())[:40]\n\nname_key({\"final_customer\": \" \", \"dealname\": \"Acme Corp. - Secure chip (2027)\"})","expected_output":"'acmecorp'","evidence_quote":"return re.sub(r\"[^a-z0-9]\", \"\", base.lower())[:40]","tags":["grounded:logic","dedup"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":299,"end":301},{"path":"sql/deals_landed_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":14,"end":16}]},{"id":"cloudbq:32","slug":"cloudbq","code":"2032","category":3,"rank":2,"type":"output","level":3,"concept":"call_batch() event NULLs","question":"cloudbq · `call_batch`: an event run has no window. Predict the argument list of the CALL statement it submits.","answer":"Four NULLs in a row after FALSE: `p_state_report_id` plus the three missing window bounds, each written as the LITERAL `NULL`, never as a NULL-valued parameter.","explanation":"`FALSE` is `p_advance_state`: lane A keeps the lease and its own watermark. The event's `p_gaps` is `['event_no_window']`. A window run sends `@watermark_in, @query_start, @query_end` in the same three places.","code_snippet":"# window = {\"mode\": \"event\", \"objectId\": \"2\"}  -> no watermark_in, query_start, query_end\nargs = []\nfor name in (\"watermark_in\", \"query_start\", \"query_end\"):\n    v = ts(window.get(name))\n    if v is None: args.append(\"NULL\")\n    else: args.append(\"@\" + name); params.append(...)\n# ...\nf\"CALL `...new_deals_batch`(@run_ts, @entity, @orchestrator, @mode, FALSE, NULL, {args[0]}, {args[1]}, {args[2]}, @started_ms, @gaps)\"","expected_output":"(@run_ts, @entity, @orchestrator, @mode, FALSE, NULL, NULL, NULL, NULL, @started_ms, @gaps)","evidence_quote":"q.endswith(\"FALSE, NULL, NULL, NULL, NULL, @started_ms, @gaps)\")","tags":["grounded:test","event-mode"],"source_refs":[{"path":"tests/test_main_offline.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":253},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":243,"end":248}]},{"id":"cloudbq:33","slug":"cloudbq","code":"2033","category":3,"rank":3,"type":"output","level":3,"concept":"Unknown entity guard","question":"cloudbq · `new_deals_report`: predict the tuple returned for the request below.","answer":"HTTP 400 with `unknown entity ACME` — the name is UPPER-cased first, then refused before any BigQuery client or HubSpot call is made.","explanation":"(1) `acme` is truthy, so the `SEALSQ` default is not used. (2) `.upper()` gives `ACME`. (3) It is not a key of `ENTITIES`. The guard sits above `client = bq()`: a typo costs nothing and writes no runs row.","code_snippet":"# GET ?entity=acme        ENTITIES has two keys: \"SEALSQ\", \"ICALPS\"\nentity = (request.args.get(\"entity\") or body.get(\"entity\") or \"SEALSQ\").upper()\ndry = request.args.get(\"dry_run\") == \"1\" or body.get(\"dry_run\") is True\nif entity not in ENTITIES: return ({\"error\": f\"unknown entity {entity}\"}, 400)","expected_output":"({'error': 'unknown entity ACME'}, 400)","evidence_quote":"if entity not in ENTITIES: return ({\"error\": f\"unknown entity {entity}\"}, 400)","tags":["grounded:logic","intended-error"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":346,"end":350},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":57,"end":60}]},{"id":"cloudbq:34","slug":"cloudbq","code":"2034","category":3,"rank":4,"type":"output","level":3,"concept":"Tier boundary at 0.75","question":"cloudbq · view `deal_tiers_v1`: predict the `tier` of an OPEN deal whose certainty is exactly 0.75.","answer":"`Tier2_opportunity` — `RANGE_BUCKET(0.75, [0.5, 0.75, 0.9])` is 2: an edge belongs to the bucket ABOVE it, and the labels array runs from Tier4 up to Tier1.","explanation":"Certainty is a FRACTION (0-1), so the operator's 50 % / 75 % / 90 % are the edges 0.5 / 0.75 / 0.9. The test's reference binning uses `bisect_right`, the same semantics as `RANGE_BUCKET`; a NULL certainty is never tiered.","confusables":"`Tier3_opportunity` — the tempting answer if you think an edge closes the bucket BELOW it; 0.75 OPENS the bucket above.","code_snippet":"-- certainty = 0.75, is_closed = FALSE, is_closed_won = FALSE\nCASE WHEN is_closed_won THEN 'Closed_won'\n     WHEN is_closed     THEN 'Closed_lost'\n     -- ...\n     WHEN certainty IS NULL THEN NULL\n     ELSE ['Tier4_pipeline', 'Tier3_opportunity', 'Tier2_opportunity', 'Tier1_opportunity'][OFFSET(RANGE_BUCKET(certainty, [0.5, 0.75, 0.9]))]\nEND AS tier","expected_output":"Tier2_opportunity","evidence_quote":"assert tier_label(0.75) == \"Tier2_opportunity\"","tags":["grounded:test","l2-tiers"],"source_refs":[{"path":"tests/test_deal_tiers.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":47},{"path":"sql/deal_tiers_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":4,"end":6},{"path":"sql/deal_tiers_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":17,"end":23}]},{"id":"cloudbq:35","slug":"cloudbq","code":"2035","category":3,"rank":5,"type":"locate","level":1,"concept":"new_deals_batch_rows","question":"Which cloudbq SQL object recomputes a past run's batch WITHOUT writing anything?","answer":"The table function `new_deals_batch_rows(run_ts, entity, orchestrator, window_start)` in `sql/deals_landed_v1.sql`.","explanation":"Pure and read-only: the in-scope deals of the slice, labels joined, `hot_score_v1` applied with `run_ts` as now, duplicates from the root. The procedure reads it into its TEMP table and dry runs render their payload from it.","example":"SELECT * FROM new_deals_batch_rows(X, 'SEALSQ', 'cloud-run-function', NULL)  -- the shaped, scored batch of run X, nothing written","confusables":"`new_deals_batch` (the procedure) — it WRITES (MERGE, history, runs row); `new_deals_batch_rows` only RETURNS the rows.","evidence_quote":"Debug a past run X without writing: SELECT * FROM","tags":["raw-root"],"source_refs":[{"path":"sql/deals_landed_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":44,"end":52},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":52,"end":53}]},{"id":"cloudbq:40","slug":"cloudbq","code":"2040","category":4,"rank":0,"type":"locate","level":1,"concept":"The one write path","question":"Which is the ONLY object in cloudbq that MERGEs into `new_deals`?","answer":"The stored procedure `new_deals_batch` in `sql/new_deals_batch.sql` — every lane lands its slice, then CALLs it.","explanation":"The function neither MERGEs the sink nor writes the OK runs row; `tests/test_main_offline.py` asserts it. One SQL implementation replaced four live copies of the batch arithmetic. See 21 for its steps.","anchor":"A single turnstile into the stadium: three queues arrive by different streets, but every ticket is punched by the same machine.","evidence_quote":"the ONE write path of the new-deals pipeline, as a stored procedure","tags":["procedure"],"source_refs":[{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":1,"end":2},{"path":"tests/test_main_offline.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":180},{"path":"CONVENTIONS.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":14,"end":16}]},{"id":"cloudbq:41","slug":"cloudbq","code":"2041","category":4,"rank":1,"type":"compare","level":2,"concept":"hot_score() test oracle","question":"cloudbq: Python `hot_score()` vs the BigQuery UDF `hot_score_v1`: what is the ONE difference?","answer":"`hot_score_v1` is THE implementation every run executes since pass 3; `hot_score()` in `main.py` is ONLY a test oracle that nothing in the request path calls.","explanation":"Both must give the same score on the vectors of `tests/hot_score_vectors.json` (tolerance 0.1 in the generated SQL check). The constants live once in `scoring/hot_score_v1.constants.json`; a drift test compares them with `main.py`. A deal is hot at a score of 45 or more.","anchor":"A tailor's paper pattern pinned to the wall: every suit is cut by the machine; the pattern is only held against a finished suit to check it.","confusables":"`hot_score_v1` — the UDF computes EVERY production score; `hot_score()` only builds and checks the test vectors, so changing it alone changes no production score.","evidence_quote":"shape() / hot_score() stay here as test oracles","tags":["hot-score"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":21,"end":22},{"path":"scoring/hot_score_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":1,"end":4},{"path":"tests/test_hot_score.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":81,"end":91},{"path":"cloud_functi
