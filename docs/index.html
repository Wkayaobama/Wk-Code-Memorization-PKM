on_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":69}]},{"id":"cloudbq:42","slug":"cloudbq","code":"2042","category":4,"rank":2,"type":"locate","level":1,"concept":"Write-back Cloud Run job","question":"Which cloudbq component writes the hot score back onto HubSpot deals?","answer":"`writeback/index.mjs`: a Node 22 Cloud Run JOB, no HTTP surface, that PATCHes the score in batches of 100.","explanation":"It writes the deal properties `hot_score_v1` / `hot_flag_v1`, reads the delta view `hot_deals_v1_writeback`, logs one row per deal to `writeback_log`, never sends a NULL score and stays DRY unless `WRITEBACK_APPROVE=1`. See 54 and 84.","confusables":"the Cloud Run function `new_deals_report` — a SERVICE that answers HTTP and only reads HubSpot; the write-back is a JOB with no URL, the only component that writes deal values to HubSpot.","evidence_quote":"Node 22 Cloud Run *job*: no HTTP surface, started by Cloud Scheduler via jobs.run.","tags":["lane-c","cloud-run-job"],"source_refs":[{"path":"writeback/index.mjs","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":1,"end":4},{"path":"writeback/index.mjs","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":44,"end":46},{"path":"sql/hot_deals_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":24,"end":32}]},{"id":"cloudbq:50","slug":"cloudbq","code":"2050","category":5,"rank":0,"type":"locate","level":2,"concept":"Asynchronous hand-off to BigQuery","question":"cloudbq · the owner's question: which function enables dbt-big-q to run asynchronously in the GCP platform?","answer":"`call_batch()` in `cloud_function_new_deals/main.py`: `client.query()` SUBMITS `CALL new_deals_batch(...)` as a BigQuery job that runs server-side; `job.result(timeout=CALL_TIMEOUT_S)` waits at most 240 s and `job.cancel()` stops the job on timeout.","explanation":"The asynchrony is JOB-based, not coroutine-based: there is no `async def` in the Python, and `new_deals_report` is a synchronous HTTP handler deployed with `--concurrency 1`. The landings use the same submit-then-wait pattern. Breaks if undone: without the cancel, a procedure outliving the request could land later as a surprise OK row. Second hand-off: see 54.","anchor":"A sender hands a parcel to the courier desk, takes the tracking slip and watches the clock: the courier works alone; after four minutes she recalls the parcel so nothing is delivered behind her back.","confusables":"`patchBatch()` in `writeback/index.mjs` — the only `async function` in the repo, but it awaits HubSpot HTTP calls in lane C's job; `call_batch()` hands the COMPUTE to BigQuery.","evidence_quote":"a procedure still running after the request gave up must not land later as a surprise OK row","tags":["owner-question","bigquery-job"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":248,"end":254},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":233,"end":236},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":341,"end":342},{"path":"writeback/index.mjs","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":22}]},{"id":"cloudbq:51","slug":"cloudbq","code":"2051","category":5,"rank":1,"type":"recall","level":1,"concept":"Lane A schedule","question":"When does Cloud Scheduler trigger cloudbq's lane A for each entity?","answer":"Mondays, Europe/Zurich: `0 7 * * 1` for SEALSQ and `20 7 * * 1` for ICALPS — 20 minutes apart.","explanation":"Both in the same minute was a bug (shared staging and 429s). Each job is an HTTP GET `?entity=E` with `--attempt-deadline 600s` and `--max-retry-attempts 3`; the jobs are created PAUSED (see 90).","confusables":"lane C's scheduled queries — `every monday 03:53` and `04:23` in UTC, which ignores DST; lane A's cron lines follow Europe/Zurich.","evidence_quote":"\"${SCHEDULE_SEALSQ:=0 7 * * 1}\" \"${SCHEDULE_ICALPS:=20 7 * * 1}\"","tags":["scheduler"],"source_refs":[{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":22},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":132,"end":134},{"path":"docs/PASS1_SEQUENCE.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":126},{"path":"sql/scheduled_query.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":3,"end":5}]},{"id":"cloudbq:52","slug":"cloudbq","code":"2052","category":5,"rank":2,"type":"scenario","level":3,"concept":"Lease against overlapping runs","question":"cloudbq: a second live run for SEALSQ starts while the first still holds the lease. What does it answer, and what does it write?","answer":"HTTP 409 and NOTHING moves: `acquire_lease()` returns False because its guarded UPDATE of `lock_until` affects 0 rows, so there is no landing, no CALL and no watermark change.","explanation":"The lease is `lock_until = run_ts + LEASE_MINUTES` (default 12). After a crash that never released it, the next run also gets 409 until those minutes have passed: check with `deploy.sh status`. Dry runs take no lease.","example":"cloud_function_new_deals/deploy.sh status  # report_id, watermark, lock_until, updated_at","confusables":"`--max-instances 1 --concurrency 1` — it serialises requests on ONE service; the lease also stops a second CALLER, such as lane C's procedure advancing state.","evidence_quote":"WHERE report_id = @rid AND (lock_until IS NULL OR lock_until \u003c @ts)","tags":["lease","trap"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":143,"end":152},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":361,"end":364},{"path":"tests/test_main_offline.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":238,"end":241},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":202,"end":205}]},{"id":"cloudbq:53","slug":"cloudbq","code":"2053","category":5,"rank":3,"type":"recall","level":2,"concept":"540 s time budget","question":"How many seconds can one cloudbq lane-A request spend at worst, and how is that figure built?","answer":"530 s, under Cloud Run's 540 s timeout: 4 landing jobs x `LAND_TIMEOUT_S` 45 + `CALL_TIMEOUT_S` 240 + 3 delivery tries x 30 + 20.","explanation":"The point of the time-boxes: a slow job must surface as a named failure INSIDE the request, with the lease released, never as a request killed by Cloud Run with the lease left set. The offline test pins 45 and 240. See 93 for the stale values in a document.","evidence_quote":"Budget: 4 × 45 (landing) + CALL_TIMEOUT_S 240 + delivery 3 × 30 + 20 = 530 s \u003c 540.","tags":["timeouts"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":204,"end":208},{"path":"tests/test_main_offline.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":197},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":121}]},{"id":"cloudbq:54","slug":"cloudbq","code":"2054","category":5,"rank":4,"type":"why","level":2,"concept":"jobs.run returns at once","question":"Why does cloudbq's write-back job exit non-zero on errors rather than rely on Cloud Scheduler's 3 retries?","answer":"Scheduler starts the job through `jobs.run`, which returns an Operation IMMEDIATELY: Scheduler sees success once the execution has started, so its retries cover only start failures. A non-zero exit makes Cloud Run's `--max-retries 2` re-run the task.","explanation":"Breaks if undone: a half-failed PATCH run would never be retried. The retry is cheap because OK rows are already in `writeback_log`, so the delta view offers only the rest. This is the repository's second asynchronous hand-off on GCP; see 50.","anchor":"A dispatcher who only checks that the taxi LEFT the rank: a breakdown on the road is the driver's own business, so the driver carries two spare tyres.","confusables":"lane A's Scheduler job — a plain HTTP GET that WAITS for the function's answer (deadline 600 s), so there Scheduler's retries DO re-run the work.","evidence_quote":"non-zero → Cloud Run retries the task (--max-retries); OK rows are logged, so the retry PATCHes only the rest","tags":["per-docs","cloud-run-job"],"source_refs":[{"path":"writeback/index.mjs","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":57},{"path":"writeback/deploy_job.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":27,"end":33},{"path":"docs/discovery/scenario_C.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":601}]},{"id":"cloudbq:60","slug":"cloudbq","code":"2060","category":6,"rank":0,"type":"why","level":2,"concept":"Raw root, not an orchestrator","question":"Why does cloudbq fix its non-recomputable runs with a `run_ts`-keyed landing table rather than with another orchestrator?","answer":"Both lanes persisted their OUTPUTS per run but never their INPUTS. An orchestrator only sequences nodes; it cannot persist the node that is missing. Landing the inputs makes every later stage SQL over the root.","explanation":"Breaks if undone: `day1_hot_score`, `duplicate_of`, the labels and the delivered report of a past run cannot be recomputed from BigQuery. Three defects, one cause, so one table (plus `labels_raw`); it also let four live copies of the batch arithmetic shrink to one SQL implementation.","anchor":"Accountants argue over who should chair the audit while the real gap sits in the bin: nobody kept the receipts, so last month's total cannot be re-added.","confusables":"a DAG / orchestrator — it decides WHEN and in what order steps run; the raw root decides WHAT a past run can still be recomputed from.","evidence_quote":"orchestrator sequences nodes; it does not persist the node that is missing","tags":["raw-root"],"source_refs":[{"path":"docs/PASS3_RAW_ROOT.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":163,"end":189},{"path":"README.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":35,"end":36},{"path":"cloud_function_new_deals/bigquery_schema.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":41,"end":45}]},{"id":"cloudbq:61","slug":"cloudbq","code":"2061","category":6,"rank":1,"type":"why","level":2,"concept":"write_watermark() only after CALL","question":"Why must you NOT move `write_watermark()` ahead of `call_batch()` in cloudbq's `new_deals_report`?","answer":"A failure between the two would leave the watermark AHEAD of the data: the deals of that window would never be searched again. Advancing last means a failed run is simply retried on the next trigger with no gap.","explanation":"Breaks if undone: silent holes in `new_deals`, no error raised. With mark-last, a crashed run re-reads the same window and the MERGE on `deal_id` absorbs the repeats. The same UPDATE also clears the lease.","anchor":"A meter reader who notes the new reading in his book only AFTER the invoice has gone out: if the printer jams, next month's bill still starts from the old reading.","confusables":"`release_lease()` — it clears `lock_until` ONLY, on the failure path; `write_watermark()` moves the mark AND clears the lease, on success only.","evidence_quote":"The watermark advances only after a successful MERGE → a failed run is retried on the next trigger with no gap.","tags":["watermark"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":10},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":378},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":154,"end":157},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":390,"end":395}]},{"id":"cloudbq:62","slug":"cloudbq","code":"2062","category":6,"rank":2,"type":"why","level":2,"concept":"Load first, delete older","question":"Why does cloudbq's `land_raw()` load the new rows first and then delete older rows of the same key rather than DELETE-then-INSERT?","answer":"A failure between the two jobs must never leave an EMPTY slice: with load-first the worst case is a doubled slice, which the table function reduces to one row per deal (latest `fetched_at`).","explanation":"Breaks if undone: a crash after the DELETE would erase a run's inputs, the very thing the raw root exists to keep. The delete is strict (`fetched_at \u003c @f`), and landing runs outside the batch transaction so a failed batch still leaves its inputs queryable.","anchor":"A baker puts the fresh loaves on the shelf BEFORE taking yesterday's away: if the phone rings in between, the shelf holds two batches, never none.","confusables":"DELETE-then-INSERT — its failure window LOSES the slice; load-then-delete-older's failure window only DOUBLES it.","evidence_quote":"Load first, then drop older rows of the same key, so a failure between the two jobs never leaves an empty slice.","tags":["raw-root"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":167},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":186,"end":188},{"path":"sql/deals_landed_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":58},{"path":"sql/land_raw.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":6,"end":7}]},{"id":"cloudbq:63","slug":"cloudbq","code":"2063","category":6,"rank":3,"type":"scenario","level":3,"concept":"No streaming inserts","question":"cloudbq: someone replaces the load job in `land_raw()` with a streaming insert (`insert_rows_json`). What breaks on the next re-landing of the same key?","answer":"The slice DELETE: a streaming buffer blocks DML on its rows, so the delete-older step raises and the run fails as `raw_landing_failed`. That is why landings are LOAD jobs and audit rows are query INSERTs.","explanation":"The same rule protects `new_deals_runs`: the procedure every lane CALLs DELETEs and re-inserts the run's row there, so `write_run()` uses a query INSERT. Rule to keep: a table whose rows are later replaced by DML is never streamed into.","confusables":"`writeback_log` — the write-back job DOES stream into it (`table.insert`), which is safe only because nothing in the repo deletes from it.","evidence_quote":"a streaming buffer would block the slice DELETE, see write_run","tags":["trap","inferred"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":168,"end":169},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":218},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":373,"end":374},{"path":"writeback/index.mjs","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":50},{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":87,"end":88}]},{"id":"cloudbq:64","slug":"cloudbq","code":"2064","category":6,"rank":4,"type":"why","level":2,"concept":"JSON properties column","question":"Why does cloudbq store a landed deal's properties as ONE JSON column rather than as typed columns?","answer":"Lane A delivers HubSpot strings, lane C typed sync values, and the property set keeps changing: with JSON a new property needs NO DDL and old slices stay readable. Typing happens once, with `SAFE_CAST`, in the view `deals_landed_v1`.","explanation":"Breaks if undone: with the rejected 28 typed columns, every `PROPS` change is a migration plus a view change and 'as delivered' is lost at the first cast. With `SAFE_CAST` in the view a malformed value reads NULL instead of failing the batch.","anchor":"A removals firm that tapes every box shut and labels only the room: sorting happens once, at the new house, whatever the family packed.","confusables":"typed columns — a schema change for every new property; the JSON column moves that change into ONE view.","evidence_quote":"with JSON a new property needs no DDL and old slices stay readable","tags":["raw-root"],"source_refs":[{"path":"docs/PASS3_RAW_ROOT.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":226,"end":230},{"path":"sql/deals_landed_v1.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":5,"end":7},{"path":"cloud_function_new_deals/bigquery_schema.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":53}]},{"id":"cloudbq:65","slug":"cloudbq","code":"2065","category":6,"rank":5,"type":"why","level":4,"concept":"Lane A as production orchestrator","question":"Why does cloudbq recommend lane A (the Cloud Run function) as the production orchestrator rather than n8n owning the whole pipeline or BigQuery scheduled queries alone, and where do B and C still fit?","answer":"Verdict: A runs production; B and C keep only what they add. (1) A is the cheapest with the fewest parts and has the exact `createdate` window, read from HubSpot at run time. (2) n8n stays ONLY as the delivery tail B1; the whole-pipeline variant B2 is retired (D6). (3) C's compute plus write-back is added when the score must be visible INSIDE HubSpot; since pass 3 every lane CALLs the same `sql/new_deals_batch.sql`, so adding C adds no second arithmetic.","explanation":"Breaks if undone: n8n as owner needs a second shaper and scorer kept in parity by tests; scheduled queries alone read a daily full-refresh sync, so their window is a 14-day lookback rather than the exact watermark window.","anchor":"A relay team: the sprinter (A) runs the lap, the announcer (B) only reads out the result, the engraver (C) is called only when the score must be cut into the trophy.","confusables":"lane C as orchestrator — it computes from a SYNCED copy refreshed once a day; lane A reads HubSpot itself at run time.","evidence_quote":"Run **A** as the production orchestrator (cheapest, fewest parts, exact window, event path possible later)","tags":["lanes"],"source_refs":[{"path":"docs/SCENARIOS.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":64,"end":69},{"path":"README.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":6,"end":10},{"path":"sql/new_deals_weekly.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":8},{"path":"sql/sync_transfer.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":2,"end":4}]},{"id":"cloudbq:70","slug":"cloudbq","code":"2070","category":7,"rank":0,"type":"recall","level":1,"concept":"report_state row per report_id","question":"Which BigQuery table holds cloudbq's watermark and lease?","answer":"`report_state`: one row per `report_id` (`NEW_DEALS_\u003centity>`) with `watermark` and the lease `lock_until`.","explanation":"`deploy.sh replay ENTITY FROM_ISO` rewinds lane A's watermark and runs once; the MERGE on `deal_id` keeps the replay idempotent. `deploy.sh status` prints the rows.","anchor":"A library index card carrying a date stamp and a 'reserved until' slip: one card per reader, nothing else in the drawer.","confusables":"`NEW_DEALS_\u003centity>_C` — lane C's OWN state row, advanced inside the procedure; lane A's row is moved only by the function.","evidence_quote":"lock_until TIMESTAMP -- lease: one run per report_id at a time","tags":["watermark","lease"],"source_refs":[{"path":"cloud_function_new_deals/bigquery_schema.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":5,"end":8},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":140},{"path":"sql/new_deals_weekly.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":39,"end":41},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":187,"end":193}]},{"id":"cloudbq:71","slug":"cloudbq","code":"2071","category":7,"rank":1,"type":"locate","level":1,"concept":"new_deals_runs audit row","question":"Which cloudbq table gets one summary row per run, including dry and failed runs?","answer":"`new_deals_runs` — the procedure writes it (`OK` / `FAILED`); the function only if the procedure never could.","explanation":"Columns that matter on re-entry: `status`, `error`, `rows_written`, `dry_run`, `data_gaps`. A failed delivery amends the row to `OK_DELIVERY_FAILED`. `deploy.sh probe` lists the last ten.","confusables":"`new_deals_history` — one row per DEAL per run (the slice); `new_deals_runs` is one SUMMARY row per run.","evidence_quote":"One row per run (window, event or dry","tags":["audit"],"source_refs":[{"path":"cloud_function_new_deals/bigquery_schema.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":20,"end":28},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":27,"end":28},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":387},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":199,"end":200}]},{"id":"cloudbq:72","slug":"cloudbq","code":"2072","category":7,"rank":2,"type":"cloze","level":2,"concept":"Procedure watermark never rewinds","question":"cloudbq · procedure `new_deals_batch`: complete the assignment that stops a replayed older run from rewinding the state.","answer":"GREATEST(t.watermark, s.watermark)","explanation":"It runs only when `p_advance_state` is TRUE (lane C's scheduled script), INSIDE the same transaction as the MERGE, so 'state only after the MERGE' is enforced by the engine.","confusables":"`write_watermark()` — lane A's own UPDATE to `run_ts`, issued by the function AFTER the CALL returns; the procedure's GREATEST runs INSIDE the batch transaction.","cloze":"WHEN MATCHED THEN UPDATE SET watermark = {{c1::GREATEST(t.watermark, s.watermark)}}, updated_at = CURRENT_TIMESTAMP()","evidence_quote":"WHEN MATCHED THEN UPDATE SET watermark = GREATEST(t.watermark, s.watermark), updated_at = CURRENT_TIMESTAMP()","tags":["watermark","procedure"],"source_refs":[{"path":"sql/new_deals_batch.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":96,"end":101},{"path":"sql/new_deals_weekly.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":42,"end":46}]},{"id":"cloudbq:80","slug":"cloudbq","code":"2080","category":8,"rank":0,"type":"recall","level":2,"concept":"Scheduler OIDC identity","question":"What makes Cloud Scheduler able to call cloudbq's private Cloud Run service?","answer":"An OIDC token: each Scheduler job signs its GET as the function's own service account, which holds `roles/run.invoker` on the service, with the service URL as the token audience.","explanation":"The service is deployed `--no-allow-unauthenticated`, so the `invoker` step grants the role first and then creates the two jobs. The URL is read from `status.url` and used both as `--uri` base and as audience.","anchor":"A night porter who opens only for a badge issued by the building itself, and only if the badge names THIS door.","confusables":"`--oauth-service-account-email` on the write-back's Scheduler job — an OAuth token for the Google API `jobs.run`; OIDC is for calling YOUR service URL.","evidence_quote":"--oidc-service-account-email \"$(sa)\" --oidc-token-audience \"$u\"","tags":["scheduler","iam"],"source_refs":[{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":126,"end":134},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":30},{"path":"writeback/deploy_job.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":33}]},{"id":"cloudbq:81","slug":"cloudbq","code":"2081","category":8,"rank":1,"type":"cloze","level":1,"concept":"Function deploy flags","question":"cloudbq: complete the flags that keep the function private and single-flight in `deploy.sh deploy`.","answer":"--no-allow-unauthenticated · --max-instances 1 --concurrency 1","explanation":"Private: only an identity holding `roles/run.invoker` can call it (see 80). One instance, one request at a time: two entity runs cannot interleave on the service; the lease covers the rest (see 52).","cloze":"gcloud run deploy \"$FN\" ... --source \"$HERE\" --function new_deals_report --base-image python312 {{c1::--no-allow-unauthenticated}} ... --timeout 540 --memory 512Mi {{c2::--max-instances 1 --concurrency 1}}","evidence_quote":"--timeout 540 --memory 512Mi --max-instances 1 --concurrency 1","tags":["cloud-run"],"source_refs":[{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":118,"end":122}]},{"id":"cloudbq:82","slug":"cloudbq","code":"2082","category":8,"rank":2,"type":"recall","level":1,"concept":"HUBSPOT_TOKEN source","question":"Where does cloudbq's function get `HUBSPOT_TOKEN` from at run time?","answer":"Secret Manager: the secret `hubspot-token`, a pinned version, mounted with `--set-secrets`; NEVER from `.env`.","explanation":"`deploy.sh check-env` dies if `.env` holds a `HUBSPOT_TOKEN` line; the token is given in the shell only for the `secret` step, which creates the secret or adds a version. The write-back job reads a separate secret, `hubspot-token-write`.","evidence_quote":"HUBSPOT_TOKEN belongs in the shell for the secret step only, never in .env","tags":["secrets"],"source_refs":[{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":39,"end":41},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":93,"end":104},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":116},{"path":"writeback/deploy_job.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":30}]},{"id":"cloudbq:83","slug":"cloudbq","code":"2083","category":8,"rank":3,"type":"recall","level":1,"concept":"DTS HubSpot sync","question":"Which Google service copies HubSpot deals into BigQuery for cloudbq's lane C, and how often?","answer":"The BigQuery Data Transfer Service HubSpot connector: a FULL refresh of Deals + Owners every day at 02:00 UTC.","explanation":"Lane C's scheduled queries (Mondays 03:53 and 04:23 UTC) refuse a sync older than 36 h: they write an `ABORTED` runs row with `sync_stale` and raise.","confusables":"lane A's `search_created()` — it reads HubSpot's API at run time; the DTS sync is a COPY that can be up to a day old.","evidence_quote":"full refresh on every run). Creates or reports the transfer config for assets Deals + Owners, daily 02:00 UTC","tags":["lane-c"],"source_refs":[{"path":"sql/sync_transfer.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":2,"end":4},{"path":"sql/new_deals_weekly.sql","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":18,"end":24},{"path":"sql/sync_transfer.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":19,"end":21}]},{"id":"cloudbq:84","slug":"cloudbq","code":"2084","category":8,"rank":4,"type":"scenario","level":3,"concept":"WRITEBACK_APPROVE reset on redeploy","question":"cloudbq: after you redeploy the write-back job, HubSpot scores stop changing and `writeback_log` shows only `DRY` rows. What happened, and what is the fix?","answer":"The redeploy reset `WRITEBACK_APPROVE` to the `.env` value, default 0, and the job is DRY whenever the variable is not exactly `1`. Fix: run `writeback/deploy_job.sh live` again, and set `WRITEBACK_APPROVE=1` in `.env` so the next deploy keeps it.","explanation":"`deploy_job.sh deploy` always passes the variable in `--set-env-vars`; `live` only flips it on the deployed job, so the next deploy overwrites it. In dry mode every candidate is logged with status `DRY` and nothing is PATCHed.","example":"writeback/deploy_job.sh live  # gcloud run jobs update ... --update-env-vars WRITEBACK_APPROVE=1","evidence_quote":"a redeploy resets WRITEBACK_APPROVE to the .env value (default 0 = dry)","tags":["trap","lane-c"],"source_refs":[{"path":"writeback/deploy_job.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":13},{"path":"writeback/deploy_job.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":29},{"path":"writeback/deploy_job.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":38},{"path":"writeback/index.mjs","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":9}]},{"id":"cloudbq:90","slug":"cloudbq","code":"2090","category":9,"rank":0,"type":"recall","level":1,"concept":"Dry gate before enable","question":"Which cloudbq command is the gate before the schedulers are enabled, and what must it show?","answer":"`deploy.sh dry`: `?dry_run=1` for both entities must return `rows_written == 0` and `dry_run` true.","explanation":"If an assertion fails the script dies with 'dry run failed — do not enable the schedulers'. The two Scheduler jobs are created PAUSED by `invoker`; only `deploy.sh enable` resumes them. See 24 for what a dry run writes.","anchor":"A pilot's run-up at the end of the runway: engines roar, every gauge is read, the wheels never leave the ground; the tower clears take-off only after that.","example":"deploy.sh dry  # then: deploy.sh run SEALSQ, deploy.sh probe, deploy.sh enable","evidence_quote":"assert p.get(\"rows_written\") == 0, \"dry run wrote rows\"","tags":["dry-run"],"source_refs":[{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":155,"end":169},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":138,"end":139},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":173,"end":177}]},{"id":"cloudbq:91","slug":"cloudbq","code":"2091","category":9,"rank":1,"type":"recall","level":1,"concept":"Nothing has run on GCP yet","question":"What has cloudbq actually executed against Google Cloud so far?","answer":"NOTHING: every step is rehearsed offline only (`bash -n`, `DRYRUN=1`, the tests); the Evidence sections are empty.","explanation":"So every 'verified' claim is an offline test or a rendered command; CI repeats the rehearsal with a placeholder project. A `bq --dry_run` of a CALL proves existence and signature only, so the batch logic stays unproven until the vectors run in a dev dataset. See 99.","evidence_quote":"Pass 1 has not run against Google Cloud yet. Every command below was rehearsed offline","tags":["per-docs","status"],"source_refs":[{"path":"docs/PASS1_SEQUENCE.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":9,"end":10},{"path":".github/workflows/ci.yml","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b7 level":1,"concept":"Timeout defaults drift","question":"cloudbq's `docs/PASS3_RAW_ROOT.md` still gives `LAND_TIMEOUT_S` 90 s and `CALL_TIMEOUT_S` 300 s in places; which defaults does the code pin?","answer":"45 s and 240 s — `main.py` reads them as defaults and `tests/test_main_offline.py` asserts both.","explanation":"With 90 and 300 the worst case would be 4 x 90 + 300 + 90 + 20 = 770 s, far over Cloud Run's 540 s, and a killed request leaves the lease set. Code wins; see 53.","evidence_quote":"return int(os.environ.get(\"LAND_TIMEOUT_S\", \"45\"))","tags":["drift","timeouts"],"source_refs":[{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":208},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":250},{"path":"tests/test_main_offline.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":197},{"path":"docs/PASS3_RAW_ROOT.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":37},{"path":"docs/PASS3_RAW_ROOT.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":122}]},{"id":"cloudbq:94","slug":"cloudbq","code":"2094","category":9,"rank":4,"type":"scenario","level":4,"concept":"Event path unreachable","question":"cloudbq must show a new deal within minutes of its creation instead of on Monday. Which mechanism blocks the event path that already exists in `new_deals_report`, and what is the smallest change?","answer":"Verdict: the code is ready, the door is shut. (1) `POST {objectId, mode: event}` already lands ONE deal, CALLs with mode `event` and never touches the watermark or the lease. (2) Blocker: the service is deployed `--no-allow-unauthenticated`, and a HubSpot workflow webhook cannot present a Google OIDC token. (3) Smallest change: a relay that holds a Google identity (the n8n lane B) or a public route that validates the HubSpot signature; lane A itself stays private.","explanation":"The docstring of `main.py` still calls the event mode near-real-time; as deployed, new deals appear only at the weekly window run. An event slice is one deal, so two events in the same second never delete each other.","confusables":"`?dry_run=1` — also leaves the watermark alone, but its caller (the operator, `deploy.sh dry`) holds a Google identity; the event POST's intended caller, a HubSpot workflow webhook, CANNOT authenticate.","evidence_quote":"a HubSpot workflow webhook cannot present a Google OIDC token to a private service","tags":["event-mode","per-docs"],"source_refs":[{"path":"docs/PASS1_SEQUENCE.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":123,"end":124},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":355,"end":357},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":120},{"path":"docs/PASS2_L2_TIERS.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":100},{"path":"cloud_function_new_deals/main.py","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":15}]},{"id":"cloudbq:99","slug":"cloudbq","code":"2099","category":9,"rank":9,"type":"scenario","level":4,"concept":"Resume: first authenticated run","question":"cloudbq: you return after six months and want the first real weekly report. What is the next step, and what must hold before the schedulers are enabled?","answer":"Next step: run pass 1 for real, phase by phase, from `docs/RUNBOOK_CLOUD_SHELL.md`. (1) Apply tables and routines BEFORE deploying: the function CALLs the procedure from its first request. (2) Run the vectors check (`tests/pass3_batch_vectors.sql`) in a dev dataset: the first authenticated proof of the UDF, the adapter view and the table function; it does not CALL the procedure. (3) `deploy.sh dry` must pass for both entities, then one live `run` and `probe`, and only then `enable`; paste the outputs into the empty Evidence sections.","explanation":"Why this first: every claim in the repository is still an offline rehearsal (see 91). After it, the open items are lane C's first sync run and the write-back going live (`writeback/deploy_job.sh live`).","evidence_quote":"Next: the authenticated checks and the first live runs.","tags":["status"],"source_refs":[{"path":"README.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":39},{"path":"docs/PASS3_RAW_ROOT.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":155,"end":159},{"path":"cloud_function_new_deals/deploy.sh","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":169},{"path":"docs/PASS1_SEQUENCE.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":9,"end":10},{"path":"README.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":10},{"path":"docs/PASS3_RAW_ROOT.md","branch":"main","commit":"e4d40b27c4ad8f6e08478e4212fa64b79c6e9cf9","line":84,"end":89}]},{"id":"google-sheets-api-python:00","slug":"google-sheets-api-python","code":"3500","category":0,"rank":0,"type":"recall","level":1,"concept":"revenue_plan_line custom object","question":"What does the `revenue_model/` work in google-sheets-api-python build in HubSpot for the 20 manual-input revenue lines?","answer":"A HubSpot custom object `revenue_plan_line`: one record per line, bound to its canonical Company where a binding exists.","explanation":"The repository is a fork of a Google Sheets API tutorial; the owner's own work is `revenue_model/`: a design document, the S0-S9 runbook, the schema payload and three scripts. Before it, the 20 lines existed only as sheet rows with no CRM identity and no company relationship.","anchor":"Twenty loose sticky notes peel off a spreadsheet; each lands on an index card of its own, tied by one string to a company's doorplate.","example":"curl -X POST https://api.hubapi.com/crm-object-schemas/v3/schemas -H \"Authorization: Bearer $HUBSPOT_PRIVATE_APP_TOKEN\" -H \"Content-Type: application/json\" -d @revenue_model/schema_revenue_plan_line.json  # creates the object (S2)","evidence_quote":"One new custom object: `revenue_plan_line` (label \"Revenue Plan Line\"), one record per model line item (20 records)","tags":["custom-object"],"source_refs":[{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":121,"end":123},{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":15,"end":19},{"path":"revenue_model/schema_revenue_plan_line.json","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":1,"end":8}]},{"id":"google-sheets-api-python:01","slug":"google-sheets-api-python","code":"3501","category":0,"rank":1,"type":"recall","level":1,"concept":"system-of-record split","question":"Which system-of-record split does google-sheets-api-python's making layer rest on?","answer":"HubSpot owns a line's identity and company link; the Sheet owns its values, mirrored Sheet -> CRM ONE way.","explanation":"Planners edit the Sheet, never the mirror; the upsert is the only writer of `amount_*` and re-running it reconciles the copy. Breaks if undone: values drift silently between the CRM mirror and the Sheet (DFMEA RPN 175). see 70","anchor":"Planners write on a whiteboard and a camera copies it to the lobby screen; scribbling on the lobby screen changes nothing upstream and is wiped at the next copy.","confusables":"two-way sync — values would be editable on BOTH sides; here the CRM copy is read-only by rule and overwritten by the next upsert.","evidence_quote":"system of record for values = Sheet; for identity/relationship = CRM","tags":["one-way-mirror"],"source_refs":[{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":248,"end":249},{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":33,"end":36},{"path":"revenue_model/crm_upsert_plan_lines.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":16,"end":17},{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":211,"end":214}]},{"id":"google-sheets-api-python:10","slug":"google-sheets-api-python","code":"3510","category":1,"rank":0,"type":"recall","level":1,"concept":"one record per line","question":"google-sheets-api-python: a plan line has one value per year. How many `revenue_plan_line` records does it get, and where do the years live?","answer":"ONE record per line item (20 in all); its years are six number properties `amount_2025`..`amount_2030` in $M.","explanation":"Rejected: one record per line x year (120 records), which would flood a company sidebar with year-records and multiply association upkeep by six. Cost accepted: adding a year is a schema change, done once a year.","confusables":"`li_values.csv` row — the CSV is LONG (one row per line x year, 120 rows); the CRM record is WIDE (one per line, six amount properties).","evidence_quote":"1 record = 1 model line** (not 1 per line×year, not 1 per pursuit)","tags":["granularity"],"source_refs":[{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":127,"end":133},{"path":"revenue_model/crm_upsert_plan_lines.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":68,"end":70},{"path":"revenue_model/schema_revenue_plan_line.json","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":32,"end":37}]},{"id":"google-sheets-api-python:11","slug":"google-sheets-api-python","code":"3511","category":1,"rank":1,"type":"cloze","level":1,"concept":"bindable binding modes","question":"google-sheets-api-python · `crm_associate_companies.py`: complete the two `company_binding_mode` values whose lines get a company edge.","answer":"VERIFIED · VERIFIED_WITH_DUPES","explanation":"This is the governance gate in code: a line whose account is not pinned to one canonical record stays unassociated rather than wrongly associated. With the committed catalog it keeps 15 lines and skips 5.","confusables":"`PROSPECTIVE` / `AGGREGATE` — valid enum values too, but SKIPPED: those lines stay unassociated by design.","cloze":"`bindable_lines()` keeps a catalog row only when its `company_binding_mode` is {{c1::VERIFIED}} or {{c1::VERIFIED_WITH_DUPES}} and its company id is not empty.","evidence_quote":"BINDABLE = {\"VERIFIED\", \"VERIFIED_WITH_DUPES\"}","tags":["binding-gate"],"source_refs":[{"path":"revenue_model/crm_associate_companies.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":37},{"path":"revenue_model/crm_associate_companies.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":55,"end":61},{"path":"revenue_model/schema_revenue_plan_line.json","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":38,"end":45}]},{"id":"google-sheets-api-python:20","slug":"google-sheets-api-python","code":"3520","category":2,"rank":0,"type":"trace","level":3,"concept":"runbook S0 to S5 order","question":"google-sheets-api-python · WORKFLOW runbook: recite the 6 steps S0 to S5, from preflight to verified company associations.","answer":"preflight · dedup · schema · label · upsert · associate + verify","explanation":"The order is by dependency and each step has a Verify gate. The load-bearing constraint: S5 runs strictly after S1 and S4, so every edge lands on a canonical company that still exists and on a record that is already loaded. S6-S9 (permissions, Sheet re-sync, acceptance, DFMEA re-score) follow.","anchor":"A registry clerk checks her licence, glues twin company folders into one, prints a blank form, inks a stamp, fills 20 forms, then staples 15 of them to folders and recounts.","steps":["S0 preflight -> Enterprise tier, a free custom-object slot and a token confirmed","S1 dedup -> duplicate company records merged INTO the canonical record (irreversible)","S2 POST `schema_revenue_plan_line.json` -> the `revenue_plan_line` object exists","S3 create the `Plan line` association label -> edges to companies can carry the name","S4 `crm_upsert_plan_lines.py --execute` -> 20 records upserted by `li_key`","S5 `crm_associate_companies.py --execute`, then `--verify` -> 15/15 edges correct"],"evidence_quote":"Runs strictly **after S1 (dedup) and S4 (records exist)**","tags":["runbook-order"],"source_refs":[{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":159,"end":168},{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":3,"end":5},{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":32,"end":48},{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":52,"end":62},{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":91,"end":102},{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":120,"end":149}]},{"id":"google-sheets-api-python:30","slug":"google-sheets-api-python","code":"3530","category":3,"rank":0,"type":"locate","level":1,"concept":"upsert script entry point","question":"Which script in google-sheets-api-python loads the 20 plan-line records into HubSpot (runbook step S4)?","answer":"`revenue_model/crm_upsert_plan_lines.py --object-type \u003cfullyQualifiedName>`: `--dry-run` first, then `--execute`.","explanation":"`--dry-run` prints the count and the first input and returns BEFORE the token is read; `--execute` POSTs slices of 100 inputs to the batch upsert endpoint. Exactly one of the two flags is required. Records ONLY, no associations.","example":"python revenue_model/crm_upsert_plan_lines.py --object-type \u003cfullyQualifiedName> --dry-run  # '20 records to upsert into ...' then the first input as JSON","confusables":"`crm_associate_companies.py` — same flags plus `--verify`, but it creates EDGES to companies, never records.","evidence_quote":"res = call(token, \"POST\", f\"/crm/v3/objects/{args.object_type}/batch/upsert\",","tags":["cli"],"source_refs":[{"path":"revenue_model/crm_upsert_plan_lines.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":90,"end":95},{"path":"revenue_model/crm_upsert_plan_lines.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":74,"end":88}]},{"id":"google-sheets-api-python:31","slug":"google-sheets-api-python","code":"3531","category":3,"rank":1,"type":"output","level":3,"concept":"build_inputs() amounts as strings","question":"google-sheets-api-python · `build_inputs`: predict the exact value of the expression on the last line of the snippet below.","answer":"`'0.2'` — a STRING: `csv.DictReader` yields text and `build_inputs()` forwards `value_musd` verbatim, pivoting one CSV row per year into one `amount_\u003cyear>` property.","explanation":"(1) The 2026 row of the first catalog line holds `0.2`. (2) It is stored as text under the int key 2026. (3) `.get(y, \"0\")` returns that text; only a MISSING year falls back to `\"0\"`. No float conversion happens anywhere, so the model's figures reach the API exactly as typed.","code_snippet":"# li_catalog.csv, first row: li_cat_new_sealsq_prospects\n# li_values.csv: li_cat_new_sealsq_prospects,11,...,2026,0.2,...\nfor row in csv.DictReader(f):\n    values.setdefault(row[\"li_key\"], {})[int(row[\"year\"])] = row[\"value_musd\"]\n# ...\nfor y in YEARS:\n    props[f\"amount_{y}\"] = values[c[\"li_key\"]].get(y, \"0\")\ninputs.append({\"idProperty\": \"li_key\", \"id\": c[\"li_key\"], \"properties\": props})\n# ...\nbuild_inputs()[0][\"properties\"][\"amount_2026\"]","expected_output":"'0.2'","evidence_quote":"li_cat_new_sealsq_prospects,11,Catalog Product Customers,New SEALSQ Prospects,2026,0.2,Line item manual input,None","tags":["grounded:fixture","long-to-wide"],"source_refs":[{"path":"revenue_model/li_values.csv","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":3},{"path":"revenue_model/crm_upsert_plan_lines.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":46,"end":71},{"path":"revenue_model/li_catalog.csv","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":2}]},{"id":"google-sheets-api-python:60","slug":"google-sheets-api-python","code":"3560","category":6,"rank":0,"type":"why","level":2,"concept":"plan line as custom object","question":"Why does google-sheets-api-python model plan lines as a custom object `revenue_plan_line` rather than as HubSpot native line items?","answer":"Native line items have NO association type to companies: they hang only on deals, quotes and other commerce objects, with a single parent, and are cascade-deleted with it.","explanation":"The plan lines must hang on Companies and outlive any deal. Breaks if undone: every line needs a parent deal, enters deal analytics and vanishes when that deal is deleted. The products catalog was ruled out too: products cannot be associated with other objects. see 61","anchor":"A price tag sewn into one coat: sell or burn the coat and the tag goes with it, and nobody can pin that tag onto the customer's own file.","confusables":"native `line_items` — a child of ONE deal or quote with no company edge; the custom object is a standalone record whose only edge IS the company.","evidence_quote":"no line_item↔company association type exists","tags":["per-docs","custom-object"],"source_refs":[{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":109},{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":119,"end":123},{"path":"revenue_model/schema_revenue_plan_line.json","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":1,"end":8}]},{"id":"google-sheets-api-python:61","slug":"google-sheets-api-python","code":"3561","category":6,"rank":1,"type":"why","level":2,"concept":"company as the only edge","question":"Why does google-sheets-api-python's `revenue_plan_line` schema list `COMPANY` as its ONLY associated object rather than also linking plan lines to deals?","answer":"With NO join path to deals, plan values cannot leak into pipelines, forecast tools or win-rate reports: isolation rule R1 makes R3 structural instead of a matter of discipline.","explanation":"It is the reason a second 'planning' deal pipeline was rejected: deals always feed forecast analytics. The S2 gate checks that COMPANY is the only entry. Breaks if undone: planning figures get counted as live sales pipeline.","anchor":"A planner's wish list kept in a room with one door, opening onto the company shelves; the sales scoreboard hangs in another building with no corridor between them.","confusables":"a 'planning' deal pipeline — the lines would BE deals and appear in forecasts; the custom object has no deal edge at all.","evidence_quote":"Prevents any join path that could leak plan values into sales analytics.","tags":["isolation-rules"],"source_refs":[{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":174,"end":180},{"path":"revenue_model/schema_revenue_plan_line.json","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":8},{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":115,"end":116}]},{"id":"google-sheets-api-python:62","slug":"google-sheets-api-python","code":"3562","category":6,"rank":2,"type":"recall","level":1,"concept":"rule R5 one feed","question":"google-sheets-api-python: what does isolation rule R5 demand of every dollar in the revenue model?","answer":"It enters through exactly ONE feed: a pursuit covered by a plan line is excluded from the weighted-pipe scope.","explanation":"It answers the top DFMEA risk, double counting (RPN 216 = 9 x 6 x 4). R4 keeps the deal weighted-pipe layer (`weighted_amount_calculated`, cf. [private project]) read-only, and that pipe feeds only the Catalog segment line. The audit is quarterly and manual: no script exists for it.","confusables":"R1 — R1 forbids any EDGE from the object to deals; R5 forbids the same MONEY arriving twice, even when no edge exists.","evidence_quote":"every dollar enters the model through exactly one feed","tags":["per-docs","isolation-rules"],"source_refs":[{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":184,"end":190},{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":181,"end":183},{"path":"revenue_model/implementation_design.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":52}]},{"id":"google-sheets-api-python:70","slug":"google-sheets-api-python","code":"3570","category":7,"rank":0,"type":"recall","level":1,"concept":"li_key idempotent upsert key","question":"google-sheets-api-python: which property makes re-running the plan-line upsert safe?","answer":"`li_key`: unique-value text sent as `idProperty`, so each run is create-or-update with no record-id bookkeeping.","explanation":"No plan-line record id is stored anywhere in the repository (the ids in `li_catalog.csv` are COMPANY ids); the key is also the join column between the CRM record, `LI_CATALOG` and `LI_VALUES`. The association script resolves record ids from it at run time. The schema marks it `hasUniqueValue` and says never to rename it.","anchor":"A cloakroom ticket: hand in the same number twice and the attendant walks to the same hook; a second coat never appears.","confusables":"`label` — the display name, which may change FREELY; the key never does.","evidence_quote":"inputs.append({\"idProperty\": \"li_key\", \"id\": c[\"li_key\"], \"properties\": props})","tags":["idempotency"],"source_refs":[{"path":"revenue_model/crm_upsert_plan_lines.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":70},{"path":"revenue_model/crm_upsert_plan_lines.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":16,"end":17},{"path":"revenue_model/schema_revenue_plan_line.json","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":10,"end":11},{"path":"revenue_model/crm_associate_companies.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":92,"end":97}]},{"id":"google-sheets-api-python:80","slug":"google-sheets-api-python","code":"3580","category":8,"rank":0,"type":"recall","level":2,"concept":"Sheet deploy authentication","question":"What makes google-sheets-api-python's `deploy_line_items.py` able to write to a Google Sheet?","answer":"The fork's `pygs.Pygs` wrapper, which authenticates with a service-account key JSON at the repository root. In this fork that file is a PLACEHOLDER: put a real key there and share the spreadsheet with the service account as editor.","explanation":"`pygs.py` builds its credentials at IMPORT time, so the deploy script imports `Pygs` inside `main()` rather than at module level. Until the key is real, the Sheet re-sync (S7) cannot run.","example":"python revenue_model/deploy_line_items.py \u003cspreadsheet_id>  # clears and rewrites LI_CATALOG and LI_VALUES, appends the checksum block","confusables":"the HubSpot side — the two CRM scripts need only the env var `HUBSPOT_PRIVATE_APP_TOKEN` and the standard library; ONLY the Sheet deploy needs the key file and the Google packages.","evidence_quote":"from pygs import Pygs # imported late: module-level auth needs a real key file","tags":["service-account","late-import"],"source_refs":[{"path":"revenue_model/deploy_line_items.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":29},{"path":"revenue_model/deploy_line_items.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":3,"end":5},{"path":"pygs.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":13},{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":213,"end":214}]},{"id":"google-sheets-api-python:90","slug":"google-sheets-api-python","code":"3590","category":9,"rank":0,"type":"recall","level":2,"concept":"association verify gate","question":"google-sheets-api-python: which command proves the line-to-company associations are right, and what is its passing sign?","answer":"`python revenue_model/crm_associate_companies.py --object-type \u003cfullyQualifiedName> --verify` — last line `verify: 15/15 correct; expected total = 15`, exit code 0.","explanation":"A line is OK only when its associated companies equal EXACTLY the one canonical id, so a leftover second edge is a MISMATCH and the exit code is 1. The repository has no test suite: this gate and the Sheet checksum block are the proofs.","example":"python revenue_model/crm_associate_companies.py --object-type \u003cfullyQualifiedName> --verify; echo $?  # 0 only when every bindable line matches","evidence_quote":"sys.exit(0 if ok == len(lines) else 1)","tags":["verify-gate"],"source_refs":[{"path":"revenue_model/crm_associate_companies.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":125,"end":137},{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":181,"end":182}]},{"id":"google-sheets-api-python:91","slug":"google-sheets-api-python","code":"3591","category":9,"rank":1,"type":"compare","level":2,"concept":"li_catalog.csv source of truth","question":"google-sheets-api-python: `li_catalog.csv` vs the deployed `LI_CATALOG` Sheet tab: what is the ONE difference?","answer":"`li_catalog.csv` in the repository is the source of truth and holds the canonical company ids; the deployed `LI_CATALOG` tab is a STALE copy, published before the canonical designation.","explanation":"All three scripts read the CSV, never the tab. Fix: `python revenue_model/deploy_line_items.py \u003cspreadsheet_id>` (S7) clears the tab and rewrites it from the CSV.","anchor":"A master ledger locked in the office and a photocopy pinned in the corridor weeks ago: corrections go into the ledger while the corridor copy keeps last month's entries.","confusables":"`LI_CATALOG` tab — shows the pre-canonical binding modes until S7 is re-run; reading it instead of the CSV gives the WRONG association targets.","evidence_quote":"`li_catalog.csv` in this repo is the source of truth.","tags":["drift","per-docs"],"source_refs":[{"path":"revenue_model/WORKFLOW.md","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":207,"end":216},{"path":"revenue_model/crm_associate_companies.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":7,"end":8},{"path":"revenue_model/deploy_line_items.py","branch":"claude/workflow-design-framework-hg4q2l","commit":"214847b190a4b14fda1c7121ad4ef8ae48856c7b","line":20}]},{"id":"google-sheets-api-python:92","slug":"google-sheets-api-python","code":"3592","category":9,"rank":2,"type":"scenario","level":4,"concept":"active flag reset trap","question":"google-sheets-api-python: you retire a plan line by setting `active=false` in HubSpot, as the design prescribes, and leave its row in `li_catalog.csv`. What does the next `crm_upsert_plan_lines.py --execute` do to it, and what is the smallest fix?","answer":"It UN-RETIRES the line. (1) `build_inputs()` hard-codes `\"active\": \"true\"` for every catalog row. (2) `li_catalog.csv` has NO `active` column, so no row can say otherwise. (3) Smallest fix: add an `active` column to the catalog and read it in `build_inputs()`; until then, remove the row from the catalog before retiring the record.","explanation":"Drift between design and code: the design says retirement is `active=false`, never delete; the code resets the flag on every run. Inputs are ames are all declared there; probe results and the four renderers are regenerated from it on every run.","confusables":"the rendered workbooks — they are OUTPUTS regenerated from the YAML, never the place to edit.","evidence_quote":"YAML as single source of truth, declarative + re-runnable","source_refs":[{"path":"README.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":13},{"path":"src/ontology_substrate/schema/loader.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":14,"end":15}]},{"id":"ic-ontology:02","slug":"ic-ontology","code":"4002","category":0,"rank":2,"type":"recall","level":1,"concept":"Import name ontology_substrate","question":"Which Python import name does ic-ontology's package use, given that the repo is called IC-Ontology?","answer":"`ontology_substrate` — the package is generic; the repo name marks the IC'ALPS -> HubSpot instantiation.","example":"from ontology_substrate.schema.loader import load_ontology  # not `import ic_ontology`","confusables":"`ontology-substrate` (hyphen) — the pip DISTRIBUTION and console-script name; the importable module uses an underscore.","evidence_quote":"Python import name: `ontology_substrate`. Repo name: `IC-Ontology`.","source_refs":[{"path":"README.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":7,"end":9},{"path":"pyproject.toml","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":6},{"path":"pyproject.toml","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":25}]},{"id":"ic-ontology:10","slug":"ic-ontology","code":"4010","category":1,"rank":0,"type":"locate","level":1,"concept":"Edge central dataclass","question":"Which dataclass in ic-ontology models one relationship between two entities, with its FK column at each layer?","answer":"`Edge` in `src/ontology_substrate/schema/edge.py`; only `name`, `source`, `target`, `cardinality` are required.","explanation":"Optional: `bronze_source_fk`, `silver_source_fk`, `mirror_source_fk`, `mirror_target_match_col`, the three `assoc_*` fields, `expected_from`, `portal_constraint`, `notes` and a list of type bindings. For bronze, silver and mirror it names COLUMNS only; those tables live on the source `Entity` (see 20). The gold `assoc_table` is the one table an edge names itself.","anchor":"A courier's waybill lists the locker NUMBER to open at each of three depots, but not the depots' addresses; those are on the sender's file card.","confusables":"`EdgeTypeBinding` — ONE association type id of a relationship (with its API-reverse id); the relationship itself holds a LIST of them.","evidence_quote":"class Edge: name: str source: str target: str cardinality: str bronze_source_fk: str | None = None","source_refs":[{"path":"src/ontology_substrate/schema/edge.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":35,"end":51},{"path":"src/ontology_substrate/schema/edge.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":54,"end":60}]},{"id":"ic-ontology:11","slug":"ic-ontology","code":"4011","category":1,"rank":1,"type":"recall","level":1,"concept":"expected_from denominator switch","question":"ic-ontology: what does an edge's `expected_from` field select?","answer":"The fill-rate DENOMINATOR: `bronze` (default) -> bronze count; `mirror` -> gold count.","explanation":"Task edges declare `mirror` because the phaseA-created call tasks bypass bronze entirely, so a bronze denominator would be wrong for them. The trap this opens is in 92.","example":"task_company: expected_from: mirror  # note_company keeps expected_from: bronze","confusables":"`materialized_default` — the NUMERATOR; it is always the gold count, whatever `expected_from` says.","evidence_quote":"result.bronze_count if edge.expected_from == \"bronze\" else result.gold_count","source_refs":[{"path":"src/ontology_substrate/probe/fill_rates.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d y `ontology` becomes an `OntologyDocument`","caller builds a connectors dict keyed `bronze` / `silver` / `gold` -> `ProbeEngine(...)`","`ProbeEngine.run()` -> loops over `ontology.edges`, one edge per iteration","`_edge_context(edge.source)` -> the SOURCE entity's bronze / silver / mirror tables","`is_engagement_edge(edge)` -> `process_engagement` or `process_interentity`","`compute_*_counts()` -> bronze, silver and gold counts read through the connectors","`edge.expected_from` -> `expected` = bronze count, or gold count for `mirror`","one `EdgeProbeResult` per edge -> counts plus four zero-safe rate properties","caller passes the results to the renderers (a payload dict for the three XLSX writers, plain lists for the CSV sheets) -> CSV sheets, two workbooks, metagraph"],"evidence_quote":"ctx = self._edge_context(edge.source)","source_refs":[{"path":"src/ontology_substrate/probe/engine.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":40,"end":48},{"path":"src/ontology_substrate/schema/loader.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":14,"end":15},{"path":"src/ontology_substrate/probe/fill_rates.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":34,"end":48},{"path":"src/ontology_substrate/probe/edge_processors.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":45,"end":46},{"path":"src/ontology_substrate/renderers/metagraph.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":36,"end":38},{"path":"tests/test_probe/test_engine.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":33,"end":34}]},{"id":"ic-ontology:21","slug":"ic-ontology","code":"4021","category":2,"rank":1,"type":"compare","level":2,"concept":"Inter-entity vs engagement counts","question":"ic-ontology: `compute_interentity_counts` vs `compute_engagement_counts`: what is the ONE difference?","answer":"Inter-entity takes the bronze ource_refs":[{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":4},{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":19,"end":25},{"path":"pyproject.toml","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":22}]},{"id":"ic-ontology:31","slug":"ic-ontology","code":"4031","category":3,"rank":1,"type":"output","level":3,"concept":"Dry-run summary on fixture","question":"ic-ontology · CLI `main`: predict the printed lines of the command below, run on the canonical 7-entity fixture.","answer":"Five lines: name and version, `entities: 7`, `edges: 13`, then the two adapter NAMES (`hubspot`, `stacksync`) — a summary of what the schema parsed; return code 0.","explanation":"13 edges = 4 inter-entity + 9 engagement. The two adapter lines only echo strings stored by the loader (see 93). `tests/test_cli.py` asserts four of the five lines.","code_snippet":"python -m ontology_substrate probe --ontology tests/fixtures/7_entity_icload_style.yaml --dry-run","expected_output":"ontology: ic-load-corrections v0.7.0\nentities: 7\nedges: 13\ntarget_system_adapter: hubspot\nsync_provider_adapter: stacksync","evidence_quote":"ontology: ic-load-corrections v0.7.0","tags":["grounded:doc"],"source_refs":[{"path":"README.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":31,"end":41},{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":31,"end":37},{"path":"tests/test_cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":8,"end":13},{"path":"tests/fixtures/7_entity_icload_style.yaml","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":9,"end":18}]},{"id":"ic-ontology:32","slug":"ic-ontology","code":"4032","category":3,"rank":2,"type":"output","level":3,"concept":"parse_drift_flag unknown flag","question":"ic-ontology · `parse_drift_flag`: predict the result of the call below.","answer":"It RAISES `ValueError: unknown drift flag: foo` — the vocabulary is CLOSED, so a typo in a YAML `drift_flags` list stops the load instead of becoming an eighth flag.","explanation":"Order inside the function: (1) the legacy alias table, (2) `DriftFlag(raw)`, (3) the enum's own ValueError re-raised with this message. `PropertyLineage.from_dict` sends every flag through it.","confusables":"`parse_drift_flag(\"renamed\")` — a LEGACY alias, so it returns `DriftFlag.NAMING_DRIFT` instead of raising.","code_snippet":"parse_drift_flag(\"foo\")","expected_output":"ValueError: unknown drift flag: foo","evidence_quote":"with pytest.raises(ValueError, match=\"unknown drift flag: foo\"):","tags":["grounded:test","intended-error"],"source_refs":[{"path":"tests/test_schema/test_drift_flags.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":34,"end":36},{"path":"src/ontology_substrate/schema/drift_flags.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":32,"end":38},{"path":"src/ontology_substrate/schema/property_lineage.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":24}]},{"id":"ic-ontology:33","slug":"ic-ontology","code":"4033","category":3,"rank":3,"type":"output","level":3,"concept":"CsvConnector.filled_count nulls","question":"ic-ontology · `CsvConnector.filled_count`: predict the return value of the last call below.","answer":"`2` — it counts the NON-NULL cells of the column (`notna().sum()`), so the empty `b` of the third row is skipped; `row_count` on the same file is 3.","explanation":"This is the 'filled' half of every fill rate: `row_count` = how many rows exist, `filled_count` = how many carry the value. The DataFrame is cached per file name, so a file changed mid-run is NOT re-read.","confusables":"`CsvConnector.row_count` — `len()` of the DataFrame: counts ROWS (3 here), not filled cells.","code_snippet":"# Bronze_Deals.csv holds:\n#   a,b,c\n#   1,2,3\n#   4,5,6\n#   7,,9\nc = CsvConnector(name=\"bronze\", path_pattern=str(tmp_path / \"Bronze_*.csv\"))\nc.filled_count(table_or_file=\"Bronze_Deals.csv\", column=\"b\")","expected_output":"2","evidence_quote":"assert c.filled_count(table_or_file=\"Bronze_Deals.csv\", column=\"b\") == 2","tags":["grounded:test"],"source_refs":[{"path":"tests/test_probe/test_connectors.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":18,"end":23},{"path":"src/ontology_substrate/probe/connectors.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":44,"end":46}]},{"id":"ic-ontology:40","slug":"ic-ontology","code":"4040","category":4,"rank":0,"type":"recall","level":1,"concept":"Five subpackages of substrate","question":"ic-ontology: which five subpackages make up `ontology_substrate`?","answer":"`schema` · `adapters` · `probe` · `renderers` · `audit` (with `cli.py` on top).","explanation":"schema = dataclasses + the YAML loader · adapters = the two CRM-agnostic interfaces and their reference implementations · probe = connectors, engine, fill rates · renderers = CSV sheets and three workbooks · audit = SQLite trail of the memory observations behind the design.","anchor":"A print shop in five rooms: type cases, a shelf of interchangeable couplings, a proof-reader counting line by line, the presses, and a locked cabinet of who dictated what.","evidence_quote":"schema → adapters → probe → renderers → CLI","source_refs":[{"path":"docs/phases/phase_a_renderers_cli.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":12},{"path":"src/ontology_substrate/schema/__init__.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1},{"path":"src/ontology_substrate/adapters/base.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1,"end":5},{"path":"src/ontology_substrate/probe/__init__.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1},{"path":"src/ontology_substrate/renderers/__init__.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1},{"path":"src/ontology_substrate/audit/__init__.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1}]},{"id":"ic-ontology:41","slug":"ic-ontology","code":"4041","category":4,"rank":1,"type":"compare","level":2,"concept":"Ontology workbook vs coverage workbook","question":"ic-ontology: `write_ontology_workbook` vs `write_coverage_workbook`: what is the ONE difference?","answer":"The ontology workbook is the 6-sheet GRAPH view (entities, edges, probe counts and rates); the coverage workbook is the 8-sheet FLAT v7-style view with one row per PROPERTY.","explanation":"Audiences differ: the workbook is the engineering build artefact, coverage the operator audit. Coverage is still a shape skeleton: its fill-rate and count cells are empty, the four 'is in ...' cells are hard-coded `True`, and 7 of its 8 sheets hold only a header row.","anchor":"Same city, two documents: a metro map with lines between stations, and a phone book with one line per resident where most numbers are still blank.","confusables":"`write_coverage_workbook` — FLAT per-property audit shape, no probe results in it; the ontology workbook is graph-shaped and carries the counts.","evidence_quote":"v7-style flat coverage workbook — 8 sheets, per-property fill-rate matrix.","source_refs":[{"path":"src/ontology_substrate/renderers/coverage.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1},{"path":"src/ontology_substrate/renderers/coverage.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":43,"end":53},{"path":"src/ontology_substrate/renderers/workbook.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1,"end":9},{"path":"docs/phases/phase_a_renderers_cli.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":51}]},{"id":"ic-ontology:42","slug":"ic-ontology","code":"4042","category":4,"rank":2,"type":"locate","level":1,"concept":"Metagraph living tool renderer","question":"Which renderer in ic-ontology writes the operator's one-sheet 'living tool' with a live Fill Rate column?","answer":"`write_metagraph()` in `renderers/metagraph.py`: sheet `Metagraph - Edges`, 20 columns, one row per type binding.","explanation":"First column = the human association label (falls back to the edge name); last column = `all_types_fill_rate` of the latest probe as a one-decimal percentage. The operator sorts on it while throttling association writes. Caveat: the rate is per EDGE, so every binding row of one edge shows the same value.","confusables":"the `Metagraph-Edges` sheet of `write_ontology_workbook` — 19 columns and NO Fill Rate column.","evidence_quote":"Standalone metagraph view — the operator's living tool.","source_refs":[{"path":"src/ontology_substrate/renderers/metagraph.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1,"end":6},{"path":"src/ontology_substrate/renderers/metagraph.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":30,"end":38},{"path":"tests/test_renderers/test_metagraph.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":10,"end":14},{"path":"src/ontology_substrate/renderers/workbook.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":30,"end":37}]},{"id":"ic-ontology:50","slug":"ic-ontology","code":"4050","category":5,"rank":0,"type":"recall","level":1,"concept":"Synchronous on-demand probe run","question":"How and when does an ic-ontology probe run?","answer":"On demand, synchronously: `ProbeEngine.run()` is one sequential loop over `ontology.edges`; no scheduler, no async.","explanation":"Nothing in the repository schedules or deploys it: calling code builds the connectors dict and calls `run()` once. A layer without a connector leaves its count at 0 with no error. `PostgresConnector` opens its connection lazily, on the first count.","anchor":"A night watchman with one lantern checks the doors of a corridor one after another, and only when someone rings for him.","evidence_quote":"for edge in self.ontology.edges:","tags":["inferred"],"source_refs":[{"path":"src/ontology_substrate/probe/engine.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":40,"end":48},{"path":"src/ontology_substrate/probe/connectors.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":55,"end":59},{"path":"src/ontology_substrate/probe/edge_processors.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":51,"end":57}]},{"id":"ic-ontology:60","slug":"ic-ontology","code":"4060","category":6,"rank":0,"type":"why","level":2,"concept":"Edge as unit of work","question":"Why does ic-ontology's probe take one EDGE as its unit of work rather than one target, as ic-load's base `Correction.run()` does?","answer":"Because what is measured is a RELATIONSHIP materialising layer by layer (bronze FK -> silver FK -> gold association table). ic-load's `probe_ontology.py` already overrides `Correction.run()` for that, and the substrate preserves it.","explanation":"Breaks if undone: `EdgeProbeResult`, the Relationship Lineage sheet and the metagraph Fill Rate are all keyed on `edge_name`; a per-target run has no row to hold the three layer counts.","anchor":"A bridge inspector is paid per bridge, not per pedestrian: he counts who set off, who reached the middle pier and who arrived on the far bank.","confusables":"cf. ic-load `Correction.run()`: the corrections framework works per TARGET; the ontology probe overrides it to work per edge.","evidence_quote":"because the unit of work is one edge, not one target. We preserve that.","tags":["inferred"],"source_refs":[{"path":"src/ontology_substrate/probe/edge_processors.py","branch":"main","commit":"0684d6dd0970f94
