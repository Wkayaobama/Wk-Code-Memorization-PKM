c28307cd3a4e26d255d81ea45","line":3,"end":4},{"path":"src/ontology_substrate/probe/engine.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1},{"path":"README.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":14}]},{"id":"ic-ontology:61","slug":"ic-ontology","code":"4061","category":6,"rank":1,"type":"why","level":2,"concept":"Explicit type-id pairing","question":"Why does ic-ontology write each association type as one list item with a nested `api_reverse` block rather than ic-load's three parallel dicts (`types`, `type_labels`, `api_reverse_labels`)?","answer":"ic-load paired a mirror type id with its API-reverse id only by dict insertion ORDER; one item per binding makes the pair explicit, so reordering the YAML can no longer mis-pair them.","explanation":"Each item becomes one `EdgeTypeBinding(id, role, label, api_reverse_id, api_reverse_label)`; an item without the block gets `None` for both reverse fields. Breaks if undone: an asymmetric label (forward text differs from reverse text) lands on the wrong direction, silently.","anchor":"Left and right shoes: the old shop kept them in two bins sorted the same way; the new one ties each pair together by the laces.","confusables":"ic-load's parallel dicts — the pairing is IMPLICIT (n-th id with n-th reverse id); in the substrate one object holds both.","evidence_quote":"The substrate makes this explicit so future ontologies don't depend on dict ordering.","tags":["per-docs"],"source_refs":[{"path":"docs/phases/phase_a_schema.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":74},{"path":"src/ontology_substrate/schema/edge.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":23,"end":32},{"path":"tests/fixtures/7_entity_icload_style.yaml","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":4,"end":7}]},{"id":"ic-ontology:62","slug":"ic-ontology","code":"4062","category":6,"rank":2,"type":"why","level":2,"concept":"Two adapter seams","question":"Why does ic-ontology parameterise over TWO interfaces, `TargetSystemAdapter` and `SyncProviderAdapter`, rather than abstracting only the CRM?","answer":"A CRM swap alone would leave the mirror layer hard-coded: the sync provider decides the mirror's record-id columns and which drift modes can occur, so it gets its own seam.","explanation":"Target = destination-CRM semantics (`reconciliation_id_for`). Sync provider = the layer between CRM and mirror DB (`mirror_record_id_column`, `boundary_drift_modes`): StackSync exposes three drift modes, `DirectAPISyncProvider` has no mirror and only `api_readonly`. Breaks if undone: a tenant without StackSync cannot be described. Status: declared but not wired (see 93).","anchor":"A travel plug with two swappable ends, one for the wall socket and one for the device cable: weld either end and it works in a single hotel only.","confusables":"`TargetSystemAdapter` — WHERE records end up (the CRM); `SyncProviderAdapter` is HOW they travel between the CRM and the Postgres mirror.","evidence_quote":"because \"CRM-agnostic\" loses meaning if the mirror layer is hard-coded.","tags":["per-docs"],"source_refs":[{"path":"docs/phases/phase_a_adapters_probe.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":78},{"path":"src/ontology_substrate/adapters/base.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":13,"end":45},{"path":"src/ontology_substrate/adapters/reference/direct_api.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":14,"end":18}]},{"id":"ic-ontology:63","slug":"ic-ontology","code":"4063","category":6,"rank":3,"type":"scenario","level":4,"concept":"Hard-coded engagement entity set","question":"ic-ontology must probe a second tenant whose activity entities are named `email` and `visit`. Which mechanism mishandles their edges, and what is the smallest change?","answer":"They are probed as inter-entity edges, silently. (1) `is_engagement_edge` tests `edge.source in ENGAGEMENT_ENTITIES`, the hard-coded set `{note, call, meeting, task}`. (2) Consequence: bronze becomes a full `row_count` instead of the filled-FK count, which deflates the rates; no error is raised. (3) Smallest change: read the set from the ontology YAML or the target adapter and hand it to `ProbeEngine`.","explanation":"This is the first thing that breaks the CRM-agnostic claim: the set lives in `probe/edge_processors.py`, not in the YAML or in an adapter. The difference between the two branches is card 21.","evidence_quote":"ENGAGEMENT_ENTITIES = {\"note\", \"call\", \"meeting\", \"task\"}","tags":["inferred"],"source_refs":[{"path":"src/ontology_substrate/probe/edge_processors.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":14},{"path":"src/ontology_substrate/probe/edge_processors.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":45,"end":46},{"path":"src/ontology_substrate/probe/engine.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":44,"end":47},{"path":"src/ontology_substrate/probe/fill_rates.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":35,"end":36}]},{"id":"ic-ontology:70","slug":"ic-ontology","code":"4070","category":7,"rank":0,"type":"recall","level":1,"concept":"audit_observations table","question":"Which is the only persistent store ic-ontology defines, and what does one row record?","answer":"SQLite table `audit_observations`: one claude-mem observation and the design claim it supported.","explanation":"Columns: `observation_id` (primary key), `project`, `created_at`, `title`, `narrative_excerpt`, `reconstruction_step`, `claim_supported`, `fetched_at`. It is the fact-check trail of the reconstruction: which memory underwrote which step. The database FILE is not in this repository: Phase B creates it in the ic-load working tree under `_scratch/audit/`.","anchor":"A notary's ledger: every line names one remembered testimony and the wall of the house it was used to rebuild.","confusables":"probe results — NEVER persisted by the package; they live in memory until a renderer writes a CSV or XLSX.","evidence_quote":"CREATE TABLE IF NOT EXISTS audit_observations (","source_refs":[{"path":"src/ontology_substrate/audit/schema.sql","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1,"end":10},{"path":"src/ontology_substrate/audit/db.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":3,"end":12},{"path":"docs/phases/phase_b_probe_drift.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":128}]},{"id":"ic-ontology:71","slug":"ic-ontology","code":"4071","category":7,"rank":1,"type":"output","level":3,"concept":"AuditDB.insert idempotent re-seed","question":"ic-ontology · `AuditDB.insert`: predict the number of rows and the stored `claim_supported` after the calls below.","answer":"1 row holding `first claim refined` — `INSERT OR REPLACE` on the primary key `observation_id` OVERWRITES instead of duplicating or raising.","explanation":"The first argument of `_make_obs` is the `observation_id`. This makes re-seeding idempotent: every Phase B script can re-insert its observations. A plain INSERT would fail on the second call with a primary-key conflict.","confusables":"`insert_many()` — loops over `insert()` and returns the number of CALLS, not the number of distinct rows left in the table.","code_snippet":"db = AuditDB(db_path)\ndb.init_schema()\ndb.insert(_make_obs(1, \"step-a\", \"first claim\"))\ndb.insert(_make_obs(1, \"step-a\", \"first claim refined\"))\nrows = db.fetch_all()\n# len(rows) ?   rows[0].claim_supported ?","expected_output":"len(rows) == 1\nrows[0].claim_supported == \"first claim refined\"","evidence_quote":"assert rows[0].claim_supported == \"first claim refined\"","tags":["grounded:test"],"source_refs":[{"path":"tests/test_audit/test_db.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":32,"end":40},{"path":"src/ontology_substrate/audit/db.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":51,"end":60},{"path":"src/ontology_substrate/audit/schema.sql","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":2}]},{"id":"ic-ontology:80","slug":"ic-ontology","code":"4080","category":8,"rank":0,"type":"recall","level":2,"concept":"Editable install into ic-load","question":"What makes ic-ontology usable from the Phase B probe scripts that live in ic-load?","answer":"An EDITABLE install: `pip install -e \u003contology-substrate>[dev]` into the ic-load virtualenv, so the scripts simply `from ontology_substrate... import`. There is no deployment, CI job or container.","explanation":"The live wiring (connectors -> `ProbeEngine` -> renderers), the converted ontology, the drift outputs and the audit SQLite file all live in ic-load under `_scratch/ontology_probe_phase_b/` and `_scratch/audit/`, outside this repository.","anchor":"A toolbox lent to the neighbour's workbench on a long chain: the tools stay yours, and the ones you sharpen at home are sharp over there too.","confusables":"cf. ic-load `_scratch/ontology_probe_phase_b/`: the Phase B scripts RUN there; ic-ontology only supplies the importable package.","evidence_quote":"because the ic-load Python venv has it installed editable","tags":["per-docs"],"source_refs":[{"path":"docs/phases/phase_b_probe_drift.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":8},{"path":"pyproject.toml","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":21,"end":25},{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":40,"end":43}]},{"id":"ic-ontology:81","slug":"ic-ontology","code":"4081","category":8,"rank":1,"type":"why","level":2,"concept":"REST archive not SQL DELETE","question":"Why must an ic-ontology deletion-candidate HubSpot property be removed through the v3 REST archive endpoint rather than a SQL DELETE on the StackSync mirror?","answer":"A SQL DELETE against the mirror leaves a visible 'deleted record' shell; the archive endpoint removes it in the CRM itself. Each removal also needs per-operation operator authorisation: candidates are REPORTED, never executed.","explanation":"A deletion candidate is a HubSpot property that is NOT in the substrate ontology and NOT platform-native; Phase B listed 7 high-confidence ones from the v7 curation. Breaks if undone: tombstone shells in the mirror and an unauthorised change to `hubspot.*`.","anchor":"Tearing a page out of the photocopy leaves a stub in the binder; only the registrar can strike the entry in the original book.","confusables":"SQL DELETE on `hubspot.*` — acts on the MIRROR copy and leaves a shell; the archive endpoint acts on the CRM itself.","evidence_quote":"SQL DELETE leaves a visible \"deleted record\" shell","tags":["per-docs"],"source_refs":[{"path":"docs/phases/phase_b_probe_drift.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":93,"end":96},{"path":"docs/phases/phase_b_probe_drift.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":70,"end":72}]},{"id":"ic-ontology:90","slug":"ic-ontology","code":"4090","category":9,"rank":0,"type":"recall","level":1,"concept":"Test suite passing sign","question":"How do you prove ic-ontology works after a fresh clone, and what is the passing sign?","answer":"`pip install -e \".[dev]\"` then `pytest -v`: 62 tests pass, no database needed (connectors are mocked).","explanation":"62 = schema 22 + smoke 1, adapters 8, probe 12, renderers 12, CLI 2, audit 5. pytest temp dirs are routed into the project by `addopts = \"--basetemp=.pytest_tmp\"`. Second check: the dry-run on the canonical fixture (see 31).","anchor":"A fire drill with cardboard hydrants: sixty-two checks pass without a drop of real water.","evidence_quote":"Cumulative suite: 62 passing.","tags":["per-docs"],"source_refs":[{"path":"docs/phases/phase_audit_db.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":5},{"path":"README.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":28,"end":31},{"path":"pyproject.toml","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":31},{"path":"tests/test_probe/test_engine.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":1}]},{"id":"ic-ontology:91","slug":"ic-ontology","code":"4091","category":9,"rank":1,"type":"scenario","level":3,"concept":"CLI live path not implemented","question":"ic-ontology: you run `python -m ontology_substrate probe --ontology x.yaml --out-dir out` expecting workbooks in `out/`. What happens?","answer":"It loads the YAML, then RAISES `NotImplementedError`: only `--dry-run` is implemented. `--out-dir` is parsed (default `./probe_out`) but never read; live probing is wired by the Phase B scripts kept in ic-load.","explanation":"Do instead: add `--dry-run` to validate the file, and wire connectors -> `ProbeEngine` -> renderers in calling code, as the tests and Phase B do. Because the load comes first, a broken YAML fails with its own error before this one.","evidence_quote":"Live probe is wired by Phase B scripts in ic-load/_scratch/ontology_probe_phase_b/.","tags":["trap","intended-error"],"source_refs":[{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":38,"end":43},{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":26},{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":30}]},{"id":"ic-ontology:92","slug":"ic-ontology","code":"4092","category":9,"rank":2,"type":"scenario","level":4,"concept":"Mirror-expected fill rate trap","question":"ic-ontology: the metagraph shows Fill Rate `100.0%` for `task_company`, an edge declared `expected_from: mirror`. How much does that number tell you, and what do you read instead?","answer":"Nothing. (1) With `mirror`, `expected` is set to `gold_count`. (2) `materialized_all_types` is ALSO set to `gold_count`, so the rate is gold / gold: 100.0% as soon as one association row exists, 0.0% when none does. (3) Read the raw `gold_count` and compare it with the row counts of the task silver marts, or add a real mirror-side expected count.","explanation":"`source_side_fill_rate` has the same flaw (`materialized_default` is gold too). `materialized_custom` is never set, so every rate is per edge, never per type id.","evidence_quote":"result.materialized_all_types = result.gold_count","tags":["trap","inferred"],"source_refs":[{"path":"src/ontology_substrate/probe/fill_rates.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":77,"end":81},{"path":"src/ontology_substrate/probe/edge_processors.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":40,"end":42},{"path":"src/ontology_substrate/renderers/metagraph.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":36,"end":38},{"path":"tests/fixtures/7_entity_icload_style.yaml","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":257,"end":262},{"path":"tests/test_probe/test_engine.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":55,"end":56}]},{"id":"ic-ontology:93","slug":"ic-ontology","code":"4093","category":9,"rank":3,"type":"recall","level":2,"concept":"Adapters declared not wired","question":"ic-ontology's schema phase doc says the probe engine will route runtime calls through whichever adapter the YAML names. What does the code actually do with `target_system.adapter`?","answer":"It only STORES the name as a string (`OntologyDocument.target_system_adapter`), and the dry-run prints it. No registry or factory instantiates an adapter, and `ProbeEngine` never touches one.","explanation":"Changing `adapter: hubspot` in the YAML changes one printed line and nothing else. To use `HubSpotTargetAdapter` or `StackSyncProviderAdapter` you construct them by hand in calling code. The same holds for `layers`: nothing builds connectors from them.","confusables":"the adapter CLASSES under `adapters/reference/` — they exist and are tested, but nothing maps the YAML's adapter NAME to them.","evidence_quote":"target_system_adapter=raw[\"target_system\"][\"adapter\"],","tags":["drift"],"source_refs":[{"path":"src/ontology_substrate/schema/loader.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":31},{"path":"docs/phases/phase_a_schema.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":85},{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":35},{"path":"src/ontology_substrate/probe/engine.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":22,"end":25}]},{"id":"ic-ontology:99","slug":"ic-ontology","code":"4099","category":9,"rank":9,"type":"recall","level":2,"concept":"Next step live CLI path","question":"What is the next planned step for ic-ontology?","answer":"Implement the non-dry-run path of `cli.py`: build the connectors, run `ProbeEngine`, write the renderers' files into `--out-dir`, so a live probe is ONE command instead of scripts kept in ic-load.","explanation":"Unblocks: a second tenant can be probed without copying the Phase B scripts. `--out-dir` already exists and is unused. Further gaps visible in the code, not written down as plans: an adapter registry keyed by the YAML names (see 93) and a real denominator for mirror-expected edges (see 92).","evidence_quote":"(in eventual non-dry mode) wire connectors → ProbeEngine → renderers","tags":["inferred"],"source_refs":[{"path":"docs/phases/phase_a_adapters_probe.md","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":196},{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":26},{"path":"src/ontology_substrate/cli.py","branch":"main","commit":"0684d6dd0970f94c28307cd3a4e26d255d81ea45","line":38,"end":43}]},{"id":"bhead-claude:00","slug":"bhead-claude","code":"5000","category":0,"rank":0,"type":"recall","level":1,"concept":"What HR Scout is","question":"What is bhead-claude, and what does it do with a job board?","answer":"HR Scout: it scrapes job boards, has Claude extract structured postings, scores each one, and coaches interview prep.","explanation":"React 18 + Vite frontend, FastAPI + Motor backend, MongoDB 7, and the Anthropic API called directly with your own key. It began as an Understand Studio generated app; the `claude/standalone-app` line made it self-contained.","anchor":"A recruiting office conveyor belt: posters go in, a clerk types one index card per job, an examiner stamps a mark out of 100 on each card, a coach rehearses the candidate.","evidence_quote":"it scrapes job boards you configure, extracts structured postings with Claude, scores each extraction with deterministic quality rules","source_refs":[{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":3,"end":6},{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":8,"end":9}]},{"id":"bhead-claude:01","slug":"bhead-claude","code":"5001","category":0,"rank":1,"type":"recall","level":1,"concept":"The one-seam invariant","question":"Which invariant does bhead-claude exist to protect?","answer":"Every Claude call goes through ONE seam, `backend/app/llm.py`; nothing else imports `anthropic`.","explanation":"That makes swapping the model, adding a gateway `base_url`, caching or usage metering a one-file edit. Breaks if undone: an SDK call written inside a route escapes the refusal and truncation guards. The headless rail on `main` follows the same rule, see 61.","anchor":"A castle with a single drawbridge: every messenger to the oracle crosses it, so the guard there can change the toll or the road for all of them at once.","confusables":"`headless.py` on `main` — the seam of the other rail: the only place a `claude` SUBPROCESS is spawned, where `llm.py` is the only importer of `anthropic`.","evidence_quote":"Every Claude call in the codebase goes through this module; nothing else imports `anthropic`.","tags":["ai-seam","line:claude/standalone-app"],"source_refs":[{"path":"backend/app/llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":3,"end":5},{"path":"claude-template/template/backend/app/headless.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":15,"end":16}]},{"id":"bhead-claude:02","slug":"bhead-claude","code":"5002","category":0,"rank":2,"type":"compare","level":2,"concept":"main vs claude/standalone-app","question":"bhead-claude: line `main` vs line `claude/standalone-app`: what is the ONE difference in how HR Scout reaches Claude?","answer":"`main` by default routes the SDK through Understand Studio's proxy with the per-app `UT_API_KEY`; `claude/standalone-app` calls `api.anthropic.com` DIRECTLY with your own `ANTHROPIC_API_KEY`.","explanation":"`main` goes direct only in its opt-in standalone mode, see 82. `claude/standalone-app` is the freshest line. It also removed the bundled `claude-template/` scaffold, so the headless rail lives only on `main` (see 61).","anchor":"Two food stalls with the same recipe: one must buy every ingredient through the market owner's till, the other pays the farmer directly.","confusables":"`main` — by default needs the builder's runtime on the other end of every call; the standalone line needs ONLY your own key.","evidence_quote":"**AI calls** now go straight to `api.anthropic.com` with `ANTHROPIC_API_KEY`.","tags":["line:main","line:claude/standalone-app","studio-scaffold"],"source_refs":[{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":144,"end":147},{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":16,"end":28}]},{"id":"bhead-claude:10","slug":"bhead-claude","code":"5010","category":1,"rank":0,"type":"recall","level":1,"concept":"Extraction result shape","question":"bhead-claude: what top-level JSON shape does Claude return for one scrape?","answer":"`{\"jobs\": [...]}` — one array of postings under `_JOB_EXTRACTION_SCHEMA`, shared by BOTH scrape paths.","explanation":"Each job requires all nine properties (title, company, location, description, url, salary_range, posted_at, category, tags). Structured output needs every property listed as required, so the prompt asks for an empty string where a value is missing.","evidence_quote":"\"required\": [\"jobs\"],","tags":["structured-output"],"source_refs":[{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":76},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":35,"end":39},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":69,"end":71}]},{"id":"bhead-claude:20","slug":"bhead-claude","code":"5020","category":2,"rank":0,"type":"trace","level":3,"concept":"HTML scrape end to end","question":"bhead-claude · manual HTML scrape of one target: recite the 6 steps from `POST /api/scraper/run/{target_id}` to the completed target.","answer":"mark running · build prompt · open session · fetch, strip, cut · extract · persist","explanation":"Any exception inside the try block goes to `_mark_error()`: target and session end in `error` with the message. The trigger answers 409 when the target is already `running`. The cron path calls `_do_scrape()` directly with `triggered_by=\"cron\"`, see 50.","anchor":"A courier hangs a BUSY tag on a mailbox, writes his brief, opens a log page, pulls out the newspaper, trims it to envelope size, mails it to the oracle and files the cards that come back.","steps":["`trigger_scrape()` -> target `status` = `running`, `_do_scrape` queued in background","`_build_system_prompt()` -> base prompt + domain focus + the target's goal","`agent_sessions.insert_one()` -> a session record with status `running`","`httpx` GET -> `_html_to_text()` -> text cut to `scrape_page_chars`","`extract_structured()` with `_JOB_EXTRACTION_SCHEMA` -> `{jobs: [...]}`","`_persist_jobs()` -> new postings inserted, target `completed`, session counts set"],"evidence_quote":"background_tasks.add_task(_do_scrape, db, target_id, \"manual\")","tags":["scrape-pipeline"],"source_refs":[{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":391},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":372,"end":392},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":218,"end":238},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":254,"end":258},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":260,"end":279}]},{"id":"bhead-claude:21","slug":"bhead-claude","code":"5021","category":2,"rank":1,"type":"trace","level":3,"concept":"Headless workflow run","question":"bhead-claude · on the `main` line, one scheduled headless workflow: recite the 6 steps from the scheduler tick to the stored run record.","answer":"tick · overlap gate · stamp last_run · background task · claude -p · append runs.jsonl","explanation":"`POST /api/workflows/{id}/run` enters at the overlap gate and answers 409 when `start_run()` returns None. `last_run` is stamped at the start so a long review does not drift the cadence. The run is `completed` on exit code 0, otherwise `failed`.","anchor":"A night watchman with a 30-second egg timer: he checks the roster, hangs an OCCUPIED tag on the door, writes the start time, sends the inspector in and staples the report into the ledger.","confusables":"standalone `scheduler.scheduler_loop(db)` — same name, but it fires scrapes that call the SDK seam; this one runs workflows through the `claude` CLI.","steps":["`scheduler_loop()` wakes every 30 s -> finds an enabled workflow that `_is_due()`","`start_run()` -> returns None when the workflow id is already in `_active`","`update_workflow()` -> stamps `last_run` with the START time of the run","`asyncio.create_task(_execute())` -> the run continues in the background","`run_headless()` -> spawns `claude -p \u003cprompt> --output-format text` in the workdir","`_execute()` finally block -> appends the run record as one line to `data/runs.jsonl`"],"evidence_quote":"asyncio.create_task(_execute(workflow, run))","tags":["line:main","headless-rail"],"source_refs":[{"path":"claude-template/template/backend/app/workflows.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":165},{"path":"claude-template/template/backend/app/workflows.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":143,"end":166},{"path":"claude-template/template/backend/app/workflows.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":169,"end":188},{"path":"claude-template/template/backend/app/workflows.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":204,"end":220},{"path":"claude-template/template/backend/app/workflows.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":33},{"path":"claude-template/template/backend/app/headless.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":110}]},{"id":"bhead-claude:30","slug":"bhead-claude","code":"5030","category":3,"rank":0,"type":"recall","level":1,"concept":"Local start command","question":"Which two-step command starts bhead-claude's standalone app on a fresh clone?","answer":"`cp .env.example .env` (then set `ANTHROPIC_API_KEY`), followed by `docker compose up --build`.","explanation":"Without the key the backend still starts; `/api/health` reports `llm.configured: false` and the first AI call fails with a clear message, see 32.","example":"docker compose up --build  # frontend on :5173, API on :8000, health at /api/health","evidence_quote":"cp .env.example .env # then set ANTHROPIC_API_KEY","tags":["line:claude/standalone-app"],"source_refs":[{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":24,"end":25},{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":28,"end":30}]},{"id":"bhead-claude:31","slug":"bhead-claude","code":"5031","category":3,"rank":1,"type":"output","level":3,"concept":"evaluate() HTML penalty","question":"bhead-claude · `evaluate` (standalone line): predict the score, the band and the flagged value for the call below (`CLEAN_JOB` alone scores 100).","answer":"80, `review`, NOT flagged — only `html_artifacts` fires (penalty 20); 80 is not below `FLAG_THRESHOLD` = 70, and 70-89 is the `review` band.","explanation":"A score starts at 100, loses the penalty of each fired rule and floors at 0; flagged means score \u003c 70. The issue label names the first matching field: `HTML artefacts in description`.","confusables":"band `flagged` (0-69) — `review` (70-89) is a band, NOT a flag: `flagged` is True only when the score is below 70.","code_snippet":"result = evaluate({**CLEAN_JOB, \"description\": \"\u003cdiv>Great role\u003c/div> with a long enough text\"})\n# result.score ?  result.band ?  result.flagged ?","expected_output":"result.score == 80\nresult.band == \"review\"\nresult.flagged is False","evidence_quote":"assert result.score == 80","tags":["grounded:test","quality-engine","line:claude/standalone-app"],"source_refs":[{"path":"backend/tests/test_quality_engine.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":120,"end":126},{"path":"backend/app/quality/registry.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":68,"end":70},{"path":"backend/app/quality/registry.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":46,"end":51},{"path":"backend/app/quality/engine.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":101,"end":117}]},{"id":"bhead-claude:32","slug":"bhead-claude","code":"5032","category":3,"rank":2,"type":"output","level":3,"concept":"get_client() without credentials","question":"bhead-claude · `get_client` (standalone line): predict the result of the call below when neither `ANTHROPIC_API_KEY` nor `ANTHROPIC_AUTH_TOKEN` is set.","answer":"It RAISES `LLMNotConfigured` — a missing key must be a clear message at the first AI call, never a connection error; the backend itself still starts.","explanation":"`/api/health` shows `llm.configured: false` meanwhile. In a scrape the exception is caught and routed to `_mark_error()`, so the session record carries this message.","code_snippet":"assert llm.is_configured() is False\nllm.get_client()","expected_output":"LLMNotConfigured: No Anthropic credential: set ANTHROPIC_API_KEY (or ANTHROPIC_AUTH_TOKEN) in .env — see .env.example — and restart the backend.","evidence_quote":"with pytest.raises(llm.LLMNotConfigured, match=\"ANTHROPIC_API_KEY\"):","tags":["intended-error","grounded:test","ai-seam","line:claude/standalone-app"],"source_refs":[{"path":"backend/tests/test_llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":189,"end":193},{"path":"backend/app/llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":80,"end":94}]},{"id":"bhead-claude:33","slug":"bhead-claude","code":"5033","category":3,"rank":3,"type":"output","level":3,"concept":"extract_fields() normalisation","question":"bhead-claude · `extract_fields` (standalone line): predict the exact return value of the call below.","answer":"All FOUR scored fields as stripped strings — `None` and the missing key become `''`, the integer becomes `'42'`.","explanation":"`SCORED_FIELDS` is (title, description, company, salary_range), in that order. Because every value is a stripped string, no rule regex ever sees a non-string. Dedup in `_persist_jobs()` reads title and company through the same function, see 70.","code_snippet":"extract_fields({\"title\": None, \"company\": 42, \"description\": \"  padded  \"})","expected_output":"{'title': '', 'description': 'padded', 'company': '42', 'salary_range': ''}","evidence_quote":"assert fields == {\"title\": \"\", \"description\": \"padded\", \"company\": \"42\", \"salary_range\": \"\"}","tags":["grounded:test","quality-engine","line:claude/standalone-app"],"source_refs":[{"path":"backend/tests/test_quality_engine.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":170,"end":172},{"path":"backend/app/quality/extractor.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":10,"end":23}]},{"id":"bhead-claude:34","slug":"bhead-claude","code":"5034","category":3,"rank":4,"type":"cloze","level":1,"concept":"The headless command","question":"bhead-claude · `main` line: complete the command that `run_headless()` builds for every headless run.","answer":"-p · --output-format","explanation":"`-p` is print mode: the CLI runs its whole agent loop without interaction, prints the final result and exits. `--model`, `--allowedTools` and the workflow's `extra_args` are appended only when set.","cloze":"claude {{c1::-p}} \"\u003cprompt>\" {{c2::--output-format}} text","evidence_quote":"cmd = [settings.claude_bin, \"-p\", prompt, \"--output-format\", output_format]","tags":["line:main","headless-rail"],"source_refs":[{"path":"claude-template/template/backend/app/headless.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":110,"end":115},{"path":"claude-template/template/backend/app/headless.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":7}]},{"id":"bhead-claude:40","slug":"bhead-claude","code":"5040","category":4,"rank":0,"type":"locate","level":1,"concept":"Quality registry","question":"Which module on bhead-claude's standalone line is the ONLY place a quality rule, band or flag threshold is defined?","answer":"`backend/app/quality/registry.py`: `RULES`, `BANDS`, `FLAG_THRESHOLD` as plain data; `engine.py` only interprets.","explanation":"Adding a check is adding a row. `validate_registry()` runs when the package is imported, and `GET /api/monitor/quality-config` serves the registry, so the UI never restates a threshold.","confusables":"`engine.py` — a pure INTERPRETER (no I/O, no clock); it holds no rule, only one branch per predicate kind.","evidence_quote":"A `Rule` is interpreted by `engine.evaluate`; it never holds code.","tags":["quality-engine","line:claude/standalone-app"],"source_refs":[{"path":"backend/app/quality/registry.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":3,"end":6},{"path":"backend/app/quality/__init__.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":15}]},{"id":"bhead-claude:41","slug":"bhead-claude","code":"5041","category":4,"rank":1,"type":"compare","level":2,"concept":"_do_scrape() vs _do_scrape_apify()","question":"bhead-claude: `_do_scrape()` vs `_do_scrape_apify()`: what is the ONE difference?","answer":"`_do_scrape()` FETCHES the page itself (`httpx`, then `_html_to_text()`); `_do_scrape_apify()` takes its text from the Apify jobup actor's items. Both end in the same `extract_structured()` call and schema.","explanation":"Caps follow the source: `scrape_page_chars` 12000 for the page, `apify_text_chars` 15000 for the actor items. The cron scheduler fires only `_do_scrape()`, so scheduled runs never spend Apify budget.","anchor":"One angler casts his own line from the pier; the other buys the catch from a trawler.","confusables":"`_do_scrape_apify()` — its text comes from the Apify ACTOR's leaf-page items, NOT from a page the app fetched itself.","evidence_quote":"raw_items = await run_apify_scrape(url, apify_token, max_items=max_items)","tags":["scrape-pipeline"],"source_refs":[{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":323},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":3,"end":11},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":258},{"path":"backend/app/config.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":49,"end":50},{"path":"backend/app/scheduler.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":61}]},{"id":"bhead-claude:50","slug":"bhead-claude","code":"5050","category":5,"rank":0,"type":"locate","level":1,"concept":"Cron scheduler loop","question":"Which function lets bhead-claude scrape cron-enabled targets with no manual trigger?","answer":"`scheduler_loop(db)` in `backend/app/scheduler.py`: an asyncio task started in the FastAPI lifespan, ticking every 60 s.","explanation":"Each tick selects active, cron-enabled, non-running targets whose `cron_next_run` is past or missing, reserves each one (`status` running, next run = now + `cron_interval_minutes`, default 1440) and fires `_do_scrape()` with `asyncio.create_task`. The tick is `SCHEDULER_TICK_SECONDS`.","anchor":"A lighthouse beam sweeping once a minute: every boat whose departure time has passed gets a BUSY lantern and is pushed off the quay.","confusables":"`workflows.scheduler_loop()` on `main` — same name, but it polls FILE-backed headless workflows, not Mongo targets.","evidence_quote":"asyncio.create_task(_do_scrape(db, tid, triggered_by=\"cron\"))","tags":["scheduler"],"source_refs":[{"path":"backend/app/scheduler.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":61},{"path":"backend/app/scheduler.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":16,"end":37},{"path":"backend/app/main.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":38,"end":39},{"path":"backend/app/config.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":67}]},{"id":"bhead-claude:51","slug":"bhead-claude","code":"5051","category":5,"rank":1,"type":"recall","level":1,"concept":"Cloud Run CPU flag","question":"bhead-claude · `main` template: which Cloud Run deploy flag keeps a headless run alive after the 202 response?","answer":"`--no-cpu-throttling` — the run continues AFTER the response; throttled CPU would freeze it mid-run.","explanation":"`start_run()` returns at once and the CLI subprocess keeps working in a background task, which Cloud Run would otherwise starve of CPU once the response is sent.","confusables":"`--min-instances 1` — keeps the in-process SCHEDULER alive between requests; it does nothing for the CPU of a run already triggered.","evidence_quote":"--no-cpu-throttling headless runs continue AFTER the 202 response;","tags":["line:main","headless-rail","cloud-run"],"source_refs":[{"path":"claude-template/template/deploy/cloudrun.sh","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":29,"end":32},{"path":"claude-template/template/deploy/cloudrun.sh","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":43,"end":44}]},{"id":"bhead-claude:60","slug":"bhead-claude","code":"5060","category":6,"rank":0,"type":"why","level":2,"concept":"Direct Anthropic API","question":"Why does bhead-claude's standalone line call `api.anthropic.com` directly rather than keep the generated app's Studio-proxy mode?","answer":"Outside Understand Studio the proxy host does not exist, so a proxy-mode call ends as a connection error; calling directly leaves ONE dependency, the owner's own `ANTHROPIC_API_KEY`.","explanation":"`get_client()` now raises `LLMNotConfigured` when no credential is present. Breaks if undone: the app again needs the builder's proxy and per-app key to answer one request, and reports every call to the usage metering. The parent's dual-mode client is on `main`, see 81.","anchor":"Letters keep going to a mail room in a demolished building and come back 'address unknown'; the cure is to write straight to the recipient.","confusables":"`claude_examples.get_client()` on `main` — picks proxy OR direct from the environment; the standalone `llm.get_client()` has ONLY the direct path.","evidence_quote":"connection error to a host that no longer exists","tags":["inferred","ai-seam","studio-scaffold","line:claude/standalone-app"],"source_refs":[{"path":"backend/app/llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":7,"end":11},{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":144,"end":147},{"path":"backend/app/llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":93}]},{"id":"bhead-claude:61","slug":"bhead-claude","code":"5061","category":6,"rank":1,"type":"why","level":4,"concept":"Headless calls vs plain SDK","question":"bhead-claude · the owner's question: why headless-bun-claude leverage Anthropic headless calls rather than plain SDK?","answer":"It does NOT replace the SDK: on `main`, `claude-template` ADDS a headless rail beside it. (1) `run_headless()` spawns `claude -p \"\u003cprompt>\"`: the CLI's own agent loop reads files, greps and runs git in the mounted repo and accepts slash commands such as `/review`, a CLI concept. (2) The rule: SDK when your code knows the steps, headless when the model must discover them by exploring a filesystem; chat and extraction stay on `llm.py`. (3) `claude/standalone-app` removed the scaffold, so that line is SDK only.","explanation":"Breaks if undone: a repository review through the SDK means hand-writing the loop (the template's `chat_with_tools()`) plus your own file, grep and git tools, and slash commands are unavailable. On the headless rail, varying the workload is just varying a prompt string. Both rails read the same `ANTHROPIC_API_KEY`.","anchor":"A librarian answering by phone must have every page read aloud to her; send the inspector INTO the library with a lamp and he finds the shelves himself.","confusables":"`chat_with_tools()` in the template's `llm.py` — an agent loop YOUR code drives over tools you write; `claude -p` runs the CLI's OWN loop with its built-in file tools.","evidence_quote":"Mode 1 when your code knows the steps; Mode 2 when the model must discover them by exploring a filesystem.","tags":["owner-question","line:main","headless-rail"],"source_refs":[{"path":"claude-template/template/docs/llm-modes.md","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":346,"end":359},{"path":"claude-template/template/backend/app/headless.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":3,"end":13},{"path":"claude-template/template/backend/app/headless.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":110},{"path":"claude-template/template/backend/app/llm.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":119,"end":123},{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":151,"end":154}]},{"id":"bhead-claude:62","slug":"bhead-claude","code":"5062","category":6,"rank":2,"type":"why","level":2,"concept":"Structured output format","question":"Why does bhead-claude's standalone `extract_structured()` use `output_config.format` with a JSON schema rather than a forced tool call?","answer":"The API then guarantees that the first text block is valid JSON for the schema, so nothing has to be stripped or repaired; and the code records that forced `tool_choice` is rejected by current models.","explanation":"The parent version on `main` forced a named tool. Breaks if undone: per that code comment the extraction request is rejected by current models. `_strict_schema()` adds `additionalProperties: false` to every object node that does not set it, because the format requires it, and a test asserts that no `tools` or `tool_choice` is sent.","anchor":"A vending machine with a moulded slot: only a coin of the exact shape drops through, so nobody downstream has to sort the change.","confusables":"`tool_choice` with a named tool, in `claude_examples.extract_structured()` on `main` — there the JSON arrives as a TOOL INPUT; here it is the reply TEXT, parsed with `json.loads`.","evidence_quote":"(forced `tool_choice` is rejected by current models)","tags":["structured-output","ai-seam","line:claude/standalone-app"],"source_refs":[{"path":"backend/app/llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":261,"end":265},{"path":"backend/app/llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":273,"end":274},{"path":"backend/tests/test_llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":94},{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":441}]},{"id":"bhead-claude:70","slug":"bhead-claude","code":"5070","category":7,"rank":0,"type":"recall","level":2,"concept":"Dedup on re-scrape","question":"bhead-claude: what stops a re-scrape of the same target from inserting a posting twice?","answer":"`_persist_jobs()` inserts ONLY when no posting of that target matches the title AND the company exactly, case-insensitively; a job with an empty title is skipped.","explanation":"State lives in MongoDB, collection `job_postings`. Title and company come from `extract_fields()` and are wrapped in `re.escape`, so a title such as `C++ Developer` cannot break the query. The check is per `target_id`: the same job found on two boards is stored twice.","anchor":"A doorman with one guest list per ballroom: same name and same company already inside this room and you stay out, however you capitalise it.","confusables":"the unique index on `scrape_targets.url` — it blocks a duplicate TARGET in the database itself; postings have NO unique index, only this query.","evidence_quote":"\"title\": {\"$regex\": f\"^{re.escape(title)}$\", \"$options\": \"i\"},","tags":["dedup","mongodb"],"source_refs":[{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":149},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":141,"end":163},{"path":"backend/app/main.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":22}]},{"id":"bhead-claude:80","slug":"bhead-claude","code":"5080","category":8,"rank":0,"type":"recall","level":2,"concept":"Vite /api proxy","question":"What makes bhead-claude's React UI able to call the FastAPI backend with no CORS setup on the standalone line?","answer":"The Vite dev server proxies `/api` to `http://backend:8000`, so the browser only ever talks same-origin; CORS middleware is installed ONLY when `CORS_ORIGINS` is set.","explanation":"The stack is docker compose with three services: frontend on 5173, backend on 8000 and `mongo:7`, whose port is not published. When the API runs outside Docker the proxy target must become `localhost:8000`.","anchor":"A shop counter with a hatch: customers only ever speak to the counter, which passes each slip through the hatch to the workshop, so the workshop needs no street door.","confusables":"the generated version on `main` — it installed a CORS WILDCARD middleware; the standalone line installs none by default.","evidence_quote":"The browser only ever talks to the dev server; /api is forwarded to","tags":["vite-proxy","line:claude/standalone-app"],"source_refs":[{"path":"frontend/vite.config.ts","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":23,"end":28},{"path":"backend/app/main.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":64,"end":69},{"path":"docker-compose.yml","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":43,"end":46},{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":60,"end":62}]},{"id":"bhead-claude:81","slug":"bhead-claude","code":"5081","category":8,"rank":1,"type":"recall","level":2,"concept":"Studio LLM proxy and per-app key","question":"bhead-claude · `main` line (Understand Studio scaffold): how does the generated app's Anthropic SDK reach Claude in Studio mode?","answer":"`get_client()` builds `AsyncAnthropic(api_key=ut_key, base_url=base_url)`: the per-app `UT_API_KEY` is the bearer against Studio's Anthropic-compatible proxy at `UT_LLM_BASE_URL`.","explanation":"The proxy validates the per-app key, forwards to Anthropic with a server-side master key and bills the project, so the app never holds a provider key. Because the proxy is Anthropic-compatible, only the client constructor differs from a direct call (see 60). This deck is the home of that scaffold for the sibling generated apps.","confusables":"standalone mode of the same `get_client()` — `AsyncAnthropic(api_key=anthropic_key)` with NO `base_url`, so the SDK's public default endpoint is used.","evidence_quote":"_client = AsyncAnthropic(api_key=ut_key, base_url=base_url)","tags":["line:main","studio-scaffold"],"source_refs":[{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":155},{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":137,"end":155},{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":16,"end":20}]},{"id":"bhead-claude:82","slug":"bhead-claude","code":"5082","category":8,"rank":2,"type":"scenario","level":3,"concept":"Studio vs standalone mode rule","question":"bhead-claude · `main` line: the backend's environment holds BOTH `ANTHROPIC_API_KEY` and a non-empty `UT_LLM_BASE_URL`. Which endpoint does `get_client()` call, and what do you check first?","answer":"Studio's proxy, not Anthropic: standalone mode is chosen ONLY when `ANTHROPIC_API_KEY` is set AND `UT_LLM_BASE_URL` is empty; in every other case the proxy wins. Check that the base URL is really empty in BOTH places `get_client()` reads it, `settings.ut_llm_base_url` and `os.environ`: one non-empty value is enough for the proxy.","explanation":"The rule exists so that a Studio-seeded workspace never bypasses the proxy by accident. With no `UT_API_KEY` either, `get_client()` raises `RuntimeError` naming both options. `ANTHROPIC_API_KEY` is read from `os.environ` only, never from `Settings`.","evidence_quote":"if anthropic_key and not ut_llm_base:","tags":["trap","line:main","studio-scaffold"],"source_refs":[{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":130},{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":107,"end":111},{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":125,"end":135}]},{"id":"bhead-claude:83","slug":"bhead-claude","code":"5083","category":8,"rank":3,"type":"compare","level":2,"concept":"increment_prompt() usage callback","question":"bhead-claude · `main` line (Studio scaffold): `increment_prompt()` vs `report_to_studio_counter()`: what is the ONE difference?","answer":"`increment_prompt()` reports a Claude call to BOTH Understand Tech's prompt quota and Studio's per-project counter; `report_to_studio_counter()` bumps ONLY Studio's counter.","explanation":"`claude_examples.py` calls `increment_prompt()` after every successful Claude call. Both are fail-open: a billing error never breaks a chat. The standalone line deleted the module, so nothing is metered there.","anchor":"Two turnstile clickers at a fairground gate: one clicks the park's tally AND the ride owner's tally, the other clicks the park's tally only.","confusables":"`report_to_studio_counter()` — meant for UT API v3 chats, which UT already counts server-side; calling `increment_prompt()` there would DOUBLE-bill.","evidence_quote":"Report a CLAUDE call (routed through Studio's Anthropic proxy) to BOTH UT (for the prompt quota) and Studio (for the per-project UI tile).","tags":["line:main","studio-scaffold","usage-metering"],"source_refs":[{"path":"backend/app/ut_usage.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":210,"end":216},{"path":"backend/app/ut_usage.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":5,"end":20},{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":49}]},{"id":"bhead-claude:84","slug":"bhead-claude","code":"5084","category":8,"rank":4,"type":"recall","level":1,"concept":"Whitelabel identity prelude","question":"bhead-claude · `main` line: what does `_with_identity()` do to every system prompt of the generated app?","answer":"It prepends `_IDENTITY_PRELUDE` FIRST: asked who made it, the model must say it is powered by Understand Tech.","explanation":"The directive hides the underlying model and wins over any persona because it comes first. The standalone line removed it: a test asserts that the `system` value sent equals the caller's prompt exactly.","confusables":"standalone `llm.py` — passes the caller's `system_prompt` through UNCHANGED; nothing is prepended.","evidence_quote":"The directive comes FIRST so it takes precedence over any persona the caller layered on top.","tags":["line:main","studio-scaffold"],"source_refs":[{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":73,"end":80},{"path":"backend/app/claude_examples.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":53,"end":58},{"path":"backend/tests/test_llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":104,"end":108},{"path":"backend/app/llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":172,"end":173}]},{"id":"bhead-claude:85","slug":"bhead-claude","code":"5085","category":8,"rank":5,"type":"scenario","level":4,"concept":"Cutting the Studio coupling","question":"bhead-claude: you must make another Understand Studio generated app (same scaffold as the `main` line) run standalone. Following the `claude/standalone-app` translation, which host couplings do you cut?","answer":"Three groups; no data migration is needed. (1) AI rail: the proxy URL and per-app key, the usage-metering callbacks and the whitelabel identity instruction, replaced by one seam calling `api.anthropic.com` with `ANTHROPIC_API_KEY`. (2) Host observability and branding: request analytics and error ring buffer with their `/api/__*` endpoints, the browser error reporter, badge and logo, the CORS wildcard. (3) Vault key: derive it from `SECRETS_ENCRYPTION_KEY`; set it to the old per-app key to keep stored secrets readable.","explanation":"An empty `SECRETS_ENCRYPTION_KEY` disables the vault with 503 rather than encrypting with a guessable constant. `MONGO_DB` still defaults to `app`. This card is the portfolio home of the Studio scaffold: details in 81 (proxy), 83 (usage callbacks) and 84 (identity prelude).","evidence_quote":"The proxy URL, per-app key, usage-metering callbacks and the whitelabel identity instruction are gone.","tags":["studio-scaffold","standalone-refactor"],"source_refs":[{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":144,"end":158},{"path":"docs/SYSTEM_MAPS.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":64,"end":71},{"path":"backend/app/routes/secrets.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":5,"end":11}]},{"id":"bhead-claude:90","slug":"bhead-claude","code":"5090","category":9,"rank":0,"type":"recall","level":1,"concept":"Proving it works","question":"bhead-claude: which command proves the standalone backend works without a key, a network or MongoDB?","answer":"`cd backend && pytest` — the suite runs on a fake Motor database and a fake Anthropic client.","explanation":"`asyncio_mode = auto` in `pytest.ini`; the `api` fixture skips the lifespan, so no scheduler starts. On a live stack, `GET /api/health` shows `mongo`, `llm.configured`, the quality threshold and the caps before you spend a scrape.","example":"cd backend && pip install -r requirements-dev.txt && pytest  # no network, no Mongo","evidence_quote":"The LLM seam, exercised against a fake client — no network, no key.","tags":["line:claude/standalone-app"],"source_refs":[{"path":"backend/tests/test_llm.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":1},{"path":"backend/tests/conftest.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":1,"end":6},{"path":"README.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":53,"end":57},{"path":"backend/pytest.ini","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":4}]},{"id":"bhead-claude:91","slug":"bhead-claude","code":"5091","category":9,"rank":1,"type":"scenario","level":3,"concept":"Three-edit setting rule","question":"bhead-claude (standalone line): you add a field to `Settings` and put its variable in the repo-root `.env`, yet under docker compose the backend still runs on the default value. What did you miss?","answer":"The line in `docker-compose.yml`'s explicit `environment:` allowlist: a variable reaches the container ONLY if it is listed there, so the container silently runs on the default.","explanation":"A new setting needs three edits together: the `Settings` field, the compose allowlist line and a row in `.env.example`. Bare-metal `uvicorn` would have picked the value up, because `Settings` reads the repo-root `.env` itself, anchored on `__file__` rather than the working directory.","evidence_quote":"(otherwise the container silently runs on the default)","tags":["trap","config","line:claude/standalone-app"],"source_refs":[{"path":"backend/app/config.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":12,"end":14},{"path":"docker-compose.yml","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":18,"end":22},{"path":"backend/app/config.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":5,"end":9}]},{"id":"bhead-claude:92","slug":"bhead-claude","code":"5092","category":9,"rank":2,"type":"scenario","level":3,"concept":"Target stuck in running","question":"bhead-claude: after a backend crash mid-scrape, a manual trigger answers 409 `Scrape already in progress for this target.` and cron never picks the target up again. What happened and what do you do?","answer":"The target document is stuck at `status: \"running\"`: a scrape leaves that state only through `_persist_jobs()` or `_mark_error()`, and neither ran. No route resets it, so set `status` back by hand in `scrape_targets`.","explanation":"The scheduler filters on `status != running` and both trigger routes return 409 on `running`. A `uvicorn --reload` in the middle of a scrape causes the same thing. It is an open item of the known drift; a reset route or a stale-run timeout would close it.","evidence_quote":"the scheduler skips it and manual triggers return 409. No route resets `status`.","tags":["trap","scheduler"],"source_refs":[{"path":"docs/SYSTEM_MAPS.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":282,"end":284},{"path":"backend/app/routes/scraper.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":385,"end":386},{"path":"backend/app/scheduler.py","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":33}]},{"id":"bhead-claude:93","slug":"bhead-claude","code":"5093","category":9,"rank":3,"type":"recall","level":1,"concept":"Headless permission default","question":"bhead-claude · `main` line: what happens to a tool call that would ask for approval during a headless `claude -p` run?","answer":"It is DENIED — print mode is non-interactive. Grant it per workflow with `allowed_tools` or `extra_args`.","explanation":"Read-oriented workflows such as `/review` work as they are; one that must edit files or run commands fails until granted, for example `allowed_tools=[\"Edit\", \"Bash(git diff:*)\"]`. The module's rule: never default to bypassing permissions.","evidence_quote":"print mode is non-interactive, so tools that would normally prompt for approval are denied","tags":["trap","line:main","headless-rail"],"source_refs":[{"path":"claude-template/template/backend/app/headless.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":19,"end":25},{"path":"claude-template/template/backend/app/headless.py","branch":"main","commit":"9b6b3fa7f61568262fa56bfb6fa78efd277fe94d","line":113,"end":115}]},{"id":"bhead-claude:99","slug":"bhead-claude","code":"5099","category":9,"rank":9,"type":"recall","level":2,"concept":"Next step: authentication","question":"bhead-claude: what is the first open item to fix before HR Scout is exposed beyond localhost, and why?","answer":"Authentication: NO route has any. Whoever reaches port 8000 can trigger scrapes that spend Anthropic and Apify budget and can read vault secrets in plaintext through `GET /api/secrets/{name}/value`.","explanation":"Interim guard: keep it on localhost or put a reverse proxy with auth in front. It heads the known-drift list in `docs/SYSTEM_MAPS.md`, where the next pass starts; targets stuck in `running` (see 92) and non-atomic scheduler claims come next.","evidence_quote":"API behind a reverse proxy with auth before exposing it beyond localhost.","tags":["per-docs","security"],"source_refs":[{"path":"docs/SYSTEM_MAPS.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":278,"end":281},{"path":"docs/SYSTEM_MAPS.md","branch":"claude/standalone-app","commit":"863b75fa5abee86a19e5b37bbed616c7ecbf518b","line":272,"end":276}]},{"id":"deep-seek-harness:00","slug":"deep-seek-harness","code":"5100","category":0,"rank":0,"type":"recall","level":1,"concept":"Launcher for upstream dsh","question":"What is deep-seek-harness, and what does one launch of it produce?","answer":"A launcher: one command runs the pinned upstream `@deepseek-ai/dsh` and opens its Web UI at `http://127.0.0.1:3080`.","explanation":"The repository holds NO agent code of its own: two launcher scripts, a `package.json` with the pinned dependency and a README runbook. The agent harness is downloaded at launch.","anchor":"An ignition key with no car attached: turn it and the same rented car is delivered to your driveway, engine running, doors open.","example":"./start-harness.sh  # browser opens the harness Web UI on loopback port 3080","evidence_quote":"\"description\": \"Local launcher for the DeepSeek Harness (dsh) Web UI at http://127.0.0.1:3080\"","tags":["launcher"],"source_refs":[{"path":"package.json","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":5},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":3,"end":5},{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":2}]},{"id":"deep-seek-harness:01","slug":"deep-seek-harness","code":"5101","category":0,"rank":1,"type":"recall","level":1,"concept":"Run the verified release","question":"Which one-sentence rule does deep-seek-harness enforce about the upstream release it launches?","answer":"It launches the release the setup was last VERIFIED against (the pin), never the newest one by default.","explanation":"Upstream is a fast-moving developer preview, so a newer release may change flags or first-run steps. Breaks if undone: a launch that worked yesterday fails without any change here. The newest release is an explicit opt-in, see 10.","confusables":"`@latest` — tracks whatever upstream published last; the pin tracks what was TESTED here.","evidence_quote":"# Version this setup was verified against; override with DSH_VERSION=latest for the newest release.","tags":["version-pin"],"source_refs":[{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":17,"end":18},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":9}]},{"id":"deep-seek-harness:10","slug":"deep-seek-harness","code":"5110","category":1,"rank":0,"type":"recall","level":1,"concept":"DSH_VERSION per-run override","question":"Which environment variable makes deep-seek-harness launch another upstream release for a single run?","answer":"`DSH_VERSION`, e.g. `DSH_VERSION=latest ./start-harness.sh`; left unset, each script uses its pinned default.","explanation":"Both launcher scripts read it and fall back to their own hard-coded default. Nothing is edited on disk, so the next plain launch is back on the pin.","example":"DSH_VERSION=latest ./start-harness.sh  # newest upstream release, this run only","confusables":"the `package.json` dependency version — `DSH_VERSION` steers ONLY the two launcher scripts; `pnpm start` never reads it.","evidence_quote":"DSH_VERSION=\"${DSH_VERSION:-0.1.1-rc.2}\"","tags":["version-pin","env-override"],"source_refs":[{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":18},{"path":"start-harness.cmd","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":12},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":101,"end":105}]},{"id":"deep-seek-harness:20","slug":"deep-seek-harness","code":"5120","category":2,"rank":0,"type":"trace","level":3,"concept":"start-harness.sh launch chain","question":"deep-seek-harness · `start-harness.sh`: recite the 5 steps from the call to the process that replaces the shell.","answer":"node present · major at least 22 · resolve `DSH_VERSION` · first-run notice · `pnpm dlx`, else `npx -y`","explanation":"Both guards run BEFORE anything is downloaded, so a missing or old Node fails fast with a readable message. The last step uses `exec`, so the package manager takes over the shell's process and Ctrl+C in the terminal stops the server.","anchor":"A launch-pad countdown: is there an engine, is it a recent enough model, load the flight number, announce a long fuelling, then light the fast booster or, failing that, the slow one.","steps":["`command -v node` -> missing: error on stderr and `exit 1`","`node -p` extracts the Node major -> below 22: error on stderr and `exit 1`","`DSH_VERSION` -> kept when set, otherwise the pinned default","`echo` -> notice that the first run downloads the package","`command -v pnpm` -> found: `exec pnpm dlx`; missing: hint, then `exec npx -y`"],"evidence_quote":"NODE_MAJOR=$(node -p 'process.versions.node.split(\".\")[0]')","tags":["launch-flow"],"source_refs":[{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":6,"end":29},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":39}]},{"id":"deep-seek-harness:30","slug":"deep-seek-harness","code":"5130","category":3,"rank":0,"type":"locate","level":1,"concept":"Entry point and launch directory","question":"Which script do you run first to open the deep-seek-harness Web UI on macOS or Linux, and from which directory?","answer":"`start-harness.sh`, run FROM the project the agent should work in: that directory becomes the default workspace root.","explanation":"Windows uses `start-harness.cmd` the same way. Launched from inside the launcher's own checkout, the agent's default workspace is the launcher itself, not your project.","example":"cd ~/my-project && /path/to/deep-seek-harness/start-harness.sh  # my-project becomes the default workspace root","evidence_quote":"From the directory you want the agent to work in (that directory becomes the default workspace root):","tags":["entry-point","per-docs"],"source_refs":[{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":18,"end":30},{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":1,"end":3}]},{"id":"deep-seek-harness:31","slug":"deep-seek-harness","code":"5131","category":3,"rank":1,"type":"output","level":3,"concept":"Argument forwarding after web","question":"deep-seek-harness · `start-harness.sh`: predict the exact command that replaces the shell for the call below.","answer":"`pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 web --port 4000 --no-open` — the default fills the unset variable and every script argument is APPENDED after `web`.","explanation":"(1) `DSH_VERSION` is unset, so `:-` yields the default. (2) pnpm is found, so the first branch runs. (3) `\"$@\"` expands to the two flags, placed after the `web` subcommand, which is where upstream expects its flags.","confusables":"the `npx -y` branch — same package, same `web` and the same forwarded flags; it runs ONLY when pnpm is absent.","code_snippet":"# pnpm is installed; DSH_VERSION is not set\n# call: ./start-harness.sh --port 4000 --no-open\nDSH_VERSION=\"${DSH_VERSION:-0.1.1-rc.2}\"\n# ...\nif command -v pnpm >/dev/null 2>&1; then\n  exec pnpm dlx \"@deepseek-ai/dsh@${DSH_VERSION}\" web \"$@\"\nelse\n  # ...\n  exec npx -y \"@deepseek-ai/dsh@${DSH_VERSION}\" web \"$@\"\nfi","expected_output":"pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 web --port 4000 --no-open","evidence_quote":"exec pnpm dlx \"@deepseek-ai/dsh@${DSH_VERSION}\" web \"$@\"","tags":["grounded:doc","arg-forwarding"],"source_refs":[{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":18,"end":28},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":35},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":61,"end":70}]},{"id":"deep-seek-harness:40","slug":"deep-seek-harness","code":"5140","category":4,"rank":0,"type":"compare","level":2,"concept":"sh launcher vs cmd launcher","question":"deep-seek-harness: `start-harness.sh` vs `start-harness.cmd`: what is the ONE difference in what they verify before launching?","answer":"`start-harness.sh` checks that Node exists and that its major is at least 22; `start-harness.cmd` checks ONLY that `node` is on PATH.","explanation":"The batch file runs `where node` and nothing more, so on Windows the launcher stops no Node version at all. For how loose the sh guard itself is, see 92.","anchor":"Two doormen: one reads the birth year on your card, the other only checks that you are holding a card.","confusables":"`start-harness.cmd` — NO version guard: any Node that is on PATH gets through the Windows launcher.","evidence_quote":"if [ \"$NODE_MAJOR\" -lt 22 ]; then","tags":["node-guard"],"source_refs":[{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":11,"end":15},{"path":"start-harness.cmd","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":5,"end":9}]},{"id":"deep-seek-harness:41","slug":"deep-seek-harness","code":"5141","category":4,"rank":1,"type":"locate","level":1,"concept":"Installed-dependency launch path","question":"Which deep-seek-harness command runs the harness from an INSTALLED dependency instead of a download-and-run?","answer":"`pnpm start`, after `pnpm install`: the `package.json` script `\"start\": \"dsh web\"`.","explanation":"It runs the `dsh` binary of the dependency declared in `package.json`, so its release is whatever that file pins, independent of the launcher scripts (see 91).","example":"pnpm install / pnpm start  # runs: dsh web","confusables":"`./start-harness.sh` — runs `@deepseek-ai/dsh@$DSH_VERSION` EPHEMERALLY through dlx or npx; `pnpm start` runs the copy in `node_modules`.","evidence_quote":"\"start\": \"dsh web\"","tags":["npm-scripts"],"source_refs":[{"path":"package.json","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":6,"end":13},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":41,"end":46}]},{"id":"deep-seek-harness:60","slug":"deep-seek-harness","code":"5160","category":6,"rank":0,"type":"why","level":2,"concept":"pnpm dlx preferred over npx","question":"Why does deep-seek-harness launch through `pnpm dlx` whenever pnpm is installed rather than always using `npx -y`?","answer":"npm's resolver can stall for a very long time on the package's large release-candidate dependency graph; pnpm resolves the same graph in seconds.","explanation":"Breaks if undone: the first launch sits on 'resolving dependencies' and looks frozen. `npx -y` survives ONLY as the fallback, and the scripts print a hint to install pnpm before taking it.","anchor":"Two couriers are handed the same enormous parts list: one sorts it at the counter in seconds, the other stands chewing his pencil until closing time.","confusables":"`npx -y` — the same download-and-run idea, but through npm's resolver; kept as the FALLBACK only.","evidence_quote":"resolver can grind for a very long time, so prefer pnpm when it is available.","tags":["package-manager","trap"],"source_refs":[{"path":"start-harness.sh","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":22,"end":28},{"path":"start-harness.cmd","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":16,"end":23},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":109}]},{"id":"deep-seek-harness:61","slug":"deep-seek-harness","code":"5161","category":6,"rank":1,"type":"why","level":2,"concept":"SSH forward, never a tunnel","question":"Why does deep-seek-harness reach a harness on a remote machine through an SSH port-forward rather than a public tunnel such as ngrok?","answer":"Nothing authenticates the Web UI, and its API tells an agent to run shell commands in the workspace: ANYONE who reaches the port can execute code on the machine.","explanation":"Breaks if undone: a published port is an open shell on your workspace. The server therefore stays on `127.0.0.1`, and the README notes that upstream itself refuses `--host 0.0.0.0`. The forward command: see 81.","anchor":"A workshop with no lock and an obedient robot inside that does whatever a visitor tells it: it is kept in a windowless back room reached only by your own private corridor.","confusables":"a public tunnel or a reverse proxy on a public interface — it publishes the port to EVERYONE; an SSH forward opens it only to the holder of the SSH login.","evidence_quote":"its API drives an agent that can execute shell commands in your workspace","tags":["per-docs","loopback","security"],"source_refs":[{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":84,"end":85},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":74}]},{"id":"deep-seek-harness:80","slug":"deep-seek-harness","code":"5180","category":8,"rank":0,"type":"recall","level":2,"concept":"DeepSeek API key supply","question":"What makes the Web UI launched by deep-seek-harness able to call the DeepSeek API, and through which two routes is it supplied?","answer":"A DeepSeek API key: pasted under Settings -> Models in the Web UI, or set as `DEEPSEEK_API_KEY` in a `.env` in the directory you LAUNCH from.","explanation":"The key never lives in the repository: `.gitignore` excludes `.env` and only the empty template `.env.example` is tracked. Because the file is read from the invoking directory, a `.env` beside the script is missed when you launch from another project.","example":"cp .env.example .env  # then fill in DEEPSEEK_API_KEY","confusables":"cf. [private project] `DEEPSEEK_API_KEY`: there it is ONE provider key among several for a Hermes agent; here it is the only secret the setup needs.","evidence_quote":"# Copied to .env (git-ignored), this is picked up by dsh from the invoking directory.","tags":["auth","env-file"],"source_refs":[{"path":".env.example","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":1,"end":3},{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":52,"end":53},{"path":".gitignore","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":3}]},{"id":"deep-seek-harness:81","slug":"deep-seek-harness","code":"5181","category":8,"rank":1,"type":"cloze","level":1,"concept":"SSH local port-forward command","question":"deep-seek-harness: complete the SSH command that brings a harness running on a remote box to your local browser.","answer":"3080:127.0.0.1:3080","explanation":"Local port 3080 is forwarded to loopback port 3080 on the remote box, where the server listens; you then open `http://127.0.0.1:3080` locally. Why this route and not a tunnel: see 61.","cloze":"ssh -L {{c1::3080:127.0.0.1:3080}} user@remote-host","evidence_quote":"ssh -L 3080:127.0.0.1:3080 user@remote-host","tags":["per-docs","remote-access"],"source_refs":[{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":74,"end":80}]},{"id":"deep-seek-harness:90","slug":"deep-seek-harness","code":"5190","category":9,"rank":0,"type":"recall","level":1,"concept":"Manual launch verification","question":"deep-seek-harness has no test suite: which manual check proves a launch works, and what is its passing sign?","answer":"Launch with `--no-open`, then request `http://127.0.0.1:3080`: HTTP 200 and the app renders.","explanation":"This is the only verification the repository records: one end-to-end run on a clean Linux container. Nothing automated guards a broken upstream release.","example":"./start-harness.sh --no-open  # then fetch http://127.0.0.1:3080 and expect HTTP 200","evidence_quote":"served the Web UI at http://127.0.0.1:3080 (HTTP 200, app renders)","tags":["per-docs","smoke-check"],"source_refs":[{"path":"README.md","branch":"main","commit":"54739fdc68c41fc5e1c6c04fcdbb3a36580d63cb","line":48}]},{"id":"deep-seek-harness:91","slug":"deep-seek-harness","code":"5191","category":9,"rank":1,"type":"scenario","level":3,"concept":"update:dsh moves one pin","question":"deep-seek-harness: you run `npm run update:dsh` to move to a newer upstream release. Which
