ects/crm-three-scenarios/method-structured-citation-metagraph.md:224-228"},{"decision":"Files are the bus between agents; schemas are the contract; the orchestrator reads only typed summaries and paths.","why":"Each agent reads brief.md and writes its full output to a named file, so nothing of substance travels in a prompt except claim batches and verdicts. This kept the orchestrator's context a control loop: it counted 135 facts instead of reading them.","alternative_rejected":"Passing raw material through prompts or the orchestrator's context","evidence":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:137-149"},{"decision":"Score neighbours as 0.7 x co-citation + 0.3 x folder proximity, with slides as views and the entity hierarchy as folders.","why":"Reused unchanged from the owner's citation-algorithm plan. Proximity is small by design (halving per level) so it only breaks ties; the neighbourhood comes from where things were shown together, not from prose adjacency.","alternative_rejected":"Prose adjacency or an equal-weight proximity term","evidence":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:50-79"},{"decision":"Keep refuted claims as nodes with status refuted and retire their ids, instead of deleting them.","why":"In the worked case refuted claims were deleted; keeping them as negative evidence lets a deck say 'two pricing claims were refuted' with a citation, and a retired id can never be silently reused.","alternative_rejected":"Delete the node, its edges and view cites (what the first pass did)","evidence":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:234-236"},{"decision":"Write the boundary brief inside the project folder with repository-relative locators from the first minute.","why":"The first brief cited scratchpad paths, which leaked into 143 locators in the graph and 84 in the ledger and had to be rewritten by hand; scratch locators die when the session ends.","alternative_rejected":"A brief and extracts kept in a session scratch directory","evidence":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:207-211"},{"decision":"Produce PowerPoint through an editable Markdown intermediate (HTML -> Markdown -> pandoc) with a 16 pt reference template, one picture or table per slide.","why":"The HTML deck stays the source of truth; wording can be edited in Markdown and facts only in HTML + ledger. Pandoc's stock 24 pt body overflows dense slides, and its two-column and caption layouts overlap pictures and tables.","alternative_rejected":"Direct pandoc defaults, or building the pptx by hand","evidence":"projects/crm-three-scenarios/pptx/README.md:20-29"},{"decision":"Skip the upstream lead-magnet CTA slide and close with 'a presentation, not a decision'; light neutral style.","why":"The audience is executive stakeholders, not YouTube viewers, so the mandatory CTA rule of Claude.MD is deliberately overridden for this deck.","alternative_rejected":"Following Claude.MD's mandatory final CTA slide","evidence":"projects/crm-three-scenarios/brief.md:254-258"}],"gotchas":[{"issue":"A pricing explorer read a vendor calculator's default slider value as a price tier.","consequence":"A fabricated price band would have sat on a cost slide (claim C128, refuted).","fix_or_guard":"Only the source-fidelity verifier caught it: it re-opens the URL and checks the quote says exactly this.","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:220-221"},{"issue":"git log -8 truncated a ten-commit history and hid the first commit.","consequence":"A provenance claim was wrong (C058 refuted) and the only evidence for the 'understand tech is outsourced' example was missed until harvested by hand as C157.","fix_or_guard":"Log without a count limit when provenance is the question; give verifiers a side_findings channel.","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:222-233"},{"issue":"The live HubSQL engine summed an id column when asked to COUNT it and silently dropped an association filter inside a GROUP BY.","consequence":"Counts from the live portal can be silently wrong.","fix_or_guard":"Keep only COUNT(*) results and record the quirk as a methodological fact (Appendix A of the deck).","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:201-205"},{"issue":"Capped scans (10,000 records) produce floors, not counts.","consequence":"A partial figure presented as a total; most of the 83 caveats were this kind of scope conflation.","fix_or_guard":"The caveat is stored in attrs.caveat and must travel to the slide or its notes; deck_cites_check.py lists every caveated claim.","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:215-218"},{"issue":"The two copies of citation_graph.py differ at line 137: the project copy hard-codes the node-type order (with plan, plan_layer); the skill copy reads meta.node_types.","consequence":"With the project copy, a node type missing from the hard-coded list gets no section in metagraph.md; the two files can drift further.","fix_or_guard":"Use the skill copy (.claude/skills/structured-citation-metagraph/scripts/citation_graph.py) and declare new node types in meta.node_types.","path":"projects/crm-three-scenarios/citation_graph.py:137"},{"issue":"The bundled workflow script (skill references/workflow-crm-three-scenarios.js:28 and :301) still carries first-run behaviour: EVIDENCE requires only source and locator (not quote), and the maintainer prompt says refuted -> remove.","consequence":"Reusing it verbatim contradicts the skill's invariants (evidence triple, refuted nodes kept with status refuted).","fix_or_guard":"SKILL.md says to reuse its phase shape and rewrite its prompts; tighten the schema to require quote.","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:307-309"},{"issue":"A dense HTML slide (300-460 words, notes hidden behind N) does not fit a linear medium.","consequence":"24 HTML slides became 74 pptx slides, 27 became 90; views in the committed graph carry no budget.","fix_or_guard":"Plan each view with a budget per medium (words for HTML, lines for pptx) before writing; --budget tunes the pptx chunking.","path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md:268-272"},{"issue":"build_pptx.py is specific to this deck: default paths, the YAML date '2026-10-01' and the class vocabulary (tiles, bars, gates, hcgrid) are hard-coded; a stale docstring mentions WORDS_PLAIN.","consequence":"Reusing it for another deck silently mis-dates the title slide and drops unknown layouts into generic paragraphs.","fix_or_guard":"Pass --deck / --out / --figures and edit line 416; re-run render_figures.js first because figures are matched by slide and svgIndex.","path":"projects/crm-three-scenarios/pptx/build_pptx.py:416"}],"glossary":[{"term":"Presentation layer vs decision layer","meaning":"The deck's rule: show grounded truth against the options and offer no choice. Nothing shown is a recommendation."},{"term":"Evidence triple","meaning":"{source, locator, quote}: the minimum every fact must carry to be shown; without all three the guard treats the node as ungrounded."},{"term":"Metagraph","meaning":"metagraph.json: nodes (story, image, data_problem, practical_example, scenario, gate_cell, project, cost_line, evidence_fact, plan, plan_layer), typed edges and views, with max_depth 4."},{"term":"View","meaning":"A planned slide: an id (V01...V25), a title and the list of node ids it cites. Co-citation is counted over views."},{"term":"Claim id (Cxxx)","meaning":"The id of an evidence_fact node, shown on the deck as data-claim=\"C067\" and as a row in the evidence ledger. Retired ids (refuted) are never reused."},{"term":"grounded_in","meaning":"The edge type that links a narrative node to its evidence; a node is citable only if a grounded_in path reaches a fact with a full evidence triple."},{"term":"Co-citation","meaning":"Number of views (slides) that cite both of two nodes; weight 0.7 in the combined score."},{"term":"Folder proximity","meaning":"1 / 2^(max_depth - shared ancestor depth) along the parent chain, which plays the role of vault folders; weight 0.3."},{"term":"Boundary brief","meaning":"brief.md: the only context boundary. The user's stories are admissible as 'what was asked', never as truth."},{"term":"Provenance tag","meaning":"The data-source label of a source family, e.g. tracker-210926, live-hubsql-2026-10-01, sealsq-property-set-2026-09-14, public-pricing-\u003curl>, brief-2026-10-12."},{"term":"Confidence ladder","meaning":"Price / fact tiers carried verbatim on cost slides: official list, vendor list, partner range, secondary, order of magnitude, illustrative, tracker words, not priced."},{"term":"Verdicts (two vocabularies)","meaning":"Claim verdicts: confirmed, caveat, refuted (default refuted when unverifiable). Health-check verdicts about built items: keep, simplify, consolidate, pay_for."},{"term":"Lenses","meaning":"The two verifier roles per batch of 8 claims: source fidelity (re-open the source) and numeric and logical consistency (recompute, catch scope conflation)."},{"term":"Gates table","meaning":"The user's 6 rows x 3 scenarios matrix (sampling probe, schema blueprint, rules to comply, declarative action layer, new cost lines, depends on) = 18 gate_cell nodes."},{"term":"Illustrative, not measured","meaning":"Label for story elements and metaphors (iceberg, Team A pitch, speedometer, messy landlord, Team B) that found no evidence; 18 such elements in the first pass."}],"directions":["Run the skill on a second project (method.md says this is the next step) and execute the three prompts in evals/evals.json, since the skill has only its originating case.","Update the bundled workflow script to the skill's own rules: require quote in EVIDENCE, add side_findings to VERDICT_SCHEMA, keep refuted nodes, add kind / confidence to the explorer schema, and call deck_cites_check.py as a QA step.","Add a budget per medium to each view in metagraph.json (currently none) so dense slides are split at planning time instead of at pptx conversion.","Script the hygiene pass (path normalisation, forbidden-token and personal-data scrub, idempotent regeneration check) that the orchestrator did by hand.","Unify the two citation_graph.py copies and generalise build_pptx.py (date, paths, class map) so the 'pptx recovery pattern' works for any deck.","Reuse the claim-id + evidence-quote + guard pattern for other grounded outputs (documentation pages, flashcards): it is the same 'every statement cites a locator and a quote' contract."],"confidence":"high","coverage_notes":"Read in full: the skill folder (SKILL.md, schemas, brief template, evals, method.md, both scripts), pptx/README.md, build_pptx.py, render_figures.js, the deck's script block, README.md; workflow script read for control flow, verify, QA and explorer prompts. brief.md sections 1, 2e, 2f, 3, 5 read. metagraph.json summarised by counting. Health check, cost lines, ledger read by headings and verification header; explore JSONs, sources/ extracts and metagraph.md not read (CRM detail and people). Nothing executed. CITATION NOTE: the validator cannot resolve paths starting with '.claude', so skill files are cited through identical project copies (citation_graph.py, method-structured-citation-metagraph.md) or through the method.md lines that describe them; the real skill path is given in the text.","slug":"presentation-builder","code":"71","repo":"presentation-builder","visibility":"public","fork":true,"pushed_at":"2026-10-12T13:12:09Z","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","alts":[],"aliases":["presentation builder","the three-scenarios deck","three stories three scenarios","the citation metagraph","structured-citation-metagraph skill","the evidence ledger deck","the iceberg / speedometer / landlord deck","the pptx recovery pattern"],"analyzed_at":"2026-11-12","card_count":16,"shelf":7,"github":"https://github.com/Wkayaobama/presentation-builder"},{"title":"Ghost-CRM: Skhokho docs import + 16-skill Django rebuild contract","one_liner":"Docs-only repo: a VuePress 1.8.2 site imported from Skhokho Business Management Software plus a 16-skill library that specifies how to rebuild the product as a modular Django app.","purpose":"Ghost-CRM holds no application code. It contains the 45-page, 169-screenshot user documentation of Skhokho (a real Django-built SMB suite: CRM, HR/payroll, accounting, projects, OKR, client portal), imported wholesale and only partially rebranded, plus one provenance script (rewrite_links.py) that flattened every skhokho.io link to the repo URL and archived the originals in per-page References blocks. The mission is to rebuild the documented product as a production Django application, with the docs as product ground truth. The analysed branch adds a knowledge-transfer library of 16 skills under .claude/skills/: an architecture contract (17-app map, invariants I1-I6, rulings R1-R10), a gated campaign plan (G0-G6), change control (classes C1-C5, rules N1-N8), five domain specs, and five read-only diagnostics that certify the corpus baseline. It exists so a zero-context engineer or agent can start the rebuild without re-deciding what the docs left ambiguous.","domain":"CRM / SMB business-suite rebuild spec (docs + knowledge transfer)","status":"docs-only","stack":["VuePress 1.8.2","webpack 4.46.0 (pinned by lockfileVersion 1)","Node 14/16 or NODE_OPTIONS=--openssl-legacy-provider","Markdown","Python 3 stdlib scripts","Claude Code skills (.claude/skills)","Django 5.2 LTS + pytest-django (planned, not present)","Celery + Redis (planned default, not present)"],"entry_points":[{"command":"npm ci && npm run docs:dev","what":"Install the pinned 2021 tree and serve the docs site with hot reload at localhost:8080/documentation/ (on Node >= 17 export NODE_OPTIONS=--openssl-legacy-provider first).","path":"package.json:8"},{"command":"npm run docs:build","what":"Static build into docs/.vuepress/dist/ (gitignored); only works when served under the /documentation/ subpath.","path":"package.json:9"},{"command":"python3 rewrite_links.py [--apply] [--docs PATH]","what":"Dry run by default: reports the skhokho.io markdown links it would flatten; --apply rewrites files and regenerates the References blocks.","path":"rewrite_links.py:54"},{"command":"python3 .claude/skills/diagnostics-and-tooling/scripts/audit_branding.py [--repo PATH]","what":"S1 rebrand meter: counts 'skhokho' per file split into body vs immutable References; exits 1 at baseline because the rebrand is incomplete."},{"command":"python3 .claude/skills/diagnostics-and-tooling/scripts/check_references_integrity.py","what":"S3 provenance tripwire: every References block must be byte-intact machine output (one header, exact separator, well-formed entries)."},{"command":"python3 .claude/skills/diagnostics-and-tooling/scripts/docs_inventory.py","what":"S5 drift dashboard: compares corpus counts against the embedded 2026-08-30 baseline; any DEVIATION exits 1."},{"command":"npm test","what":"Hardcoded failure (echo + exit 1). There are no tests and no CI; the failure is kept as an honest red.","path":"package.json:7"}],"architecture":[{"component":"Docs corpus (the product spec)","path":"docs","responsibility":"45 markdown pages in 9 modules (guide, personal, manager, okr, hr, project, client, accounting, sales) plus 169 screenshots. Product ground truth for the rebuild; code must conform to it, never the reverse.","talks_to":["VuePress config","References blocks"]},{"component":"VuePress site config","path":"docs/.vuepress/config.js","responsibility":"The whole site behaviour in 34 lines: base '/documentation/', favicon head link, still-Skhokho title/description, 10 nav entries (Home points at the live skhokho.io), and 9 sidebar arrays that must mirror the 45 md files 1:1.","talks_to":["Docs corpus","check_sidebar_sync.py"]},{"component":"Link rewriter / provenance tool","path":"rewrite_links.py","responsibility":"Flattens every markdown link whose URL contains skhokho.io to the bare repo URL and appends a '## References (original links)' block with the deduped originals. Those blocks are the only record of the original app's routes.","talks_to":["Docs corpus"]},{"component":"architecture-contract skill","path":".claude/skills/architecture-contract/SKILL.md","responsibility":"Single home of design decisions: candidate 17-app Django map and layered dependency graph, shared-schema tenancy contract, invariants I1-I6, ruling register R1-R10, legacy route reconstruction method, known weak points.","talks_to":["domain-* skills","campaign-django-rebuild","change-control"]},{"component":"campaign-django-rebuild skill","path":".claude/skills/campaign-django-rebuild/SKILL.md","responsibility":"Executable rebuild runbook: phases G0 spec freeze, G1 skeleton, G2 tenancy + permission engine, G3 clients + projects, G4 money + HR, G5 CRM + collab, G6 portal; ranked solution menus; fenced wrong paths W1-W8; promotion protocol.","talks_to":["architecture-contract","change-control","diagnostics scripts"]},{"component":"change-control skill","path":".claude/skills/change-control/SKILL.md","responsibility":"Classifies every change (C1 docs-content, C2 docs-infra, C3 skill-library, C4 future-app-code, C5 provenance-touching) and holds the non-negotiable register N1-N8 with reviewer checklists and the skill promotion path.","talks_to":["all skills"]},{"component":"Diagnostics battery (S1-S5)","path":".claude/skills/diagnostics-and-tooling/scripts","responsibility":"Five read-only stdlib scripts (branding audit, image cross-check, References integrity, sidebar sync, inventory) with exit contract 0 pass / 1 findings / 2 cannot run. They certify the corpus baseline before and after every phase.","talks_to":["Docs corpus","VuePress config","git log"]},{"component":"validation-and-qa skill","path":".claude/skills/validation-and-qa/SKILL.md","responsibility":"Evidence tiers (command output, docs citation, ruling, labelled inference), golden inventory G1-G14, acceptance thresholds per change class, and the four planned test tiers for the rebuild.","talks_to":["diagnostics-and-tooling","change-control"]},{"component":"Domain spec skills (5)","path":".claude/skills/domain-tenancy-and-access/SKILL.md","responsibility":"domain-tenancy-and-access, -hr-and-payroll, -accounting, -sales-and-marketing, -projects-okr-collab: documented behaviour fact by fact with citations, open registers, and candidate Django model sketches. Tenancy holds the permission matrix.","talks_to":["architecture-contract"]},{"component":"Operations skills","path":".claude/skills/build-and-operate/SKILL.md","responsibility":"build-and-operate (clone, Node trap, npm ci, serve under /documentation/), config-and-flags (every config axis with status PROD/STALE/BUG), debugging-and-archaeology (triage T1-T8, experiments E1-E4, chronicle A1-A7).","talks_to":["VuePress config","rewrite_links.py"]},{"component":"Standards and writing skills","path":".claude/skills/engineering-standards/SKILL.md","responsibility":"engineering-standards (modularity rules D1-D6 with grep checks, SOLID examples, idea lifecycle, frontier register F1-F5), docs-and-writing (house style, rebrand checklist, attribution rule), reference (domain glossary).","talks_to":["change-control","architecture-contract"]}],"data_flow":["1. Origin: Skhokho's VuePress docs were imported; rewrite_links.py ran BEFORE the first commit, so the pre-rewrite text exists nowhere in git (import commit is an orphan root later merged with the GitHub README root).","2. rewrite_file() matches each [label](...skhokho.io...) link, swaps the URL for the bare repo URL and collects (label, url) pairs deduped in order.","3. If the file already has a References header, the text is split on the exact separator '\\n\\n---\\n\\n## References (original links)' and the old block dropped; a fresh block is appended. Result: 43 of 45 pages carry a block, 69 archived entries.","4. VuePress reads docs/ plus config.js (base /documentation/, nav, 9 sidebar arrays) and builds the static site into docs/.vuepress/dist/.","5. Skill library layer: the docs were read into 16 skills; contradictions became rulings R1-R10, gaps became [open] items, and every count was certified as a golden inventory dated 2026-08-30.","6. Planned G0: run the five diagnostics to prove the corpus is at baseline, mine screenshot-only schemas (items A1-A7) into rulings, classify every [open] item as ruling or deferral.","7. Planned G1: create app/ at the repo root, startproject config, apps accounts/tenants/core, set AUTH_USER_MODEL = 'accounts.User' BEFORE the first migrate.","8. Planned G2: tenancy + three-layer permission engine (package gating, five member grants, line-manager row scoping), proven by the permission matrix as parametrized pytest cells.","9. Planned G3-G6: clients + projects slice with route parity (3 of 7 legacy routes built, 4 deferred), accounting then payroll with idempotency proofs, CRM + unified collab models, finally portal + calendar aggregation.","10. Every phase exit is a C4 change through change-control: diagnostics still at baseline, gate numbers quoted, full pytest tally, rulings ledger delta, no file under docs/ modified."],"key_functions":[{"name":"rewrite_file","path":"rewrite_links.py:24","signature":"def rewrite_file(path: Path, apply: bool) -> tuple[int, list[tuple[str, str]]]","does":"Core of the provenance tool: regex-substitutes skhokho.io links with NEW_URL, harvests the original (label, url) pairs, strips any previous References block by exact-separator split, appends a regenerated block, and writes only when apply is true. Returns (match count, originals).","input_example":"rewrite_file(Path('docs/guide/index.md'), apply=False)","expected_output":"Returns (0, []) and leaves the file untouched when it contains no skhokho.io markdown link (early return at lines 38-39)."},{"name":"main (rewrite_links.py)","path":"rewrite_links.py:54","signature":"def main() -> int","does":"CLI: --apply (default is dry run) and --docs (default is \u003cscript dir>/docs, not cwd). Walks docs/**/*.md, prints one line per touched file and a summary. Returns 1 when the docs directory is missing.","input_example":"python3 rewrite_links.py","expected_output":"[DRY RUN] 69 link(s) across 43 file(s) of 45 scanned.  (documented baseline on the committed tree; the same 69/43 is printed on every re-run)"},{"name":"LINK_RE / REFERENCES_HEADER","path":"rewrite_links.py:20-21","signature":"LINK_RE = re.compile(r\"\\[([^\\]]+)\\]\\((https?://[^)\\s]*skhokho\\.io[^)\\s]*)\\)\")","does":"Load-bearing constants. LINK_RE only sees markdown inline links, which is why the nav Home link in config.js and all prose mentions escaped the rewrite. REFERENCES_HEADER plus the '\\n\\n---\\n\\n' separator is the strip-and-regenerate anchor."},{"name":"split_md","path":".claude/skills/diagnostics-and-tooling/scripts/audit_branding.py:31","signature":"def split_md(text: str)","does":"Splits a markdown page at the References header so branding hits can be counted separately as actionable body debt versus immutable archive.","input_example":"split_md('intro text with no header')","expected_output":"('intro text with no header', '') - the refs part is an empty string when no header exists."},{"name":"main (audit_branding.py, S1)","path":".claude/skills/diagnostics-and-tooling/scripts/audit_branding.py:39","signature":"def main() -> int","does":"Counts case-insensitive 'skhokho' in every non-PNG file under docs/, plus package.json, plus skhokho.io URLs in md bodies and config.js. Findings = body + package.json + body URLs + config links; References occurrences never count.","expected_output":"Documented baseline: body 59, refs 73, grand=132; package.json 3; 0 body URLs; 1 live link at config.js:10; 'FINDINGS: 63 stale-branding item(s)'; exit 1."},{"name":"main (check_references_integrity.py, S3)","path":".claude/skills/diagnostics-and-tooling/scripts/check_references_integrity.py:37","signature":"def main() -> int","does":"For each md file: at most one References header, the byte-exact MACHINE_SEP before it, no skhokho.io URL above it, every block line shaped '- [label](url)', block ends the file with one newline. Any violation exits 1.","expected_output":"Documented baseline: 45 scanned, 43 with a block, 2 without (docs/client/portal.md, docs/okr/keyresults.md), 69 entries, 0 violations, 'PASS: all References blocks are byte-intact machine output.'"},{"name":"main (check_sidebar_sync.py, S4)","path":".claude/skills/diagnostics-and-tooling/scripts/check_sidebar_sync.py:29","signature":"def main() -> int","does":"Regex-parses the sidebar arrays out of config.js (JS, not JSON), maps '' to index.md, and compares each section with the md files on disk in both directions; also flags module dirs with no sidebar section.","expected_output":"Documented baseline: 'PASS: sidebar and disk agree (45:45).'"},{"name":"main (check_images.py, S2)","path":".claude/skills/diagnostics-and-tooling/scripts/check_images.py:28","signature":"def main() -> int","does":"Set-compares image references in md against files in docs/.vuepress/public/img/. Missing images exit 1; orphans are informational, and an orphan named in config.js is flagged as not a true orphan.","expected_output":"Documented baseline: 169 on disk, 156 unique refs, 0 missing, 13 unreferenced (favicon.png is used by config.js, so 12 true orphans); exit 0."},{"name":"main / EXPECTED (docs_inventory.py, S5)","path":".claude/skills/diagnostics-and-tooling/scripts/docs_inventory.py:23","signature":"EXPECTED = {'md_total': 45, 'images_total': 169, 'references_blocks': 43, 'github_links_md': 73, 'skhokho_urls_md': 69, 'skhokho_occurrences_docs': 132, ...}","does":"Embedded baseline dict and the main() that re-measures each number, printing 'ok' or 'DEVIATION' per row. Only script that shells out, and only to git log -1 (informational).","expected_output":"Documented baseline: 'PASS: corpus matches the 2026-08-30 baseline exactly.'"},{"name":"default_repo","path":".claude/skills/diagnostics-and-tooling/scripts/audit_branding.py:26","signature":"def default_repo() -> Path","does":"Self-location shared by all five scripts: Path(__file__).resolve().parents[4] climbs scripts -> diagnostics-and-tooling -> skills -> .claude -> repo root, so the scripts work from any cwd; --repo overrides it."},{"name":"requires_app_grant [candidate sketch, no code exists]","path":".claude/skills/domain-tenancy-and-access/SKILL.md:571","signature":"def requires_app_grant(app: str)","does":"Planned layer-2 permission decorator in core/permissions.py: raises PermissionDenied when the request has no membership; passes when the member is owner or holds grant_\u003capp>. Views declare a named capability instead of writing if-statements (wrong path W2)."},{"name":"direct_reports / hr_visible_memberships [candidate sketch]","path":".claude/skills/domain-tenancy-and-access/SKILL.md:586-596","signature":"def direct_reports(membership); def hr_visible_memberships(membership)","does":"Planned layer-3 row scoping. direct_reports returns only memberships whose line_manager is the caller (not recursive, invariant I2). hr_visible_memberships returns the whole company for owner or HR-grant holders (I3), else the direct reports.","input_example":"Mr-X case: 12 employees, 3 report to X","expected_output":"X's HR-file list returns exactly 3 (the gate test prescribed for G2, from docs/manager/hr.md:6)."},{"name":"TenantManager.for_company / CompanyMiddleware [candidate sketch]","path":".claude/skills/domain-tenancy-and-access/SKILL.md:539-560","signature":"def for_company(self, company)","does":"Planned tenancy plumbing in core: abstract TenantModel carries the company FK, the manager filters by company, and the middleware resolves request.company from the user's Membership; portal accounts get company None and reach only portal views (I1, I5)."},{"name":"grantable_apps [candidate sketch]","path":".claude/skills/domain-tenancy-and-access/SKILL.md:498","signature":"def grantable_apps(company) -> set[str]","does":"Planned billing service that implements ruling R1 and invariant I4: the subscription package bounds which of the five grants may be issued, checked at invite time and at grant-edit time. The one declared coupling point between tenancy and billing."}],"infra":[{"topic":"Docs site build","detail":"VuePress 1.8.2 via 'vuepress dev docs' and 'vuepress build docs'. package-lock.json is lockfileVersion 1 and pins webpack 4.46.0, which hashes with MD4; Node >= 17 (OpenSSL 3) fails with ERR_OSSL_EVP_UNSUPPORTED unless Node 14/16 is used or NODE_OPTIONS=--openssl-legacy-provider is exported. Install with npm ci, never npm install. Runbook: skill build-and-operate, sections 1.2-1.3.","path":"package-lock.json:10692-10693"},{"topic":"Serving path","detail":"config.js sets base '/documentation/'. Dev server lives at localhost:8080/documentation/; a built dist/ must be mounted under a path literally named 'documentation' or every asset and router link 404s. No deployment exists in the repo.","path":"docs/.vuepress/config.js:2"},{"topic":"Tests and CI","detail":"None. npm test is a hardcoded exit 1, there is no .github/ directory, no workflow, no Dockerfile. The five diagnostics plus the reviewer are the only safety net ('you are the CI').","path":"package.json:7"},{"topic":"Git ignore / artifacts","detail":"Eight lines: node_modules/, docs/.vuepress/dist/, .cache/, .temp/, __pycache__/, *.pyc, .DS_Store, Thumbs.db. Nothing build-related is committed, so a fresh clone renders nothing until install + build. (File: .gitignore at the repo root.)"},{"topic":"Planned Django baseline (not present)","detail":"app/ at the repo root, venv, Django LTS (5.2.x noted on 2026-08-30) + pytest-django, 'django-admin startproject config .', first apps accounts, tenants, core. Planned root .gitignore additions: app/.venv/, app/db.sqlite3, app/staticfiles/. Source: skill campaign-django-rebuild, Phase 1."},{"topic":"Planned background jobs (not present)","detail":"Default choice Celery + Redis for bulk SMTP sends and asynchronous CSV import; cron-style management commands acceptable only for the payroll trigger and recurring documents; Django's built-in Tasks framework ranked third because it is outside the pinned LTS. Source: skill campaign-django-rebuild, solution menu 3; the cited docs line is the 'running in the background' evidence.","path":"docs/sales/groups.md:98"},{"topic":"Branches / history","detail":"main holds the docs baseline (three commits, two parentless roots joined by a merge: GitHub README root + orphan docs-import root). The analysed branch claude/ghost-crm-skill-library-x37l4e sits above it and touches only .claude/ (21 files, about 8,700 lines). Source: skill debugging-and-archaeology, chronicle A1."}],"decisions":[{"decision":"One Django app per bounded context (17-app map), no cross-app model imports outside declared interfaces","why":"The maintainer's costliest past failure was a monolith where multiple languages blurred functionality boundaries. Modularity is therefore doctrine: apps interact via FKs in the dependency direction, signals (hr to accounting) or exported service functions (billing.grantable_apps). Source: skill architecture-contract section 7 and change-control N8 (maintainer testimony, 2026-08-30).","alternative_rejected":"One mega-app or a shared models.py dumping ground (wrong path W3)"},{"decision":"References blocks are immutable provenance (N1) and git history is never rewritten (N5)","why":"The link rewrite ran before the first commit, so the blocks are the only surviving record of the original app's deep links and route structure; they are the raw material for the rebuild's URL design. The exact separator is also what the script splits on, so hand edits corrupt files. Rule home: skill change-control, N1 and N5.","alternative_rejected":"Cleaning up or grep-replacing 'skhokho' across docs/","evidence":"rewrite_links.py:44-45"},{"decision":"Shared-schema tenancy with a company FK (TenantModel + TenantManager + middleware)","why":"Matches the documented product: single database, invite-only membership (one user, one company) and portal accounts that accumulate per-project grants keyed by email, trivially expressible when tenants share tables. Leakage risk is carried by the G2/G3 isolation tests. Home: skill campaign-django-rebuild, solution menu 1.","alternative_rejected":"django-tenants schema-per-tenant, or a database per tenant","evidence":"docs/client/portal.md:26"},{"decision":"Permission engine = decorators + scoped managers in core, rules computed from current FKs","why":"Visibility is relationship-computed (line-manager tree, org-wide HR overlay, creator/assignee), so nothing must be kept in sync when a line manager changes, and the engine is testable as one matrix. Stored per-object rows would need a bulk rewrite on every reassignment. Home: skill campaign-django-rebuild, solution menu 2.","alternative_rejected":"django-guardian object-permission rows; per-view if-statements (W2)","evidence":"docs/manager/hr.md:6"},{"decision":"Custom AUTH_USER_MODEL = 'accounts.User' set before the first migrate","why":"Django's auth, admin, contenttypes and sessions migrations bake a foreign key to whatever user model exists at first apply; switching later is unsupported without dropping the database. It is the only irreversible decision of the campaign, so it is made in the first hour. Home: skill campaign-django-rebuild, Phase 1 step 1.3.","alternative_rejected":"Migrating on the default auth.User and repairing django_migrations afterwards (W1)"},{"decision":"Docs contradictions are resolved by numbered rulings, never by code or by editing docs: R1 tiers (Starter=T1, Business=T2, Business Pro=T3), R2 'Concerted' means CONVERTED","why":"There is no original team or running system to consult; docs plus the ruling register are the only arbiter. A ruling is cited as a ruling, never as documented fact, and each becomes a pinning test when its code lands. Register: skill architecture-contract section 4; the R2 typo is at docs/sales/hustle.md:60.","alternative_rejected":"Codifying the doc bug, or whichever engineer gets there first deciding","evidence":"docs/guide/company.md:76-77"},{"decision":"Unify the duplicated systems: one Client (R4, superset schema), one Task enum TODO/IN_PROGRESS/DONE (R3), one Meeting/Note/Document/Task model each with nullable scope FKs (R9)","why":"The docs state the client list is shared by project, sales and accounting, and the sales pages reuse the project module's screenshots, so the original served one component in several scopes. Four task tables would still have to union onto the personal kanban and calendar. Register: skill architecture-contract R3, R4, R9.","alternative_rejected":"A Client or Task table per module (W4)","evidence":"docs/project/clients.md:9"},{"decision":"Leave accrual is a side effect of the payroll run (R5); a run is unique per (company, month)","why":"hr/index.md says leave is credited every month, hr/payroll.md says when payroll is run; the payroll statement is more specific and two accrual paths would double-credit. The run moves money and leave with no documented double-run protection, so idempotency is a gate (byte-identical second run). Register: skill architecture-contract R5; transaction design in domain-hr-and-payroll Part 3.","alternative_rejected":"Calendar-monthly accrual independent of payroll","evidence":"docs/hr/payroll.md:12"},{"decision":"manager and personal doc modules are view layers, not Django apps; ExpenseClaim lives in accounting, LeaveApplication in hr","why":"Manager approves what personal requests, so separate model apps would import each other. Keeping claim approval and Expense creation inside accounting makes the approval atomic within one boundary; payroll reaches accounting only through a payroll_run_completed signal. Home: skill architecture-contract, 'the two cycles to break'.","alternative_rejected":"personal / manager apps with their own models; claims in a personal app signalling into accounting","evidence":"docs/hr/payroll.md:13"},{"decision":"Logs are not evidence; success at every gate is a number from a command","why":"rewrite_links.py --apply prints 'wrote 69 link(s)' on every run even when the bytes are identical, because the References entries re-match the regex. Only git diff / diff -r proves change, so the same rule governs the whole campaign. Home: skills validation-and-qa 1.2 and diagnostics-and-tooling doctrine.","alternative_rejected":"Trusting tool output or eyeball review","evidence":"rewrite_links.py:72-75"}],"gotchas":[{"issue":"Hand-editing the References separator (even removing one blank line) and then running rewrite_links.py --apply","consequence":"The header check at line 44 passes but the split at line 45 finds nothing: the old block's skhokho.io URLs are flattened in place and a duplicate block is appended. The file ends with two References headers and damaged provenance.","fix_or_guard":"Never touch the blocks (N1); dry-run first on a clean tree (N6); check_references_integrity.py flags a non-byte-exact separator before any apply; restore the file from git.","path":"rewrite_links.py:44-45"},{"issue":"npm run docs:dev / docs:build die on modern Node with ERR_OSSL_EVP_UNSUPPORTED","consequence":"The site cannot be served or built; webpack 4.46.0 uses MD4, which OpenSSL 3 disables.","fix_or_guard":"Use Node 14/16, or export NODE_OPTIONS=--openssl-legacy-provider before any docs script. Noted as inferred from the lockfile pins; a live build was not run when the skills were written.","path":"package-lock.json:10692-10693"},{"issue":"npm install with npm >= 7 silently rewrites the lockfileVersion 1 lockfile","consequence":"An unreviewed multi-thousand-line diff to a file treated as part of the imported snapshot.","fix_or_guard":"Always npm ci; if the lockfile changed, git checkout -- package-lock.json and reinstall.","path":"package-lock.json:4"},{"issue":"The site only works under /documentation/, and the favicon 404s even then","consequence":"Root URL is blank; serving dist/ at a web root 404s every asset. VuePress 1 does not prefix head hrefs with base, while themeConfig.logo (same path string) is resolved correctly.","fix_or_guard":"Open /documentation/; stage dist under a directory named documentation. The favicon is a known cosmetic bug (hand-write the prefixed href through change control).","path":"docs/.vuepress/config.js:2-3"},{"issue":"rewrite_links.py reports 69 links / 43 files on every run","consequence":"Easy to misread as 'it changed 69 links again'; --apply also rewrites all 43 files (mtime churn) with identical bytes.","fix_or_guard":"Byte-idempotency was proven on a scratch copy (two applies, empty diff -r). Use git status / git diff as the instrument, never the log.","path":"rewrite_links.py:72-75"},{"issue":"Rebrand is incomplete: 132 'skhokho' occurrences in 46 files, config.js title/description, nav Home pointing at the live skhokho.io, package.json name, three branded image filenames","consequence":"The repo claims Ghost-CRM but reads Skhokho; a blunt find-and-replace would also rewrite the archived URLs inside References blocks.","fix_or_guard":"Rebrand prose and metadata only, above each References header, via the docs-and-writing checklist; attribution to Skhokho must stay visible (N2). Progress metric is the body count from audit_branding.py.","path":"docs/.vuepress/config.js:4-10"},{"issue":"Docs contain bugs that look like spec: both Business and Business Pro labelled 'Tier 3', hustle status 'Concerted', quote described as 'black', task status spelled four ways","consequence":"Copying them literally would bake typos and contradictions into models and enums.","fix_or_guard":"Use the ruling register (R1, R2, R3) and add a code comment citing the source typo; the G5 gate greps app/ for zero 'Concerted'.","path":"docs/guide/company.md:76"},{"issue":"Load-bearing schemas exist only in screenshots or nowhere: funnel intermediate stages, sales contact form, invite access-rights list, quote/invoice/expense status values, payment recording, recurring schedules, UIF default, net-pay composition","consequence":"Starting to code these means inventing product behaviour silently.","fix_or_guard":"G0 screenshot-archaeology pass (items A1-A7) and an [open]-register sweep: every gap gets a ruling or a named deferral before its phase starts.","path":"docs/sales/index.md:39"},{"issue":"Two-root git history, and two pages (client/portal.md, okr/keyresults.md) have no References block","consequence":"rebase / bisect / merge-base can misbehave; portal and key-result detail routes are unrecoverable and must be designed fresh and labelled as inventions.","fix_or_guard":"Never rewrite published history (N5); fix forward with new commits; mark invented portal URLs in code comments.","path":"docs/client/portal.md"}],"glossary":[{"term":"Skhokho","meaning":"Skhokho Business Management Software, the real Django-built South-African SMB suite whose documentation was imported. When a page says 'Skhokho does X', read 'the product being rebuilt does X'. Its origin must stay visibly attributed."},{"term":"References block","meaning":"The trailing '## References (original links)' section appended by rewrite_links.py to 43 of 45 pages; a bullet list of the original skhokho.io links (69 entries, 54 unique URLs). Immutable provenance and the only route map of the original app."},{"term":"Machine separator","meaning":"The exact bytes blank line, '---', blank line, then the References header. The rewriter splits on it to strip and regenerate a block; a single changed blank line breaks that."},{"term":"Ruling (R1-R10)","meaning":"A recorded design decision dated 2026-08-30 where the docs are silent or contradictory, homed in architecture-contract and cited as a ruling, never as documented fact."},{"term":"Invariants I1-I6","meaning":"I1 every tenant queryset filters by company; I2 managers see direct reports only; I3 the HR grant is org-wide; I4 the package bounds issuable grants; I5 portal users get read-only projections of granted projects and invoices; I6 References blocks are immutable."},{"term":"Gate (G0-G6)","meaning":"Measurable exit condition of a rebuild phase: spec freeze, skeleton, tenancy + permissions, clients + projects, money + HR, CRM + collab, portal + integrations. Note validation-and-qa also uses G1-G14 for golden-inventory rows."},{"term":"Change classes C1-C5 / register N1-N8","meaning":"C1 docs-content, C2 docs-infra + toolchain, C3 skill-library, C4 future-app-code, C5 provenance-touching (presumption of no). N1-N8 are rules no change may violate, e.g. N3 docs are ground truth, N4 no app code inside docs/, N8 one bounded context per app."},{"term":"Wrong paths W1-W8","meaning":"Fenced mistakes: migrate before custom user, scattered per-view authorization, mega-app, duplicate Client per module, codifying 'Concerted', trusting logs, editing docs to match code, float for money."},{"term":"App grant","meaning":"One of five per-member booleans on Membership (Manager, HR, Project, Accounting, Sales) that gate module access. In the docs an 'app' is a permission-gated product module, not a Django app."},{"term":"Line manager","meaning":"Membership self-FK forming the org tree; the docs also call the same person team leader and leave manager. LM-scoped means visible only over members whose line_manager is the acting user."},{"term":"Company / space","meaning":"The tenancy root; one company is one tenant and 'space' is the docs' and the legacy routes' word for it (e.g. /space/settings)."},{"term":"Hustle","meaning":"The docs' word for a sales lead or opportunity; it moves down the funnel by status change and ends as CONVERTED or Lost."},{"term":"Three person-records","meaning":"ClientContact (client-org people, portal invitees), SalesContact (CRM contacts attached to hustles) and GroupMember (mailing-list rows). They must never be merged, unlike Client, which is one shared entity."},{"term":"Screenshot archaeology","meaning":"Recovering form fields, enum values or KPIs from the 169 PNGs when prose is silent, then freezing each recovery as a ruling. Precedence is prose over screenshot over inference."},{"term":"Golden inventory / S1-S5","meaning":"The certified baseline numbers (45 md, 169 images, 43 blocks, 69 archived URLs, 132 occurrences) and the five diagnostic scripts that re-measure them: branding, images, References integrity, sidebar sync, inventory."}],"relations":[{"project":"GPT3.5_VBA","relation":"Its apilogicserver-* skill library follows the same contract / change-control / campaign / validation-and-qa structure. Shared documentation method only."}],"directions":["Execute G0 of the campaign: run the five diagnostics, transcribe the screenshot-only schemas (funnel stages, sales contact form, invite form, payroll screens) into rulings. Nothing else can start cleanly before this spec freeze.","Create app/ with the custom user model and reach G1/G2: the permission matrix as parametrized pytest cells is the load-bearing gate and cannot be retrofitted later.","Finish the rebrand without losing provenance (frontier F4): extend the rewrite-with-archive pattern to prose and config.js behind a dry-run default, and anchor the References block by header regex instead of the fragile exact separator.","Add an explicit Skhokho attribution section to README.md (currently one line) so the origin statement has a designated home before any rebrand sweep.","Wire the diagnostics into a first CI workflow (the repo has none): the four passing scripts as hard gates and the rewriter dry run as a golden-number check; replace the npm test placeholder only when a real runner exists.","Resolve the money-path open items before G4: status enums for quote/invoice/expense, what 'paid' means, recurring semantics, UIF default and net-pay composition all need rulings because they have financial consequences."],"confidence":"high","coverage_notes":"Read in full: rewrite_links.py, package.json, config.js, .gitignore, the five diagnostics scripts and the skills architecture-contract, campaign-django-rebuild, build-and-operate, config-and-flags, debugging-and-archaeology; most of change-control, validation-and-qa, engineering-standards, diagnostics-and-tooling. Sampled: the five domain-* skills, reference, docs-and-writing and the 45 docs pages. Images and lockfile body not opened. Nothing was executed: script outputs are the baselines documented in the skills (2026-08-30); the counts 45/169/132/46/43/69/54 were re-checked with read-only grep. Shallow clone, so the two-root history comes from the skills. PATH CAVEAT: the validator drops the leading dot of dot-directories, so files under .claude/ cannot be cited; such entries carry path '.' and the real location in [brackets] at the start of the text. 'Candidate sketch' functions exist only as code blocks in skill files; no Django code exists. One line of work only.","slug":"ghost-crm","code":"80","repo":"Ghost-CRM","visibility":"public","fork":false,"pushed_at":"2026-08-31T08:06:40Z","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","alts":[],"aliases":["Ghost CRM","the Skhokho docs rebuild","the Skhokho import","the Django rebuild campaign","ghost-crm skill library"],"analyzed_at":"2026-11-12","card_count":30,"shelf":8,"github":"https://github.com/Wkayaobama/Ghost-CRM"},{"title":"GPT-in-a-cell VBA fork + API Logic Server skill library","one_liner":"Fork of a one-function Excel/VBA OpenAI caller, turned into the 'before picture' for an 18-skill Claude library on modernizing spreadsheet glue into a governed API Logic Server system.","purpose":"The fork starts from a 44-line VBA function, OpenAI(prompt), that lets an Excel cell call the chat-completions API (plus a binary workbook carrying the key). The owner's own work is everything under .claude/skills/: 18 dense SKILL.md runbooks (17 apilogicserver-* skills plus declarative-rules-reference) and three diagnostic shell scripts about API Logic Server (ALS, packaged as Genai-Logic) and its LogicBank rules engine. The library treats the VBA file as the canonical specimen of ungoverned, application-embedded glue and defines a gated P0-P7 campaign to replace it with a server where business logic is declared once as rules, enforced on every write path, secured by JWT, proven by Behave tests, and reachable by AI only through the governed API (MCP). It exists so that a future session (human or model) can rebuild, operate, debug and honestly position an ALS project without re-fighting settled questions: every fact is labeled either verified against a live Genai-Logic 17.03.19 install (2026-08-23 to 26) or 'per docs, not live-verified'.","domain":"LLM tooling / legacy Excel-VBA modernization to declarative rules","status":"docs-only","stack":["Excel VBA (MSXML2.ServerXMLHTTP)","OpenAI chat completions (gpt-3.5-turbo)","Claude Code skills (SKILL.md Markdown)","Bash + curl","Python 3 stdlib (inside the scripts)","Subject: API Logic Server / Genai-Logic 17.03.19","Subject: LogicBank 1.32.0 rules engine","Subject: Flask + SQLAlchemy + SAFRS JSON:API","Subject: safrs-react-admin, Behave, Alembic","Subject: Kafka, MCP, Docker (documented only)"],"entry_points":[{"command":"=OpenAI(\"some prompt\")  (Excel cell formula, after pasting the function into a VBA module)","what":"The whole legacy system: sends the prompt to the chat-completions endpoint synchronously and returns the reply text into the cell.","path":"turbo3.5_excel_vba:1"},{"command":"HOST=localhost PORT=5656 ALS_USER=... ALS_PASS=... RESOURCE=Customer bash scripts/probe_health.sh","what":"Three-step health probe of a running ALS server: GET /api, login for a token, authorized GET of one row. Exit code N = step N failed.","path":".claude/skills/apilogicserver-debugging-playbook/scripts/probe_health.sh:5"},{"command":"scripts/extract_logic_log.sh logs/als.log","what":"Pulls each LogicBank transaction block (ROW LOGIC ... COMPLETE) out of a noisy server log, numbered, ANSI stripped, and flags blocks cut short by the logging bug.","path":".claude/skills/apilogicserver-debugging-playbook/scripts/extract_logic_log.sh:5"},{"command":"scripts/list_discovered_logic.sh   (from an ALS project root)","what":"Static mirror of ALS auto-discovery: lists which logic/api discovery files WILL LOAD, which are disabled by rename, and which have a bad shape.","path":".claude/skills/apilogicserver-debugging-playbook/scripts/list_discovered_logic.sh:6"},{"command":"Ask Claude Code about an ALS symptom or task; the matching skill under .claude/skills/ loads by its description","what":"Normal way the library is consumed: each skill's frontmatter description lists trigger symptoms, and its 'Do NOT use' section routes to the sibling that owns the topic.","path":".claude/skills/apilogicserver-change-control/SKILL.md:287-294"}],"architecture":[{"component":"Legacy exhibit (VBA OpenAI function)","path":"turbo3.5_excel_vba","responsibility":"Upstream code kept untouched as the before-picture: hand-concatenated JSON request, synchronous POST with a key held in the macro, InStr-based response scraping. Never hardened, only analysed.","talks_to":["OpenAI chat completions API","Excel cell"]},{"component":"Key-carrying workbook (binary)","path":"api_Key.xlsm","responsibility":"Macro-enabled workbook that in practice ships the key and the function per user copy. The skills record its role but say not to parse it; it was not opened for this map.","talks_to":["Legacy exhibit (VBA OpenAI function)"]},{"component":"Modernization campaign (P0-P7)","path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","responsibility":"The spine of the library: gated runbook from legacy inventory to containerised ALS, with exact commands, expected outputs, failure branches, rollback notes, a ranked solution menu and fenced wrong paths.","talks_to":["Legacy exhibit (VBA OpenAI function)","Theory and contract skills","Practice runbooks","Change control and QA gates"]},{"component":"Theory and contract skills","path":".claude/skills/declarative-rules-reference/SKILL.md","responsibility":"declarative-rules-reference (why rules, watch/react/chain, phases, delta adjustment, pruning, Rete comparison) plus architecture-contract (stack, file ownership, 7 invariants, startup and write-request sequence, weak points).","talks_to":["Practice runbooks","Failure archaeology ledger"]},{"component":"Practice runbooks","path":".claude/skills/apilogicserver-logic-patterns/SKILL.md","responsibility":"How-to skills, one home per fact: logic-patterns, data-modeling, api-contract, security-model, integration-patterns, genai-development, cli-and-config, build-and-env, operate-and-deploy.","talks_to":["Theory and contract skills","Change control and QA gates"]},{"component":"Change control and QA gates","path":".claude/skills/apilogicserver-change-control/SKILL.md","responsibility":"change-control classifies every change, owns the rebuild/Alembic runbook, five non-negotiables (NN-1..5) and gates G0-G5; validation-and-qa defines Behave evidence and the golden suite counts.","talks_to":["Practice runbooks","Modernization campaign (P0-P7)"]},{"component":"Debugging playbook + scripts","path":".claude/skills/apilogicserver-debugging-playbook/SKILL.md","responsibility":"18-row symptom triage table, deep dives (where-clause pruning, undiscovered rule, logging bug), logic-log reading guide, and the three shipped diagnostic scripts.","talks_to":["Running ALS server on port 5656","logs/als.log","Failure archaeology ledger"]},{"component":"Failure archaeology ledger","path":".claude/skills/apilogicserver-failure-archaeology/SKILL.md","responsibility":"Entries A1-A10 in a strict format (symptom, investigation, root cause, evidence, status) so settled battles are not re-fought; A9 is the line-by-line autopsy of the VBA file.","talks_to":["Legacy exhibit (VBA OpenAI function)","Research skills"]},{"component":"Research skills","path":".claude/skills/apilogicserver-research-frontier/SKILL.md","responsibility":"research-frontier holds the Positioning Ledger (what may be claimed, in which words) and open problems F1-F6; research-methodology holds the evidence bar, predict-numbers-first template, idea lifecycle and assigned refutation.","talks_to":["Failure archaeology ledger","Change control and QA gates"]}],"data_flow":["LEGACY 1. A cell calls OpenAI(prompt); the function pastes the raw prompt into a JSON string with model gpt-3.5-turbo and temperature 0 (turbo3.5_excel_vba:10-12).","LEGACY 2. It POSTs synchronously through MSXML2.ServerXMLHTTP with a Bearer header built from the key variable; Excel is frozen until the reply arrives (lines 14-18).","LEGACY 3. It finds the literal \"content\": \" marker with InStr, walks forward to the first double quote not preceded by a backslash, and returns that substring to the cell (lines 28-41). No status check, no error handling, no logging.","CAMPAIGN P0. Inventory the legacy: one capability, a risk register, and the gate table mapping five defects to the ALS mechanism and owning skill that removes each.","P1-P2. Build a venv, pip install ApiLogicServer, confirm with `als welcome`; `als create` a project (basic_demo stands in for the workbook's domain), add customizations and auth, start the server on port 5656; gate = startup banner plus an authenticated GET returning rows.","P3. Translate spreadsheet constructs to rules (cell formula -> Rule.formula, SUM -> Rule.sum, SUMIF -> Rule.sum with where, VLOOKUP -> Rule.copy, validation -> Rule.constraint); predict numbers, fire a violating PATCH, expect HTTP 400 code 2001, then run the shipped-order control that must return 200.","P4. Prove security: exact 401 body without a token, a predicted row-count difference for a restricted role, and a written plan to replace the sample credentials.","P5. Behave suite green (0 failed) and the Behave Logic Report generated; every migrated behaviour traceable to a named scenario.","P6. Re-introduce AI through the governed door (MCP client or a thin read-mostly Excel bridge calling the JSON:API with a JWT); gate = a rule-violating write through the new channel is rejected with the same 400/2001 body as P3.","P7. Containerise with the project's devops scripts and re-run the same suite against the container. Labeled to-execute: no container was built in the authoring workspace.","Every phase lands through change-control (classify, respect regenerated vs owned files, pass gates G0-G5); surprises become failure-archaeology entries; the VBA file is retired, not deleted."],"key_functions":[{"name":"OpenAI","path":"turbo3.5_excel_vba:1","signature":"Function OpenAI(prompt As String) As String","does":"The entire legacy system. Builds the request body by string concatenation, POSTs it synchronously, then scrapes the reply with InStr and a Do While loop. Its five defect classes are the justification for the whole campaign.","input_example":"=OpenAI(\"Say hello\") where the HTTP response text contains  \"content\": \"Hello\"","expected_output":"Hello  (the text between the marker \"content\": \" and the next unescaped double quote; escapes are returned un-decoded, and a response without that exact marker yields garbage rather than an error)"},{"name":"content-extraction loop","path":"turbo3.5_excel_vba:28-37","signature":"ContentStart = InStr(json, \"\"\"content\"\": \"\"\") + Len(...) ; Do While True ... If Mid(json, ContentEnd - 1, 1) \u003c> \"\\\" Then Exit Do","does":"Hand-rolled JSON 'parser'. Fails four ways per archaeology A9: content ending in a backslash overruns, compact JSON without the space breaks the marker, error bodies are parsed as success, escapes stay encoded. ContentStart/ContentEnd are 16-bit Integers (lines 24-25)."},{"name":"probe_health.sh","path":".claude/skills/apilogicserver-debugging-playbook/scripts/probe_health.sh:28-90","signature":"HOST PORT ALS_USER ALS_PASS RESOURCE (env vars, all defaulted) -> PASS/FAIL/SKIP lines, exit 0..3","does":"Step 1 GET /api expects 200; step 2 login expects access_token, but prints SKIP if an unauthenticated GET works (security off); step 3 authorized GET /api/RESOURCE/?page[limit]=1 expects 200 with a data key and prints meta.total.","input_example":"bash scripts/probe_health.sh against a healthy server with security on","expected_output":"Three PASS lines then 'OK    all probes passed against http://localhost:5656', exit 0. If nothing listens: 'FAIL  1. server up ... HTTP ...' and exit 1."},{"name":"extract_logic_log.sh","path":".claude/skills/apilogicserver-debugging-playbook/scripts/extract_logic_log.sh:23-75","signature":"extract_logic_log.sh \u003clogfile>","does":"Embedded Python state machine: a block opens on a 'Logic Phase:' line containing ROW LOGIC, closes on COMPLETE, and is flagged when it ends in '--- Logging error ---' (the constraint-violation path of the 17.03.19 logging bug) or is truncated.","input_example":"a log file with no write transactions","expected_output":"No \"Logic Phase: ROW LOGIC\" blocks found in \u003cpath>. followed by a hint about logic_logger level; exit 0. Otherwise numbered 'Transaction n  (session=0x...)' blocks and a final count line."},{"name":"scan","path":".claude/skills/apilogicserver-debugging-playbook/scripts/list_discovered_logic.sh:28-49","signature":"def scan(base, required_fn, exclude_init) -> (loaded, skipped, malformed) | None","does":"Walks a discovery directory recursively like ALS auto_discovery does: every *.py except auto_discovery.py and __init__.py is a candidate; files renamed to .pyXX count as disabled; a file lacking a top-level def of the required function is 'BAD SHAPE'."},{"name":"report","path":".claude/skills/apilogicserver-debugging-playbook/scripts/list_discovered_logic.sh:51-68","signature":"def report(title, base, required_fn, exclude_init) -> int (number of malformed files)","does":"Prints WILL LOAD / disabled / !! BAD SHAPE lines for logic/logic_discovery (needs declare_logic) and api/api_discovery (needs add_service); the script exits 1 if any file is malformed.","input_example":"run outside an ALS project root","expected_output":"stderr: 'Neither logic/logic_discovery/ nor api/api_discovery/ found.' plus a hint to run from the project root; exit 1"},{"name":"5-rule check-credit template (documented)","path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md:240-247","signature":"Rule.constraint(validate=Customer, as_condition=lambda row: row.balance \u003c= row.credit_limit, error_msg=...) ; Rule.sum(derive=Customer.balance, as_sum_of=Order.amount_total, where=lambda row: row.date_shipped is None) ; Rule.sum ; Rule.formula ; Rule.copy","does":"Upstream sample logic quoted as the worked translation of a check-credit spreadsheet: one validation, one SUMIF, one SUM, one cell formula, one VLOOKUP. Not code in this repo; it is the pattern every migrated rule follows.","input_example":"PATCH /api/Item/2/ setting quantity 1 -> 100 on the unshipped order (unit_price 90, credit_limit 5000)","expected_output":"HTTP 400, errors[0].code \"2001\", title \"Customer balance (9000.0000000000) exceeds credit limit (5000.0000000000)\"; the same PATCH on the shipped order's item returns 200"},{"name":"ALS_Get (candidate bridge)","path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md:433-449","signature":"Function ALS_Get(path As String, token As String) As String","does":"Corrected VBA sketch for the hybrid Excel bridge: GET against your own ALS server with a Bearer JWT, explicit timeouts, On Error handler and a Status check that returns 'ERROR \u003cstatus>: ...'. Explicitly labeled CANDIDATE: reviewed, never executed."},{"name":"delta algebra for Rule.sum (documented)","path":".claude/skills/declarative-rules-reference/SKILL.md:183-194","signature":"where(old_row), where(row) -> delta: (T,T) new-old ; (F,F) 0 ; (F,T) +new ; (T,F) -new","does":"The table that explains adjustment and pruning: a parent aggregate is moved by a one-row delta, never recomputed with SELECT SUM; delta 0 means the parent row, its cascade and its constraint are never touched."},{"name":"write-request sequence (documented)","path":".claude/skills/apilogicserver-architecture-contract/SKILL.md:222-234","signature":"PATCH -> SAFRS -> session commit -> before_flush: ROW LOGIC -> COMMIT LOGIC -> flush -> AFTER_FLUSH -> commit or rollback+400","does":"Nine numbered steps of what executes on one write in an ALS project, verified with the Item quantity experiment. The mental model every other skill relies on."},{"name":"experiment template","path":".claude/skills/apilogicserver-research-methodology/SKILL.md:135-151","signature":"EXPERIMENT / HYPOTHESIS / MECHANISM / PREDICTED NUMBERS / COMMAND(S) / OBSERVED / VERDICT / STATE / ARCHAEOLOGY ENTRY?","does":"Copy-paste block enforcing predict-numbers-first: expected values, HTTP codes, rules fired and rules NOT fired are written before the run; an expectation written afterwards is documentation, not evidence."}],"infra":[{"topic":"No build, CI or manifest","detail":"The repository holds only two legacy files and .claude/skills/. No README, package manifest, tests or workflow. The visible commit is a merge of PR #1 from a Claude-authored branch on 2026-08-28; the checkout is shallow so earlier history was not inspected."},{"topic":"How the skills are delivered","detail":"One directory per skill under .claude/skills/\u003cname>/SKILL.md with name + description frontmatter (trigger-rich, at most 1024 chars). Body order: Purpose, Use this skill when, Do NOT use this skill when, numbered sections, then a closing 'Provenance and maintenance' section with one-line re-verification commands.","path":".claude/skills/apilogicserver-change-control/SKILL.md:287-294"},{"topic":"Verification environment","detail":"Facts labeled verified were checked on 2026-08-23 to 26 against a live pip install of ApiLogicServer (installs as Genai-Logic 17.03.19, bundling LogicBank 1.32.0, Python 3.11) using two created projects: basic_demo and the Northwind nw+ sample. Container builds, cloud deploys and every live-LLM leg were NOT executed.","path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md:544"},{"topic":"Documented ALS runtime defaults","detail":"Server on port 5656; Swagger at /api; login at POST /api/auth/login; admin app at /admin-app/index.html; MCP discovery at /.well-known/mcp.json; logs in logs/als.log. Config precedence: creation defaults -> config/config.py (+ default.env) -> CLI args -> APILOGICPROJECT_* env (env wins). Env var names: APILOGICPROJECT_PORT, APILOGICPROJECT_DISABLE_RULES, SECURITY_ENABLED, OPT_LOCKING, KAFKA_SERVER, PYTHONHASHSEED.","path":".claude/skills/apilogicserver-architecture-contract/SKILL.md:176-181"},{"topic":"Secrets handling","detail":"Legacy: the key sits in a VBA variable (a placeholder string in the committed file) and inside the binary workbook. Target: the LLM key lives only server-side in APILOGICSERVER_CHATGPT_APIKEY; clients hold a short-lived JWT (expiry 222 minutes).","path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md:398-406"},{"topic":"Script dependencies","detail":"The three diagnostic scripts need only bash, curl and python3 stdlib; curl always runs with --noproxy '*' and a 10 s timeout. They are read-only against the project and were executed against the live Northwind sample before shipping.","path":".claude/skills/apilogicserver-debugging-playbook/SKILL.md:226-230"}],"decisions":[{"decision":"Replace the VBA caller with a governed server instead of hardening the macro","why":"[.claude/skills/apilogicserver-failure-archaeology/SKILL.md:304-308] The defects are not 'bad VBA' but the pattern itself: application-embedded glue with no contract (hand-built wire format both ways), no gating (no review, tests or CI) and no evidence (no logs or audit). Patching one failure mode leaves the three absences in place. Status is SETTLED-BY-REPLACEMENT-PLAN: do not reopen.","alternative_rejected":"Harden turbo3.5_excel_vba in place (escape JSON, add error handling)","evidence":"."},{"decision":"Full ALS adoption (option A) ranked above the hybrid Excel bridge (B) and GenAI re-creation (C)","why":"[.claude/skills/apilogicserver-modernization-campaign/SKILL.md:499-507] A rides the path verified end to end. B keeps fragile VBA JSON assembly on any write path and needs a token-distribution story, so it is allowed only read-mostly and only for user continuity. C has the highest variance (LLM-dependent, needs a key) and may only accelerate drafting; its output still passes the P3 and P5 gates.","alternative_rejected":"Bridge-first or genai-first migration","evidence":"."},{"decision":"Business logic as declarative rules bound to the SQLAlchemy session's before_flush, not procedural code per endpoint or database triggers","why":"[.claude/skills/declarative-rules-reference/SKILL.md:77-87] One interception point enforces logic for every writer (API, admin app, custom endpoints, MCP) with nothing to call and nothing to forget; ordering is derived from dependencies; rules stay portable across databases. Procedural code needs hand-tracked dependencies and ordering and silently omits paths.","alternative_rejected":"Per-controller validation code, or DB triggers","evidence":"."},{"decision":"Transaction-logic engine with delta adjustment rather than a Rete / BRMS decision engine","why":"[.claude/skills/declarative-rules-reference/SKILL.md:239-251] Decision engines are explicitly invoked with a named ruleset, cannot presume old row values, and therefore must re-read children to know an aggregate (orders of magnitude slower) while unloaded rules silently do not fire. LogicBank has old_row natively, so it prunes and applies one-row deltas.","alternative_rejected":"Rete-based engine (Drools-style)","evidence":"."},{"decision":"AI re-enters only through the governed API (MCP / JSON:API with JWT), never as a client-embedded completion call","why":"[.claude/skills/apilogicserver-modernization-campaign/SKILL.md:394-406] The proof is measurable: a rule-violating write through the AI channel must be rejected with the same 400/2001 body as a human one, because the rule fires regardless of who calls. The key stays server-side and every transaction leaves a logic log.","alternative_rejected":"GPT-in-a-cell with the key in the workbook","evidence":"."},{"decision":"AI-generated schema or logic is a candidate until deterministic gates pass","why":"[.claude/skills/apilogicserver-failure-archaeology/SKILL.md:310-327] Per the upstream docs, unconstrained AI turns 5 rules into about 200 lines with bugs that are hard to spot but fatal to data integrity. Guardrail chain: AI proposes readable rules -> startup activation, Behave scenarios with predicted numbers and the Logic Report verify -> change-control merges.","alternative_rejected":"Merging LLM output because it looks right","evidence":"."},{"decision":"Every fact carries a ground-truth label, and each fact has exactly one home skill","why":"[.claude/skills/apilogicserver-change-control/SKILL.md:287-294] Labels ('verified \u003cdate>, Genai-Logic \u003cversion>' vs 'per docs, not live-verified' vs candidate) keep executed evidence from blending with documentation claims; one home per fact with one-line cross-references prevents skills drifting apart. Never an invented flag, path, port or number.","alternative_rejected":"Unlabeled prose that repeats facts across skills","evidence":"."},{"decision":"Public claims must stand on a Positioning Ledger row; unqualified multipliers are forbidden","why":"[.claude/skills/apilogicserver-research-frontier/SKILL.md:31-43] The '40X more concise' figure rests on one A/B example that itself says it is not a benchmark, and Versata-era percentages describe a product that no longer exists. Wrong claims cost more than missing claims, so each claim cites its row and carries the artifact's caveat.","alternative_rejected":"Repeating docs/marketing numbers as present-tense measurements","evidence":"."},{"decision":"A phase or change is done only when a measurable gate output is captured, never by looking at the admin app","why":"[.claude/skills/apilogicserver-modernization-campaign/SKILL.md:39-46] The admin app shows a state, not a proof. Predictions are written before the probe, the violating write must fail with the predicted numbers, and a control experiment must succeed, otherwise 'constraint works' cannot be told apart from 'constraint fires on everything'.","alternative_rejected":"Acceptance by inspection","evidence":"."}],"gotchas":[{"issue":"\"My constraint did not fire\": a write expected to be rejected returns 200","consequence":"Looks like a broken rules engine; hours lost.","fix_or_guard":"Usually where-clause pruning doing its job: a qualified sum whose where() is False before and after yields delta 0, so the parent row and its constraint never run. Find the transaction with extract_logic_log.sh and check whether the parent adjustment row is present.","path":".claude/skills/declarative-rules-reference/SKILL.md:202-227"},{"issue":"Writes that bypass the SQLAlchemy session (raw SQL, DB browser, another app, bulk loaders, Alembic data scripts)","consequence":"No rules fire: stored aggregates go stale and invalid rows persist, with no error anywhere.","fix_or_guard":"Non-negotiable NN-1: route every write through the API/session. Detect by recomputing one aggregate from its children. Only two waivers: rule-free databases (the auth DB) and one-time backfill of a newly added aggregate column.","path":".claude/skills/apilogicserver-change-control/SKILL.md:210-217"},{"issue":"Console shows '--- Logging error ---' and a TypeError ('str' object cannot be interpreted as an integer) exactly when a constraint rejects (Genai-Logic 17.03.19)","consequence":"Misread as the engine crashing; the pretty logic log for that transaction is lost.","fix_or_guard":"Open upstream bug A8: short_format_exception calls splitlines with a separator argument. Cosmetic only: the 400 and the rollback are correct. Check the HTTP response and data before concluding anything; re-verify with a grep for splitlines in config/server_setup.py.","path":".claude/skills/apilogicserver-failure-archaeology/SKILL.md:237-268"},{"issue":"APILOGICPROJECT_DISABLE_RULES set to a truthy value","consequence":"LogicBank.activate is skipped and NO logic runs until restart; legitimate for bulk loads, a deploy-time footgun otherwise.","fix_or_guard":"Startup prints 'LogicBank rules disabled' and no dependency listing. Check this env var before trusting any running server.","path":".claude/skills/apilogicserver-architecture-contract/SKILL.md:258"},{"issue":"Any *.py dropped into logic/logic_discovery/ is live at the next start, and a file without a top-level declare_logic() breaks startup","consequence":"An experiment file goes onto the main path of the project of record, or a new rule silently never loads when placed in the wrong folder.","fix_or_guard":"Experiments live in scratch projects with an exp_ prefix; disable by renaming off .py (the .pyZZ precedent); run list_discovered_logic.sh and compare with the startup '..discovered logic' line. Rule edits always need a restart.","path":".claude/skills/apilogicserver-research-methodology/SKILL.md:174-180"},{"issue":"Rebuilds overwrite generated files (database/models.py under a DB-first policy) but never update ui/admin/admin.yaml in place","consequence":"Hand edits vanish, or the admin app silently lags the schema.","fix_or_guard":"Put work in the owned files (customize_models.py, customize_api.py, discovery directories); after a rebuild merge admin-merge.yaml / admin-created.yaml and delete the artifacts (gate G4); record one source-of-truth policy.","path":".claude/skills/apilogicserver-change-control/SKILL.md:117-127"},{"issue":"The legacy parser depends on the exact marker \"content\": \" with a space and on 16-bit Integer indexes","consequence":"Compact JSON or any error body returns garbage silently; responses beyond about 32 KB raise run-time error 6; content ending in a backslash overruns into surrounding JSON.","fix_or_guard":"Do not patch. Use a real JSON parser against a typed contract; this file stays only as the acceptance foil.","path":".claude/skills/apilogicserver-failure-archaeology/SKILL.md:296-301"},{"issue":"The library's facts are a snapshot of Genai-Logic 17.03.19 as of late August 2026, and several legs were never executed (P7 container gate, cloud deploys, every live-LLM genai/MCP-client leg, the Excel bridge)","consequence":"Flags, banners, file line numbers and even attribute names drift between releases (example: the shipped MCP executor names the request attribute 'request' while the docs page says 'prompt').","fix_or_guard":"Each skill ends with re-verification one-liners; re-stamp labels after running `als welcome` on the current install, and treat 'per docs' and 'candidate' items as unproven.","path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md:526-542"}],"glossary":[{"term":"ALS / Genai-Logic","meaning":"API Logic Server: `pip install ApiLogicServer` installs the package named Genai-Logic since v17; CLI is `als` (six equivalent entry points). Creates a Flask + SQLAlchemy + SAFRS JSON:API project with admin app from a database schema in one command."},{"term":"LogicBank","meaning":"The declarative rules engine inside ALS. Rules (Rule.sum, formula, copy, constraint, events) are declared in logic/declare_logic.py or logic/logic_discovery/ and execute automatically in the session's before_flush."},{"term":"watch / react / chain","meaning":"Engine behaviour modelled on a spreadsheet: watch attribute-level changes via old_row vs row, react by running only rules that reference changed attributes, chain when those results change other rows or tables."},{"term":"adjustment","meaning":"Maintaining a stored parent aggregate by applying the old-to-new delta of one child row as a one-row update, instead of re-aggregating all children with SELECT SUM."},{"term":"pruning","meaning":"Skipping rules whose referenced data did not change; for qualified sums, delta 0 means the parent is never processed, so its constraint never runs."},{"term":"gate","meaning":"A measurable pass condition: a command whose output either matches the quoted expectation or does not. Campaign gates close phases P0-P7; change-control gates are G0 (clean git) to G5 (diffs isolated)."},{"term":"code 2001","meaning":"The JSON:API error code in the HTTP 400 body returned when a constraint rejects a transaction; 401/422 with a top-level msg is authentication instead."},{"term":"request pattern","meaning":"House idiom for side effects: the client inserts a row into a request table (SysEmail, SysMcp); an after_flush_row_event on that table performs the side effect and the row stays as the audit trail."},{"term":"REGEN / ONCE-YOURS / ALWAYS-YOURS / ENGINE","meaning":"File-ownership legend for a created ALS project: regenerated by rebuilds, scaffolded once then yours, files you add, and framework plumbing you should not customize."},{"term":"NN-1 .. NN-5","meaning":"The five non-negotiables: never write around the ORM; never hand-edit regenerated files outside policy; schema changes only through the rebuild flow; every behaviour change lands with Behave evidence; sample credentials never reach production."},{"term":"Behave Logic Report","meaning":"Markdown report generated from the Behave run that embeds per-scenario logic logs; the requirements-traceability and audit artifact. Golden suite on the Northwind sample: 7 features, 26 scenarios, 83 steps."},{"term":"Positioning Ledger","meaning":"Four rows that every public claim must cite: PROVEN-HERE, PROVEN-PER-LINEAGE, CLAIMED-NOT-INDEPENDENTLY-MEASURED, OPEN / PREVIEW."},{"term":"predict-numbers-first","meaning":"Protocol: write expected values, HTTP codes and the rules expected to fire or be pruned before running an experiment; then compare to the digit."},{"term":"discriminating experiment / control","meaning":"A probe designed so each hypothesis predicts a different outcome, paired with a control (the same PATCH on a shipped order must succeed) so 'works' is distinguishable from 'fires on everything'."},{"term":"S_CheckSum","meaning":"Per-row attribute SAFRS adds for optimistic locking; a stale value on write gives 'Sorry, row altered by another user'. Checksums need PYTHONHASHSEED=0 to be repeatable."}],"relations":[{"project":"ghost-crm","relation":"Third instance of the pattern (architecture-contract, change-control, validation-and-qa, a campaign-django-rebuild skill, 'Provenance and maintenance' in all 16 skills). Useful to compare how the same knowledge-transfer structure is applied to a different system."}],"directions":["Build the F5 extractor: read workbook formulas with openpyxl and VBA with olevba, emit candidate rules in the 5-rule vocabulary plus an 'untranslatable' remainder, and diff against the manual P3 translation table. The frontier skill names this as the first tooling result to earn.","Execute the P7 gate for real: build the project image and re-run the Behave suite against the container. It is the only campaign gate still labeled to-execute.","Run the live-LLM legs with a server-side key (genai commands, MCP client executor / SysMcp) so 'per docs, not live-verified' items can be promoted or corrected, including the request-vs-prompt attribute divergence.","Try the Path B Excel bridge (ALS_Get) on a machine with Excel and a maintained VBA JSON parser; today it is a reviewed-but-never-executed candidate.","Re-verify the library against a newer G
