and type-checking fails. Which rule settles it, and what do you do?","answer":"The PINNED version wins: Remotion is fixed at 4.0.438, where `Sequence premountFor` does not exist. Strip the prop (the H2Evo build stripped 10 usages) and re-run `npm run lint`.","explanation":"The rules under `.agents/skills/remotion-best-practices/` are third-party and describe newer APIs; `skills-lock.json` pins them by hash. `npm run lint` ends with `tsc --noEmit`, which is what catches the missing prop before a render.","evidence_quote":"When a rule and the pinned version disagree, the pinned version wins.","tags":["trap","version-pin","per-docs"],"source_refs":[{"path":"workflow/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":30},{"path":".agents/skills/remotion-best-practices/rules/sequencing.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":15},{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":26},{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":60},{"path":"task.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":30}]},{"id":"remotion-maker:94","slug":"remotion-maker","code":"7094","category":9,"rank":4,"type":"scenario","level":4,"concept":"Retiming is not one-file","question":"remotion-maker: the script grows to 100 s (6000 frames). sealcoin-promo's README says retiming only ever means editing scene durations in `manifest.ts`. Which other places must change, and what goes wrong at each if it does not?","answer":"Three more places; the one-file claim is DRIFT. (1) `EXPECTED_TOTAL_FRAMES` in `manifest.ts`: left at 4500, the drift guard throws on import. (2) `scripts/verify-media.mjs` repeats `CHUNK_FRAMES` and `EXPECTED_TOTAL_FRAMES`: it still expects 3 chunks and 75 s. (3) `package.json` has only `render:chunk1..3`: `ceil(6000 / 1800)` = 4, so `SealcoinChunk04` is registered but never rendered.","explanation":"The output name `sealcoin-promo-75s.mp4` is also hard-coded in both scripts. Only a `keep in sync` comment guards the duplicated constants. The concat step is the one part that adapts by itself: it discovers chunk files from `out/`.","evidence_quote":"const EXPECTED_TOTAL_FRAMES = 4500; // keep in sync with remotion/manifest.ts","tags":["drift","single-source"],"source_refs":[{"path":"sealcoin-promo/scripts/verify-media.mjs","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":8,"end":10},{"path":"sealcoin-promo/README.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":21},{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":52,"end":55},{"path":"sealcoin-promo/remotion/manifest.ts","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":37},{"path":"sealcoin-promo/scripts/concat-chunks.mjs","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":10},{"path":"sealcoin-promo/scripts/concat-chunks.mjs","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":12,"end":15}]},{"id":"remotion-maker:99","slug":"remotion-maker","code":"7099","category":9,"rank":9,"type":"scenario","level":4,"concept":"Resume: audio pass","question":"remotion-maker · resume: sealcoin-promo was rendered as a video-only pass, with the script's voice-over kept as metadata. When audio is added, which parts of the chunk pipeline stop being valid?","answer":"The `--muted` + stream-copy join. (1) Every render script passes `--muted`, a rule stated only for compositions WITHOUT audio. (2) Un-muted chunks carry an AAC track slightly longer than their video, so the concat demuxer leaves ~3-frame gaps at each boundary. (3) `verify-media.mjs` probes only the video stream `v:0`, so it cannot see audio drift.","explanation":"DESIGN TARGET: no audio code exists, and the repository names no next step for sealcoin-promo in so many words (root `task.md` lists voiceover integration as future work, but for the H2Evo exemplar); audio is the open item its documents point at. Whatever replaces the join must be proved the same way: by probing the produced file.","evidence_quote":"All voice-over text is production metadata only (no audio in this pass)","tags":["inferred","chunked-render"],"source_refs":[{"path":"sealcoin-promo/docs/SCENE-MANIFEST.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":19},{"path":"workflow/CHUNK-RENDER.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":39},{"path":"sealcoin-promo/package.json","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":52},{"path":"sealcoin-promo/scripts/verify-media.mjs","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":33},{"path":"task.md","branch":"main","commit":"85a506cb64b251f8e7b2177abe69c28f0c4e8a26","line":36}]},{"id":"presentation-builder:00","slug":"presentation-builder","code":"7100","category":0,"rank":0,"type":"recall","level":1,"concept":"Grounded deck pipeline fork","question":"What does the presentation-builder fork add on top of the upstream script-to-HTML deck factory?","answer":"A grounded-deck pipeline: EVERY number on a slide carries a claim id traced back to verified evidence.","explanation":"Worked case: the three-scenario CRM deck under `projects/crm-three-scenarios/`. The method is packaged as the skill `structured-citation-metagraph`. Upstream only turns a script plus a style reference into one HTML file.","anchor":"Every number on the slide wears a luggage tag; pull its string and you land on the shelf, the page and the sentence it came from.","evidence_quote":"the deck is rendered from the graph with the claim id on every number; two scripts refuse to pass anything that is not grounded","tags":["claim-id"],"source_refs":[{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":8,"end":12},{"path":"README.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":3}]},{"id":"presentation-builder:01","slug":"presentation-builder","code":"7101","category":0,"rank":1,"type":"recall","level":1,"concept":"The presentation-layer invariant","question":"Which invariant does presentation-builder's `structured-citation-metagraph` skill exist to protect?","answer":"The presentation-layer rule: everything shown traces to evidence, and NOTHING shown is a recommendation.","explanation":"The CRM deck shows grounded truth against three scenarios and offers no choice. Breaks if undone: the deck becomes a pitch that a sceptical reader can dismiss. The fields that make a fact traceable: see 10.","anchor":"A guide unlocks three rooms and describes each one to the centimetre, then stays silent when asked which room to rent.","confusables":"decision layer — it RECOMMENDS one option; the presentation layer only shows grounded truth against all of them.","evidence_quote":"Its one invariant is the presentation-layer rule: nothing is shown that cannot be traced to a source, a locator and a quote, and nothing shown is a recommendation.","tags":["presentation-layer"],"source_refs":[{"path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":290,"end":292},{"path":"projects/crm-three-scenarios/brief.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":31,"end":33},{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":12}]},{"id":"presentation-builder:10","slug":"presentation-builder","code":"7110","category":1,"rank":0,"type":"cloze","level":1,"concept":"Grounded node contract","question":"presentation-builder: complete the rule `grounded_ok()` applies before a view may cite a node.","answer":"source · locator · quote · grounded_in","explanation":"The path is followed transitively and is cycle-safe; an id missing from the graph is not grounded. Breaks if undone: a story or metaphor node with no measurement behind it reaches a slide as if it were a fact.","confusables":"the workflow script's `EVIDENCE` schema — it requires ONLY `source` and `locator`; the guard also demands `quote` (see 91).","cloze":"An `evidence_fact` is grounded when one evidence entry holds {{c1::source}}, {{c1::locator}} AND {{c1::quote}}; any other node needs a {{c2::grounded_in}} edge path to such a fact.","evidence_quote":"res = any(ev.get(\"source\") and ev.get(\"locator\") and ev.get(\"quote\") for ev in evs)","tags":["evidence-triple","guard"],"source_refs":[{"path":"projects/crm-three-scenarios/citation_graph.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":82,"end":108},{"path":".claude/skills/structured-citation-metagraph/references/schemas.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":8,"end":12}]},{"id":"presentation-builder:11","slug":"presentation-builder","code":"7111","category":1,"rank":1,"type":"compare","level":2,"concept":"Claim verdict vocabulary","question":"presentation-builder: a claim verdict (`confirmed`, `caveat`, `refuted`) vs a health-check verdict (`keep`, `simplify`, `consolidate`, `pay_for`): what is the ONE difference?","answer":"A claim verdict says whether a FACT survived verification; a health-check verdict says what to do with a built ITEM, and is never given to a scenario.","explanation":"Claim verdicts come from the two verifier lenses and decide the wording a slide may carry. Health-check verdicts come from the rank agent and become `health_verdict` edges in the graph.","anchor":"A proofreader stamps a sentence true, hedged or false; next door a mechanic hangs a keep-or-scrap label on a machine. Neither stamp fits the other's object.","confusables":"health-check verdict (`keep | simplify | consolidate | pay_for`) — it rates a built ITEM; a claim verdict rates the EVIDENCE of one fact.","evidence_quote":"Verdicts are about items, never about scenarios.","tags":["verdicts"],"source_refs":[{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":57,"end":59},{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":86,"end":87},{"path":".claude/skills/structured-citation-metagraph/references/schemas.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":33},{"path":".claude/skills/structured-citation-metagraph/references/schemas.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":70},{"path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":248,"end":250}]},{"id":"presentation-builder:20","slug":"presentation-builder","code":"7120","category":2,"rank":0,"type":"trace","level":3,"concept":"Skill procedure, brief to commit","question":"presentation-builder · `structured-citation-metagraph` procedure: recite the 7 steps from the boundary brief to the commit.","answer":"brief · explore · rank · metagraph · verify · present · QA + hygiene + commit","explanation":"Each role writes its full output to the project folder and returns a typed summary, so the orchestrator reads summaries and paths, never the raw material. Verify sits BEFORE present on purpose (see 60).","anchor":"A trial day: the judge rules what is admissible, clerks gather exhibits, an appraiser grades them, a wall map links them, two cross-examiners attack, then the advocate speaks and an usher checks.","steps":["orchestrator writes `projects/\u003cname>/brief.md` -> request, tagged sources, conventions","explorers, one per source family in parallel -> items, facts and gaps with evidence","rank agent -> `implementation-health-check.md` and `cost-lines.md`, one verdict per item","metagraph agent -> `metagraph.json`, planned views, ledger; `citation_graph.py` must pass","verifiers, two lenses per batch -> confirmed, caveat or refuted; maintainer applies them","presentation agent renders from the graph -> each number carries `data-claim`","QA loop, hygiene, commit -> render, fact drift, design rules, `deck_cites_check.py`"],"evidence_quote":"→ metagraph (hierarchy, edges, planned views, ledger, guard script) → verify (two lenses per batch; confirm, caveat, refute; side-findings filed) → present","tags":["procedure"],"source_refs":[{"path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":297,"end":301},{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":27,"end":34},{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":107,"end":117}]},{"id":"presentation-builder:21","slug":"presentation-builder","code":"7121","category":2,"rank":1,"type":"output","level":3,"concept":"Two-lens verdict merge","question":"presentation-builder · verdict merge in `workflow-crm-three-scenarios.js`: predict the `status` the code below assigns to the claim described in its first line.","answer":"`caveat` — ANY `refuted` verdict wins, else any `caveat`, else `confirmed`; a claim that received no verdict at all becomes `unverified`.","explanation":"(1) No verdict is `refuted`, so `refuted` is false. (2) One verdict is `caveat`, so `caveat` is true. (3) The ternary chain returns 'caveat'. The stricter lens always wins; only non-confirmed results are sent to the maintainer agent.","confusables":"`unverified` — given when NO lens returned a verdict for the claim; `confirmed` needs at least one verdict and none worse.","code_snippet":"// vs = this claim's verdicts: source lens 'confirmed', numeric lens 'caveat'\nconst refuted = vs.some(v => v.verdict === 'refuted')\nconst caveat = !refuted && vs.some(v => v.verdict === 'caveat')\nreturn { id: c.id, status: refuted ? 'refuted' : caveat ? 'caveat' : vs.length ? 'confirmed' : 'unverified',\n  // ...\n}","expected_output":"caveat","evidence_quote":"const caveat = !refuted && vs.some(v => v.verdict === 'caveat')","tags":["grounded:logic","verdict-merge"],"source_refs":[{"path":".claude/skills/structured-citation-metagraph/references/workflow-crm-three-scenarios.js","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":289,"end":295},{"path":".claude/skills/structured-citation-metagraph/references/workflow-crm-three-scenarios.js","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":300}]},{"id":"presentation-builder:30","slug":"presentation-builder","code":"7130","category":3,"rank":0,"type":"locate","level":1,"concept":"Guard and scoring command","question":"Which command in presentation-builder regenerates `metagraph.md` and enforces the grounded-path guard?","answer":"`python3 scripts/citation_graph.py --graph metagraph.json --out metagraph.md --top-n 5`","explanation":"`scripts/` is the skill's own folder; a near-identical copy (one line differs: the node-type order in `render_md`) also sits in `projects/crm-three-scenarios/`. It scores co-cited pairs, REPLACES the Markdown file (never appends) and exits 2 when a view cites an ungrounded node (see 90).","anchor":"A doorman at the slide-room door: each guest shows an unbroken chain of receipts back to a quoted source, or the whole queue is sent home.","example":"python3 scripts/citation_graph.py --graph metagraph.json --dry-run  # prints each node's top neighbours, writes nothing, the guard still runs","confusables":"`--dry-run` — prints the neighbours and WRITES no file; the guard runs in both modes.","evidence_quote":"python3 scripts/citation_graph.py --graph metagraph.json --out metagraph.md --top-n 5","tags":["guard","co-citation"],"source_refs":[{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":69,"end":77},{"path":"projects/crm-three-scenarios/citation_graph.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":189,"end":196},{"path":"projects/crm-three-scenarios/citation_graph.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":211,"end":223},{"path":".claude/skills/structured-citation-metagraph/scripts/citation_graph.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":137},{"path":"projects/crm-three-scenarios/citation_graph.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":137}]},{"id":"presentation-builder:31","slug":"presentation-builder","code":"7131","category":3,"rank":1,"type":"output","level":3,"concept":"Combined co-citation score","question":"presentation-builder · `citation_graph.py --dry-run`: predict the `combined`, `co` and `prox` values printed for the pair described below.","answer":"`combined=1.550 co=2 prox=0.500` — proximity is 1 / 2 ** (4 - 3) = 0.5 for a parent and its child, and 0.7 * 2 + 0.3 * 0.5 = 1.55.","explanation":"(1) A child shares its parent's whole chain: shared ancestor depth 3. (2) prox = 1 / 2 ** (4 - 3) = 0.5. (3) combined = 0.7 * 2 + 0.3 * 0.5 = 1.55, printed with three decimals. Proximity halves per unshared level, so it only breaks ties between equally co-cited nodes.","confusables":"co-citation — COUNTS the views that cite both nodes (weight 0.7); folder proximity only reads the parent chain (weight 0.3).","code_snippet":"def folder_proximity(a, b, chains, max_depth):\n    return 1.0 / (2 ** (max_depth - shared_ancestor_depth(a, b, chains)))\n\n# in score_pairs():\nscores[a][b] = w_co * c + w_prox * folder_proximity(a, b, chains, max_depth)\n\n# pair: data problem `dp_modelling` (depth 3) and its own child fact `C067`\n# cited together by 2 views; max_depth = 4; default weights 0.7 / 0.3","expected_output":"combined=1.550 co=2 prox=0.500","evidence_quote":"| 2 | 0.500 | 1.550 | same branch, two shared slides: the fact that *defines* the problem |","tags":["grounded:doc","co-citation"],"source_refs":[{"path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":69,"end":79},{"path":"projects/crm-three-scenarios/citation_graph.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":59,"end":60},{"path":"projects/crm-three-scenarios/citation_graph.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":73,"end":79},{"path":"projects/crm-three-scenarios/citation_graph.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":210},{"path":"projects/crm-three-scenarios/metagraph.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":266}]},{"id":"presentation-builder:32","slug":"presentation-builder","code":"7132","category":3,"rank":2,"type":"locate","level":1,"concept":"Built-deck fidelity check","question":"Which script in presentation-builder checks the claim ids the BUILT deck shows against the metagraph?","answer":"`deck_cites_check.py` in the skill's `scripts/`: unknown, non-fact or refuted ids exit 1.","explanation":"It reads `data-claim=\"Cxxx\"` from HTML, or `^Cxxx^` / `[Cxxx]` from Markdown, and lists every caveated claim so the caveat wording can be confirmed on the slide. `--strict` also fails on ids that no view planned.","example":"python3 scripts/deck_cites_check.py --graph metagraph.json --deck deck.html --strict  # exit 1 on unknown, refuted or unplanned ids","confusables":"`citation_graph.py` — guards the PLAN (what each view intends to cite); this script guards the BUILD (what the deck actually shows).","evidence_quote":"This script closes the other gap: what the *built deck* actually shows.","tags":["claim-id","guard"],"source_refs":[{"path":".claude/skills/structured-citation-metagraph/scripts/deck_cites_check.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":4,"end":15},{"path":".claude/skills/structured-citation-metagraph/scripts/deck_cites_check.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":33},{"path":".claude/skills/structured-citation-metagraph/scripts/deck_cites_check.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":48,"end":49}]},{"id":"presentation-builder:40","slug":"presentation-builder","code":"7140","category":4,"rank":0,"type":"locate","level":1,"concept":"The boundary brief file","question":"Which file in presentation-builder's `projects/crm-three-scenarios/` is the single context boundary every agent reads first?","answer":"`brief.md`: the request verbatim, the admissible sources with provenance tags, the output conventions.","explanation":"The user's stories and tables are admissible as what was asked, never as truth. Breaks if undone: agents cite material nobody declared admissible. Write it INSIDE the repository: locators that point at a scratch directory die with the session.","anchor":"A chalk circle drawn on the floor before anyone enters: each worker steps into it first, and nothing lying outside it may be picked up.","evidence_quote":"This file is the ONLY context boundary.","tags":["boundary-brief"],"source_refs":[{"path":"projects/crm-three-scenarios/brief.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":7,"end":10},{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":34,"end":39},{"path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":137,"end":138}]},{"id":"presentation-builder:50","slug":"presentation-builder","code":"7150","category":5,"rank":0,"type":"recall","level":2,"concept":"Verification fan-out by batch","question":"How does presentation-builder's workflow script fan out the verification of the claims?","answer":"It slices the claims into batches of `BATCH = 8` and runs EVERY batch under two lenses, source fidelity and numeric-and-logical consistency, inside one `parallel(...)` call.","explanation":"Worked case: 20 batches x 2 lenses = 40 verifiers. Two DIFFERENT lenses find different errors; identical refuters would not. A barrier follows: verdicts are merged per claim before anything is edited (see 21).","confusables":"QA loop — also parallel, but it checks the finished DECK (render, fact drift, design rules); the verify fan-out attacks CLAIMS before any slide exists.","evidence_quote":"const verdictLists = await parallel(batches.flatMap((b, bi) => LENSES.map(l => () =>","tags":["fan-out","two-lenses"],"source_refs":[{"path":".claude/skills/structured-citation-metagraph/references/workflow-crm-three-scenarios.js","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":263,"end":284},{"path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":151,"end":154},{"path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":227,"end":228}]},{"id":"presentation-builder:60","slug":"presentation-builder","code":"7160","category":6,"rank":0,"type":"why","level":2,"concept":"Verify before writing","question":"Why does presentation-builder's skill verify every claim BEFORE the presentation agent writes the deck rather than fact-check the finished deck?","answer":"The deck is then written with the caveated wording already decided, so QA has ONLY layout to fix; verifying afterwards turns every refutation into a slide rewrite.","explanation":"Breaks if undone: a refuted number already sits on a slide and in the spoken script, and each one costs a rewrite. Worked case: QA round 1 found five blocking issues, all layout, nothing factual.","anchor":"A sign painter letters prices on the shop window before the inspector arrives; every wrong price is then scraped off the glass by hand.","confusables":"fact-drift QA — it runs once the deck exists and only checks that slides still match the verified claims; it does NOT re-open the sources.","evidence_quote":"Verifying after writing makes every refutation a slide rewrite.","tags":["verify-first"],"source_refs":[{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":128,"end":129},{"path":"projects/crm-three-scenarios/method-structured-citation-metagraph.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":258,"end":262},{"path":".claude/skills/structured-citation-metagraph/references/workflow-crm-three-scenarios.js","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":254},{"path":".claude/skills/structured-citation-metagraph/references/workflow-crm-three-scenarios.js","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":312}]},{"id":"presentation-builder:61","slug":"presentation-builder","code":"7161","category":6,"rank":1,"type":"why","level":2,"concept":"16 pt pandoc reference template","question":"Why does presentation-builder's `build_pptx.py --pptx` pass `--reference-doc reference.pptx` to pandoc rather than rely on pandoc's stock template?","answer":"The stock template sets body text at 24 pt, which overflows the denser slides; `reference.pptx` is pandoc's own template with body text at 16 pt and titles at 26 pt.","explanation":"Breaks if undone: text runs past PowerPoint's content placeholder, because `chunk()` budgets `LINES_PLAIN = 11` lines per slide for 16 pt text.","anchor":"A removal list counted in small boxes: load the same list packed in big boxes and the last ones stick out of the van door.","confusables":"`--budget` — changes how many LINES go on one slide; `reference.pptx` changes the font SIZE those lines are estimated for.","evidence_quote":"pandoc's stock template sets body text at 24 pt, so expect overflow on the denser slides","tags":["pptx"],"source_refs":[{"path":"projects/crm-three-scenarios/pptx/README.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":22,"end":24},{"path":"projects/crm-three-scenarios/pptx/build_pptx.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":29},{"path":"projects/crm-three-scenarios/pptx/build_pptx.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":442,"end":443},{"path":"projects/crm-three-scenarios/pptx/build_pptx.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":451}]},{"id":"presentation-builder:90","slug":"presentation-builder","code":"7190","category":9,"rank":0,"type":"recall","level":2,"concept":"Guard passing sign","question":"presentation-builder: what does `citation_graph.py` print when a metagraph is safe to render, and how does a failed guard show?","answer":"It prints `guard OK: every cited node in N views is grounded`. A failure prints `PRESENTATION-LAYER GUARD FAILED` with the offending views on stderr and exits 2.","explanation":"Before a commit the skill also wants `metagraph.md` byte-identical on a second run. Once the deck exists, `deck_cites_check.py` is the matching check on the build (see 32).","example":"python3 citation_graph.py --graph metagraph.json --out metagraph.md; echo $?  # 0 after the guard OK line, 2 after GUARD FAILED","evidence_quote":"print(f\"guard OK: every cited node in {len(views)} views is grounded\")","tags":["guard"],"source_refs":[{"path":"projects/crm-three-scenarios/citation_graph.py","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":217,"end":223},{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":115,"end":117}]},{"id":"presentation-builder:91","slug":"presentation-builder","code":"7191","category":9,"rank":1,"type":"scenario","level":4,"concept":"Bundled workflow script drift","question":"presentation-builder: you reuse the skill's bundled `references/workflow-crm-three-scenarios.js` unchanged on a second project. Which of the skill's own rules does that script break, and what is the smallest fix for each?","answer":"It still carries first-run behaviour: reuse its phase shape, rewrite its prompts. (1) Its `EVIDENCE` schema requires ONLY `source` and `locator`, so a fact with no quote passes the tool layer and fails the guard once a view cites it: add `quote` to `required`. (2) Its maintainer prompt REMOVES refuted claims, while the skill keeps the node with `status: refuted`: rewrite that rule. (3) `VERDICT_SCHEMA` has no `side_findings`, so verifiers cannot file what they meet: add the field.","explanation":"The script also never calls `deck_cites_check.py`; the skill lists it as a QA step. The guard itself is already strict: `grounded_ok()` demands all three evidence fields (see 10).","evidence_quote":"required: ['source', 'locator'],","tags":["drift","trap"],"source_refs":[{"path":".claude/skills/structured-citation-metagraph/references/workflow-crm-three-scenarios.js","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":21,"end":29},{"path":".claude/skills/structured-citation-metagraph/references/workflow-crm-three-scenarios.js","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":255,"end":262},{"path":".claude/skills/structured-citation-metagraph/references/workflow-crm-three-scenarios.js","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":301,"end":303},{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":87,"end":92},{"path":".claude/skills/structured-citation-metagraph/SKILL.md","branch":"claude/affectionate-brahmagupta-r8n7t5","commit":"25552bdacac7409af2ce8373d8012913a2c92194","line":144},{" rtal — DESIGN TARGET","explanation":"Ordered by dependency: the permission engine cannot be retrofitted, so G2 precedes every domain slice; the portal is a read projection over everything, so it is last. Phases may overlap in coding, never in gating. No phase has run yet.","anchor":"A seven-storey scaffold: on each landing an inspector stamps a number before the crew may carry bricks one floor higher.","confusables":"Golden-inventory rows `G1`-`G14` in the `validation-and-qa` skill — same letter, but those are baseline NUMBERS, not rebuild phases.","steps":["G0 spec freeze -> diagnostics at baseline, screenshot-only schemas turned into rulings","G1 skeleton -> `app/` project, `AUTH_USER_MODEL` set before the first migrate","G2 tenancy + permission engine -> the permission matrix passes as pytest cells","G3 clients + projects -> first vertical slice, two-company isolation proof","G4 money + HR -> accounting first, then the payroll run, both idempotent","G5 CRM + collab -> sales, marketing, one shared Task / Meeting / Note / Document","G6 portal + integrations -> read-only portal, calendar aggregation"],"evidence_quote":"## Phase 2 — TENANCY + PERMISSION ENGINE (gate G2 — the load-bearing gate)","tags":["per-docs","campaign"],"source_refs":[{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":296},{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":109},{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":184},{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":373},{"path":".claude/skills/campaign-django-rebuild/SKILL.md" ence_quote":"if key not in seen:","tags":["grounded:logic","dedupe"],"source_refs":[{"path":"rewrite_links.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":26,"end":37},{"path":"rewrite_links.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":20}]},{"id":"ghost-crm:32","slug":"ghost-crm","code":"8032","category":3,"rank":2,"type":"output","level":3,"concept":"Missing docs dir guard","question":"ghost-crm · `rewrite_links.py`: predict the result of the call below, given that `/tmp/nope` does not exist.","answer":"It stops: `docs directory not found: /tmp/nope` on stderr and exit code 1 — it NEVER falls back to another tree.","explanation":"`main()` tests `args.docs.is_dir()` before walking, and `raise SystemExit(main())` turns the returned 1 into the exit code. Without the guard, a walk that finds no page would end with a `0 link(s)` summary and return 0, which reads like a clean tree.","confusables":"`audit_branding.py` and the other four diagnostics — their missing-`docs/` guard returns 2 (cannot run); `rewrite_links.py` returns 1.","code_snippet":"python3 rewrite_links.py --docs /tmp/nope","expected_output":"docs directory not found: /tmp/nope\n(exit code 1)","evidence_quote":"print(f\"docs directory not found: {args.docs}\", file=sys.stderr)","tags":["grounded:logic","intended-error"],"source_refs":[{"path":"rewrite_links.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":60,"end":62},{"path":"rewrite_links.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":79,"end":80},{"path":".claude/skills/diagnostics-and-tooling/scripts/audit_branding.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":46,"end":49}]},{"id":"ghost-crm:40","slug":"ghost-crm","code":"8040","category":4,"rank":0,"type":"locate","level":1,"concept":"The architecture-contract skill","question":"Which skill in ghost-crm is the single home of the app map, invariants I1-I6 and rulings R1-R10?","answer":"`architecture-contract` (`.claude/skills/architecture-contract/SKILL.md`): sibling skills cite its rulings by number.","explanation":"cf. [private project] `[private project]-architecture-contract`: the same skill template for another product.","anchor":"A court registry: every judge in the building walks to one ledger to look up decision number seven instead of deciding it again.","confusables":"`change-control` — it decides WHETHER a change may merge; this skill only records what was decided.","evidence_quote":"This skill is the home of rulings; sibling skills cite these by number.","tags":["skill-library"],"source_refs":[{"path":".claude/skills/architecture-contract/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":226,"end":228},{"path":".claude/skills/architecture-contract/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":24,"end":27}]},{"id":"ghost-crm:41","slug":"ghost-crm","code":"8041","category":4,"rank":1,"type":"compare","level":2,"concept":"audit_branding.py baseline exit","question":"ghost-crm: `audit_branding.py` vs `docs_inventory.py` on the untouched baseline: what is the ONE difference in their exit codes?","answer":"`audit_branding.py` exits 1 BY DESIGN (the rebrand is incomplete, so findings remain); `docs_inventory.py` exits 0 and turns 1 only when a count deviates from `EXPECTED`.","explanation":"So the healthy battery reads 1,0,0,0,0 (see 90). Gate the audit on 'body count did not increase', not on exit 0.","anchor":"Two smoke alarms: one has beeped since move-in because the paint is still wet; the other stays silent until someone moves the furniture.","confusables":"`docs_inventory.py` — a 1 from the audi m forbid hand-editing or deleting a References block rather than tidying it up during the rebrand?","answer":"The link rewrite ran BEFORE the docs import was committed, so the pre-rewrite docs exist nowhere in git: the blocks are the only surviving record of the original app's routes.","explanation":"They are the raw material for the rebuild's URL design (ruling R10 keeps the originals as a legacy mapping). Breaks if undone: the deep links are gone for good, and a hand-edited separator makes the next `--apply` corrupt the page (see 91).","anchor":"A demolished house whose only floor plan is a carbon copy stapled to the back of each brochure: scribble on it and no architect can redraw the rooms.","confusables":"A grep-and-replace of `skhokho` across `docs/` — it would also rewrite the ARCHIVED URLs; the rebrand stops above the header (see 94).","evidence_quote":"the pre-rewrite docs were never committed. They must never be hand-edited.","tags":["provenance","per-docs"],"source_refs":[{"path":".claude/skills/diagnostics-and-tooling/scripts/check_references_integrity.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":4,"end":6},{"path":".claude/skills/change-control/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":171,"end":176},{"path":"rewrite_links.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":44,"end":45}]},{"id":"ghost-crm:61","slug":"ghost-crm","code":"8061","category":6,"rank":1,"type":"why","level":2,"concept":"AUTH_USER_MODEL before migrate","question":"Why does ghost-crm's rebuild plan set `AUTH_USER_MODEL = 'accounts.User'` BEFORE the first `migrate` rather than start on the default `auth.User` and switch later?","answer":"The first `migrate` bakes a foreign key to whatever user model exists at that moment; switching afterwards is unsupported without dropping the database. DESIGN TARGET.","explanation":"It is the ONLY irreversible decision of the campaign, so it is made in step 1.3 of phase G1. Breaks if undone: `InconsistentMigrationHistory`; the clean fix is to delete `db.sqlite3` and the generated migrations.","anchor":"Concrete poured around the first door frame: to change the door afterwards, the whole foundation has to be broken out.","confusables":"Migrating on `auth.User`, then editing `django_migrations` (wrong path W1) — history and schema then DISAGREE forever.","evidence_quote":"Changing `AUTH_USER_MODEL` mid-project is officially unsupported without dropping the database.","tags":["per-docs","irreversible"],"source_refs":[{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":229,"end":237},{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":252},{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":276,"end":284}]},{"id":"ghost-crm:62","slug":"ghost-crm","code":"8062","category":6,"rank":2,"type":"why","level":4,"concept":"Computed permissions, not stored","question":"Why does ghost-crm's rebuild plan compute row visibility with decorators and scoped managers in `core` rather than store per-object permission rows with django-guardian? Give the verdict and what the alternative must first prove.","answer":"Verdict: computed wins. (1) Visibility derives from current FKs (line-manager tree, org-wide HR overlay, creator/assignee), so a reassignment needs ZERO permission writes. (2) Stored rows imply a bulk rewrite of grants on every `line_manager` change; guardian is admissible only with a written derivation of how they stay correct. (3) One engine is provable as the G2 permission matrix; per-view if-statements are wrong path W2. DESIGN TARGET.","explanation":"Breaks if undone: after a change of manager, stale rows keep granting access to former reports. see 22","anchor":"A guard who reads the org chart on the wall each time someone knocks, instead of a drawer of keys that must all be recut whenever a team changes boss.","confusables":"django-guardian — permissions are STORED rows that must be rewritten on reassignment; the chosen engine recomputes them from FKs.","evidence_quote":"they derive from current FKs, so nothing must be kept in sync on reassignment","tags":["per-docs","permissions"],"source_refs":[{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":608,"end":614},{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":364,"end":369}]},{"id":"ghost-crm:63","slug":"ghost-crm","code":"8063","category":6,"rank":3,"type":"why","level":2,"concept":"ExpenseClaim lives in accounting","question":"Why does ghost-crm's app map put `ExpenseClaim` in `accounting` and `LeaveApplication` in `hr` rather than give the docs' `personal` and `manager` modules their own Django apps?","answer":"Manager approves what personal requests, so two model apps would import each other. With the models in `hr` and `accounting`, `manager` and `personal` are only VIEW layers and no cycle exists. DESIGN TARGET.","explanation":"Bonus: approving a claim and creating its `Expense` stay inside one app, so the conversion is atomic. Payroll reaches accounting only through the `payroll_run_completed` signal; `hr` never imports accounting models.","confusables":"`personal` / `manager` apps with their own models — they would IMPORT each other; as view layers they own no models to import.","evidence_quote":"LeaveApplication lives in `hr`; ExpenseClaim lives in `accounting`","tags":["per-docs","app-boundaries"],"source_refs":[{"path":".claude/skills/architecture-contract/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":142,"end":147},{"path":".claude/skills/architecture-contract/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":112}]},{"id":"ghost-crm:64","slug":"ghost-crm","code":"8064","category":6,"rank":4,"type":"recall","level":1,"concept":"R2: Concerted means CONVERTED","question":"ghost-crm: the docs tell users to update a hustle's status to `Concerted`. Which enum value does ruling R2 make the rebuild use?","answer":"`CONVERTED` — `Concerted` is a source typo; a code comment must cite it, and gate G5 greps `app/` for zero hits.","explanation":"The doc bug stays in `docs/sales/hustle.md`; the code follows the ruling (codifying the typo is wrong path W5). 'Hustle' is the docs' word for a sales lead.","evidence_quote":"1. Update Hustle status to \"Concerted\"","tags":["per-docs","trap"],"source_refs":[{"path":"docs/sales/hustle.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":60},{"path":".claude/skills/architecture-contract/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":238,"end":242},{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":634}]},{"id":"ghost-crm:70","slug":"ghost-crm","code":"8070","category":7,"rank":0,"type":"recall","level":2,"concept":"Byte-idempotent re-apply","question":"ghost-crm has no database: its state is the committed `docs/` tree. What makes a second `rewrite_links.py --apply` leave an untouched page byte-identical?","answer":"The old block is cut off at the exact separator and REGENERATED from the same archived entries, which re-match `LINK_RE`; `rstrip()` plus the footer rebuilds the same bytes.","explanation":"Body links no longer match: they already point at the repo URL. Safe ONLY while the machine output was never hand-touched (see 91). The log still claims it wrote (see 92).","evidence_quote":"new_text = new_text.rstrip() + footer","tags":["idempotency","provenance"],"source_refs":[{"path":"rewrite_links.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":44,"end":47},{"path":".claude/skills/change-control/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":317,"end":319}]},{"id":"ghost-crm:80","slug":"ghost-crm","code":"8080","category":8,"rank":0,"type":"recall","level":1,"concept":"Base path /documentation/","question":"Under which URL path must ghost-crm's VuePress site be served for its assets and links to resolve?","answer":"`/documentation/` — `base` in `docs/.vuepress/config.js`; the dev server answers at `localhost:8080/documentation/`.","explanation":"A built `dist/` mounted at a web root 404s. No deployment exists in the repository.","evidence_quote":"base: '/documentation/',","tags":["vuepress"],"source_refs":[{"path":"docs/.vuepress/config.js","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":2},{"path":".claude/skills/build-and-operate/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":165,"end":169}]},{"id":"ghost-crm:81","slug":"ghost-crm","code":"8081","category":8,"rank":1,"type":"scenario","level":3,"concept":"ERR_OSSL_EVP_UNSUPPORTED on build","question":"ghost-crm: `npm run docs:dev` dies with `ERR_OSSL_EVP_UNSUPPORTED`. What is the cause and what do you change?","answer":"Run on Node 14/16, or `export NODE_OPTIONS=--openssl-legacy-provider` first. Cause: the lockfile pins webpack 4, which hashes with :"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":7}]},{"id":"ghost-crm:91","slug":"ghost-crm","code":"8091","category":9,"rank":1,"type":"scenario","level":3,"concept":"Hand-edited separator corruption","question":"ghost-crm: someone removes one blank line above `## References (original links)` on a page, then `rewrite_links.py --apply` runs. What does the page look like afterwards?","answer":"Two References blocks: the header test still passes but the `split()` on the exact separator finds nothing, so the old block stays, its URLs already flattened, and a fresh block is appended.","explanation":"Fix: restore the page from git; never repair it by hand. Guard: `check_references_integrity.py` reports a separator that is not byte-exact BEFORE any apply, and flags more than one header.","anchor":"A tear-off coupon whose perforation was taped over: the machine cannot rip the old coupon off, so it glues a second one underneath.","evidence_quote":"if REFERENCES_HEADER in new_text:","tags":["trap","provenance"],"source_refs":[{"path":"rewrite_links.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":44,"end":45},{"path":".claude/skills/diagnostics-and-tooling/scripts/check_references_integrity.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":9,"end":11},{"path":".claude/skills/diagnostics-and-tooling/scripts/check_references_integrity.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":65,"end":70}]},{"id":"ghost-crm:92","slug":"ghost-crm","code":"8092","category":9,"rank":2,"type":"scenario","level":3,"concept":"The apply log is not evidence","question":"ghost-crm: on an unchanged tree `rewrite_links.py --apply` ends with `[APPLIED] 69 link(s) across 43 file(s) of 45 scanned.` What really changed, and what do you check instead of that log?","answer":"NOTHING but mtimes: the archived entries inside the References blocks re-match `LINK_RE` on every run, so the count is always the full 69. Check `git status` / `git diff`.","explanation":"`main()` prints `wrote` whenever `count` is non-zero, without comparing old and new text. Doctrine drawn from it for the whole campaign: a log is not evidence, a diff or a test tally is (wrong path W6).","evidence_quote":"print(f\"{'wrote' if args.apply else 'would rewrite'} {count:>2} link(s): {md.relative_to(args.docs)}\")","tags":["trap","per-docs"],"source_refs":[{"path":"rewrite_links.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":68,"end":75},{"path":".claude/skills/change-control/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":306,"end":312}]},{"id":"ghost-crm:93","slug":"ghost-crm","code":"8093","category":9,"rank":3,"type":"locate","level":1,"concept":"Surviving skhokho.io nav link","question":"ghost-crm's rewriter flattened every skhokho.io markdown link; which live skhokho.io link survived, and where?","answer":"The nav `Home` link in `docs/.vuepress/config.js` — the rewriter walks ONLY `*.md` files.","explanation":"Site `title` and `description` in the same file, and `name` in `package.json`, still say Skhokho: the repository is called Ghost-CRM but reads Skhokho. `audit_branding.py` reports this link on its own line.","evidence_quote":"{ text: 'Home', link: 'https://skhokho.io' },","tags":["drift","rebrand"],"source_refs":[{"path":"docs/.vuepress/config.js","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":10},{"path":"rewrite_links.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":64},{"path":".claude/skills/diagnostics-and-tooling/scripts/audit_branding.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":76,"end":81}]},{"id":"ghost-crm:94","slug":"ghost-crm","code":"8094","category":9,"rank":4,"type":"scenario","level":4,"concept":"Finishing the rebrand safely","question":"ghost-crm: you must finish the Skhokho-to-Ghost-CRM rebrand. Why is a find-and-replace of `skhokho` across `docs/` forbidden, and what is the smallest safe procedure?","answer":"Verdict: rebrand ABOVE the References header only. (1) A blunt replace also rewrites the archived URLs inside the blocks, destroying the only route record. (2) Edit prose, the `config.js` title / description / nav and `package.json`; the progress metric is the body column of `audit_branding.py`, whose refs column must never move. (3) Keep a visible Skhokho origin statement: attribution may not be erased.","explanation":"`split_md()` in the audit cuts each page at the header, which is why body debt and archive are counted apart. Open direction (frontier F4): extend the rewrite-with-archive pattern to prose behind a dry-run default and anchor the block by header regex.","evidence_quote":"N2 says the References blocks and an explicit origin acknowledgment are exempt from that sweep.","tags":["rebrand","provenance","per-docs"],"source_refs":[{"path":".claude/skills/change-control/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":219,"end":221},{"path":".claude/skills/diagnostics-and-tooling/scripts/audit_branding.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":31,"end":36},{"path":".claude/skills/diagnostics-and-tooling/scripts/audit_branding.py","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":97,"end":100},{"path":".claude/skills/engineering-standards/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":361,"end":366}]},{"id":"ghost-crm:99","slug":"ghost-crm","code":"8099","category":9,"rank":9,"type":"recall","level":2,"concept":"Next step: G0 spec freeze","question":"What is the next planned step for ghost-crm, and why can no application code start before it?","answer":"Execute G0, the spec freeze: run the five diagnostics, transcribe the screenshot-only schemas (items A1-A7) into rulings, classify every `[open]` item. Coding against a drifted or half-read spec rebuilds the wrong product.","explanation":"After G0 comes `app/` with the custom user model (G1), then the permission matrix (G2). If any diagnostic deviates from its baseline: STOP and triage before anything else.","evidence_quote":"freeze the spec before the first line of code","tags":["per-docs","resume"],"source_refs":[{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":109,"end":114},{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":139,"end":142},{"path":".claude/skills/campaign-django-rebuild/SKILL.md","branch":"claude/ghost-crm-skill-library-x37l4e","commit":"4b534f03a89f5349c54e3add2b7633e139c6b1df","line":173,"end":180}]},{"id":"gpt3.5_vba:00","slug":"gpt3.5_vba","code":"8100","category":0,"rank":0,"type":"recall","level":1,"concept":"Fork plus skill library","question":"gpt3.5_vba: what did the owner build around the forked one-function Excel/VBA OpenAI caller?","answer":"An `apilogicserver-*` skill library to REPLACE it with a governed API Logic Server; the VBA stays as the before-picture.","explanation":"The owner's work is everything under `.claude/skills/`; `turbo3.5_excel_vba` is upstream code kept untouched as the specimen the campaign measures itself against. Why replace and not repair: see 60.","anchor":"A hand-crank telephone in a glass case at the door of a modern switchboard room: nobody repairs it, every visitor is shown it first.","confusables":"cf. [private project] [private project]-repair-campaign: the same skill-library archetype, down to the closing 'Provenance and maintenance' section, on a DIFFERENT subject domain.","evidence_quote":"carry a legacy spreadsheet/VBA + GPT automation (the concrete instance: `turbo3.5_excel_vba` and `api_Key.xlsm` at this repo's root) to a governed, production-grade API Logic Server system","tags":["skill-library"],"source_refs":[{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":21},{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":109},{"path":"turbo3.5_excel_vba","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":1}]},{"id":"gpt3.5_vba:01","slug":"gpt3.5_vba","code":"8101","category":0,"rank":1,"type":"recall","level":1,"concept":"Rule fires whoever calls","question":"Which one-sentence guarantee does gpt3.5_vba's modernization campaign exist to prove?","answer":"The rule fires regardless of WHO calls: a human, a bridge or an AI gets the same 400 / code 2001 refusal.","explanation":"P6's gate reuses P3's observable on purpose: an identical refusal through the new AI channel IS the governance proof. Boundary: it holds only for writes that go through the API/session, see 50. The refusal's exact shape: see 90.","example":"P3 probe: PATCH /api/Item/2/ quantity 100 -> 400 code 2001 / P6: the same violating write through MCP or the bridge -> the same 400 code 2001","evidence_quote":"(same observable as P3 — that identity IS the point: the rule fires regardless of who calls)","tags":["governance"],"source_refs":[{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":454,"end":461},{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":58}]},{"id":"gpt3.5_vba:10","slug":"gpt3.5_vba","code":"8110","category":1,"rank":0,"type":"recall","level":1,"concept":"Three ground-truth labels","question":"Which three ground-truth labels may a fact carry in gpt3.5_vba's skill library?","answer":"\"verified \u003cdate>, Genai-Logic \u003cversion>\" · \"per docs, not live-verified\" · \"candidate\" (designed, never executed).","explanation":"The label is the library's contract with its reader: executed evidence never blends with documentation claims. Breaks if undone: a docs number gets repeated as if it had been measured here.","confusables":"\"per docs\" vs \"candidate\" — per docs was read upstream and only not executed here; candidate was designed here and executed NOWHERE.","evidence_quote":"\"per docs, not live-verified\" means docs-derived; \"candidate\" means designed but never executed anywhere","tags":["labeling"],"source_refs":[{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":43},{"path":".claude/skills/apilogicserver-change-control/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":291}]},{"id":"gpt3.5_vba:20","slug":"gpt3.5_vba","code":"8120","category":2,"rank":0,"type":"trace","level":3,"concept":"Campaign phases P0-P7","question":"gpt3.5_vba · modernization campaign: recite the 8 phases P0-P7 from legacy inventory to container, each with its gate.","answer":"inventory · environment · project · logic · security · validation · AI re-entry · container","explanation":"One phase at a time, in order: a phase begins only when the previous gate's output is captured in the migration record. P7 is the only gate never executed, see 99.","anchor":"A workbook goes through an airport: bags listed, ticket printed, seat assigned, rules read out, passport checked, test flight, the AI co-pilot scanned like everyone, plane crated.","steps":["P0 Inventory the legacy -> every defect mapped to the ALS mechanism that removes it","P1 Environment -> `als welcome` prints the version banner","P2 Target schema + project -> server banner up, authenticated GET returns rows","P3 Declarative logic -> violating PATCH refused with 400 code 2001, numbers predicted","P4 Security -> 401 without a token, role-filtered read demonstrated","P5 Validation -> Behave all green and the Behave Logic Report file exists","P6 Governed AI re-entry -> rule-violating write through the new channel REJECTED","P7 Containerize + operate -> same Behave suite green in the container (to-execute)"],"evidence_quote":"| P6 | Governed AI re-entry | A rule-violating write through the new channel is REJECTED 400/2001 |","tags":["campaign"],"source_refs":[{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":50,"end":59},{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":520}]},{"id":"gpt3.5_vba:21","slug":"gpt3.5_vba","code":"8121","category":2,"rank":1,"type":"cloze","level":1,"concept":"SUMIF and VLOOKUP as rules","question":"gpt3.5_vba: complete the campaign's P3 translation of two spreadsheet functions into rule types.","answer":"where= · Rule.copy","explanation":"The bridge insight of P3: a cell formula IS a derivation and a validation IS a constraint, so the migration recovers what the spreadsheet already declared. Plain `SUM()` is `Rule.sum` without `where=`; `=Qty*UnitPrice` is `Rule.formula`.","example":"Rule.sum(derive=Customer.balance, as_sum_of=Order.amount_total, where=lambda row: row.date_shipped is None) / Rule.copy(derive=Item.unit_price, from_parent=Product.unit_price)","confusables":"`Rule.formula` with a parent reference — it CASCADES when the parent value later changes; `Rule.copy` FREEZES the value taken at insert or FK change.","cloze":"`SUMIF()` -> `Rule.sum` with {{c1::where=}} · `VLOOKUP` -> {{c2::Rule.copy}}","evidence_quote":"| `VLOOKUP` from a reference sheet | `=VLOOKUP(pid, Products!A:B, 2)` | `Rule.copy` |","tags":["translation-table"],"source_refs":[{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":226,"end":232},{"path":".claude/skills/declarative-rules-reference/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":153}]},{"id":"gpt3.5_vba:30","slug":"gpt3.5_vba","code":"8130","category":3,"rank":0,"type":"locate","level":1,"concept":"probe_health.sh three-step probe","question":"Which script in gpt3.5_vba checks a running ALS server in three steps: up, login, authorized read?","answer":"`probe_health.sh` in the debugging-playbook `scripts/` folder: exit 0 = healthy, exit N = step N failed.","explanation":"Step 1 GET `/api` expects 200; step 2 POST `/api/auth/login` expects an `access_token`; step 3 GET `/api/RESOURCE/?page[limit]=1` expects 200 with `\"data\"`. All inputs are env vars with defaults (`HOST`, `PORT`, `RESOURCE` ...).","anchor":"A night nurse's three checks: pulse, 'say your name', one sip of water. The number of the check that fails is what goes on the chart.","example":"HOST=localhost PORT=5656 RESOURCE=Customer bash scripts/probe_health.sh  # three PASS lines, then: OK    all probes passed against http://localhost:5656","confusables":"`list_discovered_logic.sh` — it is STATIC and needs no running server; the health probe only talks HTTP to a live one.","evidence_quote":"# Prints PASS/FAIL per step. Exit 0 = healthy; exit N = step N failed.","tags":["diagnostic-script"],"source_refs":[{"path":".claude/skills/apilogicserver-debugging-playbook/scripts/probe_health.sh","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":7,"end":13},{"path":".claude/skills/apilogicserver-debugging-playbook/scripts/probe_health.sh","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":89,"end":90},{"path":".claude/skills/apilogicserver-debugging-playbook/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":236}]},{"id":"gpt3.5_vba:31","slug":"gpt3.5_vba","code":"8131","category":3,"rank":1,"type":"output","level":3,"concept":"scan() discovery verdicts","question":"gpt3.5_vba · `list_discovered_logic.sh` · `scan`: predict the verdict printed for each file in the folder described below, and the script's exit code.","answer":"`check_credit.py` WILL LOAD, `exp_tax.pyZZ` disabled, `notes.py` !! BAD SHAPE, `__init__.py` silent; exit 1 — any `.py` in the folder is a candidate, and one lacking a top-level `def declare_logic(` fails the run.","explanation":"(1) `__init__.py` hits the first `continue`. (2) `check_credit.py` ends in `.py` and matches the `def declare_logic(` regex -> loaded. (3) `.pyZZ` does not end in `.py` but matches `\\.py[A-Za-z_]+$` -> skipped. (4) `notes.py` has no match -> malformed, so `bad` is 1 and the exit code is 1.","confusables":"`extract_logic_log.sh` — it reads what DID run from a server log; `scan` predicts what WILL load from the files alone.","code_snippet":"# logic/logic_discovery/ holds: __init__.py, check_credit.py (has `def declare_logic():`),\n#   exp_tax.pyZZ, notes.py (no declare_logic); required_fn='declare_logic', exclude_init=True\nif f == 'auto_discovery.py' or (exclude_init and f == '__init__.py'):\n    continue\nif not f.endswith('.py'):\n    if re.search(r'\\.py[A-Za-z_]+$', f):   # e.g. .pyZZ = deliberately disabled\n        skipped.append(rel)\n    continue\n# ...\nok = re.search(r'^\\s*def\\s+' + required_fn + r'\\s*\\(', src, re.M) is not None\n(loaded if ok else malformed).append(rel)\n# ... sys.exit(1 if bad else 0)","expected_output":"__init__.py -> not listed\ncheck_credit.py -> WILL LOAD\nexp_tax.pyZZ -> disabled\nnotes.py -> !! BAD SHAPE\nexit code 1","evidence_quote":"(loaded if ok else malformed).append(rel)","tags":["grounded:logic","auto-discovery"],"source_refs":[{"path":".claude/skills/apilogicserver-debugging-playbook/scripts/list_discovered_logic.sh","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":28,"end":49},{"path":".claude/skills/apilogicserver-debugging-playbook/scripts/list_discovered_logic.sh","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":58,"end":68},{"path":".claude/skills/apilogicserver-debugging-playbook/scripts/list_discovered_logic.sh","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":77}]},{"id":"gpt3.5_vba:40","slug":"gpt3.5_vba","code":"8140","category":4,"rank":0,"type":"locate","level":1,"concept":"Change-control chokepoint","question":"Which skill in gpt3.5_vba is the single chokepoint every campaign phase must land through?","answer":"`apilogicserver-change-control`: classify the change, pass gates G0-G5, then commit.","explanation":"No phase is exempt, including test-only and docs-only ones. Its gates are commands (clean git, clean boot, Behave green, report current, merges resolved, diffs isolated), so they work with zero reviewers.","anchor":"One customs desk at the end of every pier: whatever a phase unloads is classified, weighed and stamped there, or it stays on the dock.","confusables":"`apilogicserver-validation-and-qa` — it PRODUCES the Behave evidence; change-control is the gate that decides if a change may land.","evidence_quote":"The final step of any phase that changes files is: classify the change, pass the gates, and commit per **apilogicserver-change-control**","tags":["gates"],"source_refs":[{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":44},{"path":".claude/skills/apilogicserver-change-control/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":243,"end":250},{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":521}]},{"id":"gpt3.5_vba:41","slug":"gpt3.5_vba","code":"8141","category":4,"rank":1,"type":"compare","level":2,"concept":"apilogicserver-failure-archaeology","question":"gpt3.5_vba: `apilogicserver-failure-archaeology` vs `apilogicserver-debugging-playbook`: what is the ONE difference?","answer":"Archaeology tells you WHETHER a battle was already fought (the verdict ledger, entries A1-A10); the playbook tells you HOW to fight a live symptom step by step.","explanation":"The ledger holds verdict plus pointer only; mechanisms, runbooks and fixes live in sibling skills. Confusing them means either re-running a settled experiment or reading history when a server is down.","anchor":"A plaque on an old battlefield: 'fought here, settled'. The archaeologist reads it aloud to anyone reaching for a sword, and never draws one himself.","confusables":"`apilogicserver-debugging-playbook` — archaeology records the VERDICT of past battles; the playbook is the triage procedure for the one in front of you.","evidence_quote":"(this skill tells you whether the battle was already fought; that one tells you how to fight it)","tags":["skill-routing"],"source_refs":[{"path":".claude/skills/apilogicserver-failure-archaeology/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":41},{"path":".claude/skills/apilogicserver-failure-archaeology/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":24},{"path":".claude/skills/apilogicserver-debugging-playbook/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":36,"end":41}]},{"id":"gpt3.5_vba:50","slug":"gpt3.5_vba","code":"8150","category":5,"rank":0,"type":"recall","level":1,"concept":"before_flush is the only hook","question":"In the ALS system that gpt3.5_vba's skills document, which SQLAlchemy session event is LogicBank's ONLY hook?","answer":"`before_flush` — no database triggers back the rules, so a write outside the session runs NO logic.","explanation":"One interception point enforces logic for every writer with nothing to call and nothing to forget. Breaks if bypassed: raw SQL or a DB browser leaves stored aggregates stale and admits invalid rows, with no error anywhere (non-negotiable NN-1).","anchor":"A toll booth bolted INSIDE the delivery truck, not at the warehouse door: a crate carried in on foot never pays.","confusables":"`after_flush` — side effects only (a message send); a row value changed there is NOT persisted in this transaction, whereas rules in `before_flush` still shape what is written.","evidence_quote":"LogicBank's ONLY hook is the SQLAlchemy session's `before_flush` event. There are no database triggers backing the rules.","tags":["per-docs","session-hook"],"source_refs":[{"path":".claude/skills/apilogicserver-architecture-contract/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":157,"end":159},{"path":".claude/skills/apilogicserver-change-control/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":210,"end":211},{"path":".claude/skills/declarative-rules-reference/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":129}]},{"id":"gpt3.5_vba:60","slug":"gpt3.5_vba","code":"8160","category":6,"rank":0,"type":"why","level":2,"concept":"Replace, do not harden","question":"Why does gpt3.5_vba's library replace the `OpenAI()` VBA caller with a governed server rather than harden the macro in place?","answer":"The defect is the PATTERN, not the VBA: application-embedded glue with no contract, no gating and no evidence. Patching one failure mode leaves all three absences in place.","explanation":"Breaks if undone: effort goes into escaping JSON in a file that still ships its key in every workbook copy, has no tests or review and leaves no audit trail. Archaeology A9 status: SETTLED-BY-REPLACEMENT-PLAN, do not reopen.","anchor":"An Excel cell throws a paper plane out of the office window: a better-folded nose still leaves no flight plan, no control tower and no black box.","confusables":"Hardening `turbo3.5_excel_vba` in place — it fixes ONE failure mode (say, quote escaping); replacement removes the three absences that produce them all.","evidence_quote":"Every failure mode above is a special case of those three absences. Resolution path: replace, don't patch","tags":["settled-battle"],"source_refs":[{"path":".claude/skills/apilogicserver-failure-archaeology/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":304,"end":308},{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":107},{"path":"turbo3.5_excel_vba","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":10,"end":12}]},{"id":"gpt3.5_vba:61","slug":"gpt3.5_vba","code":"8161","category":6,"rank":1,"type":"why","level":2,"concept":"Shipped-order control probe","question":"Why does gpt3.5_vba's P3 gate repeat the violating PATCH on a SHIPPED order's item rather than stop at the 400?","answer":"It is the CONTROL: it must return 200, otherwise you cannot tell 'the constraint works' from 'the constraint fires on everything'.","explanation":"`where=date_shipped is None` excludes shipped orders from the balance, so the same PATCH legitimately succeeds there. Breaks if undone: a rule that rejects every write would still pass the gate. The 400 itself: see 90.","anchor":"Testing a smoke alarm with two matches: one under the detector, one in the next room. If it screams for both, it is broken, not vigilant.","confusables":"Stopping at the 400 — it proves the rule CAN reject, not that it rejects ONLY what it should.","evidence_quote":"If you skip the control you cannot distinguish \"constraint works\" from \"constraint fires on everything.\"","tags":["control-experiment"],"source_refs":[{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":305,"end":307},{"path":".claude/skills/declarative-rules-reference/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":227}]},{"id":"gpt3.5_vba:80","slug":"gpt3.5_vba","code":"8180","category":8,"rank":0,"type":"recall","level":2,"concept":"JWT client, server-side key","question":"What makes gpt3.5_vba's governed design work without an OpenAI key inside the workbook?","answer":"The client holds ONLY a short-lived JWT obtained from `POST /api/auth/login`; any LLM key lives server-side in the env var `APILOGICSERVER_CHATGPT_APIKEY`.","explanation":"In the legacy file the key sits in a VBA variable and inside `api_Key.xlsm`, so it ships with every workbook copy and cannot be rotated or reviewed. DESIGN TARGET: the live-LLM leg was never executed in the authoring workspace.","anchor":"The spreadsheet wears a visitor badge that expires this afternoon; the master key never leaves the server room.","confusables":"Legacy `apiKey` variable in `turbo3.5_excel_vba` — the secret travels WITH the client; in the governed design only an expiring token does.","evidence_quote":"Client holds only a JWT; any LLM key lives server-side (`APILOGICSERVER_CHATGPT_APIKEY`)","tags":["per-docs","secrets"],"source_refs":[{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":398,"end":406},{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":103},{"path":"turbo3.5_excel_vba","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":17}]},{"id":"gpt3.5_vba:90","slug":"gpt3.5_vba","code":"8190","category":9,"rank":0,"type":"recall","level":2,"concept":"P3 gate passing sign","question":"gpt3.5_vba: which response proves a migrated rule fires in the campaign's P3 gate?","answer":"HTTP 400 with `errors[0].code` \"2001\" on the violating PATCH, its title carrying the numbers you wrote down BEFORE running it.","explanation":"A gate is a command whose output matches the quoted expectation or does not; 'it looks right in the admin app' is fenced as a wrong path. The gate has two more observables: the logic-log chain and the control probe (see 61).","anchor":"A doorman test: you send in a guest you KNOW is over the limit, his bill already written on your hand; you pass only if he is thrown out holding that exact bill.","example":"PATCH /api/Item/2/ {quantity: 100}  # 400, code 2001, title: Customer balance (9000.0000000000) exceeds credit limit (5000.0000000000)","confusables":"401 / 422 with a top-level `msg` — that is AUTH refusing the request; a rule refusal is 400 with `errors[0].code`.","evidence_quote":"(1) the 400 body matches the predicted numbers inside the verified shape (`code\": \"2001\"`)","tags":["gate","predict-numbers-first"],"source_refs":[{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":307},{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":41,"end":42},{"path":".claude/skills/apilogicserver-modernization-campaign/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":287,"end":292},{"path":".claude/skills/apilogicserver-debugging-playbook/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":59}]},{"id":"gpt3.5_vba:91","slug":"gpt3.5_vba","code":"8191","category":9,"rank":1,"type":"scenario","level":3,"concept":"Constraint did not fire","question":"gpt3.5_vba: on an ALS project, a PATCH you expected the credit-limit constraint to reject returns 200. What do you check first, and what is the usual cause?","answer":"Run `scripts/extract_logic_log.sh logs/als.log` and look for the parent adjustment row in that transaction. Usual cause: `where=` pruning — the sum's qualification is False before AND after, so the delta is 0 and the parent row and its constraint never run.","explanation":"Usually not a bug: the rule's qualification is doing its job (a shipped order is outside `Customer.balance`). Discriminate: no transaction block at all means the write bypassed the session; a block with no Customer row means pruning. The same effect used on purpose as a control: see 61.","confusables":"Stale sums after a raw SQL write — there the log shows NO transaction block; with pruning the block exists and merely lacks the parent row.","evidence_quote":"Aggregate `where=` clause excludes the row's parent chain (pruning), so the watched value never changed","tags":["trap","per-docs","pruning"],"source_refs":[{"path":".claude/skills/apilogicserver-debugging-playbook/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":48},{"path":".claude/skills/declarative-rules-reference/SKILL.md","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":187,"end":194},{"path":".claude/skills/apilogicserver-debugging-playbook/scripts/extract_logic_log.sh","branch":"main","commit":"5216c8eb31d5b455f1cbe01cf6a1628fdb4a5cb3","line":33,"end":50}]},{"id":"gpt3.5_vba:99","slug":"gpt3.5_vba","code":"8199","category":9,"rank":9,"type":"recall","level":2,"concept":"P7 gate still to-execute","question":"Which gpt3.5_vba campaign gate is still labeled to-execute, and what output closes it?","answer":"P7: build the project image, then the SAME Behave suite must run green against the container with the same counts as the host run. No container was built in the authoring workspace.","explanation":"Until that output is captured the campaign may not be called deployed. Also unprov
