# Generated by `python3 -m recurser k8s write`. Edit recurser/k8s.py, not this file.
# Layer 2: the settings, mounted in the pod at /app/config/config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: team-config
  namespace: recurser
data:
  config.yaml: |
    llm:
      provider: anthropic
      model: claude-opus-5-5
      effort: medium
      max_tokens: 16000
    retrieval:
      engine: bm25
      top_k: 8
      per_project: 6
    server:
      host: 0.0.0.0
      port: 8000
      progress_dir: /var/lib/recurser
      ask_per_10_minutes: 30
    access:
      users_file: /app/secrets/users.json
