# Create the two Secrets with kubectl, so that no credential is ever written to a file in git:
#
#   kubectl -n recurser create secret generic team-anthropic --from-literal=ANTHROPIC_API_KEY=<your key>
#   python3 -m recurser users add <name> --projects <a,b> --file users.json     # once per person
#   kubectl -n recurser create secret generic team-users --from-file=users.json=users.json
#
# The pod reads the first one as an environment variable (secretKeyRef) and the second as a file
# (/app/secrets/users.json).  Shown here for reference only, with placeholders:
apiVersion: v1
kind: Secret
metadata:
  name: team-anthropic
  namespace: recurser
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<set with kubectl, never commit a real key>"
